<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerar Pix — Admin Servnet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --pool:#00C4D8;--bg:#030F18;--surface:#061520;--card:#091C2A;
  --text:#CDEAF2;--text-2:#4A8898;--border:rgba(0,196,216,0.15);
  --pos:#10B981;--neg:#EF4444;
}
body{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem;}
.logo{font-size:1.5rem;font-weight:900;letter-spacing:0.1em;color:var(--pool);text-shadow:0 0 20px rgba(0,196,216,0.4);margin-bottom:0.25rem;}
.logo span{color:var(--text);opacity:0.7;font-weight:700;}
.sub{font-size:0.78rem;color:var(--text-2);text-transform:uppercase;letter-spacing:0.18em;margin-bottom:2rem;}
.box{width:100%;max-width:480px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2rem 1.75rem;margin-bottom:1.5rem;}
.box-title{font-size:1rem;font-weight:700;margin-bottom:1.5rem;}
.f-group{display:flex;flex-direction:column;gap:0.4rem;margin-bottom:1rem;}
.f-label{font-size:0.74rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--text-2);}
.f-input{padding:0.85rem 1rem;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:1rem;font-family:inherit;outline:none;transition:border-color 0.15s;}
.f-input:focus{border-color:var(--pool);box-shadow:0 0 0 3px rgba(0,196,216,0.12);}
.f-input::placeholder{color:var(--text-2);opacity:0.6;}
.btn{width:100%;padding:0.9rem;background:var(--pool);color:#fff;border:none;border-radius:6px;font-size:1rem;font-weight:700;cursor:pointer;transition:opacity 0.15s;font-family:inherit;margin-top:0.5rem;}
.btn:hover:not(:disabled){opacity:0.88;}
.btn:disabled{opacity:0.5;cursor:default;}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
.err{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:6px;padding:0.7rem 1rem;color:#FCA5A5;font-size:0.86rem;margin-top:0.75rem;display:none;}
.err.show{display:block;}

/* resultado pix */
#resultado{display:none;}
.qr-wrap{text-align:center;margin-bottom:1.5rem;}
.qr-wrap img{width:220px;height:220px;border:4px solid var(--pool);border-radius:8px;background:#fff;padding:8px;}
.info-row{display:flex;flex-direction:column;gap:0.4rem;margin-bottom:1rem;}
.info-label{font-size:0.74rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--text-2);}
.copy-field{display:flex;gap:0.5rem;align-items:center;}
.copy-input{flex:1;padding:0.7rem 0.9rem;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:0.8rem;font-family:monospace;outline:none;word-break:break-all;}
.copy-btn{padding:0.7rem 1rem;background:var(--pool);color:#fff;border:none;border-radius:6px;font-size:0.8rem;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;}
.copy-btn:hover{opacity:0.88;}
.valor-badge{display:inline-block;background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);border-radius:100px;padding:0.3rem 1rem;color:#34D399;font-size:1.1rem;font-weight:700;margin-bottom:1rem;}
.novo-btn{width:100%;padding:0.8rem;background:transparent;color:var(--pool);border:1px solid var(--pool);border-radius:6px;font-size:0.9rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:0.5rem;}
.novo-btn:hover{background:rgba(0,196,216,0.07);}

/* pin */
#pinScreen{}
</style>
</head>
<body>

<div class="logo">SERV<span>NET</span></div>
<div class="sub">Gerador de Pix</div>

<!-- PIN -->
<div class="box" id="pinScreen">
  <div class="box-title">🔐 Acesso Restrito</div>
  <div class="f-group">
    <label class="f-label">PIN de Administrador</label>
    <input class="f-input" type="password" id="pinInput" placeholder="••••" maxlength="20">
  </div>
  <button class="btn" onclick="verificarPin()">Entrar</button>
  <div class="err" id="pinErr">PIN incorreto.</div>
</div>

<!-- FORMULÁRIO -->
<div class="box" id="formScreen" style="display:none">
  <div class="box-title">💳 Gerar Cobrança Pix</div>
  <div class="f-group">
    <label class="f-label">ID do Cliente</label>
    <input class="f-input" type="text" id="clienteId" placeholder="cli_xxx">
  </div>
  <div class="f-group">
    <label class="f-label">ID do Contrato (opcional)</label>
    <input class="f-input" type="text" id="contratoId" placeholder="ct_xxx">
  </div>
  <div class="f-group">
    <label class="f-label">Valor (R$)</label>
    <input class="f-input" type="number" id="valor" placeholder="99.90" min="1" step="0.01">
  </div>
  <div class="f-group">
    <label class="f-label">Descrição</label>
    <input class="f-input" type="text" id="descricao" placeholder="Mensalidade Servnet" maxlength="120">
  </div>
  <div class="f-group">
    <label class="f-label">Mês de Referência</label>
    <input class="f-input" type="month" id="mesRef">
  </div>
  <button class="btn" id="gerarBtn" onclick="gerarPix()">⚡ Gerar Pix</button>
  <div class="err" id="formErr"></div>
</div>

<!-- RESULTADO -->
<div class="box" id="resultado">
  <div class="box-title">✅ Pix Gerado!</div>
  <div class="qr-wrap">
    <img id="qrImg" src="" alt="QR Code Pix">
  </div>
  <div style="text-align:center;margin-bottom:1rem;">
    <div class="valor-badge" id="valorBadge"></div>
  </div>
  <div class="info-row">
    <div class="info-label">Pix Copia e Cola</div>
    <div class="copy-field">
      <input class="copy-input" type="text" id="copiaCola" readonly>
      <button class="copy-btn" onclick="copiar()">Copiar</button>
    </div>
  </div>
  <div class="info-row">
    <div class="info-label">ID do Lançamento</div>
    <input class="copy-input" type="text" id="lancamentoId" readonly style="width:100%">
  </div>
  <button class="novo-btn" onclick="novoGerar()">+ Nova Cobrança</button>
</div>

<script>
const SB_URL = 'https://lkymiclirksgqkeiglyw.supabase.co';
const SB_KEY = 'sb_publishable_0peTquB1iqmsYTBMLwH2JA_eOwz2yTM';
const FN_URL = SB_URL + '/functions/v1/mp-gerar-pix';
const sb = supabase.createClient(SB_URL, SB_KEY);

let pinOk = false;

document.getElementById('pinInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') verificarPin();
});

async function verificarPin(){
  const pin = document.getElementById('pinInput').value.trim();
  if(!pin) return;
  const errEl = document.getElementById('pinErr');
  errEl.classList.remove('show');
  try{
    const {data, error} = await sb.rpc('portal_servnet_atualizar_status',{
      p_pin: pin, p_status: 'ok', p_titulo: 'Rede operando normalmente', p_descricao: ''
    });
    if(error || !data?.ok){ errEl.classList.add('show'); return; }
    pinOk = true;
    document.getElementById('pinScreen').style.display = 'none';
    document.getElementById('formScreen').style.display = 'block';
    // preenche mês atual
    const hoje = new Date();
    document.getElementById('mesRef').value = hoje.toISOString().slice(0,7);
  }catch(e){
    errEl.textContent = 'Erro de conexão.';
    errEl.classList.add('show');
  }
}

async function gerarPix(){
  const btn = document.getElementById('gerarBtn');
  const errEl = document.getElementById('formErr');
  errEl.classList.remove('show');

  const clienteId = document.getElementById('clienteId').value.trim();
  const contratoId = document.getElementById('contratoId').value.trim();
  const valor = parseFloat(document.getElementById('valor').value);
  const descricao = document.getElementById('descricao').value.trim() || 'Mensalidade Servnet';
  const mesRef = document.getElementById('mesRef').value;

  if(!clienteId){ errEl.textContent='Informe o ID do cliente.'; errEl.classList.add('show'); return; }
  if(!valor || valor < 1){ errEl.textContent='Informe um valor válido.'; errEl.classList.add('show'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Gerando…';

  try{
    const res = await fetch(FN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cliente_id: clienteId, contrato_id: contratoId || null, valor, descricao, mes_ref: mesRef })
    });
    const data = await res.json();

    if(!data.ok){
      errEl.textContent = '❌ ' + (data.msg || 'Erro ao gerar Pix.');
      errEl.classList.add('show');
      return;
    }

    // Mostra resultado
    document.getElementById('formScreen').style.display = 'none';
    document.getElementById('resultado').style.display = 'block';
    document.getElementById('qrImg').src = data.qr_code_url || '';
    document.getElementById('copiaCola').value = data.copia_cola || data.qr_code || '';
    document.getElementById('lancamentoId').value = data.lancamento_id || '';
    document.getElementById('valorBadge').textContent = 'R$ ' + valor.toFixed(2).replace('.',',');

  }catch(e){
    errEl.textContent = '❌ Erro de conexão.';
    errEl.classList.add('show');
    console.error(e);
  }finally{
    btn.disabled = false;
    btn.textContent = '⚡ Gerar Pix';
  }
}

function copiar(){
  const el = document.getElementById('copiaCola');
  el.select();
  navigator.clipboard.writeText(el.value).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '✓ Copiado';
    setTimeout(() => btn.textContent = 'Copiar', 2000);
  });
}

function novoGerar(){
  document.getElementById('resultado').style.display = 'none';
  document.getElementById('formScreen').style.display = 'block';
  document.getElementById('formErr').classList.remove('show');
}
</script>
</body>
</html>
