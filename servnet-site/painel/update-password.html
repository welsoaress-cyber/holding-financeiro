<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrupoTom — Redefinir Senha</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --bg-card: #ffffff;
      --text: #111827;
      --text-muted: #6b7280;
      --border: #e5e7eb;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 36px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 44px; height: 44px;
      background: var(--primary);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .logo-text { font-size: 20px; font-weight: 700; }
    .logo-sub { font-size: 12px; color: var(--text-muted); }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 28px; }
    label {
      display: flex; flex-direction: column; gap: 6px;
      font-size: 13px; font-weight: 500; margin-bottom: 16px;
    }
    .senha-wrapper { position: relative; }
    .senha-wrapper input { width: 100%; padding-right: 44px; }
    .btn-ver {
      position: absolute; right: 10px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      font-size: 16px; color: var(--text-muted); padding: 4px;
    }
    input[type="password"], input[type="text"] {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      background: var(--bg);
      color: var(--text);
      width: 100%;
    }
    input:focus { outline: none; border-color: var(--primary); }
    #btn-salvar {
      width: 100%; padding: 12px;
      background: var(--primary); color: #fff;
      border: none; border-radius: 8px;
      font-size: 16px; font-weight: 600;
      cursor: pointer; margin-top: 8px;
    }
    #btn-salvar:disabled { opacity: .65; cursor: not-allowed; }
    #msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
    .ok  { color: #059669; }
    .err { color: #dc2626; }
  </style>
  <script type="module" crossorigin src="/painel/assets/updatePassword-Cv6LuFruF1.js"></script>
  <link rel="modulepreload" crossorigin href="/painel/assets/modulepreload-polyfill-B5Qt9EMXF1.js">
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">💰</div>
      <div>
        <div class="logo-text">GrupoTom</div>
        <div class="logo-sub">Sistema Financeiro</div>
      </div>
    </div>

    <h1>Nova senha</h1>
    <p class="subtitle">Escolha uma senha segura para sua conta.</p>

    <form id="form" novalidate>
      <label>
        Nova senha
        <div class="senha-wrapper">
          <input id="senha" type="password" placeholder="Mínimo 8 caracteres" required />
          <button type="button" class="btn-ver" data-target="senha">👁</button>
        </div>
      </label>
      <label>
        Confirmar senha
        <div class="senha-wrapper">
          <input id="confirmar" type="password" placeholder="Repita a senha" required />
          <button type="button" class="btn-ver" data-target="confirmar">👁</button>
        </div>
      </label>

      <div id="msg"></div>
      <button type="submit" id="btn-salvar">Salvar senha</button>
    </form>
  </div>

</body>
</html>
