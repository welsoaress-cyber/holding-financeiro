/* ── Custom magnetic cursor ── */
#cursor-dot {

#cursor-ring {

}
#cursor-ring.hover {

}

/* ── Loading overlay ── */
#loading {
  position: fixed;
  inset: 0;
  background: #6d6c71;
  display: flex;
  align-items: center;
  justify-content: center;

}
#loading.hidden { opacity: 0; pointer-events: none; }

@media (max-width: 600px) {

@media (prefers-reduced-motion: reduce) {

<script>
(function () {
  'use strict';

  var BG = '#6d6c71';
  var FRAME_COUNT = 64;
  var LERP_FACTOR = 0.55;

  // ── Canvas ──
  var canvas = document.getElementById('hero-canvas');
  var ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  // ── Preload all frames + center ──
  var frames = new Array(FRAME_COUNT);
  var centerImg = new Image();
  var loaded = 0;
  var total = FRAME_COUNT + 1;
  var loadingEl = document.getElementById('loading');

  function onImgSettle() {
    loaded++;
    if (loaded >= total) {
      loadingEl.classList.add('hidden');
      setTimeout(function () {
        if (loadingEl.parentNode) loadingEl.parentNode.removeChild(loadingEl);
      }, 500);
    }
  }

  for (var i = 0; i < FRAME_COUNT; i++) {
    frames[i] = new Image();
    frames[i].onload  = onImgSettle;
    frames[i].onerror = onImgSettle; // count failures too so overlay always closes
    frames[i].src = 'img/frames/frame_' + String(i).padStart(3, '0') + '.webp';
  }
  centerImg.onload  = onImgSettle;
  centerImg.onerror = onImgSettle;
  centerImg.src = 'img/center.webp';

  // Fallback: force-hide overlay after 5 s regardless
  setTimeout(function () {
    loadingEl.classList.add('hidden');
    setTimeout(function () {
      if (loadingEl.parentNode) loadingEl.parentNode.removeChild(loadingEl);
    }, 500);
  }, 5000);

  // ── Mouse state ──
  var mx = window.innerWidth * 0.5;
  var my = window.innerHeight * 0.5;
  var mouseActive = false;

  document.addEventListener('mousemove', function (e) {
    mx = e.clientX;
    my = e.clientY;
    mouseActive = true;
  }, { passive: true });

  document.addEventListener('mouseleave', function () {
    mouseActive = false;
  });

  // ── Shortest-path circular lerp ──
  function lerpAngle(current, target, factor) {
    var diff = target - current;
    while (diff >  Math.PI) diff -= 2 * Math.PI;
    while (diff < -Math.PI) diff += 2 * Math.PI;
    return current + diff * factor;
  }

  // ── Draw one frame cover-filling the canvas ──
  function drawCover(img, W, H) {
    if (!img || !img.complete || !img.naturalWidth) return;
    var imgAspect = img.naturalWidth / img.naturalHeight;
    var canvasAspect = W / H;
    var sw, sh, dx, dy;
    if (canvasAspect > imgAspect) {
      sw = W;
      sh = W / imgAspect;
      dx = 0;
      dy = (H - sh) * 0.5;
    } else {
      sh = H;
      sw = H * imgAspect;
      dx = (W - sw) * 0.5;
      dy = 0;
    }
    ctx.drawImage(img, dx, dy, sw, sh);
  }

  // ── rAF state ──
  var smoothAngle = 0;

  function tick() {
    requestAnimationFrame(tick);

    var W = canvas.width;
    var H = canvas.height;

    // Character face center (video is 1920×1080, character is centered)
    var faceCX = W * 0.5;
    var faceCY = H * 0.42;

    var dx = mx - faceCX;
    var dy = my - faceCY;
    var dist = Math.sqrt(dx * dx + dy * dy);

    // Deadzone: cursor within ~12% of the shorter screen dimension
    var deadzoneR = Math.min(W, H) * 0.12;
    var inDeadzone = !mouseActive || dist < deadzoneR;

    // Advance smooth angle only outside deadzone
    if (!inDeadzone) {
      var targetAngle = Math.atan2(dy, dx);
      smoothAngle = lerpAngle(smoothAngle, targetAngle, LERP_FACTOR);
    }

    // Paint background first
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    // Pick exactly ONE frame — no alpha blending
    ctx.globalAlpha = 1;
    var img;
    if (inDeadzone) {
      img = centerImg;
    } else {
      var a = smoothAngle;
      // Normalise to [0, 2π)
      while (a <  0)            a += 2 * Math.PI;
      while (a >= 2 * Math.PI)  a -= 2 * Math.PI;
      var idx = (Math.round(a / (2 * Math.PI) * FRAME_COUNT) + 32) % FRAME_COUNT;
      img = frames[idx];
    }

    drawCover(img, W, H);
  }

  tick();

  // ── Custom cursor ──
  var dot  = document.getElementById('cursor-dot');
  var ring = document.getElementById('cursor-ring');
  var ringX = mx, ringY = my;

  document.addEventListener('mousemove', function (e) {
    dot.style.left = e.clientX + 'px';
    dot.style.top  = e.clientY + 'px';
  }, { passive: true });

  document.querySelectorAll('a, button').forEach(function (el) {
    el.addEventListener('mouseenter', function () { ring.classList.add('hover'); });
    el.addEventListener('mouseleave', function () { ring.classList.remove('hover'); });
  });

  function ringTick() {
    requestAnimationFrame(ringTick);
    ringX += (mx - ringX) * 0.15;
    ringY += (my - ringY) * 0.15;
    ring.style.left = ringX + 'px';
    ring.style.top  = ringY + 'px';
  }
  ringTick();

})();
</script>
