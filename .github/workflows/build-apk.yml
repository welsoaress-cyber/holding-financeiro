name: Build APK — Apps Tom

on:
  push:
    branches:
      - claude/limpezas-tom-qhscar
      - main
    paths:
      - 'apps-tom/**'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variante do build'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps-tom

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps-tom/**/*.gradle*', 'apps-tom/**/libs.versions.toml') }}
          restore-keys: |
            gradle-

      - name: Permissão no Gradle wrapper
        run: chmod +x gradlew

      - name: SHA-1 do certificado de assinatura (para Google Cloud Console)
        run: |
          echo "## 🔑 SHA-1 para cadastrar no Google Cloud Console" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pacote: \`br.com.appstom\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          SHA1=$(keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android 2>/dev/null \
            | grep "SHA1:" | awk '{print $2}')
          echo "SHA-1 (debug): \`$SHA1\`" >> $GITHUB_STEP_SUMMARY
          echo "sha1=$SHA1" >> $GITHUB_OUTPUT
          echo "SHA-1 do debug keystore: $SHA1"
        id: sha1

      - name: Compilar APK debug
        if: ${{ github.event.inputs.variant != 'release' }}
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      - name: Compilar APK release (sem assinatura)
        if: ${{ github.event.inputs.variant == 'release' }}
        run: ./gradlew :composeApp:assembleRelease --no-daemon --stacktrace

      - name: Localizar APK gerado
        id: apk_path
        run: |
          APK=$(find composeApp/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "APK encontrado: $APK"
          ls -lh "$APK"

      - name: Upload do APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: apps-tom-${{ github.event.inputs.variant || 'debug' }}-${{ github.run_number }}
          path: apps-tom/${{ steps.apk_path.outputs.path }}
          retention-days: 14
          if-no-files-found: error

      - name: Configurar Node.js para Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Distribuir APK no Firebase App Distribution
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          printf '%s' "$FIREBASE_SA" > /tmp/firebase-sa.json
          npm install -g firebase-tools@latest --silent
          firebase appdistribution:distribute \
            "apps-tom/${{ steps.apk_path.outputs.path }}" \
            --project "limpezas-tom" \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --testers "welsoaress@gmail.com" \
            --release-notes "Build ${{ github.run_number }} - branch ${{ github.ref_name }}"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Resumo do build
        run: |
          APK="${{ steps.apk_path.outputs.path }}"
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "## ✅ APK compilado com sucesso" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Arquivo | \`$(basename $APK)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tamanho | $SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Para instalar:** baixe o artefato acima, copie o APK para o celular e instale habilitando 'Fontes desconhecidas' nas configurações." >> $GITHUB_STEP_SUMMARY
