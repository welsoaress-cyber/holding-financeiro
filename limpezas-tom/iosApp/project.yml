# Projeto Xcode gerado com XcodeGen (brew install xcodegen; xcodegen generate)
name: LimpezasTom
options:
  bundleIdPrefix: br.com.limpezastom
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: "$(inherited) -framework ComposeApp"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  LimpezasTom:
    type: application
    platform: iOS
    sources: [LimpezasTom]
    info:
      path: LimpezasTom/Info.plist
      properties:
        CFBundleDisplayName: "Limpezas Tom"
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: >-
          O Limpezas Tom precisa acessar suas fotos e vídeos para enviá-los ao
          Google Fotos e, com a sua confirmação, liberar espaço no aparelho.
    preBuildScripts:
      - name: Build Kotlin Framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
