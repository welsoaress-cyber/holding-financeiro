<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holding — Painel Financeiro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===== DESIGN SYSTEM — HOLDING ERP ===== */
  :root {
    /* Surface palette */
    --bg:          #F0F2F5;
    --surface:     #FFFFFF;
    --surface-2:   #F7F8FA;
    --border:      #E2E5EA;
    --border-2:    #C8CDD8;

    /* Ink */
    --ink:         #111827;
    --ink-2:       #374151;
    --ink-3:       #6B7280;
    --ink-4:       #9CA3AF;

    /* Brand — deep navy + electric teal accent */
    --brand:       #0F2045;
    --brand-2:     #162D5C;
    --brand-3:     #1E3A73;
    --accent:      #0EA5E9;
    --accent-dark: #0284C7;
    --accent-glow: rgba(14,165,233,.12);

    /* Status */
    --pos:         #059669;
    --pos-bg:      #ECFDF5;
    --neg:         #DC2626;
    --neg-bg:      #FEF2F2;
    --warn:        #D97706;
    --warn-bg:     #FFFBEB;
    --muted-bg:    #F3F4F6;
    --muted:       #6B7280;

    /* Typography */
    --font-ui:     'Inter', -apple-system, sans-serif;
    --font-mono:   'IBM Plex Mono', 'Fira Mono', monospace;
    --font-num:    'Inter', sans-serif;

    /* Spacing */
    --r-sm:  6px;
    --r:     8px;
    --r-lg:  12px;
    --r-xl:  16px;

    /* Shadow */
    --shadow-sm: 0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
    --shadow:    0 2px 8px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.05);
    --shadow-lg: 0 8px 24px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.06);
    --shadow-xl: 0 20px 48px rgba(0,0,0,.18), 0 4px 12px rgba(0,0,0,.08);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 13.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Module Bar ---- */
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  #appBody { display: flex; flex: 1; min-height: 0; }

  .modbar {
    background: var(--brand);
    height: 44px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 0;
    position: relative;
    z-index: 200;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  .modbar-logo {
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    letter-spacing: .02em;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-right: 20px;
    margin-right: 8px;
    border-right: 1px solid rgba(255,255,255,.1);
  }
  .modbar-logo .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
    box-shadow: 0 0 8px var(--accent);
  }
  .modbar-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 0 14px;
    height: 44px;
    color: rgba(255,255,255,.65);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    background: transparent;
    font-family: var(--font-ui);
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s, background .15s;
  }
  .modbar-btn:hover { color: #fff; background: rgba(255,255,255,.05); }
  .modbar-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  .modpanel {
    position: absolute;
    top: 44px; left: 0; right: 0;
    background: var(--brand-2);
    border-bottom: 1px solid rgba(255,255,255,.08);
    padding: 20px 24px 24px;
    display: none;
    z-index: 199;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
  }
  .modpanel.open { display: block; }
  .modpanel-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: rgba(255,255,255,.3);
    margin-bottom: 14px;
    font-weight: 600;
  }
  .modpanel-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .modcard {
    display: flex; flex-direction: column; gap: 3px;
    padding: 14px 18px;
    border-radius: var(--r-lg);
    cursor: pointer;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.04);
    transition: all .15s;
    min-width: 140px;
  }
  .modcard:hover { background: rgba(255,255,255,.1); border-color: rgba(14,165,233,.4); }
  .modcard.active { background: rgba(14,165,233,.12); border-color: rgba(14,165,233,.5); }
  .modcard.soon { opacity: .4; cursor: default; }
  .modcard.soon:hover { background: rgba(255,255,255,.04); border-color: rgba(255,255,255,.08); }
  .modcard-ico { font-size: 18px; line-height: 1; margin-bottom: 4px; }
  .modcard-nome { font-size: 13px; font-weight: 700; color: #E7EDF8; font-family: var(--font-ui); }
  .modcard-desc { font-size: 11px; color: rgba(255,255,255,.4); }

  /* ---- Sidebar ---- */
  .sidebar {
    width: 228px;
    flex-shrink: 0;
    background: var(--brand);
    color: rgba(255,255,255,.85);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    max-height: calc(100vh - 44px);
    position: sticky;
    top: 0;
    border-right: 1px solid rgba(255,255,255,.05);
  }
  .brand-sub {
    font-size: 10.5px;
    color: rgba(255,255,255,.3);
    padding: 14px 16px 10px;
    letter-spacing: .06em;
    text-transform: uppercase;
    font-weight: 600;
    border-bottom: 1px solid rgba(255,255,255,.06);
    margin-bottom: 6px;
  }
  .nav-group-label {
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: rgba(255,255,255,.28);
    padding: 14px 16px 4px;
    font-weight: 600;
  }
  .nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 12px 7px 14px;
    margin: 1px 8px;
    border-radius: var(--r);
    color: rgba(255,255,255,.65);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all .12s;
    user-select: none;
  }
  .nav-item:hover { background: rgba(255,255,255,.07); color: #fff; }
  .nav-item.active { background: rgba(14,165,233,.18); color: var(--accent); border-left: 2px solid var(--accent); padding-left: 12px; }
  .nav-item.active .nav-ico { color: var(--accent); }
  .nav-item.disabled { color: rgba(255,255,255,.22); cursor: default; }
  .nav-item.disabled:hover { background: transparent; }
  .nav-ico { font-size: 13px; width: 16px; text-align: center; flex-shrink: 0; }
  .soon-badge {
    font-size: 9px; font-family: var(--font-mono);
    background: rgba(255,255,255,.06);
    color: rgba(255,255,255,.25);
    padding: 2px 6px;
    border-radius: 999px;
  }
  .sidebar-footer {
    margin-top: auto;
    padding: 12px 10px 10px;
    border-top: 1px solid rgba(255,255,255,.07);
  }
  .sidebar-lock-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 8px 10px; border-radius: var(--r);
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.04);
    color: rgba(255,255,255,.6);
    font-size: 12px; font-weight: 500;
    cursor: pointer; margin-bottom: 6px;
    font-family: var(--font-ui);
    transition: all .12s;
  }
  .sidebar-lock-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
  .sidebar-lock-btn.unlocked { background: rgba(14,165,233,.12); border-color: rgba(14,165,233,.3); color: var(--accent); }
  .btn-logout:hover { background: rgba(220,38,38,.15) !important; border-color: rgba(220,38,38,.3) !important; color: #FCA5A5 !important; }
  .footer-detail { font-size: 10.5px; color: rgba(255,255,255,.25); padding: 6px 4px 0; line-height: 1.6; }

  /* ---- Main content area ---- */
  .main { flex: 1; min-width: 0; padding: 24px 28px 60px; overflow-x: hidden; }
  .page-header {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .page-title { font-size: 20px; font-weight: 700; color: var(--ink); letter-spacing: -.02em; }
  .page-sub { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }

  /* ---- Buttons ---- */
  .btn {
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 12.5px;
    padding: 7px 14px;
    border-radius: var(--r);
    border: 1px solid transparent;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .12s;
    white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent-dark); }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-ghost { background: #fff; color: var(--ink-2); border-color: var(--border-2); box-shadow: var(--shadow-sm); }
  .btn-ghost:hover { background: var(--surface-2); border-color: var(--border-2); }
  .btn-danger-text { background: transparent; color: var(--neg); border: none; padding: 4px 8px; font-size: 12px; }
  .btn-sm { padding: 5px 10px; font-size: 11.5px; }

  /* ---- KPI Cards ---- */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
  }
  .kpi-label {
    font-size: 10.5px; color: var(--ink-3);
    text-transform: uppercase; letter-spacing: .06em;
    margin-bottom: 6px; font-weight: 600;
  }
  .kpi-value { font-family: var(--font-num); font-size: 21px; font-weight: 700; letter-spacing: -.02em; color: var(--ink); }
  .kpi-value.pos { color: var(--pos); }
  .kpi-value.neg { color: var(--neg); }
  .kpi-note { font-size: 11px; color: var(--ink-4); margin-top: 4px; }

  /* ---- Panels ---- */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    margin-bottom: 16px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .panel-title { font-size: 13px; font-weight: 700; color: var(--ink); letter-spacing: -.01em; }
  .panel-body { padding: 0 18px 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* ---- Tables ---- */
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 600px; }
  thead th {
    text-align: left;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink-3);
    font-weight: 600;
    padding: 10px 10px 8px;
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
    background: var(--surface);
  }
  tbody td { padding: 9px 10px; border-bottom: 1px solid #F0F2F5; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #F7F9FC; }
  td.num, th.num { text-align: right; font-family: var(--font-mono); font-size: 12px; }

  /* ---- Tags & Status ---- */
  .tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; padding: 2px 8px;
    border-radius: 999px;
  }
  .tag-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .status-pill { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .status-pago { background: var(--pos-bg); color: var(--pos); }
  .status-pendente { background: var(--warn-bg); color: var(--warn); }
  .status-agendado { background: var(--muted-bg); color: var(--muted); }
  .conc-yes { color: var(--pos); font-weight: 600; font-size: 11.5px; }
  .conc-no { color: var(--ink-4); font-size: 11.5px; }

  /* ---- Actions ---- */
  .row-actions { display: flex; gap: 2px; justify-content: flex-end; }
  .icon-btn {
    border: none; background: transparent; cursor: pointer;
    padding: 4px 6px; border-radius: var(--r-sm); color: var(--ink-4);
    font-size: 12.5px; transition: all .1s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink-2); }
  .icon-btn.danger:hover { background: var(--neg-bg); color: var(--neg); }

  /* ---- Filter bar ---- */
  .filter-bar {
    display: flex; gap: 8px; flex-wrap: wrap;
    padding: 12px 18px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .filter-bar select, .filter-bar input[type=date], .filter-bar input[type=text] {
    font-family: var(--font-ui); font-size: 12px; padding: 6px 10px;
    border-radius: var(--r); border: 1px solid var(--border-2);
    background: var(--surface); color: var(--ink);
    box-shadow: var(--shadow-sm);
  }
  .filter-bar select:focus, .filter-bar input:focus {
    outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent;
  }

  /* ---- Modals ---- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(11,20,45,.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 500; padding: 20px;
    backdrop-filter: blur(2px);
  }
  .modal {
    background: var(--surface); border-radius: var(--r-xl);
    width: 500px; max-width: 94vw; max-height: 88vh; overflow-y: auto;
    box-shadow: var(--shadow-xl);
    border: 1px solid var(--border);
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
    border-radius: var(--r-xl) var(--r-xl) 0 0;
  }
  .modal-title { font-size: 15px; font-weight: 700; color: var(--ink); }
  .modal-close { border: none; background: transparent; font-size: 16px; cursor: pointer; color: var(--ink-4); padding: 2px 6px; border-radius: var(--r-sm); transition: all .1s; }
  .modal-close:hover { background: var(--neg-bg); color: var(--neg); }
  .modal-body { padding: 18px 20px; }
  .modal-foot {
    display: flex; justify-content: flex-end; gap: 8px;
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface-2);
    border-radius: 0 0 var(--r-xl) var(--r-xl);
  }

  /* ---- Form fields ---- */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; letter-spacing: .01em; }
  .field input, .field select, .field textarea {
    width: 100%; font-family: var(--font-ui); font-size: 13px;
    padding: 8px 11px; border-radius: var(--r);
    border: 1px solid var(--border-2);
    background: var(--surface); color: var(--ink);
    transition: border-color .12s, box-shadow .12s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .checkbox-row input { width: auto; }
  .field-help { font-size: 11px; color: var(--ink-4); margin-top: 4px; line-height: 1.5; }

  /* ---- Charts ---- */
  .bar-row { display: grid; grid-template-columns: 160px 1fr 110px; align-items: center; gap: 12px; padding: 8px 0; }
  .bar-track { height: 6px; border-radius: 999px; background: var(--muted-bg); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width .3s ease; }
  .bar-row .val { font-family: var(--font-mono); font-size: 12px; text-align: right; color: var(--ink-2); }

  /* ---- Toast ---- */
  .toast-wrap { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 999; }
  .toast {
    background: var(--ink); color: #fff; padding: 10px 16px;
    border-radius: var(--r-lg); font-size: 12.5px;
    box-shadow: var(--shadow-lg); animation: toast-in .18s ease-out;
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    max-width: 360px;
  }
  .toast.error { background: var(--neg); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .empty-state { padding: 36px 20px; text-align: center; color: var(--ink-4); font-size: 13px; }
  .loading-screen { display: flex; align-items: center; justify-content: center; height: 100vh; width: 100%; color: var(--ink-4); font-family: var(--font-mono); font-size: 13px; }
  .masked-value { color: var(--ink-4); letter-spacing: 2px; }

  /* ---- Responsive ---- */



/* =============================================================
   RESPONSIVE — Mobile-first (320px+), Tablet (600px+), Desktop (900px+)
   Abordagem: sidebar como drawer no mobile, colapsada no tablet
============================================================= */

/* ---- Overlay do drawer (mobile) ---- */
.sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 149;
}
.sidebar-overlay.open { display: block; }

/* ---- Hamburguer ---- */
.mob-topbar {
  display: none;
  align-items: center;
  gap: 10px;
  background: var(--brand);
  padding: 0 14px;
  height: 48px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(255,255,255,.07);
  position: sticky; top: 0; z-index: 140;
}
.mob-menu-btn {
  background: none; border: none; cursor: pointer;
  display: flex; flex-direction: column; gap: 4px; padding: 6px;
}
.mob-menu-btn span {
  display: block; width: 20px; height: 2px;
  background: rgba(255,255,255,.8); border-radius: 2px;
  transition: all .2s;
}
.mob-logo {
  font-weight: 700; font-size: 14px; color: #fff; letter-spacing: .02em;
  display: flex; align-items: center; gap: 7px;
}
.mob-logo .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }

/* ---- Tablet: 600-899px — sidebar collapse icons ---- */
@media (max-width: 899px) and (min-width: 600px) {
  .modbar { display: none; }
  .mob-topbar { display: flex; }
  #app { flex-direction: column; }
  #appBody { flex: 1; }
  .sidebar {
    position: fixed; top: 0; left: -240px; height: 100vh;
    width: 228px; z-index: 150;
    transition: left .22s cubic-bezier(.4,0,.2,1);
    max-height: 100vh;
  }
  .sidebar.open { left: 0; box-shadow: 4px 0 24px rgba(0,0,0,.35); }
  .main { padding: 16px 16px 60px; }
  .modal { width: 90vw; }
  .page-header { flex-direction: column; align-items: flex-start; gap: 10px; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr) !important; }
  table { min-width: 500px; }
  .field-row { flex-direction: column; gap: 0; }
}

/* ---- Mobile: até 599px — full drawer + layout compacto ---- */
@media (max-width: 599px) {
  .modbar { display: none; }
  .mob-topbar { display: flex; }
  #app { flex-direction: column; }
  #appBody { flex: 1; }

  /* Sidebar como drawer full-height */
  .sidebar {
    position: fixed; top: 0; left: -100vw; height: 100vh;
    width: min(280px, 85vw); z-index: 150;
    transition: left .22s cubic-bezier(.4,0,.2,1);
    max-height: 100vh; overflow-y: auto;
    box-shadow: none;
  }
  .sidebar.open { left: 0; box-shadow: 4px 0 32px rgba(0,0,0,.4); }

  /* Main area */
  .main { padding: 12px 12px 80px; min-width: 0; }
  .page-header {
    flex-direction: column; align-items: flex-start;
    gap: 10px; padding-bottom: 12px;
  }
  .page-header > div:last-child { width: 100%; }
  .page-header .btn { width: 100%; justify-content: center; }

  /* KPI grid: sempre 2 colunas no mobile */
  .kpi-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 8px; }
  .kpi-card { padding: 10px 12px; }
  .kpi-value { font-size: 18px !important; }
  .kpi-label { font-size: 10px; }

  /* Panel */
  .panel { border-radius: var(--r-lg); }
  .panel-body { padding: 0 12px 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .panel-head { padding: 10px 14px 8px; flex-wrap: wrap; gap: 6px; }
  .panel-title { font-size: 12.5px; }

  /* Tabelas: scroll horizontal, sem truncar */
  .panel-body table { min-width: 560px; font-size: 12px; }
  thead th { padding: 8px 8px 6px; font-size: 10px; }
  tbody td { padding: 7px 8px; }

  /* Filtros empilhados */
  .filter-bar {
    flex-direction: column; gap: 6px; padding: 10px 12px;
  }
  .filter-bar select,
  .filter-bar input[type=date],

function dividirValor(total, qtd){
  const totalCentavos = Math.round(Number(total) * 100);
  const baseCentavos = Math.floor(totalCentavos / qtd);
  const resto = totalCentavos - (baseCentavos * qtd);
  const valores = [];
  for(let i=0;i<qtd;i++){
    let c = baseCentavos;
    if(i === qtd - 1) c += resto; // ultima parcela absorve a sobra de arredondamento
    valores.push(Math.round(c) / 100);
  }
  return valores;
}
const MESES_POR_FREQUENCIA = { "Mensal":1, "Bimestral":2, "Trimestral":3, "Semestral":6, "Anual":12 };
function proximaData(dataISO, freq){
  const d = new Date(dataISO + "T00:00:00");
  if(freq === "Semanal"){ d.setDate(d.getDate() + 7); return d.toISOString().slice(0,10); }
  if(freq === "Quinzenal"){ d.setDate(d.getDate() + 15); return d.toISOString().slice(0,10); }
  const meses = MESES_POR_FREQUENCIA[freq] || 1;
  const dia = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + meses);
  const diasNoMes = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(dia, diasNoMes));
  return d.toISOString().slice(0,10);
}
function calcularVencimento(dataCompraISO, cartao){
  const d = new Date(dataCompraISO + 'T00:00:00');
  const diaCompra = d.getDate();
  let anoFech = d.getFullYear(), mesFech = d.getMonth();
  if(diaCompra > cartao.diaFechamento){ mesFech += 1; if(mesFech > 11){ mesFech = 0; anoFech += 1; } }
  let anoVenc = anoFech, mesVenc = mesFech;
  if(cartao.diaVencimento < cartao.diaFechamento){ mesVenc += 1; if(mesVenc > 11){ mesVenc = 0; anoVenc += 1; } }
  const diasNoMes = new Date(anoVenc, mesVenc + 1, 0).getDate();
  const diaVenc = Math.min(cartao.diaVencimento, diasNoMes);
  return new Date(anoVenc, mesVenc, diaVenc).toISOString().slice(0,10);
}

function faturasAgrupadas(cartaoId){
  const grupos = {};

    grupos[l.data].total += Number(l.valor);
    grupos[l.data].itens.push(l);
  });
  return Object.values(grupos).sort((a,b) => a.data.localeCompare(b.data));
}
function autoBaixarAgendados(){
  // "Agendado" = debito/credito automatico agendado no banco: quando a data chega, vira "Pago" sozinho.

  const hojeISO = todayISO();
  let alterou = [];
  for(const l of state.lancamentos){
    if(l.inativo) continue;
    if(l.status === "Agendado" && l.data <= hojeISO && l.tipo !== "Transferência"){
      l.status = "Pago";
      l.conciliado = true;
      alterou.push(l);

}

function attachCalculadora(inputId){
  const input = document.getElementById("campo_" + inputId);
  if(!input || input.dataset.calcAttached) return;
  input.dataset.calcAttached = "1";
  const wrap = document.createElement("div");

  btn.title = "Calculadora";
  btn.textContent = "🧮";
  btn.style.cssText = "position:absolute; right:2px; top:50%; transform:translateY(-50%); border:none; background:transparent; cursor:pointer; font-size:15px; padding:6px 8px; border-radius:var(--r-sm);";
  wrap.appendChild(btn);
  const pop = document.createElement("div");
  pop.style.cssText = "display:none; position:absolute; z-index:80; top:100%; right:0; margin-top:6px; background:#fff; border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:0 10px 28px rgba(0,0,0,.18); padding:10px; width:206px;";
  const displayId = "calcDisplay_" + inputId;
  pop.innerHTML = `
    <input type="text" readonly id="${displayId}" value="0" style="width:100%; box-sizing:border-box; text-align:right; font-family:var(--font-mono); font-size:16px; padding:8px; border:1px solid var(--border); border-radius:var(--r-sm); margin-bottom:8px;">
    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:5px;">
      ${["7","8","9","÷","4","5","6","×","1","2","3","−","C","0",".","+"].map(k=>`<button type="button" data-k="${k}" style="padding:9px 0; border:1px solid var(--border); border-radius:var(--r-sm); background:var(--surface-2); cursor:pointer; font-size:13px; font-family:var(--font-mono);">${k}</button>`).join("")}
      <button type="button" data-k="=" style="grid-column:span 4; padding:9px 0; border:none; border-radius:var(--r-sm); background:var(--accent); color:#fff; cursor:pointer; font-weight:600; margin-top:4px; font-size:12.5px;">= Usar valor</button>
    </div>
  `;
  wrap.appendChild(pop);
  let expr = "";
  const display = () => document.getElementById(displayId);
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const abrindo = pop.style.display !== "block";
    pop.style.display = abrindo ? "block" : "none";
    if(abrindo){
      expr = (input.value && Number(input.value) !== 0) ? String(input.value) : "";
      display().value = expr || "0";
    }
  });
  pop.addEventListener("click", (e) => e.stopPropagation());
  pop.querySelectorAll("[data-k]").forEach(b => {
    b.addEventListener("click", () => {
      const k = b.dataset.k;
      if(k === "C"){ expr = ""; display().value = "0"; return; }
      if(k === "="){
        const safeExpr = expr.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
        if(!safeExpr || !/^[0-9+\-*/.() ]+$/.test(safeExpr)){ display().value = "erro"; return; }
        try{
          const resultado = Function('"use strict"; return (' + safeExpr + ")")();
          if(typeof resultado !== "number" || !isFinite(resultado)){ display().value = "erro"; return; }
          const val = Math.round(resultado * 100) / 100;
          input.value = val;
          input.dispatchEvent(new Event("change", {bubbles:true}));
          pop.style.display = "none";
        }catch(err){ display().value = "erro"; }
        return;
      }
      expr += k;
      display().value = expr || "0";
    });
  });
  document.addEventListener("click", (ev) => { if(!wrap.contains(ev.target)) pop.style.display = "none"; });
}

async function saveRows(table, items){
  if(!state.user || !items.length) return;
  try{
    const rows = items.map(item => {
      const { id, ...rest } = item;
      return { id, user_id: state.user.id, dados: rest, updated_at: new Date().toISOString() };
    });
    const { error } = await supabaseClient.from(table).upsert(rows, { onConflict: "id" });
    if(error) throw error;
    state.storageOK = true;
    state.ultimoSalvamento = new Date();
  }catch(e){
    state.storageOK = false;
    console.error(`[saveRows:${table}]`, e);
    if(ehErroDeSessao(e)){ await tratarErroDeSessao(e); return; }
    showToast(`Não salvou (${table}): ${e.message || e}`, "error");
  }
}
async function deleteRow(table, id){
  if(!state.user || !id) return;
  try{
    const { error } = await supabaseClient.from(table).delete().eq("id", id).eq("user_id", state.user.id);
    if(error) throw error;
  }catch(e){
    console.error(`[deleteRow:${table}]`, e);
    if(ehErroDeSessao(e)){ await tratarErroDeSessao(e); return; }
    showToast(`Erro ao excluir (${table}): ${e.message || e}`, "error");
  }
}
async function deleteRows(table, ids){
  if(!state.user || !ids || !ids.length) return;
  try{
    const { error } = await supabaseClient.from(table).delete().in("id", ids).eq("user_id", state.user.id);
    if(error) throw error;
  }catch(e){
    console.error(`[deleteRows:${table}]`, e);
    if(ehErroDeSessao(e)){ await tratarErroDeSessao(e); return; }
    showToast(`Erro ao excluir (${table}): ${e.message || e}`, "error");
  }
}

function ehErroDeSessao(e){
  const msg = (e && e.message ? e.message : String(e || "")).toLowerCase();
  return msg.includes("jwt") || msg.includes("token") || msg.includes("session") || msg.includes("401") || msg.includes("not authenticated") || msg.includes("invalid claim") || msg.includes("expired");
}
async function tratarErroDeSessao(e){
  console.error("[sessão inválida]", e);
  showToast("Sua sessão expirou ou ficou inválida. Confira a data/hora do aparelho e entre novamente.", "error");
  try{ await supabaseClient.auth.signOut(); }catch(err){}
  state.user = null;

async function loadData(){
  if(!state.user) return;
  const TABELAS_CORE = ["contas","lancamentos","ajustes","categorias","negocios","cartoes"];
  try{
    const results = await Promise.all(TABELAS_CORE.map(t =>
      supabaseClient.from(t).select("id,dados").eq("user_id", state.user.id)
    ));
    results.forEach((r, i) => { if(r.error){ console.error(`[loadData:${TABELAS_CORE[i]}]`, r.error); throw r.error; } });
    const [contas, lancamentos, ajustes, categorias, negocios, cartoes] = results.map(r =>
      (r.data || []).map(row => ({ id: row.id, ...row.dados }))
    );
    state.contas = contas;
    state.lancamentos = lancamentos;
    state.ajustes = ajustes;
    state.categorias = categorias;
    state.negocios = negocios;
    state.cartoes = cartoes;
    state.storageOK = true;

    // "perfis" (multiusuário) é tabela opcional/nova: se ainda não existir no banco,
    // não trava o resto do app — só fica sem perfis (só o Master existe) até você
    // rodar o SQL de criação da tabela no Supabase.
    try{
      const { data, error } = await supabaseClient.from("perfis").select("id,dados").eq("user_id", state.user.id);
      if(error) throw error;
      state.perfis = (data || []).map(row => ({ id: row.id, ...row.dados }));
    }catch(e){
      console.warn("[loadData:perfis] tabela 'perfis' ainda não existe no Supabase — rode o SQL de criação.", e.message || e);
      state.perfis = [];
    }

    // "config" guarda a senha do Master. Tambem opcional/nova: se nao existir, usa a senha padrao.
    try{
      const { data, error } = await supabaseClient.from("config").select("id,dados").eq("user_id", state.user.id).eq("id", "master").maybeSingle();
      if(error) throw error;
      state.senhaMaster = (data && data.dados && data.dados.senhaMaster) || SENHA_MASTER_PADRAO;
    }catch(e){
      console.warn("[loadData:config] tabela 'config' ainda não existe no Supabase — usando senha padrão do Master.", e.message || e);
      state.senhaMaster = SENHA_MASTER_PADRAO;
    }

    // Tabelas de estoque — opcionais/novas
    for(const [tbl, key] of [["est_produtos","estProdutos"],["est_movimentos","estMovimentos"],["est_fornecedores","estFornecedores"],["cli_clientes","cliClientes"],["cli_planos","cliPlanos"]]){
      try{
        const { data, error } = await supabaseClient.from(tbl).select("id,dados").eq("user_id", state.user.id);
        if(error) throw error;
        state[key] = (data || []).map(row => ({ id: row.id, ...row.dados }));
      }catch(e){
        console.warn(`[loadData:${tbl}] tabela ainda não existe — rode o SQL de criação.`, e.message||e);
        state[key] = [];
      }
    }

    // Primeiro login: sem categorias/negocios ainda -> semeia os padroes.
    if(state.categorias.length === 0 && state.negocios.length === 0){
      state.categorias = seedCategorias();
      state.negocios = seedNegocios();
      await saveCategorias();
      await saveNegocios();
    }
    if(autoBaixarAgendados().length) await saveLancamentos();
  }catch(e){
    state.storageOK = false;
    if(ehErroDeSessao(e)){ await tratarErroDeSessao(e); return; }
    showToast("Erro ao carregar dados: " + (e.message || e), "error");
  }
}
function seedCategorias(){
  return ["Servidores/Hospedagem","Aluguel","Assinaturas/Softwares","Marketing","Salários/Pró-labore","Impostos/Taxas","Outros"]
    .map(nome => ({ id: uid("cat"), nome, subcategorias: [] }));
}
function seedNegocios(){
  return ["TopTV","Uniplay","ServNet","Precautec","Porto Odonto","Pessoal","Compartilhado"]
    .map((nome,i) => ({ id: uid("neg"), nome, cor: PALETA_NEGOCIOS[i % PALETA_NEGOCIOS.length] }));
}

function saldoAtual(contaId){
  const conta = contaById(contaId);
  if(!conta) return 0;
  let total = Number(conta.saldoInicial) || 0;
  for(const l of state.lancamentos){
    if(l.inativo) continue;
    if(l.status !== "Pago") continue;
    if(l.tipo === "Receita" && l.contaOrigem === contaId) total += Number(l.valor);
    if(l.tipo === "Despesa" && l.contaOrigem === contaId) total -= Number(l.valor);
    if(l.tipo === "Transferência"){
      if(l.contaOrigem === contaId) total -= Number(l.valor);
      if(l.contaDestino === contaId) total += Number(l.valor);
    }
  }
  for(const a of state.ajustes){ if(a.contaId === contaId) total += Number(a.valor); }
  return total;
}
function saldoProjetado(contaId){
  let total = saldoAtual(contaId);
  for(const l of state.lancamentos){
    if(l.inativo) continue;
    if(l.status === "Pago") continue;
    if(l.tipo === "Receita" && l.contaOrigem === contaId) total += Number(l.valor);
    if(l.tipo === "Despesa" && l.contaOrigem === contaId) total -= Number(l.valor);
    if(l.tipo === "Transferência"){
      if(l.contaOrigem === contaId) total -= Number(l.valor);
      if(l.contaDestino === contaId) total += Number(l.valor);
    }
  }
  return total;
}
function naoConciliados(contaId){
  return state.lancamentos.filter(l => (l.contaOrigem === contaId || l.contaDestino === contaId) && !l.conciliado).length;
}
function saldoProjetadoAteMes(ano, mes){
  const base = state.contas.reduce((s,c) => s + (Number(c.saldoInicial)||0), 0);
  const fimISO = new Date(ano, mes + 1, 0).toISOString().slice(0,10);
  let total = base;
  for(const l of state.lancamentos){
    if(l.inativo) continue;
    if(l.data > fimISO) continue;
    if(l.tipo === "Receita") total += Number(l.valor);
    if(l.tipo === "Despesa") total -= Number(l.valor);
  }
  for(const a of state.ajustes){ if(a.data <= fimISO) total += Number(a.valor); }
  return total;
}
function saldoContaAteMes(contaId, ano, mes){
  const conta = contaById(contaId);
  if(!conta) return 0;
  const fimISO = new Date(ano, mes + 1, 0).toISOString().slice(0,10);
  let total = Number(conta.saldoInicial) || 0;
  for(const l of state.lancamentos){
    if(l.inativo) continue;
    if(l.data > fimISO) continue;
    if(l.tipo === "Receita" && l.contaOrigem === contaId) total += Number(l.valor);
    if(l.tipo === "Despesa" && l.contaOrigem === contaId) total -= Number(l.valor);
    if(l.tipo === "Transferência"){
      if(l.contaOrigem === contaId) total -= Number(l.valor);
      if(l.contaDestino === contaId) total += Number(l.valor);
    }
  }
  for(const a of state.ajustes){ if(a.contaId === contaId && a.data <= fimISO) total += Number(a.valor); }
  return total;
}
function movimentoPendenteDoMes(ano, mes){
  const inicioISO = new Date(ano, mes, 1).toISOString().slice(0,10);
  const fimISO = new Date(ano, mes + 1, 0).toISOString().slice(0,10);
  let entradas = 0, saidas = 0;
  for(const l of state.lancamentos){
    if(l.inativo) continue;
    if(l.data < inicioISO || l.data > fimISO || l.status === "Pago") continue;
    if(l.tipo === "Receita") entradas += Number(l.valor);
    if(l.tipo === "Despesa") saidas += Number(l.valor);
  }
  return { entradas, saidas };
}
function movimentoRealizadoDoMes(ano, mes){
  const inicioISO = new Date(ano, mes, 1).toISOString().slice(0,10);
  const fimISO = new Date(ano, mes + 1, 0).toISOString().slice(0,10);
  let entradas = 0, saidas = 0;
  for(const l of state.lancamentos){
    if(l.inativo) continue;
    if(l.data < inicioISO || l.data > fimISO || l.status !== "Pago") continue;
    if(l.tipo === "Receita") entradas += Number(l.valor);
    if(l.tipo === "Despesa") saidas += Number(l.valor);
  }
  return { entradas, saidas };
}
function topLancamentosDoMes(tipo, ano, mes, n){
  const inicioISO = new Date(ano, mes, 1).toISOString().slice(0,10);
  const fimISO = new Date(ano, mes + 1, 0).toISOString().slice(0,10);
  return state.lancamentos
    .filter(l => l.tipo === tipo && l.data >= inicioISO && l.data <= fimISO)
    .sort((a,b) => Number(b.valor) - Number(a.valor))
    .slice(0, n || 5);
}
function contasAPagar(){
  return state.lancamentos.filter(l => l.tipo === "Despesa" && l.status !== "Pago" && !l.inativo);
}
function contasAReceber(){
  return state.lancamentos.filter(l => l.tipo === "Receita" && l.status !== "Pago" && !l.inativo);
}
function contasAPagarConsolidado(){
  // Despesas avulsas ficam uma por uma. Compras de cartao viram UMA linha por fatura
  // (mesmo cartao + mesma data de vencimento), porque é assim que se paga de verdade.
  const pendentes = state.lancamentos.filter(l => l.tipo === "Despesa" && l.status !== "Pago" && !l.inativo);
  const individuais = pendentes.filter(l => !l.cartaoId).map(l => ({
    tipo: "individual", id: l.id, data: l.data, valor: Number(l.valor),
    descricao: l.descricao, negocio: l.negocio, status: l.status
  }));
  const grupos = {};
  pendentes.filter(l => l.cartaoId).forEach(l => {
    const key = l.cartaoId + "|" + l.data;
    if(!grupos[key]) grupos[key] = { cartaoId: l.cartaoId, data: l.data, valor: 0, itens: [] };
    grupos[key].valor += Number(l.valor);
    grupos[key].itens.push(l);
  });
  const faturas = Object.values(grupos).map(g => {
    const cartao = cartaoById(g.cartaoId);
    return {
      tipo: "fatura", cartaoId: g.cartaoId, data: g.data, valor: g.valor,
      descricao: `Fatura ${cartao ? cartao.nome : "Cartão"} (${g.itens.length} compra${g.itens.length===1?'':'s'})`,
      negocio: "", status: "Provisionado"
    };
  });
  return [...individuais, ...faturas].sort((a,b) => a.data.localeCompare(b.data));
}

function campoValorProtegido(label, name, valor, unlocked, opts){
  opts = opts || {};
  const helpExtra = opts.help ? `<div class="field-help">${opts.help}</div>` : "";
  if(unlocked){
    const min = opts.min !== undefined ? `min="${opts.min}"` : "";
    const req = opts.required === false ? "" : "required";
    return `<div class="field"><label>${label}</label><input id="campo_${name}" ${req} type="number" step="0.01" ${min} name="${name}" value="${valor}">${helpExtra}</div>`;
  }
  return `<div class="field"><label>${label}</label>
    <input type="text" value="R$ ••••••" disabled style="background:var(--surface-2); color:var(--ink-4); cursor:not-allowed;">
    <input type="hidden" name="${name}" value="${valor}">
    <div class="field-help">🔒 Desbloqueie para ver ou alterar este valor.</div>
  </div>`;
}

  });
  renderView();
}
function navItem(view, icon, label){
  const active = state.view === view ? "active" : "";
  return `<div class="nav-item ${active}" data-action="nav" data-view="${view}">
    <span style="display:flex;align-items:center;gap:9px;"><span class="nav-ico">${icon}</span><span class="label">${label}</span></span>

}
const AJUSTES_SUBVIEWS = ["ajustes","categorias","negocios"];
function navSubmenuAjustes(){

  const subItens = [
    navItem("ajustes","∿","Ajustes de Saldo"),

}
function navItemSoon(label){
  return `<div class="nav-item disabled">
    <span style="display:flex;align-items:center;gap:9px;"><span class="nav-ico">○</span><span class="label">${label}</span></span>

function renderView(){
  const main = document.getElementById("mainArea");
  if(!main) return;
  if(state.view === "dashboard") main.innerHTML = viewDashboard();
  else if(state.view === "contas") main.innerHTML = viewContas();
  else if(state.view === "cartoes") main.innerHTML = viewCartoes();
  else if(state.view === "lancamentos" || state.view === "receitas" || state.view === "despesas" || state.view === "transferencias") main.innerHTML = viewLancamentos();
  else if(state.view === "ajustes") main.innerHTML = viewAjustes();
  else if(state.view === "categorias") main.innerHTML = viewCategorias();
  else if(state.view === "negocios") main.innerHTML = viewNegocios();
  else if(state.view === "usuarios") main.innerHTML = viewUsuarios();

  else if(state.view === "est_dashboard") main.innerHTML = viewEstDashboard();
  else if(state.view === "est_produtos") main.innerHTML = viewEstProdutos();
  else if(state.view === "est_movimentos") main.innerHTML = viewEstMovimentos();
  else if(state.view === "est_fornecedores") main.innerHTML = viewEstFornecedores();
  else if(state.view === "est_alertas") main.innerHTML = viewEstAlertas();
  // ---- Módulo Clientes ----
  else if(state.view === "cli_dashboard") main.innerHTML = viewCliDashboard();
  else if(state.view === "cli_lista") main.innerHTML = viewCliLista();
  else if(state.view === "cli_planos") main.innerHTML = viewCliPlanos();
  else if(state.view === "cli_detalhe") main.innerHTML = viewCliDetalhe();
}

  return `

      <div style="background:#fff; padding:40px; border-radius:var(--r-xl); width:380px; max-width:90%; box-shadow:0 4px 24px rgba(0,0,0,0.08);">
        <h2 style="font-family:var(--font-ui); margin-bottom:4px;">💰 ${isLogin ? "Entrar" : "Criar conta"}</h2>

        <form id="authForm">
          <div class="field"><label>Email</label><input type="email" id="authEmail" placeholder="seu@email.com" required></div>
          <div class="field"><label>Senha</label><input type="password" id="authPassword" placeholder="Mínimo 6 caracteres" required minlength="6"></div>
          <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;" ${authBusy ? "disabled" : ""}>${authBusy ? "Aguarde..." : (isLogin ? "Entrar" : "Criar conta")}</button>
        </form>
        <div style="text-align:center; margin-top:16px; font-size:13px; color:var(--ink-3);">
          ${isLogin ? "Não tem conta?" : "Já tem conta?"}
          <a data-action="switch-auth" style="color:var(--accent); cursor:pointer; font-weight:600;">${isLogin ? "Criar conta" : "Entrar"}</a>
        </div>
      </div>
    </div>
  `;
}
function wireAuthForm(){
  const form = document.getElementById("authForm");
  if(!form) return;
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const email = document.getElementById("authEmail").value.trim();
    const password = document.getElementById("authPassword").value;
    if(!email || !password) { showToast("Preencha email e senha.", "error"); return; }
    authBusy = true; renderApp();
    const ok = authMode === "login" ? await doLogin(email, password) : await doSignup(email, password);
    authBusy = false;
    renderApp();
  });
}

// VIEW: DASHBOARD
// ============================================================
function viewDashboard(){
  const lockedReceber = !receberDesbloqueado();
  const lockedPagar = !pagarDesbloqueado();
  const mv = state.mesVisualizado;
  const hoje = new Date();
  const isMesAtual = mv.ano === hoje.getFullYear() && mv.mes === hoje.getMonth();
  const saldoMesAnterior = (() => { const m = mv.mes===0?11:mv.mes-1; const a = mv.mes===0?mv.ano-1:mv.ano; return saldoProjetadoAteMes(a,m); })();
  const movPendente = movimentoPendenteDoMes(mv.ano, mv.mes);
  const movReal = movimentoRealizadoDoMes(mv.ano, mv.mes);
  const saldoAtualMes = saldoMesAnterior + movReal.entradas - movReal.saidas;
  const saldoFinalPrevisto = saldoAtualMes + movPendente.entradas - movPendente.saidas;
  const topReceitas = topLancamentosDoMes("Receita", mv.ano, mv.mes, 5);
  const topDespesas = topLancamentosDoMes("Despesa", mv.ano, mv.mes, 5);
  const maxAbs = Math.max(...state.contas.map(c => Math.abs(saldoContaAteMes(c.id, mv.ano, mv.mes))), 1);

  // A pagar e a receber do mês selecionado (apenas pendentes, sem inativados, sem cartão)
  const inicioMesISO = new Date(mv.ano, mv.mes, 1).toISOString().slice(0,10);
  const fimMesISO = new Date(mv.ano, mv.mes + 1, 0).toISOString().slice(0,10);
  const pagarMes = lancamentosVisiveis(
    state.lancamentos.filter(l => l.tipo === "Despesa" && !l.cartaoId && !l.inativo && l.status !== "Pago" && l.data >= inicioMesISO && l.data <= fimMesISO)
  ).sort((a,b) => a.data.localeCompare(b.data));
  const receberMes = lancamentosVisiveis(
    state.lancamentos.filter(l => l.tipo === "Receita" && !l.inativo && l.status !== "Pago" && l.data >= inicioMesISO && l.data <= fimMesISO)
  ).sort((a,b) => a.data.localeCompare(b.data));

  const listaItemHTML = (l, tipo) => `
    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--border); font-size:12.5px;">
      <div style="min-width:0;">
        <div style="font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(l.descricao)||"—"}</div>
        <div style="font-size:11px; color:var(--ink-4);">${fmtDateBR(l.data)}${l.negocio ? ' · ' + esc(l.negocio) : ''}${l.lancadoPor ? ` · ${esc(l.lancadoPor)}` : ''}</div>
      </div>
      <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
        <span style="font-family:var(--font-mono); font-weight:600; color:${tipo==='receber'?'var(--pos)':'var(--neg)'};">${fmtBRL(l.valor)}</span>
        ${podeEditarNegocio(l.negocio) ? `<button class="icon-btn" data-action="baixar-titulo" data-id="${l.id}" title="Dar baixa" style="color:var(--pos); font-size:14px;">💲</button>` : ""}
      </div>
    </div>`;

  // Faturas de cartão do mês — com opções de pagamento total, mínimo e parcial
  const faturasCartaoMes = state.cartoes.flatMap(c => {
    return faturasAgrupadas(c.id).filter(f => f.data >= inicioMesISO && f.data <= fimMesISO).map(f => ({ cartao: c, fatura: f }));
  });
  const totalFaturasMes = faturasCartaoMes.reduce((s, {fatura}) => s + fatura.total, 0);
  const faturasCartaoHTML = faturasCartaoMes.map(({cartao: c, fatura: f}) => `
    <div style="border-top:1px solid var(--border); padding:8px 0;">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12.5px;">
        <div>
          <div style="font-weight:600;">💳 ${esc(c.nome)} <span style="font-size:11px; color:var(--ink-4);">final ${esc(c.ultimosDigitos)}</span></div>
          <div style="font-size:11px; color:var(--ink-4);">Vence ${fmtDateBR(f.data)} · ${f.itens.length} compra${f.itens.length===1?'':'s'} · Limite disp. ${fmtBRL(Number(c.limite||0)-faturaEmAberto(c.id))}</div>
        </div>
        <span style="font-family:var(--font-mono); font-weight:700; color:var(--neg);">${fmtBRL(f.total)}</span>
      </div>
      <div style="display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;">
        <button class="btn btn-primary btn-sm" data-action="pagar-fatura" data-id="${c.id}" data-venc="${f.data}">💰 Pagar total</button>
        <button class="btn btn-ghost btn-sm" data-action="pagar-fatura-minimo" data-id="${c.id}" data-venc="${f.data}" data-total="${f.total}" title="Geralmente 15% do total — marque as compras que quer pagar">💳 Pagar mínimo</button>
        <button class="btn btn-ghost btn-sm" data-action="pagar-fatura-parcial" data-id="${c.id}" data-venc="${f.data}" data-total="${f.total}" title="Escolha um valor e quais compras pagar">✏ Pagar parcial</button>
        <button class="btn btn-ghost btn-sm" data-action="ver-fatura" data-id="${c.id}" data-venc="${f.data}">🔍 Detalhes</button>
      </div>
    </div>`).join("");

  const totalPagarMes = pagarMes.reduce((s,l) => s+Number(l.valor), 0) + totalFaturasMes;
  const totalReceberMes = receberMes.reduce((s,l) => s+Number(l.valor), 0);
  const pagarHTML = (pagarMes.map(l => listaItemHTML(l,'pagar')).join("") + faturasCartaoHTML) || `<div style="font-size:12px; color:var(--ink-4); padding:10px 0;">Nada em aberto. 🎉</div>`;
  const receberHTML = receberMes.map(l => listaItemHTML(l,'receber')).join("") || `<div style="font-size:12px; color:var(--ink-4); padding:10px 0;">Nada a receber neste mês.</div>`;

  const barRow = (c, nested) => {
    const sa = saldoContaAteMes(c.id, mv.ano, mv.mes);
    const pct = lockedReceber ? 45 : Math.max(4, Math.round((Math.abs(sa)/maxAbs)*100));
    const inativa = c.ativa === false;
    const color = inativa ? "var(--ink-4)" : (lockedReceber ? "var(--ink-4)" : (nested ? "var(--c-porto)" : "var(--accent)"));
    const nomeTxt = nested ? `↳ ${esc(c.nome)}` : esc(c.nome);
    return `<div class="bar-row" style="${nested ? 'padding-left:14px;' : ''}">
      <div class="name" style="${nested ? 'font-weight:500; font-size:12px;' : ''}"><span class="tag-dot" style="background:${color}"></span>${nomeTxt}${inativa ? ' <span class="status-pill status-agendado">Inativa</span>' : ""}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${color};"></div></div>
      <div class="val ${lockedReceber ? 'masked-value' : ''}">${maskBRL(sa, receberDesbloqueado())}</div>
    </div>`;
  };
  const barsHTML = contasRaiz().map(c => barRow(c,false) + caixinhasDe(c.id).map(cx=>barRow(cx,true)).join("")).join("");
  const topListHTML = (lista, unlocked) => {
    if(!lista.length) return emptyState("Nada lançado neste mês.");
    return lista.map((l,i) => `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; ${i===0?'':'border-top:1px solid var(--border);'}">
        <div style="min-width:0;"><div style="font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${i+1}. ${esc(l.descricao)}</div>
        <div style="font-size:11px; color:var(--ink-4);">${fmtDateBR(l.data)} · ${l.status}${l.negocio ? ' · '+esc(l.negocio) : ''}</div></div>
        <div style="font-family:var(--font-mono); font-size:12.5px; font-weight:600; white-space:nowrap;">${fmtBRL(l.valor)}</div>
      </div>`).join("");
  };

  return `
    <div class="page-header"><div><div class="page-title">Dashboard</div><div class="page-sub">Posição do mês — navegue entre os meses para ver a projeção passada ou futura</div></div></div>
    <div class="panel" style="margin-bottom:18px;">
      <div class="panel-body" style="padding-top:16px;">
        <div style="display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:18px;">
          <button class="icon-btn" data-action="mes-prev" style="font-size:16px; padding:6px 12px; border:1px solid var(--border); border-radius:var(--r);">◀</button>
          <div style="text-align:center; min-width:200px;">
            <input type="month" id="mesManualInput" value="${mv.ano}-${String(mv.mes+1).padStart(2,'0')}" style="font-family:var(--font-ui); font-weight:700; font-size:16px; border:none; background:transparent; text-align:center; cursor:pointer; color:var(--ink); padding:2px;">
            <div>${!isMesAtual ? `<span style="font-size:11px; color:var(--ink-4); cursor:pointer; text-decoration:underline;" data-action="mes-hoje">voltar para hoje</span>` : `<span style="font-size:11px; color:var(--ink-4);">mês atual</span>`}</div>
          </div>
          <button class="icon-btn" data-action="mes-next" style="font-size:16px; padding:6px 12px; border:1px solid var(--border); border-radius:var(--r);">▶</button>
        </div>
        <div class="kpi-grid" style="grid-template-columns: repeat(2, minmax(150px, 1fr)); margin-bottom:14px;">
          <div class="kpi-card" style="text-align:center;"><div class="kpi-label">Saldo final mês anterior</div><div class="kpi-value ${saldoMesAnterior>=0?'pos':'neg'}">${fmtBRL(saldoMesAnterior)}</div></div>
          <div class="kpi-card" style="text-align:center;"><div class="kpi-label">Saldo atual</div><div class="kpi-value ${saldoAtualMes>=0?'pos':'neg'}">${fmtBRL(saldoAtualMes)}</div><div class="kpi-note">Mês anterior + realizado receitas − realizado despesas</div></div>
        </div>
        <div class="kpi-grid" style="grid-template-columns: repeat(2, minmax(150px, 1fr)); margin-bottom:14px;">
          <div class="kpi-card"><div class="kpi-label">📥 Previsto receitas</div><div class="kpi-value pos">${fmtBRL(movPendente.entradas)}</div><div class="kpi-note">Ainda não baixado</div></div>
          <div class="kpi-card"><div class="kpi-label">📤 Previsto despesas</div><div class="kpi-value neg">${fmtBRL(movPendente.saidas)}</div><div class="kpi-note">Ainda não baixado</div></div>
        </div>
        <div class="kpi-grid" style="grid-template-columns: repeat(2, minmax(150px, 1fr)); margin-bottom:0;">
          <div class="kpi-card"><div class="kpi-label">Realizado receitas</div><div class="kpi-value pos">${fmtBRL(movReal.entradas)}</div></div>
          <div class="kpi-card"><div class="kpi-label">Realizado despesas</div><div class="kpi-value neg">${fmtBRL(movReal.saidas)}</div></div>
        </div>
      </div>
    </div>

    <!-- A Receber (esq) + A Pagar (dir) — filtrados pelo mês -->
    <div class="kpi-grid" style="grid-template-columns: repeat(2, minmax(240px, 1fr)); margin-bottom:0;">
      <div class="panel" style="margin-bottom:0; border-bottom-left-radius:0; border-bottom-right-radius:0;">
        <div class="panel-head">
          <div class="panel-title">📥 A Receber — ${NOMES_MESES[mv.mes]}</div>
          <div style="font-family:var(--font-mono); font-weight:700; font-size:14px; color:var(--pos);">${fmtBRL(totalReceberMes)}</div>
        </div>
        <div class="panel-body" style="padding-top:0; max-height:340px; overflow-y:auto;">${receberHTML}</div>
      </div>
      <div class="panel" style="margin-bottom:0; border-bottom-left-radius:0; border-bottom-right-radius:0;">
        <div class="panel-head">
          <div class="panel-title">📤 A Pagar — ${NOMES_MESES[mv.mes]}</div>
          <div style="font-family:var(--font-mono); font-weight:700; font-size:14px; color:var(--neg);">${fmtBRL(totalPagarMes)}</div>
        </div>
        <div class="panel-body" style="padding-top:0; max-height:340px; overflow-y:auto;">${pagarHTML}</div>
      </div>
    </div>

    <!-- Saldo Final Previsto — abaixo dos dois painéis -->
    <div class="panel" style="margin-bottom:20px; border-top-left-radius:0; border-top-right-radius:0; border-top:none;">
      <div class="panel-body" style="padding:14px 18px; text-align:center;">
        <div class="kpi-label">Saldo final previsto</div>
        <div class="kpi-value ${saldoFinalPrevisto>=0?'pos':'neg'}" style="font-size:28px;">${fmtBRL(saldoFinalPrevisto)}</div>
        <div class="kpi-note">Saldo atual + previsto receitas − previsto despesas</div>
      </div>
    </div>

    <div class="kpi-grid" style="grid-template-columns: repeat(2, minmax(240px, 1fr)); margin-bottom:20px;">
      <div class="panel" style="margin-bottom:0;"><div class="panel-head"><div class="panel-title">Top 5 maiores receitas do mês</div></div><div class="panel-body" style="padding-top:6px;">${topListHTML(topReceitas, true)}</div></div>
      <div class="panel" style="margin-bottom:0;"><div class="panel-head"><div class="panel-title">Top 5 maiores despesas do mês</div></div><div class="panel-body" style="padding-top:6px;">${topListHTML(topDespesas, true)}</div></div>
    </div>
    <div class="panel"><div class="panel-head"><div class="panel-title">Saldo por conta${!isMesAtual ? ` — projetado até ${NOMES_MESES[mv.mes]} de ${mv.ano}` : ''}</div></div><div class="panel-body">${barsHTML || emptyState("Nenhuma conta cadastrada ainda.")}</div></div>
  `;
}

function viewContas(){
  const rowHTML = (c, nested) => {
    const sa = saldoAtual(c.id), sp = saldoProjetado(c.id), nc = naoConciliados(c.id);
    const inativa = c.ativa === false;
    const nomeCell = nested ? `<span style="color:var(--ink-4); padding-left:18px;">↳</span> ${esc(c.nome)}` : `<strong>${esc(c.nome)}</strong><div style="font-size:11px;color:var(--ink-4)">${esc(c.instituicao)} · ${esc(c.tipo)}</div>`;
    const novaCaixinhaBtn = nested ? "" : `<button class="icon-btn" data-action="new-caixinha" data-id="${c.id}" title="Nova caixinha">＋📦</button>`;
    return `<tr style="${inativa ? 'opacity:.55;' : ''} ${nested ? 'background:var(--surface-2);' : ''}">
      <td style="${nested ? 'padding-left:26px;' : ''}">${nomeCell}</td>
      <td class="num ${receberDesbloqueado()?'':'masked-value'}">${maskBRL(c.saldoInicial, receberDesbloqueado())}</td>
      <td class="num ${receberDesbloqueado()?'':'masked-value'}" style="font-weight:600;">${maskBRL(sa, receberDesbloqueado())}</td>
      <td class="num ${receberDesbloqueado()?'':'masked-value'}">${maskBRL(sp, receberDesbloqueado())}</td>
      <td style="text-align:center;">${nc > 0 ? `<span class="status-pill status-pendente">${nc}</span>` : "—"}</td>
      <td style="text-align:center;"><span class="status-pill ${inativa ? 'status-agendado' : 'status-pago'}" style="cursor:pointer;" data-action="toggle-ativa" data-id="${c.id}" title="Clique para ${inativa?'ativar':'inativar'}">${inativa ? "Inativa" : "Ativa"}</span></td>
      <td><div class="row-actions">${novaCaixinhaBtn}<button class="icon-btn" data-action="edit-conta" data-id="${c.id}" title="Editar">✎</button><button class="icon-btn danger" data-action="del-conta" data-id="${c.id}" title="Excluir">🗑</button></div></td>
    </tr>`;
  };
  const rows = contasRaiz().map(c => rowHTML(c,false) + caixinhasDe(c.id).map(cx=>rowHTML(cx,true)).join("")).join("");
  return `
    <div class="page-header"><div><div class="page-title">Contas Bancárias</div><div class="page-sub">Saldo Atual soma só lançamentos Pagos. Use "＋📦" para criar caixinhas dentro de uma conta.</div></div><button class="btn btn-primary" data-action="new-conta">+ Nova conta</button></div>
    <div class="panel"><div class="panel-body" style="padding-top:14px;"><table><thead><tr><th>Conta</th><th class="num">Saldo Inicial</th><th class="num">Saldo Atual</th><th class="num">Saldo Projetado</th><th style="text-align:center;">Não conc.</th><th style="text-align:center;">Status</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="7">${emptyState("Nenhuma conta cadastrada.")}</td></tr>`}</tbody></table></div></div>
  `;
}

// VIEW: CARTÕES DE CRÉDITO
// ============================================================
function viewCartoes(){
  const lockedPagar = !pagarDesbloqueado();
  const cardHTML = (c) => {
    const emAberto = faturaEmAberto(c.id);
    const disp = Number(c.limite||0) - emAberto;
    const inativo = c.ativo === false;
    const estourado = disp < 0;
    const todasFaturas = faturasAgrupadas(c.id);
    const faturas = todasFaturas.slice(0,6);
    const faturasHTML = faturas.length ? faturas.map(f => `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--border); font-size:12px;">
        <span style="color:var(--ink-3); cursor:pointer;" data-action="ver-fatura" data-id="${c.id}" data-venc="${f.data}">Vence ${fmtDateBR(f.data)} <span style="color:var(--ink-4);">(${f.itens.length} item${f.itens.length===1?'':'s'})</span></span>
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="${lockedPagar?'masked-value':''}" style="font-family:var(--font-mono); font-weight:600;">${maskBRL(f.total, pagarDesbloqueado())}</span>
          <button class="btn btn-ghost btn-sm" data-action="ver-fatura" data-id="${c.id}" data-venc="${f.data}">Detalhes</button>
          <button class="btn btn-ghost btn-sm" data-action="pagar-fatura" data-id="${c.id}" data-venc="${f.data}">Pagar fatura</button>
        </div>
      </div>`).join("") + (todasFaturas.length > faturas.length ? `<div style="font-size:11px; color:var(--ink-4); padding-top:6px;">+ ${todasFaturas.length - faturas.length} fatura(s) mais à frente</div>` : "")
      : `<div style="font-size:12px; color:var(--ink-4); padding:6px 0;">Nenhuma fatura em aberto.</div>`;
    const cor = PALETA_NEGOCIOS[state.cartoes.indexOf(c) % PALETA_NEGOCIOS.length];
    return `<div class="panel" style="margin-bottom:14px; ${inativo?'opacity:.55;':''}">
      <div style="padding:16px 18px; border-bottom:1px solid var(--border);">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
          <div>
            <div style="display:flex; align-items:center; gap:8px;"><span class="tag-dot" style="background:${cor};"></span><strong>${esc(c.nome)}</strong><span class="status-pill ${inativo?'status-agendado':'status-pago'}" style="cursor:pointer;" data-action="toggle-cartao-ativo" data-id="${c.id}">${inativo?"Inativo":"Ativo"}</span></div>
            <div style="font-size:12px; color:var(--ink-4); margin-top:3px;">${esc(c.bandeira)} · final ${esc(c.ultimosDigitos)} · fecha dia ${c.diaFechamento} · vence dia ${c.diaVencimento} · paga com ${contaLabel(contaById(c.contaPagamentoId))}</div>
          </div>
          <div class="row-actions"><button class="btn btn-primary btn-sm" data-action="new-compra-cartao" data-id="${c.id}">+ Compra</button><button class="icon-btn" data-action="edit-cartao" data-id="${c.id}" title="Editar">✎</button><button class="icon-btn danger" data-action="del-cartao" data-id="${c.id}" title="Excluir">🗑</button></div>
        </div>
      </div>
      <div class="panel-body" style="padding-top:14px;">
        <div class="kpi-grid" style="grid-template-columns: repeat(3, minmax(120px,1fr));">
          <div class="kpi-card"><div class="kpi-label">Limite</div><div class="kpi-value" style="font-size:16px;">${fmtBRL(c.limite)}</div></div>
          <div class="kpi-card"><div class="kpi-label">Fatura em aberto</div><div class="kpi-value ${lockedPagar?'masked-value':'neg'}" style="font-size:16px;">${maskBRL(emAberto, pagarDesbloqueado())}</div></div>
          <div class="kpi-card"><div class="kpi-label">Limite disponível</div><div class="kpi-value ${lockedPagar?'masked-value':(estourado?'neg':'pos')}" style="font-size:16px;">${lockedPagar ? "R$ ••••••" : fmtBRL(disp)}</div></div>
        </div>
        <div style="margin-top:10px;"><div style="font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-3); margin-bottom:2px;">Faturas em aberto — pagamento é por fatura fechada, não por compra</div>${faturasHTML}</div>
      </div>
    </div>`;
  };
  return `
    <div class="page-header"><div><div class="page-title">Cartões de Crédito</div><div class="page-sub">Cada compra vira um lançamento na data de vencimento da fatura certa — já entra em Contas a Pagar automaticamente.</div></div><button class="btn btn-primary" data-action="new-cartao">+ Novo cartão</button></div>
    ${state.cartoes.map(cardHTML).join("") || emptyState("Nenhum cartão cadastrado ainda.")}
  `;
}

let lancFilter = { negocio: "", status: "", conta: "", cartao: "", categoria: "", dataDe: "", dataAte: "" };
let lancSelecionados = new Set();
let lancVisibleIds = [];
const LANC_VIEW_CONFIG = {
  lancamentos:     { titulo: "Todos os Lançamentos", sub: "O coração do sistema — toda receita, despesa e transferência entra aqui.", tipo: null,             novoLabel: "+ Novo lançamento",  tipoPreset: null },
  receitas:        { titulo: "Contas a Receber",      sub: "Só receitas — o que você tem pra receber, entrar na conta.",           tipo: "Receita",         novoLabel: "+ Nova receita",     tipoPreset: "Receita" },
  despesas:        { titulo: "Contas a Pagar",         sub: "Só despesas avulsas — compras no cartão ficam no menu Cartão de Crédito.", tipo: "Despesa",     novoLabel: "+ Nova despesa",     tipoPreset: "Despesa" },
  transferencias:  { titulo: "Transferências",         sub: "Só transferências entre contas.",                                     tipo: "Transferência",  novoLabel: "+ Nova transferência", tipoPreset: "Transferência" },
};
const CATEGORIA_FILTRO_LABELS = {
  receber: "📥 Contas a Receber",
  pagar: "📤 Contas a Pagar",
  cartao: "💳 Cartão de Crédito",
  transferencia: "⇄ Transferências",
};
function viewLancamentos(){
  const cfg = LANC_VIEW_CONFIG[state.view] || LANC_VIEW_CONFIG.lancamentos;
  let list = [...state.lancamentos].sort((a,b) => a.data.localeCompare(b.data) || a.id.localeCompare(b.id));
  list = lancamentosVisiveis(list); // membros so veem os negocios liberados pra eles; Master ve tudo
  if(cfg.tipo) list = list.filter(l => l.tipo === cfg.tipo);
  if(state.view === "despesas") list = list.filter(l => !l.cartaoId); // compras de cartao ficam so no menu Cartao de Credito
  if(state.view === "lancamentos" && lancFilter.categoria){
    if(lancFilter.categoria === "receber") list = list.filter(l => l.tipo === "Receita");
    else if(lancFilter.categoria === "pagar") list = list.filter(l => l.tipo === "Despesa" && !l.cartaoId);
    else if(lancFilter.categoria === "cartao") list = list.filter(l => !!l.cartaoId);
    else if(lancFilter.categoria === "transferencia") list = list.filter(l => l.tipo === "Transferência");
  }
  if(lancFilter.negocio) list = list.filter(l => l.negocio === lancFilter.negocio);
  if(lancFilter.status) list = list.filter(l => l.status === lancFilter.status);
  if(lancFilter.conta) list = list.filter(l => l.contaOrigem === lancFilter.conta || l.contaDestino === lancFilter.conta);
  if(state.view === "lancamentos" && lancFilter.cartao) list = list.filter(l => l.cartaoId === lancFilter.cartao);
  if(lancFilter.dataDe) list = list.filter(l => l.data >= lancFilter.dataDe);
  if(lancFilter.dataAte) list = list.filter(l => l.data <= lancFilter.dataAte);
  lancVisibleIds = list.map(l => l.id);
  // limpa da selecao qualquer id que nao existe mais (ja excluido em outra tela, etc.)
  const idsValidos = new Set(state.lancamentos.map(l=>l.id));
  Array.from(lancSelecionados).forEach(id => { if(!idsValidos.has(id)) lancSelecionados.delete(id); });

  const rows = list.map(l => {
    const origem = contaById(l.contaOrigem);
    const destino = contaById(l.contaDestino);
    const cartao = l.cartaoId ? cartaoById(l.cartaoId) : null;
    const color = negocioCor(l.negocio);
    const statusClass = l.status === "Pago" ? "status-pago" : (l.status === "Provisionado" ? "status-pendente" : "status-agendado");
    let contaTxt;
    if(cartao){
      contaTxt = `💳 ${esc(cartao.nome)} <span style="color:var(--ink-4); font-size:11px;">final ${esc(cartao.ultimosDigitos)}</span>${l.dataCompra && l.dataCompra !== l.data ? `<div style="font-size:11px;color:var(--ink-4)">compra em ${fmtDateBR(l.dataCompra)}</div>` : ""}`;
    }else if(l.tipo === "Transferência"){
      contaTxt = `${origem ? contaLabel(origem) : "—"} → ${destino ? contaLabel(destino) : "—"}`;
    }else{
      contaTxt = origem ? contaLabel(origem) : "—";
    }
    const sinal = l.tipo === "Despesa" ? "−" : (l.tipo === "Receita" ? "+" : "⇄");
    const unlocked = l.tipo === "Despesa" ? pagarDesbloqueado() : receberDesbloqueado();
    const catTxt = [l.categoria, l.subcategoria].filter(Boolean).join(" › ");
    const recBadge = l.recorrenciaId ? ` <span title="${l.recorrenciaTipo==='parcelado'?'Parcelado':'Recorrente'} (${l.recorrenciaIndex}/${l.recorrenciaTotal})" style="font-size:11px;">${l.recorrenciaTipo==='parcelado'?'💳':'🔁'}</span>` : "";
    const podeEditar = podeEditarNegocio(l.negocio);
    const podeExcluir = podeExcluirNegocio(l.negocio);
    const podeBaixar = l.status !== "Pago" && l.tipo !== "Transferência" && !l.cartaoId && podeEditar && !l.inativo;
    const marcado = lancSelecionados.has(l.id);
    const autorBadge = l.lancadoPor ? `<span style="font-size:10px; color:var(--ink-4); margin-left:4px; font-family:var(--font-mono);">por ${esc(l.lancadoPor)}</span>` : "";
    if(l.inativo){
      const quando = l.inativadoEm ? ` em ${fmtDateBR(l.inativadoEm.slice(0,10))}` : "";
      return `<tr style="opacity:.45; background:#FAF5F5;">
        <td></td>
        <td style="white-space:nowrap; text-decoration:line-through;">${fmtDateBR(l.data)}</td>
        <td style="text-decoration:line-through;">${sinal} ${esc(l.tipo)}</td>
        <td style="text-decoration:line-through;">${l.negocio ? `<span class="tag" style="background:#EEE; color:#999;">${esc(l.negocio)}</span>` : "—"}</td>
        <td style="text-decoration:line-through;">${contaTxt}</td>
        <td style="text-decoration:line-through;">${esc(l.descricao)}<div style="font-size:11px;color:var(--neg);">Inativado por ${esc(l.inativadoPor||"?")}${quando}</div></td>
        <td class="num" style="text-decoration:line-through;">${fmtBRL(l.valor)}</td>
        <td><span class="status-pill status-agendado">Inativo</span></td>
        <td></td>
        <td><div class="row-actions">${ehMaster() ? `<button class="icon-btn" data-action="reativar-lanc" data-id="${l.id}" title="Reativar lançamento" style="color:var(--pos);">↩</button>` : ""}</div></td>
      </tr>`;
    }
    return `<tr style="${marcado ? 'background:#EAF1FB;' : ''}">
      <td style="text-align:center;">${podeExcluir ? `<input type="checkbox" data-action="toggle-select-lanc" data-id="${l.id}" ${marcado?"checked":""}>` : ""}</td>
      <td style="white-space:nowrap;">${fmtDateBR(l.data)}</td>
      <td>${sinal} ${esc(l.tipo)}</td>
