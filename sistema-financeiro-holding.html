  }));
  state.cartoes.push(...novosCartoes);
  await saveCartoes();

  // ---- Lançamentos (Receitas/Despesas/Transferências, espalhados em 3 meses) ----
  const categoriasNomes = state.categorias.map(c => c.nome);
  const categoriaAleatoria = () => categoriasNomes.length ? categoriasNomes[Math.floor(Math.random()*categoriasNomes.length)] : "";
  const statusVariados = ["Pago","Provisionado","Agendado"];
  const novosLancamentos = [];
  const hoje = new Date();
  for(let m=-1; m<=1; m++){
    const anoRef = hoje.getFullYear(), mesRef = hoje.getMonth()+m;
    for(let i=0;i<4;i++){
      const data = new Date(anoRef, mesRef, Math.min(3+i*6, 28)).toISOString().slice(0,10);
      const contaR = novasContas[Math.floor(Math.random()*novasContas.length)];
      const statusR = statusVariados[i%3];
      novosLancamentos.push({
        id: uid("l"), data, tipo: "Receita", negocio: negAleatorio(), categoria: categoriaAleatoria(), subcategoria: "",

        descricao: "[TESTE] Receita de teste", status: statusR, conciliado: statusR==="Pago",
        lancadoPor: "Master", _teste: true,
      });
      const contaD = novasContas[Math.floor(Math.random()*novasContas.length)];
      const statusD = statusVariados[(i+1)%3];
      novosLancamentos.push({
        id: uid("l"), data, tipo: "Despesa", negocio: negAleatorio(), categoria: categoriaAleatoria(), subcategoria: "",
        contaOrigem: contaD.id, contaDestino: "", valor: Math.round((100+Math.random()*1200)*100)/100,
        descricao: "[TESTE] Despesa de teste", status: statusD, conciliado: statusD==="Pago",
        lancadoPor: "Master", _teste: true,
      });
    }
    if(novasContas.length >= 2){
      novosLancamentos.push({
        id: uid("l"), data: new Date(anoRef, mesRef, 15).toISOString().slice(0,10), tipo: "Transferência",
        negocio: "", categoria: "", subcategoria: "", contaOrigem: novasContas[0].id, contaDestino: novasContas[1].id,
        valor: Math.round((200+Math.random()*800)*100)/100, descricao: "[TESTE] Transferência entre contas",
        status: "Pago", conciliado: true, lancadoPor: "Master", _teste: true,
      });
    }
  }
  state.lancamentos.push(...novosLancamentos);
  await saveLancamentos();

  return `${novasContas.length} contas, ${novosCartoes.length} cartões, ${novosLancamentos.length} lançamentos`;

      dataDemissao: "", tipoDesligamento: "", motivoDesligamento: "", observacoes: "Funcionário de teste", _teste: true,
    };
  });
  state.rhFuncionarios.push(...novosFuncionarios);
  await saveRhFuncionarios();

  // ---- Folha de Pagamento (2 competências por funcionário) ----
  const competenciaAnterior = (() => { const d = new Date(); d.setMonth(d.getMonth()-1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; })();
  const novaFolha = [];
  novosFuncionarios.forEach((f,i) => {
    [[competenciaAnterior,"Pago"], [competenciaAtual(), i%2===0?"Pago":"Pendente"]].forEach(([competencia,status]) => {
      novaFolha.push({
        id: uid("folha"), funcionarioId: f.id, competencia, salarioBase: f.salario, bonus: 0, descontos: 0,
        valorLiquido: f.salario, dataPagamento: status==="Pago"?todayISO():"", status,
        observacoes: "Folha de teste", _teste: true,
      });
    });
  });
  state.rhFolha.push(...novaFolha);
  await saveRhFolha();

  // ---- Férias (1 registro por funcionário) ----
  const novasFerias = novosFuncionarios.map((f,i) => {
    const venc = rhProximoVencimentoFerias(f.id);
    const fim = venc ? venc.vencimento : f.dataAdmissao;
    const inicio = (() => { const d = new Date(fim+"T00:00:00"); d.setFullYear(d.getFullYear()-1); return d.toISOString().slice(0,10); })();
    const concluida = i % 3 === 0;
    return {
      id: uid("ferias"), funcionarioId: f.id, periodoAquisitivoInicio: inicio, periodoAquisitivoFim: fim,
      dataInicioGozo: concluida ? inicio : "", dataFimGozo: concluida ? fim : "",
      diasDireito: 30, diasGozados: concluida ? 30 : 0,
      status: concluida ? "Concluída" : "Programada", observacoes: "Férias de teste", _teste: true,
    };
  });
  state.rhFerias.push(...novasFerias);
  await saveRhFerias();

  return `${novosCargos.length} cargos, ${novosFuncionarios.length} funcionários, folha e férias`;
}

async function popularDadosTeste(escopo){
  if(!ehMaster()){ showToast("Apenas o Master pode popular dados de teste.", "error"); return; }
  const areas = escopo==="geral" ? ["financeiro","estoque","clientes","rh"] : [escopo];

async function removerDadosTeste(escopo){
  if(!ehMaster()){ showToast("Apenas o Master pode remover dados de teste.", "error"); return; }
  const areas = escopo==="geral" ? ["financeiro","estoque","clientes","rh"] : [escopo];
  const nomesArea = { financeiro:"Financeiro", estoque:"Estoque", clientes:"Clientes", rh:"RH" };
  if(!confirm(`Remover os registros marcados como [TESTE] de ${areas.map(a=>nomesArea[a]).join(", ")}? Não afeta seus dados reais.`)) return;
  const removerDoArray = async (arrName, tabela) => {
    const idsTeste = state[arrName].filter(x => x._teste).map(x => x.id);
    state[arrName] = state[arrName].filter(x => !x._teste);
    if(idsTeste.length) await deleteRows(tabela, idsTeste);
  };
  if(areas.includes("financeiro")){
    // "contas" é tabela flat (sem coluna dados) — não tem campo _teste, identifica pelo nome
    const idsContasTeste = state.contas.filter(c => (c.nome||"").startsWith("[TESTE]")).map(c => c.id);
    state.contas = state.contas.filter(c => !(c.nome||"").startsWith("[TESTE]"));
    if(idsContasTeste.length) await deleteRows("contas", idsContasTeste);
    await removerDoArray("cartoes", "cartoes");
    await removerDoArray("lancamentos", "lancamentos");
  }
  if(areas.includes("estoque")){
    await removerDoArray("estMovimentos", "est_movimentos");
    await removerDoArray("estCompras", "est_compras");
    await removerDoArray("estProdutos", "est_produtos");
    await removerDoArray("estFornecedores", "est_fornecedores");
  }
  if(areas.includes("clientes")){
    await removerDoArray("cliClientes", "cli_clientes");
    await removerDoArray("cliPlanos", "cli_planos");
    await removerDoArray("cliChamados", "cli_chamados");
    await removerDoArray("cliTecnicos", "cli_tecnicos");
  }
  if(areas.includes("rh")){
    await removerDoArray("rhFuncionarios", "rh_funcionarios");
    await removerDoArray("rhCargos", "rh_cargos");
    await removerDoArray("rhFolha", "rh_folha");
    await removerDoArray("rhFerias", "rh_ferias");
  }
  renderApp();
  showToast("Dados de teste removidos.");
}

function openModal(html){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "modalOverlay";
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  overlay.addEventListener("click", e => { if(e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
}
function closeModal(){ const el = document.getElementById("modalOverlay"); if(el) el.remove(); }

function modalSenha(kind){
  const cfg = kind === "pagar"
    ? { titulo: "🔒 Ver contas a pagar", senha: SENHA_PAGAR, campo: "pagarUnlocked", toast: "Contas a pagar desbloqueadas." }
    : { titulo: "🔒 Ver contas a receber / saldo", senha: SENHA_RECEBER, campo: "receberUnlocked", toast: "Contas a receber e saldo desbloqueados." };
  openModal(`
    <div class="modal-head"><div class="modal-title">${cfg.titulo}</div><button class="modal-close" data-action="close-modal">✕</button></div>
    <form id="formSenha"><div class="modal-body">
      <div class="field"><label>Senha</label><input required type="password" name="senha" autocomplete="off" placeholder="Digite a senha"></div>
    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Desbloquear</button></div></form>
  `);
  const input = document.querySelector('#formSenha input[name="senha"]');
  if(input) input.focus();
  document.getElementById("formSenha").addEventListener("submit", e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    if(fd.get("senha") === cfg.senha){
      state[cfg.campo] = true;
      closeModal(); renderApp(); showToast(cfg.toast);
    }else{
      showToast("Senha incorreta.", "error");
      const inp = document.querySelector('#formSenha input[name="senha"]');
      if(inp){ inp.value = ""; inp.focus(); }
    }
  });
}

    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">${isEdit ? "Salvar alterações" : "Adicionar lançamento"}</button></div></form>
  `);

  document.getElementById("lancTipo").addEventListener("change", e => {
    const isTransf = e.target.value === "Transferência";
    document.getElementById("lancDestinoWrap").style.display = isTransf ? "block" : "none";
    document.getElementById("lancNegocioWrap").style.display = isTransf ? "none" : "block";
    document.getElementById("lancCategoriaWrap").style.display = isTransf ? "none" : "block";
  });

  // ---- Categoria inline ----
  const catSelect = document.getElementById("lancCategoriaSelect");
  const subSelect = document.getElementById("lancSubcategoriaSelect");
  const novaCategoriaRow = document.getElementById("novaCategoriaRow");
  const novaSubcategoriaRow = document.getElementById("novaSubcategoriaRow");
  catSelect.addEventListener("change", () => {
    if(catSelect.value === "__nova__"){
      novaCategoriaRow.style.display = "block";
      document.getElementById("novaCategoriaInput").focus();
    }else{
      novaCategoriaRow.style.display = "none";
      subSelect.innerHTML = subcatOptionsHTML(catSelect.value, "");
      novaSubcategoriaRow.style.display = "none";
    }
  });
  document.getElementById("novaCategoriaBtn").addEventListener("click", () => {
    const input = document.getElementById("novaCategoriaInput");
    const nome = input.value.trim();
    if(!nome){ input.focus(); return; }
    if(categoriaByNome(nome)){ showToast("Essa categoria já existe.", "error"); return; }
    state.categorias.push({ id: uid("cat"), nome, subcategorias: [] });
    saveCategorias();
    catSelect.innerHTML = catOptionsHTML(nome);
    novaCategoriaRow.style.display = "none";
    input.value = "";
    subSelect.innerHTML = subcatOptionsHTML(nome, "");
    showToast("Categoria criada.");
  });
  subSelect.addEventListener("change", () => {
    if(subSelect.value === "__nova__"){
      if(!catSelect.value || catSelect.value === "__nova__"){
        showToast("Escolha (ou crie) uma categoria primeiro.", "error");
        subSelect.value = "";
        return;
      }
      novaSubcategoriaRow.style.display = "block";
      document.getElementById("novaSubcategoriaInput").focus();
    }else{
      novaSubcategoriaRow.style.display = "none";
    }
  });
  document.getElementById("novaSubcategoriaBtn").addEventListener("click", () => {
    const input = document.getElementById("novaSubcategoriaInput");
    const nome = input.value.trim();
    if(!nome){ input.focus(); return; }
    const cat = categoriaByNome(catSelect.value);
    if(!cat){ showToast("Escolha uma categoria primeiro.", "error"); return; }
    if(cat.subcategorias.some(s=>s.nome===nome)){ showToast("Essa subcategoria já existe.", "error"); return; }
    cat.subcategorias.push({ id: uid("sub"), nome });
    saveCategorias();
    subSelect.innerHTML = subcatOptionsHTML(cat.nome, nome);
    novaSubcategoriaRow.style.display = "none";
    input.value = "";
    showToast("Subcategoria criada.");
  });

  // ---- Negócio inline ----
  const negSelect = document.getElementById("lancNegocioSelect");
  const novoNegocioRow = document.getElementById("novoNegocioRow");
  negSelect.addEventListener("change", () => {
    novoNegocioRow.style.display = negSelect.value === "__novo__" ? "block" : "none";
    if(negSelect.value === "__novo__") document.getElementById("novoNegocioInput").focus();
  });
  document.getElementById("novoNegocioBtn").addEventListener("click", () => {
    const input = document.getElementById("novoNegocioInput");
    const nome = input.value.trim();
    if(!nome){ input.focus(); return; }
    if(negocioByNome(nome)){ showToast("Esse negócio já existe.", "error"); return; }
    state.negocios.push({ id: uid("neg"), nome, cor: proximaCorNegocio() });
    saveNegocios();
    negSelect.innerHTML = negOptionsHTML(nome);
    novoNegocioRow.style.display = "none";
    input.value = "";
    showToast("Negócio criado.");
  });

  // ---- Conta (origem/destino) inline: qualquer usuário pode cadastrar uma conta que ainda não existe ----
  function wireContaInline(selectId, rowId, nomeId, instId, btnId){
    const select = document.getElementById(selectId);
    const row = document.getElementById(rowId);
    if(!select || !row) return;
    select.addEventListener("change", () => {
      if(select.value === "__nova__"){
        row.style.display = "block";
        document.getElementById(nomeId).focus();
      }else{
        row.style.display = "none";
      }
    });
    document.getElementById(btnId).addEventListener("click", async () => {
      const nomeInput = document.getElementById(nomeId);
      const instInput = document.getElementById(instId);
      const nome = nomeInput.value.trim();
      const instituicao = instInput.value.trim();
      if(!nome){ nomeInput.focus(); return; }
      const nova = { id: uid("c"), parentId: null, nome, instituicao, tipo: "Conta Corrente", saldoInicial: 0, limite: 0, ativa: true };
      state.contas.push(nova);
      await saveContas();
      select.innerHTML = contaOptionsComCriacao(nova.id);
      row.style.display = "none";
      nomeInput.value = ""; instInput.value = "";
      showToast("Conta criada.");
    });
  }
  wireContaInline("lancContaOrigemSelect", "novaContaOrigemRow", "novaContaOrigemNome", "novaContaOrigemInstituicao", "novaContaOrigemBtn");
  wireContaInline("lancContaDestinoSelect", "novaContaDestinoRow", "novaContaDestinoNome", "novaContaDestinoInstituicao", "novaContaDestinoBtn");

  // ---- Repetição + divisão total/parcela ----
  const repSelect = document.getElementById("lancRepeticao");
  if(repSelect){
    const recWrap = document.getElementById("repeticaoRecorrenteWrap");
    const parWrap = document.getElementById("repeticaoParceladoWrap");
    const valorHint = document.getElementById("valorHint");
    const tipoValorParcela = document.getElementById("lancTipoValorParcela");
    const qtdParcelasInput = document.getElementById("lancQtdParcelas");
    const divisaoPreview = document.getElementById("lancDivisaoPreview");
    const atualizarDivisaoPreview = () => {
      if(repSelect.value !== "parcelado" || tipoValorParcela.value !== "total"){ divisaoPreview.textContent = ""; return; }
      const valorInput = document.getElementById("campo_valor");
      const total = parseFloat(valorInput ? valorInput.value : 0) || 0;
      const qtd = Math.max(2, parseInt(qtdParcelasInput.value)||2);
      const partes = dividirValor(total, qtd);
      divisaoPreview.textContent = partes[0] === partes[partes.length-1]
        ? `${qtd}x de ${fmtBRL(partes[0])}`
        : `${qtd-1}x de ${fmtBRL(partes[0])} + 1x de ${fmtBRL(partes[partes.length-1])} (ajuste de centavos)`;
    };
    repSelect.addEventListener("change", () => {
      recWrap.style.display = repSelect.value === "recorrente" ? "block" : "none";
      parWrap.style.display = repSelect.value === "parcelado" ? "block" : "none";
      valorHint.textContent = repSelect.value === "parcelado" ? "(valor de cada parcela, por padrão)" : (repSelect.value === "recorrente" ? "(valor de cada ocorrência)" : "");
      atualizarDivisaoPreview();
    });
    tipoValorParcela.addEventListener("change", atualizarDivisaoPreview);
    qtdParcelasInput.addEventListener("input", atualizarDivisaoPreview);
    document.getElementById("campo_valor")?.addEventListener("input", atualizarDivisaoPreview);
  }
  attachCalculadora("valor");

  document.getElementById("formLanc").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const tipo = fd.get("tipo");
    if(catSelect.value === "__nova__" || subSelect.value === "__nova__"){
      showToast("Finalize a criação da categoria/subcategoria antes de salvar.", "error"); return;
    }
    if(negSelect.value === "__novo__"){
      showToast("Finalize a criação do negócio antes de salvar.", "error"); return;
    }
    if(fd.get("contaOrigem") === "__nova__" || fd.get("contaDestino") === "__nova__"){
      showToast("Finalize a criação da conta antes de salvar.", "error"); return;
    }
    const data = {
      data: fd.get("data"), tipo,
      negocio: tipo === "Transferência" ? "" : (fd.get("negocio")||""),
      categoria: tipo === "Transferência" ? "" : (fd.get("categoria")||""),
      subcategoria: tipo === "Transferência" ? "" : (fd.get("subcategoria")||""),
      contaOrigem: fd.get("contaOrigem"),
      contaDestino: tipo === "Transferência" ? fd.get("contaDestino") : "",
      valor: parseFloat(fd.get("valor"))||0,
      descricao: fd.get("descricao").trim(),
      status: fd.get("status"),
      conciliado: fd.get("conciliado") === "on",
      lancadoPor: isEdit ? existing.lancadoPor : (state.perfilAtivo ? state.perfilAtivo.nome : "Master"),
      editadoPor: isEdit ? (state.perfilAtivo ? state.perfilAtivo.nome : "Master") : undefined
    };
    if(tipo === "Transferência" && data.contaOrigem === data.contaDestino){
      showToast("Conta de origem e destino não podem ser iguais.", "error"); return;
    }

    if(isEdit){
      if(existing.recorrenciaId){
        closeModal();
        modalEscopoEdicaoSerie(existing, data);
      }else{
        Object.assign(existing, data);
        await saveLancamentos(); closeModal(); renderApp(); showToast("Lançamento atualizado.");
      }
      return;
    }

    const repeticao = fd.get("repeticao") || "nenhuma";
    if(repeticao === "nenhuma"){
      state.lancamentos.push({ id: uid("l"), ...data });
      await saveLancamentos(); closeModal(); renderApp(); showToast("Lançamento adicionado.");
      return;
    }
    const isParcelado = repeticao === "parcelado";
    const freq = isParcelado ? "Mensal" : (fd.get("frequencia")||"Mensal");
    const OCORRENCIAS_POR_ANO = { "Semanal":52, "Quinzenal":24, "Mensal":12, "Bimestral":6, "Trimestral":4, "Semestral":2, "Anual":1 };
    let qtd;
    if(isParcelado){
      qtd = Math.max(2, parseInt(fd.get("qtdParcelas"))||2);
    }else{
      qtd = (OCORRENCIAS_POR_ANO[freq]||12) * HORIZONTE_ANOS;
    }
    const valoresParcelas = (isParcelado && fd.get("tipoValorParcela") === "total") ? dividirValor(data.valor, qtd) : null;
    const grupoId = uid("rec");
    let dataOcorrencia = data.data;
    for(let i=0;i<qtd;i++){
      const descricaoOcorrencia = isParcelado ? `${data.descricao} (${i+1}/${qtd})` : data.descricao;
      state.lancamentos.push({
        id: uid("l"), ...data,
        valor: valoresParcelas ? valoresParcelas[i] : data.valor,
        data: dataOcorrencia,
        descricao: descricaoOcorrencia,
        status: i===0 ? data.status : "Provisionado",
        conciliado: i===0 ? data.conciliado : false,
        recorrenciaId: grupoId, recorrenciaTipo: repeticao, recorrenciaIndex: i+1, recorrenciaTotal: qtd
      });
      dataOcorrencia = proximaData(dataOcorrencia, freq);
    }
    await saveLancamentos(); closeModal(); renderApp();
    showToast(isParcelado ? `${qtd} parcelas criadas.` : `Lançamento fixo criado (próximos ${HORIZONTE_ANOS} anos já agendados).`);
  });
}

            ${linhasCategoria || `<div style="text-align:center; color:var(--ink-4); padding:14px;">Nenhuma categoria cadastrada ainda.</div>`}
          </div>

        </div>

    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">${isEdit ? "Salvar alterações" : "Criar usuário"}</button></div></form>
  `);
  const tipoSelect = document.getElementById("perfilTipoSelect");
  const permissoesWrap = document.getElementById("perfilPermissoesWrap");
  const masterAviso = document.getElementById("perfilMasterAviso");
  tipoSelect.addEventListener("change", () => {
    const ehTipoMaster = tipoSelect.value === "master";
    permissoesWrap.style.display = ehTipoMaster ? "none" : "block";
    masterAviso.style.display = ehTipoMaster ? "block" : "none";
  });
  document.getElementById("formPerfil").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const nome = fd.get("nome").trim();
    const senha = fd.get("senha").trim();
    const tipo = fd.get("tipo") === "master" ? "master" : "membro";
    if(!nome || !senha) return;
    if(state.perfis.some(x => x.nome === nome && x !== existing)){ showToast("Já existe um usuário com esse nome.", "error"); return; }
    const modulos = {};
    MODULOS_GRANULARES.forEach(m => {
      modulos[m] = {
        ver: fd.get(`mod_ver_${m}`) === "on",
        criar: fd.get(`mod_criar_${m}`) === "on",
        editar: fd.get(`mod_editar_${m}`) === "on",
        excluir: fd.get(`mod_excluir_${m}`) === "on",
      };
    });
    const permissoes = {};
    state.negocios.forEach(n => {
      permissoes[n.nome] = {
        ver: fd.get(`ver_${n.id}`) === "on",
        editar: fd.get(`editar_${n.id}`) === "on",
        excluir: fd.get(`excluir_${n.id}`) === "on",
      };
    });
    const categoriasPermitidas = {};
    state.categorias.forEach(c => { categoriasPermitidas[c.nome] = fd.get(`cat_${c.id}`) === "on"; });
    const data = { nome, senha, tipo, permissoes, categoriasPermitidas, modulos };
    if(isEdit){ Object.assign(existing, data); }
    else{ state.perfis.push({ id: uid("perfil"), ...data }); }
    await savePerfis(); closeModal(); renderApp(); showToast(isEdit ? "Usuário atualizado." : "Usuário criado.");
  });
}

    document.getElementById("compraFaturaPreview").textContent = `Cai na fatura com vencimento em ${fmtDateBR(venc)}.`;
  };
  document.getElementById("compraCartaoSelect").addEventListener("change", atualizarPreview);
  document.getElementById("compraDataInput").addEventListener("change", atualizarPreview);
  atualizarPreview();

  const catSelect = document.getElementById("compraCategoriaSelect");
  const subSelect = document.getElementById("compraSubcategoriaSelect");
  const novaCategoriaRow = document.getElementById("compraNovaCategoriaRow");
  const novaSubcategoriaRow = document.getElementById("compraNovaSubcategoriaRow");
  catSelect.addEventListener("change", () => {
    if(catSelect.value === "__nova__"){ novaCategoriaRow.style.display = "block"; document.getElementById("compraNovaCategoriaInput").focus(); }
    else{ novaCategoriaRow.style.display = "none"; subSelect.innerHTML = subcatOptionsHTML(catSelect.value, ""); novaSubcategoriaRow.style.display = "none"; }
  });
  document.getElementById("compraNovaCategoriaBtn").addEventListener("click", () => {
    const input = document.getElementById("compraNovaCategoriaInput");
    const nome = input.value.trim();
    if(!nome){ input.focus(); return; }
    if(categoriaByNome(nome)){ showToast("Essa categoria já existe.", "error"); return; }
    state.categorias.push({ id: uid("cat"), nome, subcategorias: [] });
    saveCategorias();
    catSelect.innerHTML = catOptionsHTML(nome);
    novaCategoriaRow.style.display = "none"; input.value = "";
    subSelect.innerHTML = subcatOptionsHTML(nome, "");
    showToast("Categoria criada.");
  });
  subSelect.addEventListener("change", () => {
    if(subSelect.value === "__nova__"){
      if(!catSelect.value || catSelect.value === "__nova__"){ showToast("Escolha (ou crie) uma categoria primeiro.", "error"); subSelect.value = ""; return; }
      novaSubcategoriaRow.style.display = "block"; document.getElementById("compraNovaSubcategoriaInput").focus();
    }else{ novaSubcategoriaRow.style.display = "none"; }
  });
  document.getElementById("compraNovaSubcategoriaBtn").addEventListener("click", () => {
    const input = document.getElementById("compraNovaSubcategoriaInput");
    const nome = input.value.trim();
    if(!nome){ input.focus(); return; }
    const cat = categoriaByNome(catSelect.value);
    if(!cat){ showToast("Escolha uma categoria primeiro.", "error"); return; }
    if(cat.subcategorias.some(s=>s.nome===nome)){ showToast("Essa subcategoria já existe.", "error"); return; }
    cat.subcategorias.push({ id: uid("sub"), nome });
    saveCategorias();
    subSelect.innerHTML = subcatOptionsHTML(cat.nome, nome);
    novaSubcategoriaRow.style.display = "none"; input.value = "";
    showToast("Subcategoria criada.");
  });

  const negSelect = document.getElementById("compraNegocioSelect");
  const novoNegocioRow = document.getElementById("compraNovoNegocioRow");
  negSelect.addEventListener("change", () => {
    novoNegocioRow.style.display = negSelect.value === "__novo__" ? "block" : "none";
    if(negSelect.value === "__novo__") document.getElementById("compraNovoNegocioInput").focus();
  });
  document.getElementById("compraNovoNegocioBtn").addEventListener("click", () => {
    const input = document.getElementById("compraNovoNegocioInput");
    const nome = input.value.trim();
    if(!nome){ input.focus(); return; }
    if(negocioByNome(nome)){ showToast("Esse negócio já existe.", "error"); return; }
    state.negocios.push({ id: uid("neg"), nome, cor: proximaCorNegocio() });
    saveNegocios();
    negSelect.innerHTML = negOptionsHTML(nome);
    novoNegocioRow.style.display = "none"; input.value = "";
    showToast("Negócio criado.");
  });

  const repSelect = document.getElementById("compraRepeticao");
  const parWrap = document.getElementById("compraParceladoWrap");
  const recWrap = document.getElementById("compraRecorrenteWrap");
  const valorHint = document.getElementById("compraValorHint");
  const compraTipoValorParcela = document.getElementById("compraTipoValorParcela");
  const compraQtdParcelas = document.getElementById("compraQtdParcelas");
  const compraDivisaoPreview = document.getElementById("compraDivisaoPreview");
  const atualizarCompraDivisaoPreview = () => {
    if(repSelect.value !== "parcelado" || compraTipoValorParcela.value !== "total"){ compraDivisaoPreview.textContent = ""; return; }
    const valorInput = document.getElementById("campo_valor");
    const total = parseFloat(valorInput ? valorInput.value : 0) || 0;
    const qtd = Math.max(2, parseInt(compraQtdParcelas.value)||2);
    const partes = dividirValor(total, qtd);
    compraDivisaoPreview.textContent = partes[0] === partes[partes.length-1]
      ? `${qtd}x de ${fmtBRL(partes[0])}`
      : `${qtd-1}x de ${fmtBRL(partes[0])} + 1x de ${fmtBRL(partes[partes.length-1])} (ajuste de centavos)`;
  };
  repSelect.addEventListener("change", () => {
    parWrap.style.display = repSelect.value === "parcelado" ? "block" : "none";
    recWrap.style.display = repSelect.value === "recorrente" ? "block" : "none";
    valorHint.textContent = repSelect.value === "parcelado" ? "(valor de cada parcela, por padrão)" : (repSelect.value === "recorrente" ? "(valor de cada cobrança)" : "");
    atualizarCompraDivisaoPreview();
  });
  compraTipoValorParcela.addEventListener("change", atualizarCompraDivisaoPreview);
  compraQtdParcelas.addEventListener("input", atualizarCompraDivisaoPreview);
  document.getElementById("campo_valor")?.addEventListener("input", () => { atualizarCompraDivisaoPreview(); });
  attachCalculadora("valor");

  document.getElementById("formCompraCartao").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    if(catSelect.value === "__nova__" || subSelect.value === "__nova__"){ showToast("Finalize a criação da categoria/subcategoria antes de salvar.", "error"); return; }
    if(negSelect.value === "__novo__"){ showToast("Finalize a criação do negócio antes de salvar.", "error"); return; }
    const cartao = cartaoById(fd.get("cartaoId"));
    if(!cartao){ showToast("Escolha um cartão.", "error"); return; }
    const dataCompra = fd.get("dataCompra");
    const base = {
      tipo: "Despesa", negocio: fd.get("negocio")||"", categoria: fd.get("categoria")||"", subcategoria: fd.get("subcategoria")||"",
      contaOrigem: cartao.contaPagamentoId, contaDestino: "", descricao: fd.get("descricao").trim(),
      status: "Provisionado", conciliado: false, cartaoId: cartao.id, dataCompra,
      lancadoPor: state.perfilAtivo ? state.perfilAtivo.nome : "Master"
    };
    const valor = parseFloat(fd.get("valor"))||0;
    const repeticao = fd.get("repeticao") || "nenhuma";

    if(repeticao === "nenhuma"){
      const venc = calcularVencimento(dataCompra, cartao);
      state.lancamentos.push({ id: uid("l"), ...base, valor, data: venc });
      await saveLancamentos(); closeModal(); renderApp(); showToast("Compra adicionada.");
      return;
    }
    const isParcelado = repeticao === "parcelado";
    const freq = isParcelado ? "Mensal" : (fd.get("frequencia")||"Mensal");
    let qtd;
    if(isParcelado){ qtd = Math.max(2, parseInt(fd.get("qtdParcelas"))||2); }
    else{ const OCORRENCIAS_POR_ANO = { "Mensal":12, "Bimestral":6, "Trimestral":4, "Semestral":2, "Anual":1 }; qtd = (OCORRENCIAS_POR_ANO[freq]||12) * HORIZONTE_ANOS; }
    const valoresParcelas = (isParcelado && fd.get("tipoValorParcela") === "total") ? dividirValor(valor, qtd) : null;
    const grupoId = uid("rec");
    let dataVencOcorrencia = calcularVencimento(dataCompra, cartao);
    for(let i=0;i<qtd;i++){
      const descricaoOcorrencia = isParcelado ? `${base.descricao} (${i+1}/${qtd})` : base.descricao;
      state.lancamentos.push({
        id: uid("l"), ...base,
        valor: valoresParcelas ? valoresParcelas[i] : valor,
        descricao: descricaoOcorrencia, data: dataVencOcorrencia,
        recorrenciaId: grupoId, recorrenciaTipo: repeticao, recorrenciaIndex: i+1, recorrenciaTotal: qtd
      });
      dataVencOcorrencia = proximaData(dataVencOcorrencia, freq);
    }
    await saveLancamentos(); closeModal(); renderApp();
    showToast(isParcelado ? `${qtd} parcelas criadas.` : `Compra fixa criada (próximos ${HORIZONTE_ANOS} anos já agendados).`);
  });
}

function modalBaixa(l){
  const contaAtual = contaById(l.contaOrigem);
  const unlockedValor = l.tipo === "Despesa" ? pagarDesbloqueado() : receberDesbloqueado();
  const contaOpts = contasParaSelecao(l.contaOrigem).map(c => `<option value="${c.id}" ${l.contaOrigem===c.id?"selected":""}>${contaLabel(c)}${c.ativa===false?" (inativa)":""}</option>`).join("");
  openModal(`
    <div class="modal-head"><div class="modal-title">💲 Dar baixa no título</div><button class="modal-close" data-action="close-modal">✕</button></div>
    <form id="formBaixa"><div class="modal-body">
      <div class="field-help" style="margin-bottom:12px; font-size:13px;"><strong>${esc(l.descricao)}</strong><br>${l.tipo} de ${maskBRL(l.valor, unlockedValor)} — hoje em ${contaLabel(contaAtual)}</div>
      <div class="field-row"><div class="field"><label>Data da baixa</label><input required type="date" name="data" value="${todayISO()}"></div><div class="field"><label>Conta</label><select name="contaOrigem">${contaOpts}</select></div></div>
      <div class="field-help" style="margin-bottom:12px;">Pode escolher qualquer conta — não precisa ser a que estava no lançamento original.</div>
      <div class="field"><label class="checkbox-row"><input type="checkbox" name="conciliado" checked> Já conciliado com o extrato</label></div>
    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Confirmar baixa</button></div></form>
  `);
  document.getElementById("formBaixa").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    l.status = "Pago";
    l.data = fd.get("data");

// ============================================================
// MODAL — ESCOPO DA EDIÇÃO EM SÉRIE (ex: reajuste de valor)
// ============================================================
const CAMPOS_CASCATA_SERIE = ["tipo","negocio","categoria","subcategoria","contaOrigem","contaDestino","valor"];
function modalEscopoEdicaoSerie(existing, data){
  const serieTxt = existing.recorrenciaTipo === "parcelado" ? "parcelada" : "recorrente";
  const futuros = state.lancamentos.filter(x => x.recorrenciaId === existing.recorrenciaId && x.data >= existing.data).length;
  const todos = state.lancamentos.filter(x => x.recorrenciaId === existing.recorrenciaId).length;
  openModal(`
    <div class="modal-head"><div class="modal-title">Aplicar alteração</div><button class="modal-close" data-action="close-modal">✕</button></div>
    <div class="modal-body">
      <div class="field-help" style="margin-bottom:14px; font-size:13px;">
        <strong>${esc(existing.descricao)}</strong> faz parte de uma série ${serieTxt}. Onde aplicar valor, categoria, conta e negócio (ex: um reajuste)?
        <br><span style="color:var(--ink-4);">Data, status e conciliado nunca são copiados — cada ocorrência mantém os seus.</span>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button class="btn btn-ghost" style="justify-content:flex-start;" id="btnEscopoUm">Aplicar apenas a este lançamento</button>
        <button class="btn btn-ghost" style="justify-content:flex-start;" id="btnEscopoFuturos">Aplicar a este e aos próximos <span style="color:var(--ink-4); margin-left:4px;">(${futuros} lançamento${futuros===1?'':'s'})</span></button>
        <button class="btn btn-ghost" style="justify-content:flex-start;" id="btnEscopoTodos">Aplicar a todos da série <span style="color:var(--ink-4); margin-left:4px;">(${todos} lançamento${todos===1?'':'s'})</span></button>
      </div>
    </div>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button></div>
  `);
  const aplicarCascata = async (apenasFuturos) => {
    Object.assign(existing, data);
    const afetados = [existing];
    for(const l of state.lancamentos){
      if(l === existing) continue;
      if(l.recorrenciaId !== existing.recorrenciaId) continue;
      if(apenasFuturos && l.data < existing.data) continue;
      CAMPOS_CASCATA_SERIE.forEach(campo => { l[campo] = data[campo]; });
      afetados.push(l);
    }
    await saveLancamentos(); closeModal(); renderApp(); showToast(`Alteração aplicada a ${afetados.length} lançamento(s).`);
  };
  document.getElementById("btnEscopoUm").addEventListener("click", async () => {
    Object.assign(existing, data);
    await saveLancamentos(); closeModal(); renderApp(); showToast("Lançamento atualizado.");
  });
  document.getElementById("btnEscopoFuturos").addEventListener("click", () => aplicarCascata(true));
  document.getElementById("btnEscopoTodos").addEventListener("click", () => aplicarCascata(false));
}

// ============================================================
// EVENT DELEGATION
// ============================================================
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  const catId = el.dataset.cat;
  const subId = el.dataset.sub;

  const bloqueioPermissao = acaoBloqueadaPorPermissao(action, el);
  if(bloqueioPermissao){ showToast(bloqueioPermissao, "error"); return; }

  if(action === "tec-app-ver"){ tecnicoChamadoAtualId = id; tecnicoView = "detalhe"; renderAppTecnico(); return; }
  else if(action === "tec-app-voltar"){ tecnicoView = "lista"; tecnicoChamadoAtualId = null; renderAppTecnico(); return; }
  else if(action === "tec-app-iniciar"){ await chamadoIniciar(id); return; }
  else if(action === "tec-app-concluir"){ await chamadoConcluir(id); return; }
  else if(action === "tec-app-materiais"){ modalChamadoMateriais(id); return; }
  else if(action === "tec-app-prorrogar"){ modalChamadoProrrogar(id); return; }
  else if(action === "tec-app-logout"){ await doLogout(); return; }
  else if(action === "nav") setView(el.dataset.view);
  else if(action === "abrir-modulo"){
    const mod = MODULOS_CATALOGO.find(m => m.id === el.dataset.id);
    if(!mod || !mod.ativo){ showToast("Esse módulo ainda está em construção.", "error"); return; }
    if(MODULOS_GRANULARES.includes(mod.id) && !podeVerModulo(mod.id)){ showToast("Esse usuário não tem acesso a esse módulo.", "error"); return; }
    state.modpanelAberto = false;
    state.moduloAtivo = mod.id;
    if(mod.id === "visaogeral"){ state.view = "vg_executivo"; }
    else if(mod.id === "cadastro"){ state.view = "cadastro_hub"; }
    else if(mod.id === "financeiro"){ state.view = "dashboard"; }
    else if(mod.id === "estoque"){ state.view = "est_dashboard"; }
    else if(mod.id === "clientes"){ state.view = "cli_dashboard"; }
    else if(mod.id === "rh"){ state.view = "rh_dashboard"; }
    else if(mod.id === "comprasvendas"){ state.view = "cv_lista"; }
    renderApp();
  }
  else if(action === "table-sort"){
    const contexto = el.dataset.contexto, campo = el.dataset.campo;
    const s = sortState(contexto, campo);
    if(s.campo === campo) s.dir = s.dir === "asc" ? "desc" : "asc";
    else { s.campo = campo; s.dir = "asc"; }
    renderView();
  }
  else if(action === "importar-abrir") modalImportarDados();
  else if(action === "import-voltar") renderImportFase1();
  else if(action === "cad-abrir"){
    const tipo = el.dataset.tipo;
    const item = CADASTRO_TIPOS.flatMap(g => g.itens).find(it => it.id === tipo);
    if(!item) return;

// Busca por texto: espera uma pausa de digitação antes de atualizar o
// resultado (em vez de re-renderizar a cada tecla) — evita que a lista
// pisque/mude embaixo do dedo enquanto ainda tá digitando o termo.
const BUSCA_DEBOUNCE_MS = 1000;
const buscaDebounceTimers = {};
function debounceBusca(chave, fn){
  clearTimeout(buscaDebounceTimers[chave]);
  buscaDebounceTimers[chave] = setTimeout(fn, BUSCA_DEBOUNCE_MS);
}
document.addEventListener("input", e => {
  if(e.target.dataset.action === "est-filtro-texto"){ estFiltroTexto = e.target.value; debounceBusca("est-filtro-texto", renderView); }
  if(e.target.dataset.action === "cli-filtro-texto"){ cliFiltro.texto = e.target.value; debounceBusca("cli-filtro-texto", renderView); }
  if(e.target.dataset.action === "rh-filtro-texto"){ rhFuncFiltro.texto = e.target.value; debounceBusca("rh-filtro-texto", renderView); }
});

// ---- Constantes ----
const CLI_STATUS = ["Ativo","Inativo","Suspenso","Cancelado","Inadimplente","Lead"];
const CLI_GENEROS = ["Masculino","Feminino","Outro","Pessoa Jurídica","Não informado"];
const CLI_ESTADOS = ["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"];

// ---- Orçamento -> OS (Fase 2: venda amarrada a estoque/cliente/financeiro) ----

const OS_STATUS = ["Aberta","Em execução","Concluída","Cancelada"];

const CATEGORIA_RENDIMENTOS = "Rendimentos/Investimentos";

// ---- Helpers ----
function cliClienteById(id){ return state.cliClientes.find(c => c.id === id); }
function cliPlanoById(id){ return state.cliPlanos.find(p => p.id === id); }
function cliNome(c){ return c.tipoPessoa === "PJ" ? (c.nomeFantasia || c.razaoSocial || c.nome) : c.nome; }
function cliContratosByNegocio(clienteId, negocio){
  const c = cliClienteById(clienteId);
  return (c?.contratos || []).filter(ct => ct.negocio === negocio);
}
function cliDataRecente(dias){ const d = new Date(); d.setDate(d.getDate()-dias); return d.toISOString().slice(0,10); }

// ---- VIEW: DASHBOARD CLIENTES ----
function viewCliDashboard(){
  const total = state.cliClientes.length;
  const ativos = state.cliClientes.filter(c => c.status === "Ativo").length;
  const inativos = total - ativos;
  const novos30 = state.cliClientes.filter(c => c.dataCadastro >= cliDataRecente(30)).length;
  const novos60 = state.cliClientes.filter(c => c.dataCadastro >= cliDataRecente(60) && c.dataCadastro < cliDataRecente(30)).length;
  const crescPct = novos60 > 0 ? ((novos30 - novos60)/novos60*100).toFixed(1) : novos30 > 0 ? "+100" : "0";
  const crescPos = Number(crescPct) >= 0;

  const negocioTotais = state.negocios.map(n => {
    const clientes = state.cliClientes.filter(c => (c.contratos||[]).some(ct => ct.negocio === n.nome));
    const ativos = clientes.filter(c => (c.contratos||[]).find(ct=>ct.negocio===n.nome)?.status === "Ativo").length;
    const mrr = clientes.reduce((s,c) => {
      const ct = (c.contratos||[]).find(ct=>ct.negocio===n.nome && ct.status==="Ativo");
      const plano = ct ? cliPlanoById(ct.planoId) : null;
      return s + (plano ? Number(plano.valor||0) : 0);
    }, 0);
    return { n, total: clientes.length, ativos, mrr };
  }).filter(r => r.total > 0);

  const inadimplentes = state.cliClientes.filter(c => c.status === "Inadimplente").length;
  const mrrTotal = state.cliClientes.reduce((s,c) => {
    return s + (c.contratos||[]).filter(ct=>ct.status==="Ativo").reduce((ss,ct) => {
      const p = cliPlanoById(ct.planoId);
      return ss + (p ? Number(p.valor||0) : 0);
    },0);
  },0);

  const novosRows = state.cliClientes
    .filter(c => c.dataCadastro >= cliDataRecente(30))
    .sort((a,b)=>b.dataCadastro.localeCompare(a.dataCadastro))
    .slice(0,8)
    .map(c => `<tr>
      <td style="font-weight:600; cursor:pointer; color:var(--accent);" data-action="cli-detalhe" data-id="${c.id}">${esc(cliNome(c))}</td>
      <td style="color:var(--ink-3);">${fmtDateBR(c.dataCadastro)}</td>
      <td>${(c.contratos||[]).map(ct=>`<span class="status-pill status-agendado" style="margin-right:3px;">${esc(ct.negocio)}</span>`).join("")||"—"}</td>
      <td>${esc(c.cidade||"—")}${c.uf?` — ${c.uf}`:""}</td>
    </tr>`).join("");

  const negCards = negocioTotais.map(({n,total,ativos,mrr}) => `
    <div class="kpi-card" style="cursor:pointer;" data-action="cli-filtrar-negocio" data-negocio="${esc(n.nome)}">
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
        <span style="width:10px;height:10px;border-radius:50%;background:${n.cor};display:inline-block;flex-shrink:0;"></span>
        <span class="kpi-label" style="margin:0;">${esc(n.nome)}</span>
      </div>
      <div class="kpi-value" style="font-size:26px;">${total}</div>
      <div class="kpi-note">${ativos} ativos · MRR ${fmtBRL(mrr)}</div>
    </div>`).join("");

  return `
    <div class="page-header">
      <div><div class="page-title">Clientes — Dashboard</div><div class="page-sub">Visão consolidada de todos os negócios</div></div>
      ${seModulo("clientes","criar",`<button class="btn btn-primary" data-action="cli-novo">+ Novo cliente</button>`)}
    </div>
    <div class="kpi-grid" style="grid-template-columns:repeat(5,1fr);">
      <div class="kpi-card"><div class="kpi-label">Total de clientes</div><div class="kpi-value">${total}</div></div>
      <div class="kpi-card"><div class="kpi-label">Clientes ativos</div><div class="kpi-value pos">${ativos}</div></div>
      <div class="kpi-card"><div class="kpi-label">MRR total</div><div class="kpi-value" style="font-size:18px;">${fmtBRL(mrrTotal)}</div><div class="kpi-note">Receita mensal recorrente</div></div>
      <div class="kpi-card"><div class="kpi-label">Novos (30 dias)</div><div class="kpi-value">${novos30}</div><div class="kpi-note" style="color:${crescPos?'var(--pos)':'var(--neg)'};">${crescPos?'↑':'↓'} ${Math.abs(crescPct)}% vs mês anterior</div></div>
      <div class="kpi-card"><div class="kpi-label">Inadimplentes</div><div class="kpi-value ${inadimplentes>0?'neg':''}">${inadimplentes}</div></div>
    </div>

    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); margin-bottom:16px;">
      ${negCards || `<div class="kpi-card" style="grid-column:1/-1; text-align:center; color:var(--ink-4);">Nenhum cliente cadastrado com negócios vinculados.</div>`}
    </div>

    <div class="panel">
      <div class="panel-head"><div class="panel-title">👥 Novos clientes — últimos 30 dias</div><span style="font-size:12px;color:var(--ink-3);">${novos30} cadastros</span></div>
      <div class="panel-body" style="padding-top:6px;">
        ${novosRows ? `<table><thead><tr><th>Nome</th><th>Cadastrado em</th><th>Negócios</th><th>Cidade</th></tr></thead><tbody>${novosRows}</tbody></table>` : emptyState("Nenhum cadastro nos últimos 30 dias.")}
      </div>
    </div>
  `;
}

  const planoOpts = state.cliPlanos.map(p=>`<option value="${p.id}" ${cliFiltro.plano===p.id?"selected":""}>${esc(p.nome)}</option>`).join("");

function modalCliCliente(existing){

  const c = existing || { nome:"", tipoPessoa:"PF", cpfCnpj:"", rg:"", dataNascimento:"", genero:"Não informado", email:"", telefone:"", whatsapp:"", logradouro:"", numero:"", complemento:"", bairro:"", cidade:"", uf:"SP", cep:"", status:"Ativo", dataCadastro:todayISO(), observacoes:"", contratos:[] };

          <option value="">— Sem plano ainda —</option>${planoOpts}

  const generoOpts = CLI_GENEROS.map(g=>`<option value="${g}" ${(c.genero||"Não informado")===g?"selected":""}>${g}</option>`).join("");
  const ufOpts = CLI_ESTADOS.map(e=>`<option value="${e}" ${(c.uf||"SP")===e?"selected":""}>${e}</option>`).join("");

  openModal(`
    <div class="modal-head"><div class="modal-title">${isEdit?"Editar cliente":"Novo cliente"}</div><button class="modal-close" data-action="close-modal">✕</button></div>
    <form id="formCliCliente"><div class="modal-body">

      <div style="font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); font-weight:700; margin-bottom:10px; border-bottom:1px solid var(--border); padding-bottom:6px;">Dados pessoais</div>

      <div class="field-row">
        <div class="field"><label>Tipo de pessoa</label>
          <select name="tipoPessoa" id="cliTipoPessoa">
            <option value="PF" ${(c.tipoPessoa||"PF")==="PF"?"selected":""}>Pessoa Física</option>
            <option value="PJ" ${c.tipoPessoa==="PJ"?"selected":""}>Pessoa Jurídica</option>
          </select>
        </div>
        <div class="field"><label>Status</label><select name="status">${statusOpts}</select></div>
        <div class="field"><label>Cadastrado em</label><input type="date" name="dataCadastro" value="${c.dataCadastro||todayISO()}"></div>
      </div>
      <div class="field" id="cliNomePFWrap">
        <label>Nome completo *</label><input required type="text" name="nome" value="${esc(c.nome)}" placeholder="Nome completo">
      </div>
      <div id="cliNomePJWrap" style="display:none;">
        <div class="field-row">
          <div class="field"><label>Razão social *</label><input type="text" name="razaoSocial" value="${esc(c.razaoSocial||"")}" placeholder="Razão social"></div>
          <div class="field"><label>Nome fantasia</label><input type="text" name="nomeFantasia" value="${esc(c.nomeFantasia||"")}" placeholder="Nome fantasia"></div>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label id="cliCpfLabel">CPF</label><input type="text" name="cpfCnpj" value="${esc(c.cpfCnpj||"")}" placeholder="000.000.000-00"></div>
        <div class="field" id="cliRgWrap"><label>RG</label><input type="text" name="rg" value="${esc(c.rg||"")}" placeholder="00.000.000-0"></div>

      </div>

      <div style="font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); font-weight:700; margin:14px 0 10px; border-bottom:1px solid var(--border); padding-bottom:6px;">Contato</div>
      <div class="field-row">
        <div class="field"><label>Telefone</label><input type="text" name="telefone" value="${esc(c.telefone||"")}" placeholder="(00) 00000-0000"></div>
        <div class="field"><label>WhatsApp</label><input type="text" name="whatsapp" value="${esc(c.whatsapp||"")}" placeholder="(00) 00000-0000"></div>
      </div>
      <div class="field"><label>E-mail</label><input type="email" name="email" value="${esc(c.email||"")}" placeholder="cliente@email.com"></div>

      <div style="font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); font-weight:700; margin:14px 0 10px; border-bottom:1px solid var(--border); padding-bottom:6px;">Endereço</div>
      <div class="field-row">
        <div class="field"><label>CEP</label><input type="text" name="cep" value="${esc(c.cep||"")}" placeholder="00000-000"></div>
        <div class="field"><label>UF</label><select name="uf">${ufOpts}</select></div>
      </div>
      <div class="field-row">
        <div class="field" style="flex:2;"><label>Logradouro</label><input type="text" name="logradouro" value="${esc(c.logradouro||"")}" placeholder="Rua, Avenida, etc."></div>
        <div class="field"><label>Número</label><input type="text" name="numero" value="${esc(c.numero||"")}" placeholder="123"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Complemento</label><input type="text" name="complemento" value="${esc(c.complemento||"")}" placeholder="Apto, bloco, casa..."></div>
        <div class="field"><label>Bairro</label><input type="text" name="bairro" value="${esc(c.bairro||"")}" placeholder="Bairro"></div>
      </div>
      <div class="field"><label>Cidade</label><input type="text" name="cidade" value="${esc(c.cidade||"")}" placeholder="Cidade"></div>

      <div style="font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); font-weight:700; margin:14px 0 10px; border-bottom:1px solid var(--border); padding-bottom:6px;">Negócios e planos vinculados</div>
      <div class="field-help" style="margin-bottom:8px;">Marque os negócios desta holding que esse cliente pertence e já escolha o plano de cada um — isso é o que vai alimentar os relatórios por plano/negócio depois.</div>
      <div style="border:1px solid var(--border); border-radius:var(--r); overflow:hidden; margin-bottom:10px;">
        <table><tbody>${negLinhas||`<tr><td>${emptyState("Nenhum negócio cadastrado ainda.")}</td></tr>`}</tbody></table>
      </div>

      <div style="font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); font-weight:700; margin:14px 0 10px; border-bottom:1px solid var(--border); padding-bottom:6px;">Observações</div>
      <div class="field"><textarea name="observacoes" rows="3" style="resize:none;" placeholder="Notas internas, histórico de atendimento, etc.">${esc(c.observacoes||"")}</textarea></div>

    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">${isEdit?"Salvar alterações":"Cadastrar cliente"}</button></div></form>
  `);

  // PF/PJ toggle
  const tipoPessoa = document.getElementById("cliTipoPessoa");
  const pfWrap = document.getElementById("cliNomePFWrap");
  const pjWrap = document.getElementById("cliNomePJWrap");
  const cpfLabel = document.getElementById("cliCpfLabel");
  const rgWrap = document.getElementById("cliRgWrap");
  const nascimentoWrap = document.getElementById("cliNascimentoWrap");
  const generoWrap = document.getElementById("cliGeneroWrap");
  const atualizarTipo = () => {
    const isPJ = tipoPessoa.value === "PJ";
    pfWrap.style.display = isPJ ? "none" : "block";
    pjWrap.style.display = isPJ ? "block" : "none";
    cpfLabel.textContent = isPJ ? "CNPJ" : "CPF";
    rgWrap.style.display = isPJ ? "none" : "block";
    nascimentoWrap.style.display = isPJ ? "none" : "block";
    generoWrap.style.display = isPJ ? "none" : "block";
    if(isPJ) pfWrap.querySelector("input").removeAttribute("required");
    else pfWrap.querySelector("input").setAttribute("required","");
  };
  tipoPessoa.addEventListener("change", atualizarTipo);
  atualizarTipo();

  // Habilita/desabilita o select de plano junto com o checkbox do negócio
  document.querySelectorAll(".cli-neg-chk").forEach(chk => {

      const sel = document.getElementById(`cliPlanoSel_${chk.dataset.negid}`);
      if(sel) sel.disabled = !chk.checked;
    });
  });

  document.getElementById("formCliCliente").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const isPJ = fd.get("tipoPessoa") === "PJ";
    const negociosMarcados = state.negocios.filter(n => fd.get(`neg_${n.id}`) === n.nome);

    const data = {
      tipoPessoa: fd.get("tipoPessoa"),
      nome: isPJ ? (fd.get("razaoSocial")||"").trim() : (fd.get("nome")||"").trim(),
      razaoSocial: (fd.get("razaoSocial")||"").trim(),
      nomeFantasia: (fd.get("nomeFantasia")||"").trim(),
      cpfCnpj: (fd.get("cpfCnpj")||"").trim(),
      rg: (fd.get("rg")||"").trim(),
      dataNascimento: fd.get("dataNascimento"),
      genero: fd.get("genero"),
      email: (fd.get("email")||"").trim(),
      telefone: (fd.get("telefone")||"").trim(),
      whatsapp: (fd.get("whatsapp")||"").trim(),
      cep: (fd.get("cep")||"").trim(),
      logradouro: (fd.get("logradouro")||"").trim(),
      numero: (fd.get("numero")||"").trim(),
      complemento: (fd.get("complemento")||"").trim(),
      bairro: (fd.get("bairro")||"").trim(),
      cidade: (fd.get("cidade")||"").trim(),
      uf: fd.get("uf"),
      status: fd.get("status"),
      dataCadastro: fd.get("dataCadastro") || todayISO(),
      observacoes: (fd.get("observacoes")||"").trim(),
    };

    if(isEdit){
      // Mantém contratos existentes (atualizando o plano se foi trocado no formulário),
      // adiciona novos negócios sem contrato já com o plano escolhido
      const novosNegs = negociosMarcados.filter(n=>!(existing.contratos||[]).some(ct=>ct.negocio===n.nome));
      const contratosNovos = novosNegs.map(n=>({ id:uid("ct"), negocio:n.nome, planoId:fd.get(`plano_${n.id}`)||"", status:"Ativo", dataContrato:todayISO() }));
      // Remove contratos de negócios desmarcados
      const negsMarcadosNomes = negociosMarcados.map(n=>n.nome);
      const contratosRestantes = (existing.contratos||[]).filter(ct=>negsMarcadosNomes.includes(ct.negocio)).map(ct => {
        const neg = negocioByNome(ct.negocio);
        const planoId = neg ? (fd.get(`plano_${neg.id}`)||"") : ct.planoId;
        return { ...ct, planoId };
      });
      data.contratos = [...contratosRestantes, ...contratosNovos];
      Object.assign(existing, data);
    }else{
      data.contratos = negociosMarcados.map(n=>({ id:uid("ct"), negocio:n.nome, planoId:fd.get(`plano_${n.id}`)||"", status:"Ativo", dataContrato:todayISO() }));
    }

    if(isEdit){
      await saveCliClientes(); closeModal();
      cliViewDetalheId = existing.id;
      state.view = "cli_detalhe";
      renderApp(); showToast("Cliente atualizado.");
    }else{
      const novoId = uid("cli");
      state.cliClientes.push({ id:novoId, ...data });
      await saveCliClientes(); closeModal();
      cliViewDetalheId = novoId;
      state.view = "cli_detalhe";
      renderApp(); showToast("Cliente cadastrado.");
    }
  });
}

// ---- Cobrança automática do contrato (mensalidade recorrente em Contas a
// Receber) — opt-in por contrato, ninguém liga sozinho. Reaproveita o mesmo
// mecanismo de recorrência que "Novo lançamento > Recorrente" já usa.
function primeiraDataVencimento(diaVencimento){
  const hoje = new Date();
  const ultimoDiaMesAtual = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).getDate();
  let d = new Date(hoje.getFullYear(), hoje.getMonth(), Math.min(diaVencimento, ultimoDiaMesAtual));
  if(d < new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate())){
    const ultimoDiaProxMes = new Date(hoje.getFullYear(), hoje.getMonth()+2, 0).getDate();
    d = new Date(hoje.getFullYear(), hoje.getMonth()+1, Math.min(diaVencimento, ultimoDiaProxMes));
  }
  return d.toISOString().slice(0,10);
}
async function sincronizarCobrancaContrato(cliente, contrato){
  // cancela a série anterior (só o que ainda não foi pago) antes de recriar —
  // evita duplicar ao editar valor/vencimento/plano várias vezes
  if(contrato.cobrancaRecorrenciaId){
    const idsCancelar = state.lancamentos.filter(l => l.recorrenciaId === contrato.cobrancaRecorrenciaId && l.status !== "Pago").map(l=>l.id);
    state.lancamentos = state.lancamentos.filter(l => !(l.recorrenciaId === contrato.cobrancaRecorrenciaId && l.status !== "Pago"));
    if(idsCancelar.length) await deleteRows("lancamentos", idsCancelar);
    contrato.cobrancaRecorrenciaId = "";
  }
  if(!contrato.cobrancaAutomatica || !contrato.planoId || !contrato.diaVencimento) return;
  const plano = state.cliPlanos.find(p => p.id === contrato.planoId);
  if(!plano || !(Number(plano.valor)>0)) return;
  let cat = categoriaByNome(CATEGORIA_VENDAS_SERVICOS);
  if(!cat){ cat = { id: uid("cat"), nome: CATEGORIA_VENDAS_SERVICOS, subcategorias: [] }; state.categorias.push(cat); await saveCategorias(); }
  const grupoId = uid("rec");
  const qtd = 12 * HORIZONTE_ANOS;
  let dataOcorrencia = primeiraDataVencimento(Number(contrato.diaVencimento));
  const novos = [];
  for(let i=0;i<qtd;i++){
    novos.push({
      id: uid("l"), data: dataOcorrencia, tipo: "Receita", negocio: contrato.negocio, categoria: cat.nome, subcategoria: "",
      contaOrigem: state.contas.find(x=>x.ativa!==false)?.id||"", contaDestino: "", valor: Number(plano.valor),
      descricao: `Mensalidade ${plano.nome} — ${cliNome(cliente)}`, status: "Provisionado", conciliado: false,
      lancadoPor: state.perfilAtivo?state.perfilAtivo.nome:"Master", clienteId: cliente.id, contratoId: contrato.id,
      recorrenciaId: grupoId, recorrenciaTipo: "recorrente", recorrenciaIndex: i+1, recorrenciaTotal: qtd,
    });
    dataOcorrencia = proximaData(dataOcorrencia, "Mensal");
  }
  state.lancamentos.push(...novos);
  contrato.cobrancaRecorrenciaId = grupoId;
  await saveLancamentos();
}

// ORÇAMENTO -> OS -> BAIXA DE ESTOQUE -> CONTA A RECEBER
// Fluxo: orçamento aprovado vira OS automaticamente. Na OS, dá baixa dos itens
// realmente usados na instalação (o custo vem do Custo Médio Real do estoque,
// no momento da baixa) e gera a conta a receber. A baixa de PAGAMENTO em si
// reaproveita o "dar baixa" que já existe em Lançamentos — não duplicamos essa
// lógica, só ligamos a OS ao lançamento gerado (campo lancamentoId) e mostramos
// o status dele ao vivo na tela da OS.

let cliOSDetalheId = null;
let cliChamadoDetalheId = null;
function cliOrcamentoById(id){ return state.cliOrcamentos.find(o => o.id === id); }
function cliOSById(id){ return state.cliOS.find(o => o.id === id); }
function osItensBaixados(osId){ return state.estMovimentos.filter(m => m.osId === osId && m.tipo === "Saída"); }
function osCustoImplantacao(osId){ return osItensBaixados(osId).reduce((s,m) => s + Number(m.qtd)*Number(m.custoUnitario||0), 0); }
function osValorVenda(os){ return (os.itens||[]).reduce((s,it) => s + Number(it.valorTotal||0), 0) + Number(os.valorServico||0); }
function osLancamento(os){ return os.lancamentoId ? state.lancamentos.find(l => l.id === os.lancamentoId) : null; }

function chamadoCustoMateriais(chamadoId){ return chamadoItensBaixados(chamadoId).reduce((s,m) => s + Number(m.qtd)*Number(m.custoUnitario||0), 0); }

/* =========================================================================
   MODAL — ORÇAMENTO (e "venda direta", que gera a OS sem passar por orçamento)
========================================================================= */
function modalCliOrcamento(existing, modoOS){
  const isEdit = !!existing;
  if(!state.cliClientes.length){ showToast("Cadastre um cliente primeiro.", "error"); return; }
  const o = existing || { clienteId: state.cliClientes[0].id, negocio:"", data: todayISO(), validade:"", itens:[], desconto:0, observacoes:"" };
  const podeEditar = modoOS || !isEdit || o.status==="Rascunho" || o.status==="Enviado";
  const clienteOptions = state.cliClientes.map(c=>`<option value="${c.id}" ${o.clienteId===c.id?"selected":""}>${esc(cliNome(c))}</option>`).join("");
  const negOptions = state.negocios.map(n=>`<option value="${esc(n.nome)}" ${o.negocio===n.nome?"selected":""}>${esc(n.nome)}</option>`).join("");
  const produtoOptionsHTML = (sel) => `<option value="">— Item livre / serviço —</option>` + state.estProdutos.map(p=>`<option value="${p.id}" ${sel===p.id?"selected":""}>${esc(p.nome)}</option>`).join("");
  const linhaItemHTML = (it) => `
    <tr>
      <td style="min-width:180px;"><select class="orc-item-produto" ${podeEditar?"":"disabled"}>${produtoOptionsHTML(it?it.produtoId:"")}</select></td>
      <td style="min-width:160px;"><input type="text" class="orc-item-descricao" value="${esc(it?it.descricao:"")}" placeholder="Descrição" ${podeEditar?"":"disabled"}></td>
      <td style="width:80px;"><input type="number" min="0.01" step="0.01" class="orc-item-qtd" value="${it?it.quantidade:1}" ${podeEditar?"":"disabled"}></td>
      <td style="width:110px;"><input type="number" min="0" step="0.01" class="orc-item-valor" value="${it?it.valorUnitario:0}" ${podeEditar?"":"disabled"}></td>
      <td class="num orc-item-total" style="width:100px;">${fmtBRL((it?Number(it.quantidade):1)*(it?Number(it.valorUnitario):0))}</td>
      <td>${podeEditar?`<button type="button" class="icon-btn danger orc-item-del" title="Remover">🗑</button>`:""}</td>
    </tr>`;
  const itensIniciais = (o.itens&&o.itens.length) ? o.itens : [{produtoId:"",descricao:"",quantidade:1,valorUnitario:0}];

  openModal(`
    <div class="modal-head"><div class="modal-title">${modoOS?"Nova venda direta":(isEdit?(podeEditar?"Editar orçamento":`Orçamento ${esc(o.numero)}`):"Novo orçamento")}</div><button class="modal-close" data-action="close-modal">✕</button></div>
    <form id="formOrc"><div class="modal-body">
      <div class="field-row">
        <div class="field" style="flex:2;"><label>Cliente *</label><select required name="clienteId" ${podeEditar?"":"disabled"}>${clienteOptions}</select></div>
        <div class="field"><label>Negócio</label><select name="negocio" ${podeEditar?"":"disabled"}><option value="">— Selecione —</option>${negOptions}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Data *</label><input required type="date" name="data" value="${o.data}" ${podeEditar?"":"disabled"}></div>
        ${!modoOS ? `<div class="field"><label>Validade</label><input type="date" name="validade" value="${o.validade||""}" ${podeEditar?"":"disabled"}></div>` : ""}
      </div>
      <div class="field-help" style="margin:10px 0 6px; font-weight:600; color:var(--ink-2);">Itens</div>
      <div style="overflow-x:auto; border:1px solid var(--border); border-radius:var(--r);">
        <table style="min-width:640px;"><thead><tr><th>Produto (opcional)</th><th>Descrição</th><th class="num">Qtd</th><th class="num">Valor unit.</th><th class="num">Total</th><th></th></tr></thead>
        <tbody id="orcItensBody">${itensIniciais.map(linhaItemHTML).join("")}</tbody></table>
      </div>
      ${podeEditar?`<button type="button" class="btn btn-ghost btn-sm" id="btnAddItemOrc" style="margin-top:8px;">+ Adicionar item</button>`:""}
      <div class="field-row" style="margin-top:14px;">
        <div class="field"><label>Desconto (R$)</label><input type="number" min="0" step="0.01" name="desconto" id="orcDesconto" value="${o.desconto||0}" ${podeEditar?"":"disabled"}></div>
      </div>
      <div style="display:flex; justify-content:space-between; padding:10px 0; border-top:2px solid var(--border); margin-top:6px;">
        <strong>Total</strong>
        <strong id="orcTotal" style="font-family:var(--font-mono); font-size:15px;">${fmtBRL(0)}</strong>
      </div>
      <div class="field"><label>Observações</label><textarea name="observacoes" rows="2" style="resize:none;" ${podeEditar?"":"disabled"}>${esc(o.observacoes||"")}</textarea></div>
    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">${podeEditar?"Cancelar":"Fechar"}</button>${podeEditar?`<button type="submit" class="btn btn-primary">${modoOS?"Criar OS":(isEdit?"Salvar":"Criar orçamento")}</button>`:""}</div></form>
  `);

  const tbody = document.getElementById("orcItensBody");
  function coletarItens(){
    return Array.from(tbody.querySelectorAll("tr")).map(tr => ({
      produtoId: tr.querySelector(".orc-item-produto").value,
      descricao: tr.querySelector(".orc-item-descricao").value.trim(),
      quantidade: parseFloat(tr.querySelector(".orc-item-qtd").value)||0,
      valorUnitario: parseFloat(tr.querySelector(".orc-item-valor").value)||0,
      tr,
    }));
  }
  function recalcular(){
    const itens = coletarItens();
    let soma = 0;
    itens.forEach(it => {
      const total = it.quantidade*it.valorUnitario;
      soma += total;
      it.tr.querySelector(".orc-item-total").textContent = fmtBRL(total);
    });
    const descontoEl = document.getElementById("orcDesconto");
    const desconto = descontoEl ? (parseFloat(descontoEl.value)||0) : 0;
    document.getElementById("orcTotal").textContent = fmtBRL(Math.max(0, soma-desconto));
  }
  if(podeEditar){
    tbody.addEventListener("input", recalcular);
    tbody.addEventListener("change", e => {
      const sel = e.target.closest(".orc-item-produto");
      if(sel){
        const tr = sel.closest("tr");
        const p = estProdutoById(sel.value);
        if(p){
          tr.querySelector(".orc-item-descricao").value = p.nome;
          tr.querySelector(".orc-item-valor").value = estValorUnitarioEstimado(p) || 0;
        }
      }
      recalcular();
    });
    tbody.addEventListener("click", e => {
      const del = e.target.closest(".orc-item-del");
      if(!del) return;
      if(tbody.querySelectorAll("tr").length<=1){ showToast("Precisa de pelo menos 1 item.", "error"); return; }
      del.closest("tr").remove();
      recalcular();
    });
    document.getElementById("btnAddItemOrc")?.addEventListener("click", () => {
      tbody.insertAdjacentHTML("beforeend", linhaItemHTML(null));
      recalcular();
    });
    document.getElementById("orcDesconto")?.addEventListener("input", recalcular);
  }
  recalcular();

  if(!podeEditar) return; // modo "só ver" — sem listener de submit

  document.getElementById("formOrc").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const itensColetados = coletarItens();
    if(itensColetados.some(it => !it.descricao)){ showToast("Preencha a descrição de todos os itens.", "error"); return; }
    const itensSalvos = itensColetados.map(it => ({ produtoId: it.produtoId, descricao: it.descricao, quantidade: it.quantidade, valorUnitario: it.valorUnitario, valorTotal: Math.round(it.quantidade*it.valorUnitario*100)/100 }));
    const desconto = parseFloat(fd.get("desconto"))||0;
    const valorTotal = Math.max(0, Math.round((itensSalvos.reduce((s,it)=>s+it.valorTotal,0) - desconto)*100)/100);
    const dataForm = {
      clienteId: fd.get("clienteId"), negocio: fd.get("negocio")||"", data: fd.get("data"),
      itens: itensSalvos, desconto, valorTotal, observacoes: fd.get("observacoes").trim(),
    };

    if(modoOS){
      const osId = uid("os");
      const novaOS = {
        id: osId, numero: `OS-${String(state.cliOS.length+1).padStart(4,"0")}`, clienteId: dataForm.clienteId,
        orcamentoId: "", negocio: dataForm.negocio, data: dataForm.data, itens: dataForm.itens, valorServico: 0,
        valorTotal: dataForm.valorTotal, status: "Aberta", lancamentoId: "", observacoes: dataForm.observacoes,
        dataCadastro: todayISO(), lancadoPor: state.perfilAtivo?state.perfilAtivo.nome:"Master",
      };
      state.cliOS.push(novaOS);
      await saveCliOS(); closeModal();
      cliOSDetalheId = osId; state.view = "cli_os_detalhe";
      renderApp(); showToast(`${novaOS.numero} criada.`);
      return;
    }

    dataForm.validade = fd.get("validade")||"";
    if(isEdit){ Object.assign(existing, dataForm); }
    else{
      const numero = `ORC-${String(state.cliOrcamentos.length+1).padStart(4,"0")}`;
      state.cliOrcamentos.push({ id: uid("orc"), numero, status: "Rascunho", dataCadastro: todayISO(), lancadoPor: state.perfilAtivo?state.perfilAtivo.nome:"Master", ...dataForm });
    }
    await saveCliOrcamentos(); closeModal(); renderView(); showToast(isEdit?"Orçamento atualizado.":"Orçamento criado.");
  });
}

async function aprovarOrcamento(id){
  const o = cliOrcamentoById(id);
  if(!o) return;
  if(!confirm(`Aprovar o orçamento ${o.numero} e gerar a Ordem de Serviço?`)) return;
  const osId = uid("os");
  const novaOS = {
    id: osId, numero: `OS-${String(state.cliOS.length+1).padStart(4,"0")}`, clienteId: o.clienteId, orcamentoId: o.id,
    negocio: o.negocio, data: todayISO(), itens: o.itens, valorServico: 0, valorTotal: o.valorTotal,
    status: "Aberta", lancamentoId: "", observacoes: o.observacoes, dataCadastro: todayISO(),
    lancadoPor: state.perfilAtivo?state.perfilAtivo.nome:"Master",
  };
  state.cliOS.push(novaOS);
  o.status = "Convertido em OS"; o.osId = osId;
  await saveCliOS(); await saveCliOrcamentos();
  cliOSDetalheId = osId; state.view = "cli_os_detalhe";
  renderApp(); showToast(`Orçamento aprovado — ${novaOS.numero} criada.`);
}
async function recusarOrcamento(id){
  const o = cliOrcamentoById(id);
  if(!o) return;
  o.status = "Recusado";
  await saveCliOrcamentos(); renderView(); showToast("Orçamento recusado.");
}

/* =========================================================================
   MODAL — DAR BAIXA DE ESTOQUE NA OS (custo real da instalação)
========================================================================= */
function modalOSBaixaEstoque(osId){
  const os = cliOSById(osId);
  if(!os) return;
  if(!state.estProdutos.length){ showToast("Cadastre produtos no estoque primeiro.", "error"); return; }
  const cliente = cliClienteById(os.clienteId);
  const linhaHTML = () => `
    <tr>
      <td style="min-width:220px;"><select class="baixa-item-produto"><option value="">— Selecione —</option>${state.estProdutos.map(p=>`<option value="${p.id}">${esc(p.nome)} (saldo: ${estSaldoAtual(p.id)} ${esc(p.unidade||"un")})</option>`).join("")}</select></td>
      <td style="width:100px;"><input type="number" min="0.001" step="0.001" class="baixa-item-qtd" value="1"></td>
      <td class="num baixa-item-custo" style="width:110px; color:var(--ink-3);">—</td>
      <td><button type="button" class="icon-btn danger baixa-item-del" title="Remover">🗑</button></td>
    </tr>`;
  openModal(`
    <div class="modal-head"><div class="modal-title">📦 Dar baixa de estoque — ${esc(os.numero)}</div><button class="modal-close" data-action="close-modal">✕</button></div>
    <form id="formBaixaOS"><div class="modal-body">
      <div class="field-help" style="margin-bottom:10px;">Informe o que foi realmente usado na instalação de <strong>${cliente?esc(cliNome(cliente)):"—"}</strong> — o custo usa o Custo Médio Real do produto agora.</div>
      <div style="overflow-x:auto; border:1px solid var(--border); border-radius:var(--r);">
        <table style="min-width:480px;"><thead><tr><th>Produto</th><th class="num">Qtd usada</th><th class="num">Custo estimado</th><th></th></tr></thead><tbody id="baixaItensBody">${linhaHTML()}</tbody></table>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="btnAddItemBaixa" style="margin-top:8px;">+ Adicionar item</button>
      <div class="field" style="margin-top:12px;"><label>Data</label><input type="date" name="data" value="${todayISO()}"></div>
    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Confirmar baixa</button></div></form>
  `);
  const tbody = document.getElementById("baixaItensBody");
  function atualizarCustos(){
    Array.from(tbody.querySelectorAll("tr")).forEach(tr => {
      const produtoId = tr.querySelector(".baixa-item-produto").value;
      const qtd = parseFloat(tr.querySelector(".baixa-item-qtd").value)||0;
      const p = estProdutoById(produtoId);
      tr.querySelector(".baixa-item-custo").textContent = p ? fmtBRL(estValorUnitarioEstimado(p)*qtd) : "—";
    });
  }
  tbody.addEventListener("input", atualizarCustos);
  tbody.addEventListener("change", atualizarCustos);
  tbody.addEventListener("click", e => {
    const del = e.target.closest(".baixa-item-del");
    if(!del) return;
    if(tbody.querySelectorAll("tr").length<=1){ showToast("Precisa de pelo menos 1 item.", "error"); return; }
    del.closest("tr").remove();
  });
  document.getElementById("btnAddItemBaixa").addEventListener("click", () => {
    tbody.insertAdjacentHTML("beforeend", linhaHTML());
    atualizarCustos();
  });
  document.getElementById("formBaixaOS").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const linhas = Array.from(tbody.querySelectorAll("tr")).map(tr => ({
      produtoId: tr.querySelector(".baixa-item-produto").value,
      qtd: parseFloat(tr.querySelector(".baixa-item-qtd").value)||0,
    })).filter(l => l.produtoId && l.qtd>0);
    if(!linhas.length){ showToast("Selecione ao menos um item com quantidade.", "error"); return; }
    const data = fd.get("data") || todayISO();
    const destinoNome = cliente ? cliNome(cliente) : "Cliente";
    linhas.forEach(l => {
      const p = estProdutoById(l.produtoId);
      const custoUnit = p ? estValorUnitarioEstimado(p) : 0;
      state.estMovimentos.push({
        id: uid("em"), data, tipo: "Saída", produtoId: l.produtoId, qtd: l.qtd, custoUnitario: custoUnit,
        localOrigem: "Estoque", localDestino: destinoNome,
        motivo: `Instalação ${os.numero}`, responsavel: state.perfilAtivo?state.perfilAtivo.nome:"Master",
        osId: os.id,
      });
    });
    await saveEstMovimentos();
    closeModal(); renderView();
    showToast(`${linhas.length} item(ns) baixado(s) do estoque.`);
  });
}

async function osGerarReceita(osId){
  const os = cliOSById(osId);
  if(!os) return;
  if(os.lancamentoId){ showToast("Essa OS já tem uma conta a receber gerada.", "error"); return; }
  let cat = categoriaByNome(CATEGORIA_VENDAS_SERVICOS);
  if(!cat){ cat = { id: uid("cat"), nome: CATEGORIA_VENDAS_SERVICOS, subcategorias: [] }; state.categorias.push(cat); await saveCategorias(); }
  const cliente = cliClienteById(os.clienteId);
  const conta = state.contas.find(c => c.ativa !== false);
  const lancId = uid("l");
  state.lancamentos.push({
    id: lancId, data: todayISO(), tipo: "Receita", negocio: os.negocio||"", categoria: cat.nome, subcategoria: "",
    contaOrigem: conta ? conta.id : "", contaDestino: "", valor: osValorVenda(os),
    descricao: `${os.numero} — ${cliente?cliNome(cliente):"Cliente"}`, status: "Provisionado", conciliado: false,
    lancadoPor: state.perfilAtivo?state.perfilAtivo.nome:"Master", osId: os.id,
  });
  os.lancamentoId = lancId;
  await saveLancamentos(); await saveCliOS();
  renderView();
  showToast("Conta a receber gerada — dê baixa nela em Lançamentos quando o cliente pagar.");
}
async function osConcluir(osId){
  const os = cliOSById(osId);
  if(!os) return;
  os.status = "Concluída";
  await saveCliOS();
  renderView();
  showToast("OS concluída.");
}

// ---- VIEW: TÉCNICOS ----
function viewCliTecnicos(){
  const lista = [...state.cliTecnicos].sort((a,b) => a.nome.localeCompare(b.nome));
  const rows = lista.map(t => {
    const negTag = t.negocio ? `<span class="tag" style="background:color-mix(in srgb, ${negocioCor(t.negocio)} 14%, white); color:${negocioCor(t.negocio)};"><span class="tag-dot" style="background:${negocioCor(t.negocio)}"></span>${esc(t.negocio)}</span>` : "—";
    const qtdChamados = state.cliChamados.filter(c => c.tecnicoId === t.id && c.status!=="Concluído" && c.status!=="Cancelado").length;
    return `<tr>
      ${bulkCheckboxCellHTML("cli_tecnicos", t.id)}
      <td style="font-weight:600;">${esc(t.nome)}${t.ativo===false?` <span style="color:var(--ink-4); font-weight:400;">(inativo)</span>`:""}</td>
      <td>${esc(t.telefone||"—")}</td>
      <td>${negTag}</td>
      <td style="color:var(--ink-3);">${esc(t.diasAtendimento||"—")}</td>
      <td class="num">${t.valorMensal ? fmtBRL(t.valorMensal) : "—"}</td>
      <td class="num">${qtdChamados||"—"}</td>
      <td><div class="row-actions">
        <button class="icon-btn" data-action="tec-app-codigo" data-id="${t.id}" title="Código de acesso ao App do Técnico" style="color:var(--accent);">🔗</button>
        ${Number(t.valorMensal)>0 ? `<button class="icon-btn" data-action="tec-gerar-pagamento" data-id="${t.id}" title="Lançar pagamento em Contas a Pagar" style="color:var(--neg);">💲</button>` : ""}
        <button class="icon-btn" data-action="tec-edit" data-id="${t.id}" title="Editar">✎</button>
        <button class="icon-btn danger" data-action="tec-del" data-id="${t.id}" title="Excluir">🗑</button>
      </div></td>
    </tr>`;
  }).join("");
  return `
    <div class="page-header">
      <div><div class="page-title">Técnicos</div><div class="page-sub">Quem atende os chamados em campo — CLT ou terceirizado, tanto faz. O valor mensal é só informativo — clique em 💲 pra lançar o pagamento em Contas a Pagar.</div></div>
      <div style="display:flex; gap:8px;">${bulkBarraAcoesHTML("cli_tecnicos")}${seModulo("clientes","criar",`<button class="btn btn-primary" data-action="tec-novo">+ Novo técnico</button>`)}</div>
    </div>
    <div class="panel"><div class="panel-body">
      <table><thead><tr>${bulkCheckboxHeaderHTML("cli_tecnicos", lista.map(t=>t.id))}<th>Nome</th><th>Telefone</th><th>Negócio</th><th>Atende quando</th><th class="num">Valor mensal</th><th class="num">Chamados abertos</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="8">${emptyState("Nenhum técnico cadastrado ainda.")}</td></tr>`}</tbody></table>
    </div></div>
  `;
}

// ---- VIEW: CHAMADOS ----
// ---- Cabeçalho de tabela clicável, pra ordenar por qualquer coluna ----
// tableSorts: { [contexto]: { campo, dir } } — genérico, reaproveitável em outras listas.
let tableSorts = {};
function sortState(contexto, campoPadrao, dirPadrao){
  if(!tableSorts[contexto]) tableSorts[contexto] = { campo: campoPadrao, dir: dirPadrao || "asc" };
  return tableSorts[contexto];
}
function thSort(contexto, label, campo){
  const s = tableSorts[contexto];
  const ativo = s && s.campo === campo;
  const seta = ativo ? (s.dir === "asc" ? " ▲" : " ▼") : "";
  return `<th style="cursor:pointer; user-select:none;" data-action="table-sort" data-contexto="${contexto}" data-campo="${campo}" title="Ordenar por ${esc(label)}">${esc(label)}${seta}</th>`;
}
function aplicarSort(contexto, lista, getters){
  const s = tableSorts[contexto];
  if(!s) return lista;
  const getter = getters[s.campo];
  if(!getter) return lista;
  const ordenada = [...lista].sort((a,b) => {
    const va = getter(a), vb = getter(b);
    const cmp = typeof va === "number" && typeof vb === "number" ? va - vb : String(va??"").localeCompare(String(vb??""), 'pt-BR', {numeric:true, sensitivity:'base'});
    return s.dir === "asc" ? cmp : -cmp;
  });
  return ordenada;
}

  numero: c => c.numero || "",

  prioridade: c => ({Baixa:0,Normal:1,Alta:2,Urgente:3})[c.prioridade] ?? 1,

};
