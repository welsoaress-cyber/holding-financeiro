      <div class="field-help" style="margin-bottom:10px;">Informe o que foi realmente usado no atendimento de <strong>${cliente?esc(cliNome(cliente)):"—"}</strong>${mostraCusto ? " — o custo usa o Custo Médio Real do produto agora." : ""}</div>
      <div id="baixaItensBody">${linhaHTML()}</div>
      <button type="button" class="btn btn-ghost btn-sm" id="btnAddItemBaixa" style="margin-top:4px;">+ Adicionar item</button>
      <div class="field" style="margin-top:12px;"><label>Data da visita</label><input type="date" name="data" value="${todayISO()}"></div>
    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Confirmar</button></div></form>
  `);
  const corpo = document.getElementById("baixaItensBody");
  function atualizarCustos(){
    if(!mostraCusto) return;
    Array.from(corpo.querySelectorAll(".baixa-item-linha")).forEach(linha => {
      const produtoId = linha.querySelector(".baixa-item-produto").value;
      const qtd = parseFloat(linha.querySelector(".baixa-item-qtd").value)||0;
      const p = estProdutoById(produtoId);
      linha.querySelector(".baixa-item-custo").textContent = p ? fmtBRL(estValorUnitarioEstimado(p)*qtd) : "—";
    });
  }
  corpo.addEventListener("input", atualizarCustos);
  corpo.addEventListener("change", atualizarCustos);
  corpo.addEventListener("click", e => {
    const del = e.target.closest(".baixa-item-del");
    if(!del) return;
    if(corpo.querySelectorAll(".baixa-item-linha").length<=1){ showToast("Precisa de pelo menos 1 item.", "error"); return; }
    del.closest(".baixa-item-linha").remove();
  });
  document.getElementById("btnAddItemBaixa").addEventListener("click", () => {
    corpo.insertAdjacentHTML("beforeend", linhaHTML());
    atualizarCustos();
  });
  document.getElementById("formBaixaChamado").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const linhas = Array.from(corpo.querySelectorAll(".baixa-item-linha")).map(linha => ({
      produtoId: linha.querySelector(".baixa-item-produto").value,
      qtd: parseFloat(linha.querySelector(".baixa-item-qtd").value)||0,
    })).filter(l => l.produtoId && l.qtd>0);
    if(!linhas.length){ showToast("Selecione ao menos um item com quantidade.", "error"); return; }
    const data = fd.get("data") || todayISO();
    const destinoNome = cliente ? cliNome(cliente) : "Cliente";
    linhas.forEach(l => {
      const p = estProdutoById(l.produtoId);
      const custoUnit = p ? estValorUnitarioEstimado(p) : 0;
      state.estMovimentos.push({
        id: uid("em"), data, tipo: "Saída", produtoId: l.produtoId, qtd: l.qtd, custoUnitario: custoUnit,
        localOrigem: "Estoque", localDestino: destinoNome,
        motivo: `Chamado ${cham.numero}`, responsavel: nomeUsuarioAtual(),
        chamadoId: cham.id,
      });
    });
    await saveEstMovimentos();
    closeModal(); renderView();
    showToast(`${linhas.length} item(ns) baixado(s) do estoque.`);
  });
}

// Correção pontual de um item de material já lançado num chamado — pra quando
// o técnico liga avisando que baixou o produto errado ou a quantidade errada.
// Só o Master mexe aqui (a tela de detalhe do chamado onde isso aparece nem
// existe no app do técnico); o custo é recalculado igual ao lançamento normal.
function modalEditarMaterialChamado(movId){
  const m = state.estMovimentos.find(x => x.id === movId);
  if(!m) return;
  const produtoOptions = state.estProdutos.map(p => `<option value="${p.id}" ${m.produtoId===p.id?"selected":""}>${esc(p.nome)} (saldo: ${estSaldoAtual(p.id)} ${esc(p.unidade||"un")})</option>`).join("");
  openModal(`
    <div class="modal-head"><div class="modal-title">✎ Editar item de material</div><button class="modal-close" data-action="close-modal">✕</button></div>
    <form id="formEditarMaterialChamado"><div class="modal-body">
      <div class="field"><label>Produto</label><select name="produtoId" required>${produtoOptions}</select></div>
      <div class="field-row">
        <div class="field"><label>Qtd usada</label><input type="number" min="0.001" step="0.001" name="qtd" value="${m.qtd}" required></div>
        <div class="field"><label>Data</label><input type="date" name="data" value="${m.data||todayISO()}"></div>
      </div>
    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Salvar</button></div></form>
  `);
  document.getElementById("formEditarMaterialChamado").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const qtd = parseFloat(fd.get("qtd")) || 0;
    if(qtd <= 0){ showToast("Informe uma quantidade válida.", "error"); return; }
    const p = estProdutoById(fd.get("produtoId"));
    m.produtoId = fd.get("produtoId");
    m.qtd = qtd;
    m.data = fd.get("data") || m.data;
    m.custoUnitario = p ? estValorUnitarioEstimado(p) : m.custoUnitario;
    await saveEstMovimentos();
    closeModal(); renderView();
    showToast("Item atualizado.");
  });
}

// ---- Prorrogar atendimento — pro técnico registrar por que não deu pra
// concluir agora (faltou material, sem luz, cliente ausente, etc.) e marcar
// uma nova data, sem perder o histórico do que já foi tentado antes. O
// chamado volta pra "Agendado" com a nova data, e cada prorrogação vira uma
// linha no relato do atendimento (dá pra prorrogar mais de uma vez).
function modalChamadoProrrogar(chamadoId){
  const c = cliChamadoById(chamadoId);
  if(!c) return;
  if(c.status==="Concluído" || c.status==="Cancelado"){ showToast(`Chamado ${c.status.toLowerCase()} — não dá pra prorrogar.`, "error"); return; }
  const motivoOptions = MOTIVOS_PRORROGACAO.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join("");
  openModal(`
    <div class="modal-head"><div class="modal-title">⏸ Não consegui concluir — ${esc(c.numero)}</div><button class="modal-close" data-action="close-modal">✕</button></div>
    <form id="formProrrogarChamado"><div class="modal-body">
      <div class="field-help" style="margin-bottom:10px;">O chamado volta pra "Agendado" com a nova data — nada se perde, dá pra tentar de novo depois.</div>
      <div class="field"><label>Motivo</label><select name="motivo">${motivoOptions}</select></div>
      <div class="field"><label>Descreva (opcional)</label><textarea name="detalhe" rows="2" style="resize:none;" placeholder="Ex: chegou o material só semana que vem"></textarea></div>
      <div class="field"><label>Nova data prevista</label><input type="date" name="novaData" min="${todayISO()}" required></div>
    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Confirmar</button></div></form>
  `);
  document.getElementById("formProrrogarChamado").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const novaData = fd.get("novaData");
    if(!novaData){ showToast("Informe a nova data prevista.", "error"); return; }
    await chamadoProrrogar(chamadoId, fd.get("motivo"), (fd.get("detalhe")||"").trim(), novaData);
    closeModal(); renderView(); showToast("Atendimento prorrogado.");
  });
}
async function chamadoProrrogar(id, motivo, detalhe, novaData){
  const c = cliChamadoById(id);
  if(!c) return;
  const dataAntiga = c.dataAgendada;
  c.status = "Agendado";
  c.dataAgendada = novaData;
  const registro = `[${fmtDateBR(todayISO())}] Prorrogado (estava p/ ${dataAntiga?fmtDateBR(dataAntiga):"sem data"}) — Motivo: ${motivo}${detalhe?" — "+detalhe:""}. Nova data: ${fmtDateBR(novaData)}.`;
  c.observacoes = c.observacoes ? `${c.observacoes}\n${registro}` : registro;
  await saveCliChamados();
}
async function chamadoGerarCobranca(id){
  const c = cliChamadoById(id);
  if(!c) return;
  if(c.lancamentoId){ showToast("Esse chamado já tem uma cobrança gerada.", "error"); return; }
  if(!(Number(c.valorCobranca)>0)){ showToast("Defina um valor de cobrança no chamado primeiro.", "error"); return; }
  let cat = categoriaByNome(CATEGORIA_VENDAS_SERVICOS);
  if(!cat){ cat = { id: uid("cat"), nome: CATEGORIA_VENDAS_SERVICOS, subcategorias: [] }; state.categorias.push(cat); await saveCategorias(); }
  const cliente = cliClienteById(c.clienteId);
  const conta = state.contas.find(x => x.ativa !== false);
  const lancId = uid("l");
  state.lancamentos.push({
    id: lancId, data: todayISO(), tipo: "Receita", negocio: c.negocio||"", categoria: cat.nome, subcategoria: "",
    contaOrigem: conta ? conta.id : "", contaDestino: "", valor: Number(c.valorCobranca),
    descricao: `${c.numero} — ${cliente?cliNome(cliente):"Cliente"}`, status: "Provisionado", conciliado: false,
    lancadoPor: state.perfilAtivo?state.perfilAtivo.nome:"Master", chamadoId: c.id,
  });
  c.lancamentoId = lancId;
  await saveLancamentos(); await saveCliChamados();
  renderView();
  showToast("Conta a receber gerada — dê baixa nela em Lançamentos quando o cliente pagar.");
}

// =========================================================================
// MÓDULO COMPRA E VENDA — itens comprados pra revender (OLX etc.). Compra
// já lança a despesa (Pago) na hora; "Registrar venda" lança a receita
// (Pago) e fecha o item — reaproveita o mesmo modalLancamento de sempre
// via prefill, não duplica lógica de lançamento.
// =========================================================================
const CATEGORIA_COMPRA_VENDA = "Compra e Venda";
const CV_STATUS = ["Em posse","Anunciado","Vendido"];
function cvItemById(id){ return state.comprasVendas.find(x => x.id === id); }
function cvMargem(item){ return item.status === "Vendido" ? Number(item.valorVenda||0) - Number(item.valorCompra||0) : null; }
function cvStatusClass(status){ return status==="Vendido"?"status-pago":status==="Anunciado"?"status-agendado":"status-pendente"; }
async function cvGarantirCategoria(){
  let cat = categoriaByNome(CATEGORIA_COMPRA_VENDA);
  if(!cat){ cat = { id: uid("cat"), nome: CATEGORIA_COMPRA_VENDA, subcategorias: [] }; state.categorias.push(cat); await saveCategorias(); }
  return cat;
}
function cvNegocioPadrao(){
  const nomeado = state.negocios.find(n => n.nome.trim().toLowerCase() === "compra/venda");
  return (nomeado || state.negocios[0])?.nome || "";
}

function viewComprasVendas(){
  const lista = [...state.comprasVendas].sort((a,b) => (b.dataCompra||"").localeCompare(a.dataCompra||""));
  const emPosse = lista.filter(i => i.status !== "Vendido");
  const vendidos = lista.filter(i => i.status === "Vendido");
  const investidoEmPosse = emPosse.reduce((s,i) => s + Number(i.valorCompra||0), 0);
  const totalVendido = vendidos.reduce((s,i) => s + Number(i.valorVenda||0), 0);
  const margemRealizada = vendidos.reduce((s,i) => s + cvMargem(i), 0);

  const rows = lista.map(i => {
    const margem = cvMargem(i);
    const negTag = i.negocio ? `<span class="tag" style="background:color-mix(in srgb, ${negocioCor(i.negocio)} 14%, white); color:${negocioCor(i.negocio)};"><span class="tag-dot" style="background:${negocioCor(i.negocio)}"></span>${esc(i.negocio)}</span>` : "—";
    return `<tr>
      ${bulkCheckboxCellHTML("compras_vendas", i.id)}
      <td style="font-weight:600;">${esc(i.nome)}${i.origem?`<div style="font-size:11px;color:var(--ink-4);">via ${esc(i.origem)}</div>`:""}</td>
      <td>${negTag}</td>
      <td><span class="status-pill ${cvStatusClass(i.status)}">${esc(i.status)}</span></td>
      <td>${i.dataCompra?fmtDateBR(i.dataCompra):"—"}</td>
      <td class="num" style="color:var(--neg);">${fmtBRL(i.valorCompra)}</td>
      <td>${i.dataVenda?fmtDateBR(i.dataVenda):"—"}${i.canalVenda?`<div style="font-size:11px;color:var(--ink-4);">via ${esc(i.canalVenda)}</div>`:""}</td>
      <td class="num" style="color:var(--pos);">${i.status==="Vendido"?fmtBRL(i.valorVenda):"—"}</td>
      <td class="num" style="font-weight:700; color:${margem===null?'var(--ink-4)':margem>=0?'var(--pos)':'var(--neg)'};">${margem===null?"—":fmtBRL(margem)}</td>
      <td><div class="row-actions">
        ${i.status!=="Vendido" ? `<button class="icon-btn" data-action="cv-registrar-venda" data-id="${i.id}" title="Registrar venda" style="color:var(--pos);">💲</button>` : ""}
        <button class="icon-btn" data-action="cv-edit" data-id="${i.id}" title="Editar">✎</button>
        <button class="icon-btn danger" data-action="cv-del" data-id="${i.id}" title="Excluir">🗑</button>
      </div></td>
    </tr>`;
  }).join("");

  return `
    <div class="page-header">
      <div><div class="page-title">Compra e Venda</div><div class="page-sub">Qualquer coisa que você compra pra revender — a compra já lança a despesa, a venda lança a receita.</div></div>
      <div style="display:flex; gap:8px;">${bulkBarraAcoesHTML("compras_vendas")}<button class="btn btn-primary" data-action="cv-novo">+ Novo item</button></div>
    </div>
    <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr); margin-bottom:16px;">
      <div class="kpi-card"><div class="kpi-label">Investido (em posse)</div><div class="kpi-value" style="font-size:18px;">${fmtBRL(investidoEmPosse)}</div><div class="kpi-note">${emPosse.length} item(ns) parado(s)</div></div>
      <div class="kpi-card"><div class="kpi-label">Total vendido</div><div class="kpi-value pos" style="font-size:18px;">${fmtBRL(totalVendido)}</div><div class="kpi-note">${vendidos.length} item(ns) vendido(s)</div></div>
      <div class="kpi-card"><div class="kpi-label">Margem realizada</div><div class="kpi-value ${margemRealizada>=0?'pos':'neg'}" style="font-size:18px;">${fmtBRL(margemRealizada)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Itens cadastrados</div><div class="kpi-value" style="font-size:18px;">${lista.length}</div></div>
    </div>
    <div class="panel"><div class="panel-body">
      <table><thead><tr>${bulkCheckboxHeaderHTML("compras_vendas", lista.map(i=>i.id))}<th>Item</th><th>Negócio</th><th>Status</th><th>Data compra</th><th class="num">Valor compra</th><th>Data venda</th><th class="num">Valor venda</th><th class="num">Margem</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="10">${emptyState("Nenhum item ainda — comprou algo pra revender? Registra aqui.")}</td></tr>`}</tbody></table>
    </div></div>
  `;
}

function modalCompraVenda(existing){
  const isEdit = !!existing;
  const i = existing || { nome:"", negocio: cvNegocioPadrao(), status:"Em posse", origem:"", linkAnuncio:"", dataCompra: todayISO(), valorCompra:0, contaCompra: state.contas.find(x=>x.ativa!==false)?.id||"", observacoes:"" };
  const negOpts = state.negocios.map(n=>`<option value="${esc(n.nome)}" ${i.negocio===n.nome?"selected":""}>${esc(n.nome)}</option>`).join("");
  const statusOpts = CV_STATUS.map(s=>`<option value="${s}" ${i.status===s?"selected":""}>${s}</option>`).join("");
  const contaOpts = state.contas.map(c=>`<option value="${c.id}" ${i.contaCompra===c.id?"selected":""}>${contaLabel(c)}</option>`).join("");
  openModal(`
    <div class="modal-head"><div class="modal-title">${isEdit?"Editar item":"Novo item comprado"}</div><button class="modal-close" data-action="close-modal">✕</button></div>
    <form id="formCv"><div class="modal-body">
      <div class="field-row">
        <div class="field" style="flex:2;"><label>Item *</label><input required type="text" name="nome" value="${esc(i.nome)}" placeholder="Ex: Bicicleta Caloi 10"></div>
        <div class="field"><label>Negócio</label><select name="negocio"><option value="">— Sem negócio —</option>${negOpts}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Onde comprou</label><input type="text" name="origem" value="${esc(i.origem||"")}" placeholder="Ex: OLX, Mercado Livre, indicação..."></div>
        <div class="field"><label>Status</label><select name="status">${statusOpts}</select></div>
      </div>
      <div class="field"><label>Link do anúncio (opcional)</label><input type="url" name="linkAnuncio" value="${esc(i.linkAnuncio||"")}" placeholder="https://..."></div>
      <div class="field-row">
        <div class="field"><label>Data da compra *</label><input required type="date" name="dataCompra" value="${i.dataCompra}" ${isEdit?"disabled":""}></div>
        <div class="field"><label>Valor pago (R$) *</label><input required type="number" step="0.01" min="0" name="valorCompra" value="${i.valorCompra}" ${isEdit?"disabled":""}></div>
      </div>
      ${!isEdit ? `<div class="field"><label>Conta que pagou</label><select name="contaCompra">${contaOpts}</select>
        <div class="field-help">Lança uma despesa Paga nessa conta assim que você salvar.</div>
      </div>` : `<div class="field-help">Valor/data/conta da compra não dá pra editar depois — o lançamento já foi gerado. Se errou, exclua o item e cadastre de novo.</div>`}
      <div class="field"><label>Observações</label><textarea name="observacoes" rows="2" style="resize:none;">${esc(i.observacoes||"")}</textarea></div>
    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">${isEdit?"Salvar":"Cadastrar e lançar despesa"}</button></div></form>
  `);
  document.getElementById("formCv").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    if(isEdit){
      const data = {
        nome: fd.get("nome").trim(), negocio: fd.get("negocio")||"", origem: fd.get("origem").trim(),
        linkAnuncio: fd.get("linkAnuncio").trim(), status: fd.get("status"), observacoes: fd.get("observacoes").trim(),
      };
      Object.assign(existing, data);
      await saveComprasVendas(); closeModal(); renderApp(); showToast("Item atualizado.");
      return;
    }
    const cat = await cvGarantirCategoria();
    const novoItem = {
      id: uid("cv"), nome: fd.get("nome").trim(), negocio: fd.get("negocio")||"", status: fd.get("status"),
      origem: fd.get("origem").trim(), linkAnuncio: fd.get("linkAnuncio").trim(),
      dataCompra: fd.get("dataCompra"), valorCompra: parseFloat(fd.get("valorCompra"))||0,
      dataVenda: "", valorVenda: 0, observacoes: fd.get("observacoes").trim(),
      lancadoPor: state.perfilAtivo?state.perfilAtivo.nome:"Master",
    };
    const lancId = uid("l");
    state.lancamentos.push({
      id: lancId, data: novoItem.dataCompra, tipo: "Despesa", negocio: novoItem.negocio, categoria: cat.nome, subcategoria: "",
      contaOrigem: fd.get("contaCompra"), contaDestino: "", valor: novoItem.valorCompra,
      descricao: `Compra — ${novoItem.nome}`, status: "Pago", conciliado: false,
      lancadoPor: novoItem.lancadoPor, compraVendaId: novoItem.id,
    });
    novoItem.lancamentoCompraId = lancId;
    state.comprasVendas.push(novoItem);
    await saveLancamentos(); await saveComprasVendas();
    closeModal(); renderApp(); showToast("Item cadastrado e despesa lançada.");
  });
}

      lancadoPor: state.perfilAtivo?state.perfilAtivo.nome:"Master", compraVendaId: item.id,
    });
    item.dataVenda = dataVenda; item.valorVenda = valorVenda; item.status = "Vendido";
    item.canalVenda = fd.get("canalVenda").trim(); item.lancamentoVendaId = lancId;
    await saveLancamentos(); await saveComprasVendas();
    closeModal(); renderApp(); showToast(`Venda registrada — margem de ${fmtBRL(cvMargem(item))}.`);
  });
}

let rhFuncFiltro = { negocio:"", cargo:"", status:"", texto:"" };
let rhFolhaFiltro = { competencia:"", negocio:"", status:"" };
let rhFeriasFiltro = { funcionario:"", status:"" };

function rhFuncionarioById(id){ return state.rhFuncionarios.find(f => f.id === id); }
function rhCargoById(id){ return state.rhCargos.find(c => c.id === id); }
function rhFolhaById(id){ return state.rhFolha.find(f => f.id === id); }
function rhFeriasById(id){ return state.rhFerias.find(f => f.id === id); }
function rhNomeCargo(cargoId){ const c = rhCargoById(cargoId); return c ? c.nome : "—"; }
function rhFuncionariosAtivos(){ return state.rhFuncionarios.filter(f => f.status !== "Desligado"); }
function competenciaAtual(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
function fmtCompetencia(c){ if(!c) return "—"; const [y,m] = c.split("-"); return `${NOMES_MESES[parseInt(m,10)-1]||m}/${y}`; }
function rhIdade(dataNascimento){
  if(!dataNascimento) return null;
  const hoje = new Date(); const nasc = new Date(dataNascimento+"T00:00:00");
  let idade = hoje.getFullYear() - nasc.getFullYear();
  const m = hoje.getMonth() - nasc.getMonth();
  if(m < 0 || (m === 0 && hoje.getDate() < nasc.getDate())) idade--;
  return idade;
}
function rhTempoCasa(dataAdmissao, dataDemissao){
  if(!dataAdmissao) return "—";
  const fim = dataDemissao ? new Date(dataDemissao+"T00:00:00") : new Date();
  const adm = new Date(dataAdmissao+"T00:00:00");
  let meses = (fim.getFullYear()-adm.getFullYear())*12 + (fim.getMonth()-adm.getMonth());
  if(fim.getDate() < adm.getDate()) meses--;
  if(meses < 0) meses = 0;
  const anos = Math.floor(meses/12), restoMeses = meses%12;
  if(anos === 0) return `${restoMeses} mês${restoMeses===1?"":"es"}`;
  if(restoMeses === 0) return `${anos} ano${anos===1?"":"s"}`;
  return `${anos} ano${anos===1?"":"s"} e ${restoMeses} mês${restoMeses===1?"":"es"}`;
}
function rhUltimasFeriasConcluidas(funcionarioId){
  return state.rhFerias
    .filter(f => f.funcionarioId === funcionarioId && f.status === "Concluída" && f.dataFimGozo)
    .sort((a,b) => (b.dataFimGozo||"").localeCompare(a.dataFimGozo||""))[0];
}
function rhProximoVencimentoFerias(funcionarioId){
  // Período aquisitivo simplificado: 12 meses depois da admissão (ou das últimas férias
  // concluídas) o funcionário vence um novo direito a férias. Serve só de alerta —
  // não substitui o cálculo oficial de CLT com afastamentos etc.
  const f = rhFuncionarioById(funcionarioId);
  if(!f || !f.dataAdmissao || f.status === "Desligado") return null;
  const ultima = rhUltimasFeriasConcluidas(funcionarioId);
  const base = ultima ? ultima.dataFimGozo : f.dataAdmissao;
  if(!base) return null;
  const d = new Date(base+"T00:00:00");
  d.setFullYear(d.getFullYear()+1);
  const vencimento = d.toISOString().slice(0,10);
  const diasRestantes = Math.round((new Date(vencimento+"T00:00:00") - new Date(todayISO()+"T00:00:00")) / 86400000);
  return { vencimento, diasRestantes };
}
function rhAniversariantesDoMes(){
  const mesAtual = new Date().getMonth();
  return rhFuncionariosAtivos()
    .filter(f => f.dataNascimento && new Date(f.dataNascimento+"T00:00:00").getMonth() === mesAtual)
    .sort((a,b) => new Date(a.dataNascimento+"T00:00:00").getDate() - new Date(b.dataNascimento+"T00:00:00").getDate());
}
function rhCustoFolhaMensal(){
  return rhFuncionariosAtivos().reduce((s,f) => s + (Number(f.salario)||0), 0);
}

function viewRhFolha(){

  if(rhFolhaFiltro.status) lista = lista.filter(p=>p.status===rhFolhaFiltro.status);

        ${seModulo("rh","criar",`<button class="btn btn-primary" data-action="rh-nova-folha">+ Lançar pagamento</button>`)}
      </div>

      <div class="filter-bar">

        <select data-action="rh-filtro-folha-status"><option value="">Todos os status</option>${statusOpts}</select>

// ---- VIEW: ALERTAS DE RH ----
function viewRhAlertas(){
  const ativos = rhFuncionariosAtivos();
  const feriasAlertas = ativos
    .map(f => ({ f, v: rhProximoVencimentoFerias(f.id) }))
    .filter(x => x.v && x.v.diasRestantes <= 60)
    .sort((a,b) => a.v.diasRestantes - b.v.diasRestantes);
  const aniversariantes = rhAniversariantesDoMes();
  const feriasRows = feriasAlertas.map(({f,v}) => `<tr>
    <td style="font-weight:600; cursor:pointer; color:var(--accent);" data-action="rh-detalhe" data-id="${f.id}">${esc(f.nome)}</td>
    <td>${esc(f.negocio||"—")}</td>
    <td>${fmtDateBR(v.vencimento)}</td>
    <td class="num" style="font-weight:700; color:${v.diasRestantes<0?'var(--neg)':v.diasRestantes<=30?'var(--warn)':'inherit'};">${v.diasRestantes<0?`vencidas há ${Math.abs(v.diasRestantes)}d`:`${v.diasRestantes}d`}</td>
    <td><div class="row-actions"><button class="btn btn-primary btn-sm" data-action="rh-nova-ferias" data-id="${f.id}">+ Férias</button></div></td>
  </tr>`).join("");
  const aniversRows = aniversariantes.map(f => `<tr>
    <td style="font-weight:600; cursor:pointer; color:var(--accent);" data-action="rh-detalhe" data-id="${f.id}">🎂 ${esc(f.nome)}</td>
    <td>${esc(f.negocio||"—")}</td>
    <td>${fmtDateBR(f.dataNascimento)}</td>
  </tr>`).join("");
  return `
    <div class="page-header"><div><div class="page-title">🔔 Alertas de RH</div><div class="page-sub">Férias vencendo e aniversariantes do mês</div></div></div>
    <div class="panel">
      <div class="panel-head"><div class="panel-title">🏖️ Férias vencendo/vencidas — ${feriasAlertas.length} alerta(s)</div></div>
      <div class="panel-body">${feriasAlertas.length ? `<table><thead><tr><th>Funcionário</th><th>Negócio</th><th>Vencimento</th><th class="num">Prazo</th><th></th></tr></thead><tbody>${feriasRows}</tbody></table>` : emptyState("Ninguém com férias vencendo. ✓")}</div>
    </div>
    <div class="panel">
      <div class="panel-head"><div class="panel-title">🎂 Aniversariantes do mês</div></div>
      <div class="panel-body">${aniversariantes.length ? `<table><thead><tr><th>Funcionário</th><th>Negócio</th><th>Data</th></tr></thead><tbody>${aniversRows}</tbody></table>` : emptyState("Ninguém faz aniversário este mês.")}</div>
    </div>
  `;
}

// ---- Helpers de estoque ----
function estProdutoById(id){ return state.estProdutos.find(p => p.id === id); }
function estFornecedorById(id){ return state.estFornecedores.find(f => f.id === id); }
function estSaldoAtual(produtoId){
  // "Ajuste" SOBRESCREVE o saldo (não soma/subtrai) — por isso a ordem importa
  // de verdade aqui: precisa processar em ordem cronológica (por data), senão
  // um ajuste antigo pode "vencer" e apagar o efeito de entradas/saídas mais
  // recentes só por causa da ordem em que o Supabase devolveu as linhas (a
  // consulta não tem ORDER BY — a ordem natural NÃO é garantida ser por data).
  let saldo = 0;
  const movs = state.estMovimentos
    .filter(m => m.produtoId === produtoId)
    .sort((a,b) => (a.data||"").localeCompare(b.data||"") || (a.id||"").localeCompare(b.id||""));
  for(const m of movs){
    if(m.tipo === "Entrada" || m.tipo === "Devolução") saldo += Number(m.qtd);
    if(m.tipo === "Saída") saldo -= Number(m.qtd);
    if(m.tipo === "Ajuste") saldo = Number(m.qtdFinal) || 0;
    if(m.tipo === "Transferência" && m.localDestino) {} // apenas muda local, qtd total igual
  }
  return saldo;
}
function estStatusBadge(saldo, minimo){
  const pct = minimo > 0 ? saldo / minimo : 1;
  if(saldo <= 0) return `<span class="status-pill" style="background:#FEE2E2; color:#DC2626;">Zerado</span>`;
  if(pct <= 1)   return `<span class="status-pill status-pendente">Baixo (${saldo})</span>`;
  return `<span class="status-pill status-pago">${saldo} ${estProdutoById}</span>`;
}

// ---- Compras / Custo Médio Real ----
function estCompraById(id){ return state.estCompras.find(c => c.id === id); }
function ratearProporcional(totalRatear, pesos){
  // Distribui 'totalRatear' (em reais) proporcionalmente aos 'pesos' (um número por
  // item — valor da linha ou peso×qtd, dependendo da base escolhida), sem perder
  // centavo de arredondamento: o último item com peso > 0 absorve a sobra.
  const totalCentavos = Math.round(Number(totalRatear) * 100);
  const somaPesos = pesos.reduce((s,p) => s + (Number(p)||0), 0);
  if(somaPesos <= 0) return pesos.map(() => 0);
  const resultado = pesos.map(p => Math.floor(totalCentavos * (Number(p)||0) / somaPesos));
  let resto = totalCentavos - resultado.reduce((s,v)=>s+v, 0);
  for(let i = pesos.length - 1; i >= 0 && resto !== 0; i--){
    if(Number(pesos[i]) > 0){ resultado[i] += resto; resto = 0; }
  }
  return resultado.map(c => Math.round(c) / 100);
}
function estCustoMedio(produtoId){
  // Custo médio ponderado, calculado só a partir de entradas que vieram de uma
  // compra (têm custoUnitario registrado, já com o rateio de frete embutido) —
  // ajustes manuais, devoluções e entradas sem nota não entram na média.
  let qtdTotal = 0, custoTotal = 0;
  for(const m of state.estMovimentos){
    if(m.produtoId !== produtoId || m.tipo !== "Entrada") continue;
    if(m.custoUnitario === undefined || m.custoUnitario === null || m.custoUnitario === "") continue;
    const qtd = Number(m.qtd) || 0;
    qtdTotal += qtd;
    custoTotal += qtd * Number(m.custoUnitario);
  }
  return qtdTotal > 0 ? custoTotal / qtdTotal : null;
}
function estValorUnitarioEstimado(produto){
  // Prioriza o Custo Médio Real (vindo de compras lançadas); sem histórico de
  // compra ainda, cai no preço unitário manual do cadastro do produto.
  const custoMedio = estCustoMedio(produto.id);
  return custoMedio !== null ? custoMedio : (Number(produto.precoUnitario) || 0);
}
// Card de KPI clicável do Dashboard de Estoque — leva direto pra tela que
// explica aquele número (mesma ideia do vgKpiCard do financeiro).
function estKpiClicavel(label, value, note, cor, view, valueStyle){
  const corMap = { pos: "var(--pos)", neg: "var(--neg)", warn: "var(--warn)" };
  const corStyle = corMap[cor] ? `color:${corMap[cor]};` : "";
  return `<div class="kpi-card" data-action="cad-ver-lista" data-modulo="estoque" data-view="${view}" style="cursor:pointer; transition:border-color .12s;" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'" title="Ir para a lista">
    <div class="kpi-label">${esc(label)}</div>
    <div class="kpi-value" style="${valueStyle||""}${corStyle}">${value}</div>
    ${note?`<div class="kpi-note">${esc(note)}</div>`:""}
  </div>`;
}

let estFiltroCategoria = "", estFiltroTexto = "";
function viewEstProdutos(){
  let lista = [...state.estProdutos];
  if(estFiltroCategoria) lista = lista.filter(p => p.categoria === estFiltroCategoria);

  lista.sort((a,b) => a.categoria.localeCompare(b.categoria) || a.nome.localeCompare(b.nome));

  const rows = lista.map(p => {
    const saldo = estSaldoAtual(p.id);
    const minimo = Number(p.estoqueMinimo||0);
    const corSaldo = saldo <= 0 ? "var(--neg)" : saldo <= minimo ? "var(--warn)" : "var(--pos)";
    const fornecedor = estFornecedorById(p.fornecedorId);

// ---- VIEW: MOVIMENTAÇÕES ----
let estMovFiltro = { tipo:"", produto:"", dataDe:"", dataAte:"" };
function viewEstMovimentos(){
  let lista = [...state.estMovimentos].sort((a,b) => b.data.localeCompare(a.data)||b.id.localeCompare(a.id));
  if(estMovFiltro.tipo) lista = lista.filter(m => m.tipo === estMovFiltro.tipo);
  if(estMovFiltro.produto) lista = lista.filter(m => m.produtoId === estMovFiltro.produto);
  if(estMovFiltro.dataDe) lista = lista.filter(m => m.data >= estMovFiltro.dataDe);
  if(estMovFiltro.dataAte) lista = lista.filter(m => m.data <= estMovFiltro.dataAte);

  const rows = lista.map(m => {
    const prod = estProdutoById(m.produtoId);
    const sinal = (m.tipo==="Entrada"||m.tipo==="Devolução") ? "+" : m.tipo==="Saída" ? "−" : "~";
    const cor = (m.tipo==="Entrada"||m.tipo==="Devolução") ? "var(--pos)" : m.tipo==="Saída" ? "var(--neg)" : "var(--ink-3)";
    return `<tr>
      ${bulkCheckboxCellHTML("est_movimentos", m.id)}
      <td style="white-space:nowrap;">${fmtDateBR(m.data)}</td>
      <td><span style="color:${cor}; font-weight:600;">${esc(m.tipo)}</span></td>
      <td>${esc(prod?.nome||"—")}<div style="font-size:11px;color:var(--ink-4);">${esc(prod?.categoria||"")}</div></td>
      <td class="num" style="font-weight:700; color:${cor};">${sinal} ${m.qtd} ${esc(prod?.unidade||"un")}</td>
      <td style="color:var(--ink-3);">${esc(m.localOrigem||"—")} ${m.localDestino?`→ ${esc(m.localDestino)}`:""}</td>
      <td>${esc(m.motivo||"—")}</td>
      <td style="color:var(--ink-3); font-size:11.5px;">${esc(m.responsavel||"—")}</td>
      <td>${esc(m.notaFiscal||"—")}</td>
      <td><div class="row-actions"><button class="icon-btn danger" data-action="est-del-mov" data-id="${m.id}" title="Remover">🗑</button></div></td>

  const tipoOpts = EST_MOV_TIPOS.map(t => `<option value="${t}" ${estMovFiltro.tipo===t?"selected":""}>${t}</option>`).join("");
  const prodOpts = state.estProdutos.map(p => `<option value="${p.id}" ${estMovFiltro.produto===p.id?"selected":""}>${esc(p.nome)}</option>`).join("");
  const temFiltro = estMovFiltro.tipo||estMovFiltro.produto||estMovFiltro.dataDe||estMovFiltro.dataAte;

    <div class="page-header">
      <div><div class="page-title">Movimentações</div><div class="page-sub">Entradas, saídas, transferências e ajustes de estoque</div></div>
      <div style="display:flex; gap:8px;">${bulkBarraAcoesHTML("est_movimentos")}${seModulo("estoque","criar",`<button class="btn btn-primary" data-action="est-nova-movimentacao">+ Nova movimentação</button>`)}</div>
    </div>
    <div class="panel">
      <div class="filter-bar">
        <select data-action="est-movfiltro-tipo"><option value="">Todos os tipos</option>${tipoOpts}</select>
        <select data-action="est-movfiltro-produto"><option value="">Todos os produtos</option>${prodOpts}</select>
        <span style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-3);">De <input type="date" data-action="est-movfiltro-de" value="${estMovFiltro.dataDe}"> até <input type="date" data-action="est-movfiltro-ate" value="${estMovFiltro.dataAte}"></span>
        ${temFiltro?`<button class="btn btn-ghost btn-sm" data-action="est-movfiltro-clear">Limpar</button>`:""}

        <div class="field"><label>Modelo</label><input type="text" name="modelo" value="${esc(p.modelo)}" placeholder="Ex: HG8145V5"></div>
        <div class="field"><label>Fabricante</label><input type="text" name="fabricante" value="${esc(p.fabricante)}" placeholder="Ex: Huawei"></div>

      </div>
      <div class="field"><label>Preço estimado (R$)</label><input type="number" step="0.01" min="0" name="precoUnitario" value="${p.precoUnitario}" placeholder="0,00">
        <div class="field-help">Só usado pra estimar valor em estoque até a primeira compra ser lançada — depois disso o Custo Médio Real (calculado nas Compras) assume.</div>
      </div>
      <div class="field"><label>Localização no estoque</label><input type="text" name="localizacao" value="${esc(p.localizacao)}" placeholder="Ex: Prateleira A3, Sala técnica"></div>

    e.preventDefault();
    const fd = new FormData(e.target);
    const data = {

      categoria: fd.get("categoria"), unidade: fd.get("unidade"),

function modalEstMovimentacao(presetProdutoId, presetTipo){
  const prodOptions = state.estProdutos.map(p => `<option value="${p.id}" ${presetProdutoId===p.id?"selected":""}>${esc(p.nome)} — saldo: ${estSaldoAtual(p.id)} ${esc(p.unidade||"un")}</option>`).join("");
  const tipoOptions = EST_MOV_TIPOS.map(t => `<option value="${t}" ${presetTipo===t?"selected":""}>${t}</option>`).join("");
  openModal(`
    <div class="modal-head"><div class="modal-title">↕ Nova movimentação de estoque</div><button class="modal-close" data-action="close-modal">✕</button></div>
    <form id="formEstMov"><div class="modal-body">
      <div class="field-row">
        <div class="field"><label>Data *</label><input required type="date" name="data" value="${todayISO()}"></div>
        <div class="field"><label>Tipo *</label><select name="tipo" id="estMovTipo">${tipoOptions}</select></div>
      </div>
      <div class="field"><label>Produto *</label><select required name="produtoId">${prodOptions||'<option value="">— Cadastre um produto primeiro —</option>'}</select></div>
      <div class="field-row">
        <div class="field"><label>Quantidade *</label><input required type="number" min="1" step="1" name="qtd" placeholder="1">
          <div class="field-help" id="estMovQtdHelp"></div>
        </div>
        <div class="field" id="estMovQtdFinalWrap" style="display:none;"><label>Saldo final (ajuste)</label><input type="number" min="0" step="1" name="qtdFinal" placeholder="Saldo correto"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Local de origem</label><input type="text" name="localOrigem" placeholder="Ex: Almoxarifado"></div>
        <div class="field" id="estMovDestinoWrap"><label>Local de destino</label><input type="text" name="localDestino" placeholder="Ex: Técnico João"></div>
      </div>
      <div class="field"><label>Motivo / Descrição</label><input type="text" name="motivo" placeholder="Ex: Instalação cliente, Compra NF 123, Perda"></div>
      <div class="field-row">
        <div class="field"><label>Responsável</label><input type="text" name="responsavel" value="${state.perfilAtivo?state.perfilAtivo.nome:'Master'}" placeholder="Nome"></div>
        <div class="field"><label>Nota Fiscal</label><input type="text" name="notaFiscal" placeholder="Nº da NF (opcional)"></div>
      </div>
    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Registrar</button></div></form>
  `);
  document.getElementById("estMovTipo").addEventListener("change", e => {
    const isAjuste = e.target.value === "Ajuste";
    const isTransf = e.target.value === "Transferência";
    document.getElementById("estMovQtdFinalWrap").style.display = isAjuste ? "block" : "none";
    document.getElementById("estMovDestinoWrap").style.display = isTransf ? "block" : "none";
  });
  document.getElementById("formEstMov").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    if(!fd.get("produtoId")){ showToast("Selecione um produto.", "error"); return; }
    // OBS: "||undefined" quebraria um Ajuste pra saldo 0 (0||undefined vira
    // undefined, porque 0 é falsy em JS) — "zerar estoque" é um caso real e
    // comum, não pode virar NaN. Por isso checa NaN explicitamente.
    const qtdFinalNum = parseInt(fd.get("qtdFinal"));
    const mov = {
      id: uid("em"), data: fd.get("data"), tipo: fd.get("tipo"),
      produtoId: fd.get("produtoId"), qtd: parseInt(fd.get("qtd"))||0,
      qtdFinal: Number.isNaN(qtdFinalNum) ? undefined : qtdFinalNum,
      localOrigem: fd.get("localOrigem").trim(), localDestino: fd.get("localDestino").trim(),
      motivo: fd.get("motivo").trim(), responsavel: fd.get("responsavel").trim(),
      notaFiscal: fd.get("notaFiscal").trim(),
    };
    state.estMovimentos.push(mov);
    await saveEstMovimentos(); closeModal(); renderView();
    showToast("Movimentação registrada.");
  });
}

========================================================================= */
function modalEstCompra(){
  const fornOptions = state.estFornecedores.map(f=>`<option value="${f.id}">${esc(f.nome)}</option>`).join("");
  const negOptions = state.negocios.map(n=>`<option value="${esc(n.nome)}">${esc(n.nome)}</option>`).join("");
  const produtoOptionsHTML = () => `<option value="">— Selecione —</option>` + state.estProdutos.map(p=>`<option value="${p.id}">${esc(p.nome)}${p.peso?` (${p.peso}kg)`:""}</option>`).join("");
  const linhaItemHTML = () => `
    <tr>
      <td style="min-width:200px;"><select class="compra-item-produto">${produtoOptionsHTML()}</select></td>
      <td style="width:90px;"><input type="number" min="0.001" step="0.001" class="compra-item-qtd" value="1"></td>
      <td style="width:120px;"><input type="number" min="0" step="0.01" class="compra-item-valor" value="0"></td>
      <td class="num compra-item-total" style="width:100px;">${fmtBRL(0)}</td>
      <td class="num compra-item-rateio" style="width:100px; color:var(--ink-3);">—</td>
      <td class="num compra-item-custofinal" style="width:110px; font-weight:700;">—</td>
      <td><button type="button" class="icon-btn danger compra-item-del" title="Remover item">🗑</button></td>
    </tr>`;

  if(!state.estFornecedores.length){ showToast("Cadastre um fornecedor primeiro.", "error"); return; }
  if(!state.estProdutos.length){ showToast("Cadastre ao menos um produto primeiro.", "error"); return; }

  openModal(`
    <div class="modal-head"><div class="modal-title">📄 Nova compra — Nota Fiscal</div><button class="modal-close" data-action="close-modal">✕</button></div>
    <form id="formEstCompra"><div class="modal-body">
      <div class="field-row">
        <div class="field"><label>Número da nota *</label><input required type="text" name="numeroNota" placeholder="Ex: 12345"></div>
        <div class="field"><label>Fornecedor *</label><select required name="fornecedorId">${fornOptions}</select></div>
        <div class="field"><label>Data *</label><input required type="date" name="data" value="${todayISO()}"></div>
      </div>
      <div class="field"><label>Negócio</label><select name="negocio"><option value="">— Estoque compartilhado —</option>${negOptions}</select></div>

      <div class="field-help" style="margin:10px 0 6px; font-weight:600; color:var(--ink-2);">Itens da nota</div>
      <div style="overflow-x:auto; border:1px solid var(--border); border-radius:var(--r);">
        <table style="min-width:680px;"><thead><tr>
          <th>Produto</th><th class="num">Qtd</th><th class="num">Valor unit.</th><th class="num">Total</th><th class="num">Rateio</th><th class="num">Custo final</th><th></th>
        </tr></thead><tbody id="compraItensBody">${linhaItemHTML()}</tbody></table>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="btnAddItemCompra" style="margin-top:8px;">+ Adicionar item</button>

      <div class="field-help" style="margin:14px 0 6px; font-weight:600; color:var(--ink-2);">Despesas acessórias (rateadas entre os itens)</div>
      <div class="field-row">
        <div class="field"><label>Frete (R$)</label><input type="number" min="0" step="0.01" name="frete" id="compraFrete" value="0"></div>
        <div class="field"><label>Seguro (R$)</label><input type="number" min="0" step="0.01" name="seguro" id="compraSeguro" value="0"></div>
        <div class="field"><label>Outras despesas (R$)</label><input type="number" min="0" step="0.01" name="outrasDespesas" id="compraOutras" value="0"></div>
      </div>
      <div class="field"><label>Ratear por</label><select name="baseRateio" id="compraBaseRateio">${EST_BASE_RATEIO.map(o=>`<option value="${o.v}">${o.l}</option>`).join("")}</select>
        <div class="field-help">Por peso só funciona se os produtos tiverem peso cadastrado — item sem peso cai automaticamente pro rateio por valor.</div>
      </div>

      <div style="display:flex; justify-content:space-between; padding:10px 0; border-top:2px solid var(--border); margin-top:10px;">
        <strong>Total da nota</strong>
        <strong id="compraTotalNota" style="font-family:var(--font-mono); font-size:15px;">${fmtBRL(0)}</strong>
      </div>
      <div class="field"><label>Observações</label><input type="text" name="observacoes"></div>
      <div class="field-help">Depois de lançada, a compra não pode ser editada (os itens já viram entrada de estoque com custo fechado) — só excluída e relançada, se precisar corrigir.</div>
    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Lançar compra</button></div></form>
  `);

  const tbody = document.getElementById("compraItensBody");
  function coletarItens(){
    return Array.from(tbody.querySelectorAll("tr")).map(tr => ({
      produtoId: tr.querySelector(".compra-item-produto").value,
      quantidade: parseFloat(tr.querySelector(".compra-item-qtd").value) || 0,
      valorUnitario: parseFloat(tr.querySelector(".compra-item-valor").value) || 0,
      tr,
    }));
  }
  function calcularRateio(itens){
    const frete = parseFloat(document.getElementById("compraFrete").value)||0;
    const seguro = parseFloat(document.getElementById("compraSeguro").value)||0;
    const outras = parseFloat(document.getElementById("compraOutras").value)||0;
    const totalDespesas = frete+seguro+outras;
    const baseRateio = document.getElementById("compraBaseRateio").value;
    const valoresTotais = itens.map(it => it.quantidade * it.valorUnitario);
    let pesos;
    const temPeso = itens.some(it => { const p = estProdutoById(it.produtoId); return p && Number(p.peso) > 0; });
    if(baseRateio === "peso" && temPeso){
      pesos = itens.map((it,i) => { const p = estProdutoById(it.produtoId); const peso = p ? Number(p.peso)||0 : 0; return peso > 0 ? peso*it.quantidade : valoresTotais[i]; });
    }else{
      pesos = valoresTotais;
    }
    const rateios = ratearProporcional(totalDespesas, pesos);
    return { valoresTotais, rateios, totalDespesas };
  }
  function recalcular(){
    const itens = coletarItens();
    const { valoresTotais, rateios, totalDespesas } = calcularRateio(itens);
    let somaItens = 0;
    itens.forEach((it, i) => {
      const valorTotal = valoresTotais[i];
      somaItens += valorTotal;
      const rateio = rateios[i] || 0;
      const custoFinalUnit = it.quantidade > 0 ? (valorTotal + rateio) / it.quantidade : 0;
      it.tr.querySelector(".compra-item-total").textContent = fmtBRL(valorTotal);
      it.tr.querySelector(".compra-item-rateio").textContent = fmtBRL(rateio);
      it.tr.querySelector(".compra-item-custofinal").textContent = fmtBRL(custoFinalUnit);
    });
    document.getElementById("compraTotalNota").textContent = fmtBRL(somaItens + totalDespesas);
  }
  tbody.addEventListener("input", recalcular);
  tbody.addEventListener("change", recalcular);
  tbody.addEventListener("click", e => {
    const delBtn = e.target.closest(".compra-item-del");
    if(!delBtn) return;
    if(tbody.querySelectorAll("tr").length <= 1){ showToast("A compra precisa de pelo menos 1 item.", "error"); return; }
    delBtn.closest("tr").remove();
    recalcular();
  });
  document.getElementById("btnAddItemCompra").addEventListener("click", () => {
    tbody.insertAdjacentHTML("beforeend", linhaItemHTML());
    recalcular();
  });
  ["compraFrete","compraSeguro","compraOutras","compraBaseRateio"].forEach(id => {
    document.getElementById(id).addEventListener("input", recalcular);
    document.getElementById(id).addEventListener("change", recalcular);
  });
  recalcular();

  document.getElementById("formEstCompra").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const itens = coletarItens();
    if(itens.some(it => !it.produtoId)){ showToast("Escolha o produto de cada item.", "error"); return; }
    if(itens.some(it => it.quantidade <= 0)){ showToast("Quantidade precisa ser maior que zero em todos os itens.", "error"); return; }
    const { valoresTotais, rateios } = calcularRateio(itens);
    const numeroNota = fd.get("numeroNota").trim();
    const data = fd.get("data");
    const fornecedorId = fd.get("fornecedorId");
    const compraId = uid("compra");
    const itensSalvos = itens.map((it,i) => {
      const valorTotal = valoresTotais[i];
      const rateio = rateios[i]||0;
      const custoUnitarioFinal = it.quantidade > 0 ? Math.round(((valorTotal+rateio)/it.quantidade)*100)/100 : 0;
      return { produtoId: it.produtoId, quantidade: it.quantidade, valorUnitario: it.valorUnitario, valorTotal, rateio, custoUnitarioFinal };
    });
    const compra = {
      id: compraId, numeroNota, fornecedorId, data, negocio: fd.get("negocio")||"",
      frete: parseFloat(fd.get("frete"))||0, seguro: parseFloat(fd.get("seguro"))||0, outrasDespesas: parseFloat(fd.get("outrasDespesas"))||0,
      baseRateio: fd.get("baseRateio"), itens: itensSalvos, observacoes: fd.get("observacoes").trim(),
      lancadoPor: state.perfilAtivo ? state.perfilAtivo.nome : "Master",
    };
    state.estCompras.push(compra);
    const fornecedor = estFornecedorById(fornecedorId);
    itensSalvos.forEach(it => {
      state.estMovimentos.push({
        id: uid("em"), data, tipo: "Entrada", produtoId: it.produtoId, qtd: it.quantidade,
        custoUnitario: it.custoUnitarioFinal,
        localOrigem: fornecedor ? fornecedor.nome : "", localDestino: "",
        motivo: `Compra NF ${numeroNota}`, responsavel: state.perfilAtivo ? state.perfilAtivo.nome : "Master",
        notaFiscal: numeroNota, notaFiscalCompraId: compraId,
      });
    });
    await saveEstCompras();
    await saveEstMovimentos();
    closeModal(); renderView();
    showToast(`Compra lançada — ${itensSalvos.length} item(ns), Custo Médio Real atualizado.`);
  });
}

          <div><strong>Motivo:</strong> ${esc(c.motivo||"—")}</div>
        </div>
        ${itensBaixados.length ? `<div style="margin-top:12px; font-size:12.5px; color:var(--ink-3);"><strong>Materiais já registrados:</strong> ${itensBaixados.map(m=>{const p=estProdutoById(m.produtoId); return `${esc(p?p.nome:"—")} (${m.qtd})`;}).join(", ")}</div>` : ""}
        ${c.observacoes ? `<div style="margin-top:12px; font-size:12px; color:var(--ink-3); white-space:pre-line; border-top:1px solid var(--border); padding-top:10px;"><strong>Histórico:</strong>\n${esc(c.observacoes)}</div>` : ""}
      </div></div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${podeIniciar ? `<button class="btn btn-primary" style="justify-content:center;" data-action="tec-app-iniciar" data-id="${c.id}">▶ Iniciar atendimento</button>` : ""}
        ${podeConcluir ? `<button class="btn btn-ghost" style="justify-content:center;" data-action="tec-app-materiais" data-id="${c.id}">📦 Registrar materiais usados</button>` : ""}
        ${podeConcluir ? `<button class="btn btn-primary" style="justify-content:center;" data-action="tec-app-concluir" data-id="${c.id}">✓ Concluir atendimento</button>` : ""}
        ${podeConcluir ? `<button class="btn btn-ghost" style="justify-content:center; color:var(--neg);" data-action="tec-app-prorrogar" data-id="${c.id}">⏸ Não consegui concluir</button>` : ""}
      </div>
    </div>
  `;
}

// ============================================================
// INIT — reage à sessão do Supabase
// ============================================================
async function init(){
  // onAuthStateChange dispara imediatamente com a sessão atual (vinda do localStorage
  // do navegador, se houver) assim que nos inscrevemos — não precisamos chamar
  // getSession() à parte, isso evitaria um carregamento duplicado.
  let carregouUmaVez = false;
  supabaseClient.auth.onAuthStateChange(async (_event, session) => {
    const jaLogado = !!state.user;
    state.user = session ? session.user : null;
    if(state.user && (!jaLogado || !carregouUmaVez)){
      carregouUmaVez = true;
      await carregarSessao();
      renderApp();
    }else if(!state.user){
      carregouUmaVez = false;
      state.modoTecnico = false; state.tecnicoAuthInfo = null;
      renderApp();
    }
  });
}
init();

// PWA: registra o service worker (deixa instalável + carrega mais rápido em
// visitas repetidas). Falha em silêncio se o navegador/hospedagem não suportar
// (ex: aberto via file://) — o app continua funcionando normal sem isso.
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
