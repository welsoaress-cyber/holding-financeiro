<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Holding — Painel Financeiro</title>
<!-- PWA: instalável na tela inicial, ícone e tela cheia sem barra do navegador -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F2045">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Holding">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://oss.sheetjs.com/sheetjs/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===== DESIGN SYSTEM — HOLDING ERP ===== */
  :root {
    /* Surface palette */
    --bg:          #F0F2F5;
    --surface:     #FFFFFF;
    --surface-2:   #F7F8FA;
    --border:      #E2E5EA;
    --border-2:    #C8CDD8;

    /* Ink */
    --ink:         #111827;
    --ink-2:       #374151;
    --ink-3:       #6B7280;
    --ink-4:       #9CA3AF;

    /* Brand — deep navy + electric teal accent */
    --brand:       #0F2045;
    --brand-2:     #162D5C;
    --brand-3:     #1E3A73;
    --accent:      #0EA5E9;
    --accent-dark: #0284C7;
    --accent-glow: rgba(14,165,233,.12);

    /* Status */
    --pos:         #059669;
    --pos-bg:      #ECFDF5;
    --neg:         #DC2626;
    --neg-bg:      #FEF2F2;
    --warn:        #D97706;
    --warn-bg:     #FFFBEB;
    --muted-bg:    #F3F4F6;
    --muted:       #6B7280;

    /* Typography */
    --font-ui:     'Inter', -apple-system, sans-serif;
    --font-mono:   'IBM Plex Mono', 'Fira Mono', monospace;
    --font-num:    'Inter', sans-serif;

    /* Spacing */
    --r-sm:  6px;
    --r:     8px;
    --r-lg:  12px;
    --r-xl:  16px;

    /* Shadow */
    --shadow-sm: 0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
    --shadow:    0 2px 8px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.05);
    --shadow-lg: 0 8px 24px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.06);
    --shadow-xl: 0 20px 48px rgba(0,0,0,.18), 0 4px 12px rgba(0,0,0,.08);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 13.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Module Bar ---- */
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  #appBody { display: flex; flex: 1; min-height: 0; }

  .modbar {
    background: var(--brand);
    height: 44px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 0;
    position: relative;
    z-index: 200;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  .modbar-logo {
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    letter-spacing: .02em;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-right: 20px;
    margin-right: 8px;
    border-right: 1px solid rgba(255,255,255,.1);
  }
  .modbar-logo .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
    box-shadow: 0 0 8px var(--accent);
  }
  .modbar-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 0 14px;
    height: 44px;
    color: rgba(255,255,255,.65);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    background: transparent;
    font-family: var(--font-ui);
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s, background .15s;
  }
  .modbar-btn:hover { color: #fff; background: rgba(255,255,255,.05); }
  .modbar-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  .modpanel {
    position: absolute;
    top: 44px; left: 0; right: 0;
    background: var(--brand-2);
    border-bottom: 1px solid rgba(255,255,255,.08);
    padding: 20px 24px 24px;
    display: none;
    z-index: 199;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
  }
  .modpanel.open { display: block; }
  .modpanel-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: rgba(255,255,255,.3);
    margin-bottom: 14px;
    font-weight: 600;
  }
  .modpanel-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .modcard {
    display: flex; flex-direction: column; gap: 3px;
    padding: 14px 18px;
    border-radius: var(--r-lg);
    cursor: pointer;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.04);
    transition: all .15s;
    min-width: 140px;
  }
  .modcard:hover { background: rgba(255,255,255,.1); border-color: rgba(14,165,233,.4); }
  .modcard.active { background: rgba(14,165,233,.12); border-color: rgba(14,165,233,.5); }
  .modcard.soon { opacity: .4; cursor: default; }
  .modcard.soon:hover { background: rgba(255,255,255,.04); border-color: rgba(255,255,255,.08); }
  .modcard-ico { font-size: 18px; line-height: 1; margin-bottom: 4px; }
  .modcard-nome { font-size: 13px; font-weight: 700; color: #E7EDF8; font-family: var(--font-ui); }
  .modcard-desc { font-size: 11px; color: rgba(255,255,255,.4); }

  /* ---- Sidebar ---- */
  .sidebar {
    width: 228px;
    flex-shrink: 0;
    background: var(--brand);
    color: rgba(255,255,255,.85);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    max-height: calc(100vh - 44px);
    position: sticky;
    top: 0;
    border-right: 1px solid rgba(255,255,255,.05);
  }
  .brand-sub {
    font-size: 10.5px;
    color: rgba(255,255,255,.3);
    padding: 14px 16px 10px;
    letter-spacing: .06em;
    text-transform: uppercase;
    font-weight: 600;
    border-bottom: 1px solid rgba(255,255,255,.06);
    margin-bottom: 6px;
  }
  .nav-group-label {
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: rgba(255,255,255,.28);
    padding: 14px 16px 4px;
    font-weight: 600;
  }
  .nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 12px 7px 14px;
    margin: 1px 8px;
    border-radius: var(--r);
    color: rgba(255,255,255,.65);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all .12s;
    user-select: none;
  }
  .nav-item:hover { background: rgba(255,255,255,.07); color: #fff; }
  .nav-item.active { background: rgba(14,165,233,.18); color: var(--accent); border-left: 2px solid var(--accent); padding-left: 12px; }
  .nav-item.active .nav-ico { color: var(--accent); }
  .nav-item.disabled { color: rgba(255,255,255,.22); cursor: default; }
  .nav-item.disabled:hover { background: transparent; }
  .nav-ico { font-size: 13px; width: 16px; text-align: center; flex-shrink: 0; }
  .soon-badge {
    font-size: 9px; font-family: var(--font-mono);
    background: rgba(255,255,255,.06);
    color: rgba(255,255,255,.25);
    padding: 2px 6px;
    border-radius: 999px;
  }
  .sidebar-footer {
    margin-top: auto;
    padding: 12px 10px 10px;
    border-top: 1px solid rgba(255,255,255,.07);
  }
  .sidebar-lock-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 8px 10px; border-radius: var(--r);
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.04);
    color: rgba(255,255,255,.6);
    font-size: 12px; font-weight: 500;
    cursor: pointer; margin-bottom: 6px;
    font-family: var(--font-ui);
    transition: all .12s;
  }
  .sidebar-lock-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
  .sidebar-lock-btn.unlocked { background: rgba(14,165,233,.12); border-color: rgba(14,165,233,.3); color: var(--accent); }
  .btn-logout:hover { background: rgba(220,38,38,.15) !important; border-color: rgba(220,38,38,.3) !important; color: #FCA5A5 !important; }
  .footer-detail { font-size: 10.5px; color: rgba(255,255,255,.25); padding: 6px 4px 0; line-height: 1.6; }

  /* ---- Main content area ---- */
  .main { flex: 1; min-width: 0; padding: 24px 28px 60px; overflow-x: hidden; }
  .page-header {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .page-title { font-size: 20px; font-weight: 700; color: var(--ink); letter-spacing: -.02em; }
  .page-sub { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }

  /* ---- Buttons ---- */
  .btn {
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 12.5px;
    padding: 7px 14px;
    border-radius: var(--r);
    border: 1px solid transparent;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .12s;
    white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent-dark); }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-ghost { background: #fff; color: var(--ink-2); border-color: var(--border-2); box-shadow: var(--shadow-sm); }
  .btn-ghost:hover { background: var(--surface-2); border-color: var(--border-2); }
  .btn-danger-text { background: transparent; color: var(--neg); border: none; padding: 4px 8px; font-size: 12px; }
  .btn-sm { padding: 5px 10px; font-size: 11.5px; }

  /* ---- KPI Cards ---- */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  /* ---- Duas colunas de PAINÉIS lado a lado (não cartõezinhos de KPI) ----
     Diferente de .kpi-grid (que é fixado em 2 colunas no mobile de
     propósito, pra cartão pequeno) — aqui cada lado é um painel completo
     (tabela, lista, cards internos), então no mobile precisa empilhar em
     1 coluna, senão o conteúdo fica espremido demais e corta. */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
  }
  .kpi-label {
    font-size: 10.5px; color: var(--ink-3);
    text-transform: uppercase; letter-spacing: .06em;
    margin-bottom: 6px; font-weight: 600;
  }
  .kpi-value { font-family: var(--font-num); font-size: 21px; font-weight: 700; letter-spacing: -.02em; color: var(--ink); }
  .kpi-value.pos { color: var(--pos); }
  .kpi-value.neg { color: var(--neg); }
  .kpi-note { font-size: 11px; color: var(--ink-4); margin-top: 4px; }

  /* ---- Panels ---- */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    margin-bottom: 16px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .panel-title { font-size: 13px; font-weight: 700; color: var(--ink); letter-spacing: -.01em; }
  .panel-body { padding: 0 18px 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* ---- Tables ---- */
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 600px; }
  thead th {
    text-align: left;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink-3);
    font-weight: 600;
    padding: 10px 10px 8px;
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
    background: var(--surface);
  }
  tbody td { padding: 9px 10px; border-bottom: 1px solid #F0F2F5; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #F7F9FC; }
  td.num, th.num { text-align: right; font-family: var(--font-mono); font-size: 12px; }

  /* ---- Tags & Status ---- */
  .tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; padding: 2px 8px;
    border-radius: 999px;
  }
  .tag-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .status-pill { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .status-pago { background: var(--pos-bg); color: var(--pos); }
  .status-pendente { background: var(--warn-bg); color: var(--warn); }
  .status-agendado { background: var(--muted-bg); color: var(--muted); }
  .conc-yes { color: var(--pos); font-weight: 600; font-size: 11.5px; }
  .conc-no { color: var(--ink-4); font-size: 11.5px; }

  /* ---- Actions ---- */
  .row-actions { display: flex; gap: 2px; justify-content: flex-end; }
  .icon-btn {
    border: none; background: transparent; cursor: pointer;
    padding: 4px 6px; border-radius: var(--r-sm); color: var(--ink-4);
    font-size: 12.5px; transition: all .1s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink-2); }
  .icon-btn.danger:hover { background: var(--neg-bg); color: var(--neg); }

  /* ---- Filter bar ---- */
  .filter-bar {
    display: flex; gap: 8px; flex-wrap: wrap;
    padding: 12px 18px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .filter-bar select, .filter-bar input[type=date], .filter-bar input[type=text] {
    font-family: var(--font-ui); font-size: 12px; padding: 6px 10px;
    border-radius: var(--r); border: 1px solid var(--border-2);
    background: var(--surface); color: var(--ink);
    box-shadow: var(--shadow-sm);
  }
  .filter-bar select:focus, .filter-bar input:focus {
    outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent;
  }

  /* ---- Modals ---- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(11,20,45,.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 500; padding: 20px;
    backdrop-filter: blur(2px);
  }
  .modal {
    background: var(--surface); border-radius: var(--r-xl);
    width: 500px; max-width: 94vw; max-height: 88vh; overflow-y: auto;
    box-shadow: var(--shadow-xl);
    border: 1px solid var(--border);
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
    border-radius: var(--r-xl) var(--r-xl) 0 0;
  }
  .modal-title { font-size: 15px; font-weight: 700; color: var(--ink); }
  .modal-close { border: none; background: transparent; font-size: 16px; cursor: pointer; color: var(--ink-4); padding: 2px 6px; border-radius: var(--r-sm); transition: all .1s; }
  .modal-close:hover { background: var(--neg-bg); color: var(--neg); }
  .modal-body { padding: 18px 20px; }
  .modal-foot {
    display: flex; justify-content: flex-end; gap: 8px;
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface-2);
    border-radius: 0 0 var(--r-xl) var(--r-xl);
  }

  /* ---- Form fields ---- */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; letter-spacing: .01em; }
  .field input, .field select, .field textarea {
    width: 100%; font-family: var(--font-ui); font-size: 13px;
    padding: 8px 11px; border-radius: var(--r);
    border: 1px solid var(--border-2);
    background: var(--surface); color: var(--ink);
    transition: border-color .12s, box-shadow .12s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .checkbox-row input { width: auto; }
  .field-help { font-size: 11px; color: var(--ink-4); margin-top: 4px; line-height: 1.5; }

  /* ---- Charts ---- */
  .bar-row { display: grid; grid-template-columns: 160px 1fr 110px; align-items: center; gap: 12px; padding: 8px 0; }
  .bar-track { height: 6px; border-radius: 999px; background: var(--muted-bg); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width .3s ease; }
  .bar-row .val { font-family: var(--font-mono); font-size: 12px; text-align: right; color: var(--ink-2); }

  /* ---- Toast ---- */
  .toast-wrap { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 999; }
  .toast {
    background: var(--ink); color: #fff; padding: 10px 16px;
    border-radius: var(--r-lg); font-size: 12.5px;
    box-shadow: var(--shadow-lg); animation: toast-in .18s ease-out;
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    max-width: 360px;
  }
  .toast.error { background: var(--neg); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .empty-state { padding: 36px 20px; text-align: center; color: var(--ink-4); font-size: 13px; }
  .loading-screen { display: flex; align-items: center; justify-content: center; height: 100vh; width: 100%; color: var(--ink-4); font-family: var(--font-mono); font-size: 13px; }
  .masked-value { color: var(--ink-4); letter-spacing: 2px; }

  /* ---- Responsive ---- */



/* =============================================================
   RESPONSIVE — Mobile-first (320px+), Tablet (600px+), Desktop (900px+)
   Abordagem: sidebar como drawer no mobile, colapsada no tablet
============================================================= */

/* ---- Overlay do drawer (mobile) ---- */
.sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 149;
}
.sidebar-overlay.open { display: block; }

/* ---- Hamburguer ---- */
.mob-topbar {
  display: none;
  align-items: center;
  gap: 10px;
  background: var(--brand);
  padding: 0 14px;
  height: 48px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(255,255,255,.07);
  position: sticky; top: 0; z-index: 140;
}
.mob-menu-btn {
  background: none; border: none; cursor: pointer;
  display: flex; flex-direction: column; gap: 4px; padding: 6px;
}
.mob-menu-btn span {
  display: block; width: 20px; height: 2px;
  background: rgba(255,255,255,.8); border-radius: 2px;
  transition: all .2s;
}
.mob-logo {
  font-weight: 700; font-size: 14px; color: #fff; letter-spacing: .02em;
  display: flex; align-items: center; gap: 7px;
}
.mob-logo .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }

/* ---- Tablet: 600-899px — sidebar collapse icons ---- */
@media (max-width: 899px) and (min-width: 600px) {
  .modbar { display: none; }
  .mob-topbar { display: flex; }
  #app { flex-direction: column; }
  #appBody { flex: 1; flex-direction: column; }
  .sidebar {
    position: fixed; top: 0; left: -240px; height: 100vh;
    width: 228px; z-index: 150;
    transition: left .22s cubic-bezier(.4,0,.2,1);
    max-height: 100vh;
  }
  .sidebar.open { left: 0; box-shadow: 4px 0 24px rgba(0,0,0,.35); }
  .main { padding: 16px 16px 60px; }
  .modal { width: 90vw; }
  .page-header { flex-direction: column; align-items: flex-start; gap: 10px; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr) !important; }
  table { min-width: 500px; }
  .field-row { flex-direction: column; gap: 0; }
}

/* ---- Mobile: até 599px — full drawer + layout compacto ---- */
@media (max-width: 599px) {
  .modbar { display: none; }
  .mob-topbar { display: flex; }
  #app { flex-direction: column; }
  #appBody { flex: 1; flex-direction: column; }

  /* Sidebar como drawer full-height */
  .sidebar {
    position: fixed; top: 0; left: -100vw; height: 100vh;
    width: min(280px, 85vw); z-index: 150;
    transition: left .22s cubic-bezier(.4,0,.2,1);
    max-height: 100vh; overflow-y: auto;
    box-shadow: none;
  }
  .sidebar.open { left: 0; box-shadow: 4px 0 32px rgba(0,0,0,.4); }

  /* Main area */
  .main { padding: 12px 12px 80px; min-width: 0; }
  .page-header {
    flex-direction: column; align-items: flex-start;
    gap: 10px; padding-bottom: 12px;
  }

const MODULOS_GRANULARES = ["estoque","clientes","rh"];
function modulosPadrao(){
  return {
    estoque:  { ver:true,  criar:true,  editar:true,  excluir:true  },
    clientes: { ver:true,  criar:true,  editar:true,  excluir:true  },

  const perm = (state.perfilAtivo.modulos || {})[moduloId] || modulosPadrao()[moduloId];

function dividirValor(total, qtd){
  const totalCentavos = Math.round(Number(total) * 100);
  const baseCentavos = Math.floor(totalCentavos / qtd);
  const resto = totalCentavos - (baseCentavos * qtd);
  const valores = [];
  for(let i=0;i<qtd;i++){
    let c = baseCentavos;
    if(i === qtd - 1) c += resto; // ultima parcela absorve a sobra de arredondamento
    valores.push(Math.round(c) / 100);
  }
  return valores;
}
const MESES_POR_FREQUENCIA = { "Mensal":1, "Bimestral":2, "Trimestral":3, "Semestral":6, "Anual":12 };
function proximaData(dataISO, freq){
  const d = new Date(dataISO + "T00:00:00");
  if(freq === "Semanal"){ d.setDate(d.getDate() + 7); return d.toISOString().slice(0,10); }
  if(freq === "Quinzenal"){ d.setDate(d.getDate() + 15); return d.toISOString().slice(0,10); }
  const meses = MESES_POR_FREQUENCIA[freq] || 1;
  const dia = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + meses);
  const diasNoMes = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(dia, diasNoMes));
  return d.toISOString().slice(0,10);
}
function calcularVencimento(dataCompraISO, cartao){
  const d = new Date(dataCompraISO + 'T00:00:00');
  const diaCompra = d.getDate();
  let anoFech = d.getFullYear(), mesFech = d.getMonth();
  if(diaCompra > cartao.diaFechamento){ mesFech += 1; if(mesFech > 11){ mesFech = 0; anoFech += 1; } }
  let anoVenc = anoFech, mesVenc = mesFech;
  if(cartao.diaVencimento < cartao.diaFechamento){ mesVenc += 1; if(mesVenc > 11){ mesVenc = 0; anoVenc += 1; } }
  const diasNoMes = new Date(anoVenc, mesVenc + 1, 0).getDate();
  const diaVenc = Math.min(cartao.diaVencimento, diasNoMes);
  return new Date(anoVenc, mesVenc, diaVenc).toISOString().slice(0,10);
}
function faturaEmAberto(cartaoId){
  return state.lancamentos.filter(l => l.cartaoId === cartaoId && l.status !== 'Pago').reduce((s,l) => s + Number(l.valor), 0);
}
function faturasAgrupadas(cartaoId){
  const grupos = {};
  state.lancamentos.filter(l => l.cartaoId === cartaoId && l.status !== 'Pago').forEach(l => {
    if(!grupos[l.data]) grupos[l.data] = { data: l.data, total: 0, itens: [] };
    grupos[l.data].total += Number(l.valor);
    grupos[l.data].itens.push(l);
  });
  return Object.values(grupos).sort((a,b) => a.data.localeCompare(b.data));
}
function autoBaixarAgendados(){
  // "Agendado" = debito/credito automatico agendado no banco: quando a data chega, vira "Pago" sozinho.
  // "Provisionado" fica parado ate baixa manual (botao 💲). Inativados sao ignorados.
  const hojeISO = todayISO();
  let alterou = [];
  for(const l of state.lancamentos){
    if(l.inativo) continue;
    if(l.status === "Agendado" && l.data <= hojeISO && l.tipo !== "Transferência"){
      l.status = "Pago";
      l.conciliado = true;
      alterou.push(l);
    }
  }
  return alterou;
}

function attachCalculadora(inputId){
  const input = document.getElementById("campo_" + inputId);
  if(!input || input.dataset.calcAttached) return;
  input.dataset.calcAttached = "1";
  const wrap = document.createElement("div");
  wrap.style.position = "relative";
  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);
  input.style.paddingRight = "36px";
  input.style.width = "100%";
  input.style.boxSizing = "border-box";
  const btn = document.createElement("button");
  btn.type = "button";
  btn.title = "Calculadora";
  btn.textContent = "🧮";
  btn.style.cssText = "position:absolute; right:2px; top:50%; transform:translateY(-50%); border:none; background:transparent; cursor:pointer; font-size:15px; padding:6px 8px; border-radius:var(--r-sm);";
  wrap.appendChild(btn);
  const pop = document.createElement("div");
  pop.style.cssText = "display:none; position:absolute; z-index:80; top:100%; right:0; margin-top:6px; background:#fff; border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:0 10px 28px rgba(0,0,0,.18); padding:10px; width:206px;";
  const displayId = "calcDisplay_" + inputId;
  pop.innerHTML = `
    <input type="text" readonly id="${displayId}" value="0" style="width:100%; box-sizing:border-box; text-align:right; font-family:var(--font-mono); font-size:16px; padding:8px; border:1px solid var(--border); border-radius:var(--r-sm); margin-bottom:8px;">
    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:5px;">
      ${["7","8","9","÷","4","5","6","×","1","2","3","−","C","0",".","+"].map(k=>`<button type="button" data-k="${k}" style="padding:9px 0; border:1px solid var(--border); border-radius:var(--r-sm); background:var(--surface-2); cursor:pointer; font-size:13px; font-family:var(--font-mono);">${k}</button>`).join("")}
      <button type="button" data-k="=" style="grid-column:span 4; padding:9px 0; border:none; border-radius:var(--r-sm); background:var(--accent); color:#fff; cursor:pointer; font-weight:600; margin-top:4px; font-size:12.5px;">= Usar valor</button>
    </div>
  `;
  wrap.appendChild(pop);
  let expr = "";
  const display = () => document.getElementById(displayId);
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const abrindo = pop.style.display !== "block";
    pop.style.display = abrindo ? "block" : "none";
    if(abrindo){
      expr = (input.value && Number(input.value) !== 0) ? String(input.value) : "";
      display().value = expr || "0";
    }
  });
  pop.addEventListener("click", (e) => e.stopPropagation());
  pop.querySelectorAll("[data-k]").forEach(b => {
    b.addEventListener("click", () => {
      const k = b.dataset.k;
      if(k === "C"){ expr = ""; display().value = "0"; return; }
      if(k === "="){
        const safeExpr = expr.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
        if(!safeExpr || !/^[0-9+\-*/.() ]+$/.test(safeExpr)){ display().value = "erro"; return; }
        try{
          const resultado = Function('"use strict"; return (' + safeExpr + ")")();
          if(typeof resultado !== "number" || !isFinite(resultado)){ display().value = "erro"; return; }
          const val = Math.round(resultado * 100) / 100;
          input.value = val;
          input.dispatchEvent(new Event("change", {bubbles:true}));
          pop.style.display = "none";
        }catch(err){ display().value = "erro"; }
        return;
      }
      expr += k;
      display().value = expr || "0";
    });
  });
  document.addEventListener("click", (ev) => { if(!wrap.contains(ev.target)) pop.style.display = "none"; });
}

// PERSISTÊNCIA (Supabase — uma tabela por entidade, payload em jsonb)
// ============================================================
// ---- App do Técnico: sessão própria e separada da do Master (mesmo Supabase,
// contas de auth diferentes) — ver bloco "MODO TÉCNICO" mais abaixo. donoAtual()
// garante que toda gravação continua marcada com o user_id do Master mesmo
// quando quem está gravando é o técnico logado com a própria conta.
function donoAtual(){
  if(state.modoTecnico && state.tecnicoAuthInfo) return state.tecnicoAuthInfo.masterUserId;
  if(state.modoCliente && state.clienteAuthInfo) return state.clienteAuthInfo.masterUserId;
  return state.user ? state.user.id : null;
}

async function saveRows(table, items){
  // IMPORTANTE: em caso de falha, este erro é relançado (throw) de propósito.
  // Todas as telas fazem "await saveX(); closeModal(); renderApp(); showToast('salvo!')"
  // sem try/catch — se engolíssemos o erro aqui (como antes), o app seguia em frente,
  // fechava o modal e avisava "salvo com sucesso" mesmo quando a gravação no Supabase
  // falhou. Resultado: o lançamento sumia ao deslogar/logar de novo, porque nunca
  // tinha sido gravado de verdade. Relançando o erro, o restante da função de quem
  // chamou para de executar e o modal continua aberto, deixando claro que não salvou.
  if(!state.user) return;
  if(!items.length) return;
  try{
    const flat = TABELAS_FLAT.has(table);
    const dono = donoAtual();
    const rows = items.map(item => {
      const { id, ...rest } = item;
      return flat
        ? { id, user_id: dono, ...rest, updated_at: new Date().toISOString() }
        : { id, user_id: dono, dados: rest, updated_at: new Date().toISOString() };
    });
    const { error } = await supabaseClient.from(table).upsert(rows, { onConflict: "id" });
    if(error) throw error;
    state.storageOK = true;
    state.ultimoSalvamento = new Date();
  }catch(e){
    state.storageOK = false;
    console.error(`[saveRows:${table}]`, e);
    if(ehErroDeSessao(e)){ await tratarErroDeSessao(e); throw e; }
    showToast(ehErroDePermissao(e) ? "Não salvou — sem permissão para isso." : `Não salvou (${table}): ${e.message || e}`, "error");
    throw e;
  }
}

function ehErroDeSessao(e){
  const msg = (e && e.message ? e.message : String(e || "")).toLowerCase();
  // OBS: "row-level security"/"rls" foi tirado daqui de propósito. A ideia
  // original era que uma violação de RLS ao gravar só podia acontecer com
  // sessão (JWT) velha/inválida — verdade enquanto todo save usava o
  // user_id do próprio usuário logado. Isso deixou de valer com o App do
  // Técnico/Cliente: lá o save grava com o user_id do Master (donoAtual()),
  // então uma violação de RLS ali é um problema de permissão de verdade
  // (ex: técnico tentando mexer num chamado que não é dele), não sessão
  // expirada — e forçar logout nesse caso só derruba o usuário no meio do
  // trabalho sem explicar o que realmente aconteceu. Ver ehErroDePermissao().
  return msg.includes("jwt") || msg.includes("token") || msg.includes("401") || msg.includes("not authenticated") || msg.includes("invalid claim") || msg.includes("expired") || (msg.includes("session") && !msg.includes("permission"));
}
function ehErroDePermissao(e){
  const msg = (e && e.message ? e.message : String(e || "")).toLowerCase();
  return msg.includes("row-level security") || msg.includes("row level security") || msg.includes("rls") || msg.includes("permission denied");
}
async function tratarErroDeSessao(e){
  console.error("[sessão inválida]", e);
  // Antes de desistir e forçar login de novo: em celular é comum o app
  // ficar em segundo plano tempo suficiente pro token de acesso vencer sem
  // o navegador ter chance de renovar sozinho. Se conseguir renovar aqui,
  // a sessão continua válida e o usuário só precisa repetir a ação (não
  // perde o que tava preenchendo, o modal continua aberto).
  try{
    const { data, error } = await supabaseClient.auth.refreshSession();
    if(!error && data && data.session){
      showToast("Conexão renovada — tente salvar de novo.", "error");
      return;
    }
  }catch(err){}
  showToast("Sua sessão expirou ou ficou inválida. Confira a data/hora do aparelho e entre novamente.", "error");
  try{ await supabaseClient.auth.signOut(); }catch(err){}
  state.user = null;
  state.contas = []; state.lancamentos = []; state.ajustes = [];
  state.categorias = []; state.negocios = []; state.cartoes = []; state.perfis = [];
  state.pagarUnlocked = false; state.receberUnlocked = false; state.executivoOculto = true;
  state.perfilAtivo = null; state.perfilEscolhido = false;
  state.modoTecnico = false; state.tecnicoAuthInfo = null;
  state.modoCliente = false; state.clienteAuthInfo = null;
  authMode = "login";
  renderApp();
}
async function loadData(){
  if(!state.user) return;
  const TABELAS_CORE = ["contas","lancamentos","ajustes","categorias","negocios","cartoes"];
  try{
    // "contas"/"categorias"/"negocios" têm colunas soltas no banco (ver TABELAS_FLAT) —
    // precisam de select("*") e não têm coluna "dados" pra desempacotar.
    const results = await Promise.all(TABELAS_CORE.map(t =>
      TABELAS_FLAT.has(t)
        ? supabaseClient.from(t).select("*").eq("user_id", state.user.id)
        : supabaseClient.from(t).select("id,dados").eq("user_id", state.user.id)
    ));
    results.forEach((r, i) => { if(r.error){ console.error(`[loadData:${TABELAS_CORE[i]}]`, r.error); throw r.error; } });
    const [contas, lancamentos, ajustes, categorias, negocios, cartoes] = TABELAS_CORE.map((t, i) => {
      const linhas = results[i].data || [];
      if(TABELAS_FLAT.has(t)){
        return linhas.map(({ user_id, updated_at, ...resto }) => resto); // já vem com id + colunas soltas
      }
      return linhas.map(row => ({ id: row.id, ...row.dados }));
    });
    state.contas = contas;
    state.lancamentos = lancamentos;
    state.ajustes = ajustes;
    state.categorias = categorias;
    state.negocios = negocios;
    state.cartoes = cartoes;
    state.storageOK = true;

    // "perfis" (multiusuário) é tabela opcional/nova: se ainda não existir no banco,
    // não trava o resto do app — só fica sem perfis (só o Master existe) até você
    // rodar o SQL de criação da tabela no Supabase.
    try{
      const { data, error } = await supabaseClient.from("perfis").select("id,dados").eq("user_id", state.user.id);
      if(error) throw error;
      state.perfis = (data || []).map(row => ({ id: row.id, ...row.dados }));
    }catch(e){
      console.warn("[loadData:perfis] tabela 'perfis' ainda não existe no Supabase — rode o SQL de criação.", e.message || e);
      state.perfis = [];
    }

    // "config" guarda a senha do Master. Tambem opcional/nova: se nao existir, usa a senha padrao.
    try{
      const { data, error } = await supabaseClient.from("config").select("id,dados").eq("user_id", state.user.id).eq("id", "master").maybeSingle();
      if(error) throw error;
      state.senhaMaster = (data && data.dados && data.dados.senhaMaster) || SENHA_MASTER_PADRAO;
    }catch(e){
      console.warn("[loadData:config] tabela 'config' ainda não existe no Supabase — usando senha padrão do Master.", e.message || e);
      state.senhaMaster = SENHA_MASTER_PADRAO;
    }

    // Tabelas de estoque/clientes/RH — opcionais/novas
    for(const [tbl, key] of [["est_produtos","estProdutos"],["est_movimentos","estMovimentos"],["est_fornecedores","estFornecedores"],["est_compras","estCompras"],["cli_clientes","cliClientes"],["cli_planos","cliPlanos"],["cli_orcamentos","cliOrcamentos"],["cli_os","cliOS"],["cli_tecnicos","cliTecnicos"],["cli_chamados","cliChamados"],["compras_vendas","comprasVendas"],["rh_funcionarios","rhFuncionarios"],["rh_cargos","rhCargos"],["rh_folha","rhFolha"],["rh_ferias","rhFerias"]]){
      try{
        const { data, error } = await supabaseClient.from(tbl).select("id,dados").eq("user_id", state.user.id);
        if(error) throw error;
        state[key] = (data || []).map(row => ({ id: row.id, ...row.dados }));
      }catch(e){
        console.warn(`[loadData:${tbl}] tabela ainda não existe — rode o SQL de criação.`, e.message||e);
        state[key] = [];
      }
    }

    // Primeiro login: sem categorias/negocios ainda -> semeia os padroes.
    if(state.categorias.length === 0 && state.negocios.length === 0){
      state.categorias = seedCategorias();
      state.negocios = seedNegocios();
      await saveCategorias();
      await saveNegocios();
    }
    if(autoBaixarAgendados().length) await saveLancamentos();
  }catch(e){
    state.storageOK = false;
    if(ehErroDeSessao(e)){ await tratarErroDeSessao(e); return; }
    showToast("Erro ao carregar dados: " + (e.message || e), "error");
  }
}

// =========================================================================
// MODO TÉCNICO — o técnico loga com a PRÓPRIA conta Supabase (não a do
// Master). "tecnicos_auth" é a tabela-ponte: liga o auth.uid() do técnico
// ao user_id do Master + ao id dele em cli_tecnicos. As regras de acesso
// (RLS) no Supabase é que de fato restringem o que essa conta consegue ler/
// gravar — o código aqui só decide QUAL interface mostrar depois que o
// Supabase já autenticou alguém.
// =========================================================================
async function detectarModoTecnico(){
  try{
    const { data, error } = await supabaseClient.from("tecnicos_auth")
      .select("master_user_id,tecnico_id").eq("auth_user_id", state.user.id).maybeSingle();
    if(error) throw error;
    if(data){ state.modoTecnico = true; state.tecnicoAuthInfo = { masterUserId: data.master_user_id, tecnicoId: data.tecnico_id, nome: "" }; }
    else{ state.modoTecnico = false; state.tecnicoAuthInfo = null; }
  }catch(e){
    console.warn("[detectarModoTecnico]", e.message || e);
    state.modoTecnico = false; state.tecnicoAuthInfo = null;
  }
}
async function carregarSessao(){
  await detectarModoTecnico();
  if(state.modoTecnico){ await loadDataTecnico(); return; }
  await detectarModoCliente();
  if(state.modoCliente){ await loadDataCliente(); return; }
  await loadData();
}
async function loadDataTecnico(){
  try{
    const masterId = state.tecnicoAuthInfo.masterUserId;
    const [tecRes, chamRes, prodRes] = await Promise.all([
      supabaseClient.from("cli_tecnicos").select("id,dados").eq("user_id", masterId).eq("id", state.tecnicoAuthInfo.tecnicoId).maybeSingle(),
      supabaseClient.from("cli_chamados").select("id,dados").eq("user_id", masterId),
      supabaseClient.from("est_produtos").select("id,dados").eq("user_id", masterId),
    ]);
    if(tecRes.error) throw tecRes.error;
    if(chamRes.error) throw chamRes.error;
    if(prodRes.error) throw prodRes.error;
    state.tecnicoAuthInfo.nome = tecRes.data ? (tecRes.data.dados.nome || "Técnico") : "Técnico";
    state.cliChamados = (chamRes.data || []).map(r => ({ id: r.id, ...r.dados }));
    state.estProdutos = (prodRes.data || []).map(r => ({ id: r.id, ...r.dados }));
    const clienteIds = [...new Set(state.cliChamados.map(c => c.clienteId).filter(Boolean))];
    if(clienteIds.length){
      const { data, error } = await supabaseClient.from("cli_clientes").select("id,dados").eq("user_id", masterId).in("id", clienteIds);
      if(error) throw error;
      state.cliClientes = (data || []).map(r => ({ id: r.id, ...r.dados }));
    }else{
      state.cliClientes = [];
    }
    state.estMovimentos = [];
    state.storageOK = true;
  }catch(e){
    state.storageOK = false;
    if(ehErroDeSessao(e)){ await tratarErroDeSessao(e); return; }
    showToast("Erro ao carregar seus chamados: " + (e.message || e), "error");
  }
}
async function vincularTecnico(codTecnico, codHolding){
  if(!codTecnico || !codHolding) return { ok:false, msg:"Preencha os dois códigos." };
  try{
    const { error } = await supabaseClient.from("tecnicos_auth").upsert({
      auth_user_id: state.user.id, master_user_id: codHolding.trim(), tecnico_id: codTecnico.trim(),
    }, { onConflict: "auth_user_id" });
    if(error) throw error;
    return { ok:true };
  }catch(e){
    return { ok:false, msg: "Não consegui vincular — confira os códigos. (" + (e.message||e) + ")" };
  }
}

// =========================================================================
// MODO CLIENTE — o cliente entra com CPF/CNPJ + um código de acesso curto
// (nada de e-mail/senha tradicional pra ele decorar). Por baixo, isso ainda
// usa o login de verdade do Supabase (mais seguro que inventar um sistema de
// autenticação do zero): CPF vira um e-mail sintético e o código vira a
// senha. O vínculo (qual cliente, de qual Master) é resolvido no banco por
// uma função (vincular_cliente_app), que confere CPF+código contra o
// cadastro real — assim o cliente nunca precisa saber nem digitar nenhum
// "código da holding" separado.
// =========================================================================
async function detectarModoCliente(){
  try{
    const { data, error } = await supabaseClient.from("clientes_auth")
      .select("master_user_id,cliente_id").eq("auth_user_id", state.user.id).maybeSingle();
    if(error) throw error;
    if(data){ state.modoCliente = true; state.clienteAuthInfo = { masterUserId: data.master_user_id, clienteId: data.cliente_id, nome: "" }; }
    else{ state.modoCliente = false; state.clienteAuthInfo = null; }
  }catch(e){
    console.warn("[detectarModoCliente]", e.message || e);
    state.modoCliente = false; state.clienteAuthInfo = null;
  }
}
async function loadDataCliente(){
  try{
    const masterId = state.clienteAuthInfo.masterUserId;
    const clienteId = state.clienteAuthInfo.clienteId;
    const [cliRes, chamRes, lancRes] = await Promise.all([
      supabaseClient.from("cli_clientes").select("id,dados").eq("user_id", masterId).eq("id", clienteId).maybeSingle(),
      supabaseClient.from("cli_chamados").select("id,dados").eq("user_id", masterId),
      supabaseClient.from("lancamentos").select("id,dados").eq("user_id", masterId),
    ]);
    if(cliRes.error) throw cliRes.error;
    if(chamRes.error) throw chamRes.error;
    if(lancRes.error) throw lancRes.error;
    state.clienteAuthInfo.nome = cliRes.data ? (cliRes.data.dados.nome || "Cliente") : "Cliente";
    state.cliClientes = cliRes.data ? [{ id: cliRes.data.id, ...cliRes.data.dados }] : [];
    state.cliChamados = (chamRes.data || []).map(r => ({ id: r.id, ...r.dados }));
    state.lancamentos = (lancRes.data || []).map(r => ({ id: r.id, ...r.dados }));
    state.cliPlanos = []; // carregado sob demanda em viewClienteContrato, se precisar do nome do plano
    state.storageOK = true;
  }catch(e){
    state.storageOK = false;
    if(ehErroDeSessao(e)){ await tratarErroDeSessao(e); return; }
    showToast("Erro ao carregar seus dados: " + (e.message || e), "error");
  }
}
async function vincularClienteApp(cpf, codigo){
  if(!cpf || !codigo) return { ok:false, msg:"Preencha o CPF/CNPJ e o código de acesso." };
  try{
    const { data, error } = await supabaseClient.rpc("vincular_cliente_app", { p_cpf: apenasDigitos(cpf), p_codigo: codigo.trim().toUpperCase() });
    if(error) throw error;
    if(!data || !data.ok) return { ok:false, msg: (data && data.msg) || "CPF ou código inválido." };
    return { ok:true };
  }catch(e){
    return { ok:false, msg: "Não consegui validar — tente de novo. (" + (e.message||e) + ")" };
  }
}

let authMode = "login";
let authBusy = false;
async function doLogin(email, password){
  try{
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error){ showToast(error.message === "Invalid login credentials" ? "E-mail ou senha incorretos." : error.message, "error"); return false; }
    state.user = data.user;
    state.perfilAtivo = null; state.perfilEscolhido = false;
    await carregarSessao();
    return true;
  }catch(e){ showToast("Erro ao fazer login.", "error"); return false; }
}
async function doSignup(email, password){
  try{
    const { data, error } = await supabaseClient.auth.signUp({ email, password });
    if(error){ showToast(error.message, "error"); return false; }
    if(data.user && data.session){
      state.user = data.user;
      state.perfilAtivo = null; state.perfilEscolhido = false;
      await loadData(); // loadData ja semeia categorias/negocios padrao no primeiro login
      showToast("Conta criada com sucesso!");
      return true;
    }
    if(data.user && !data.session){
      showToast("Conta criada! Verifique seu e-mail para confirmar antes de entrar.");
      authMode = "login";
      return true;
    }
    return false;
  }catch(e){ showToast("Erro ao criar conta.", "error"); return false; }
}
async function doAuthTecnico(email, password, codTecnico, codHolding){
  try{
    let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error){
      // ainda não tem conta — tenta criar (mesma senha que ele acabou de digitar)
      const signup = await supabaseClient.auth.signUp({ email, password });
      if(signup.error){ showToast(signup.error.message === "Invalid login credentials" ? "E-mail ou senha incorretos." : signup.error.message, "error"); return false; }
      if(!signup.data.session){
        showToast("Conta criada! Confirme seu e-mail (verifique a caixa de entrada) e volte aqui pra concluir.");
        return true;
      }
      data = signup.data;
    }
    // Trava de segurança: "código da holding" é sempre o próprio user.id do
    // Master. Se bater com o id de quem acabou de logar aqui, é a conta do
    // Master tentando entrar como se fosse o técnico dela mesma (ex: alguém
    // testou essa tela com o próprio e-mail/senha do Master por engano) —
    // isso corromperia o login normal do Master pra sempre (toda entrada
    // futura, mesmo pela tela certa, cairia no modo técnico). Bloqueia aqui
    // e desfaz o login antes de gravar qualquer vínculo.
    if(data.user.id === codHolding.trim()){
      await supabaseClient.auth.signOut();
      state.user = null;
      showToast("Essa conta é a do Master, não de um técnico — use um e-mail/senha exclusivos do técnico nessa tela.", "error");
      return false;
    }
    state.user = data.user;
    const link = await vincularTecnico(codTecnico, codHolding);
    if(!link.ok){ showToast(link.msg, "error"); return false; }
    await carregarSessao();
    return true;
  }catch(e){ showToast("Erro ao entrar como técnico.", "error"); return false; }
}
async function doAuthCliente(cpf, codigo){
  const cpfDigits = apenasDigitos(cpf);
  const codigoNorm = (codigo||"").trim().toUpperCase();
  if(!cpfDigits || !codigoNorm){ showToast("Preencha o CPF/CNPJ e o código de acesso.", "error"); return false; }
  // CPF vira o "usuário" e o código de acesso vira a "senha" — nos bastidores
  // ainda é um login real do Supabase (email sintético, nunca enviado a
  // lugar nenhum), então continua com a mesma segurança de sempre.
  const email = `cliente_${cpfDigits}@app.holding.local`;
  const password = codigoNorm.length >= 6 ? codigoNorm : (codigoNorm + "000000").slice(0, 6);
  try{
    let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error){
      const signup = await supabaseClient.auth.signUp({ email, password });
      if(signup.error){ showToast(signup.error.message === "Invalid login credentials" ? "CPF/CNPJ ou código incorretos." : signup.error.message, "error"); return false; }
      if(!signup.data.session){ showToast("Não consegui entrar agora — tente de novo em instantes.", "error"); return false; }
      data = signup.data;
    }
    state.user = data.user;
    const link = await vincularClienteApp(cpf, codigo);
    if(!link.ok){
      // login funcionou mas CPF/código não batem com nenhum cliente cadastrado
      await supabaseClient.auth.signOut();
      state.user = null;
      showToast(link.msg, "error");
      return false;
    }
    await carregarSessao();
    return true;
  }catch(e){ showToast("Erro ao entrar.", "error"); return false; }
}
async function doLogout(){
  await supabaseClient.auth.signOut();
  state.user = null;
  state.contas = []; state.lancamentos = []; state.ajustes = [];
  state.categorias = []; state.negocios = []; state.cartoes = []; state.perfis = [];
  state.pagarUnlocked = false; state.receberUnlocked = false; state.executivoOculto = true;
  state.perfilAtivo = null; state.perfilEscolhido = false;

function saldoAtual(contaId){
  const conta = contaById(contaId);
  if(!conta) return 0;
  let total = Number(conta.saldoInicial) || 0;
  for(const l of state.lancamentos){
    if(l.inativo) continue;
    if(l.status !== "Pago") continue;
    if(l.tipo === "Receita" && l.contaOrigem === contaId) total += Number(l.valor);
    if(l.tipo === "Despesa" && l.contaOrigem === contaId) total -= Number(l.valor);
    if(l.tipo === "Transferência"){
      if(l.contaOrigem === contaId) total -= Number(l.valor);
      if(l.contaDestino === contaId) total += Number(l.valor);
    }
  }
  for(const a of state.ajustes){ if(a.contaId === contaId) total += Number(a.valor); }
  return total;
}
function saldoProjetado(contaId){
  let total = saldoAtual(contaId);
  for(const l of state.lancamentos){
    if(l.inativo) continue;
    if(l.status === "Pago") continue;
    if(l.tipo === "Receita" && l.contaOrigem === contaId) total += Number(l.valor);
    if(l.tipo === "Despesa" && l.contaOrigem === contaId) total -= Number(l.valor);
    if(l.tipo === "Transferência"){
      if(l.contaOrigem === contaId) total -= Number(l.valor);
      if(l.contaDestino === contaId) total += Number(l.valor);
    }
  }
  return total;
}
function naoConciliados(contaId){
  return state.lancamentos.filter(l => (l.contaOrigem === contaId || l.contaDestino === contaId) && !l.conciliado).length;
}
function saldoProjetadoAteMes(ano, mes){
  // "Saldo real até esse mês" — só conta o que já foi de fato Pago (igual
  // saldoAtual() na tela de Contas). Provisionado/Agendado que nunca foi
  // baixado NÃO entra aqui — senão um lançamento antigo esquecido em aberto
  // ficaria inflando o saldo de todo mês pra sempre.
  const base = state.contas.reduce((s,c) => s + (Number(c.saldoInicial)||0), 0);
  const fimISO = new Date(ano, mes + 1, 0).toISOString().slice(0,10);
  let total = base;
  for(const l of state.lancamentos){
    if(l.inativo) continue;
    if(l.status !== "Pago") continue;
    if(l.data > fimISO) continue;
    if(l.tipo === "Receita") total += Number(l.valor);
    if(l.tipo === "Despesa") total -= Number(l.valor);
  }
  for(const a of state.ajustes){ if(a.data <= fimISO) total += Number(a.valor); }
  return total;
}
function saldoContaAteMes(contaId, ano, mes){
  // Mesma lógica de saldoProjetadoAteMes, mas de uma conta só — só Pago conta.
  const conta = contaById(contaId);
  if(!conta) return 0;
  const fimISO = new Date(ano, mes + 1, 0).toISOString().slice(0,10);
  let total = Number(conta.saldoInicial) || 0;
  for(const l of state.lancamentos){
    if(l.inativo) continue;
    if(l.status !== "Pago") continue;
    if(l.data > fimISO) continue;
    if(l.tipo === "Receita" && l.contaOrigem === contaId) total += Number(l.valor);
    if(l.tipo === "Despesa" && l.contaOrigem === contaId) total -= Number(l.valor);
    if(l.tipo === "Transferência"){
      if(l.contaOrigem === contaId) total -= Number(l.valor);
      if(l.contaDestino === contaId) total += Number(l.valor);
    }
  }
  for(const a of state.ajustes){ if(a.contaId === contaId && a.data <= fimISO) total += Number(a.valor); }
  return total;
}
function movimentoPendenteDoMes(ano, mes){
  const inicioISO = new Date(ano, mes, 1).toISOString().slice(0,10);
  const fimISO = new Date(ano, mes + 1, 0).toISOString().slice(0,10);
  let entradas = 0, saidas = 0;
  for(const l of state.lancamentos){
    if(l.inativo) continue;
    if(l.data < inicioISO || l.data > fimISO || l.status === "Pago") continue;
    if(l.tipo === "Receita") entradas += Number(l.valor);
    if(l.tipo === "Despesa") saidas += Number(l.valor);
  }
  return { entradas, saidas };
}
function movimentoRealizadoDoMes(ano, mes){
  const inicioISO = new Date(ano, mes, 1).toISOString().slice(0,10);
  const fimISO = new Date(ano, mes + 1, 0).toISOString().slice(0,10);
  let entradas = 0, saidas = 0;
  for(const l of state.lancamentos){
    if(l.inativo) continue;
    if(l.data < inicioISO || l.data > fimISO || l.status !== "Pago") continue;
    if(l.tipo === "Receita") entradas += Number(l.valor);
    if(l.tipo === "Despesa") saidas += Number(l.valor);
  }
  return { entradas, saidas };
}
function topLancamentosDoMes(tipo, ano, mes, n){
  const inicioISO = new Date(ano, mes, 1).toISOString().slice(0,10);
  const fimISO = new Date(ano, mes + 1, 0).toISOString().slice(0,10);
  return state.lancamentos
    .filter(l => l.tipo === tipo && l.data >= inicioISO && l.data <= fimISO)
    .sort((a,b) => Number(b.valor) - Number(a.valor))
    .slice(0, n || 5);
}
function contasAPagar(){
  return state.lancamentos.filter(l => l.tipo === "Despesa" && l.status !== "Pago" && !l.inativo);
}
function contasAReceber(){
  return state.lancamentos.filter(l => l.tipo === "Receita" && l.status !== "Pago" && !l.inativo);
}
function contasAPagarConsolidado(){
  // Despesas avulsas ficam uma por uma. Compras de cartao viram UMA linha por fatura
  // (mesmo cartao + mesma data de vencimento), porque é assim que se paga de verdade.
  const pendentes = state.lancamentos.filter(l => l.tipo === "Despesa" && l.status !== "Pago" && !l.inativo);
  const individuais = pendentes.filter(l => !l.cartaoId).map(l => ({
    tipo: "individual", id: l.id, data: l.data, valor: Number(l.valor),
    descricao: l.descricao, negocio: l.negocio, status: l.status
  }));
  const grupos = {};
  pendentes.filter(l => l.cartaoId).forEach(l => {
    const key = l.cartaoId + "|" + l.data;
    if(!grupos[key]) grupos[key] = { cartaoId: l.cartaoId, data: l.data, valor: 0, itens: [] };
    grupos[key].valor += Number(l.valor);
    grupos[key].itens.push(l);
  });
  const faturas = Object.values(grupos).map(g => {
    const cartao = cartaoById(g.cartaoId);
    return {
      tipo: "fatura", cartaoId: g.cartaoId, data: g.data, valor: g.valor,
      descricao: `Fatura ${cartao ? cartao.nome : "Cartão"} (${g.itens.length} compra${g.itens.length===1?'':'s'})`,
      negocio: "", status: "Provisionado"
    };
  });
  return [...individuais, ...faturas].sort((a,b) => a.data.localeCompare(b.data));
}

function campoValorProtegido(label, name, valor, unlocked, opts){
  opts = opts || {};
  const helpExtra = opts.help ? `<div class="field-help">${opts.help}</div>` : "";
  if(unlocked){
    const min = opts.min !== undefined ? `min="${opts.min}"` : "";
    const req = opts.required === false ? "" : "required";
    return `<div class="field"><label>${label}</label><input id="campo_${name}" ${req} type="number" step="0.01" ${min} name="${name}" value="${valor}">${helpExtra}</div>`;
  }
  return `<div class="field"><label>${label}</label>
    <input type="text" value="R$ ••••••" disabled style="background:var(--surface-2); color:var(--ink-4); cursor:not-allowed;">
    <input type="hidden" name="${name}" value="${valor}">
    <div class="field-help">🔒 Desbloqueie para ver ou alterar este valor.</div>
  </div>`;
}

      <div class="modcard-desc">${m.desc}</div>

  }).join("");

      <button class="modbar-btn ${state.modpanelAberto ? 'active' : ''}" id="btnModulos">⊞ Módulos</button>

      <div class="modpanel ${state.modpanelAberto ? 'open' : ''}" id="modPanel">
        <div class="modpanel-title">Selecione o módulo</div>
        <div class="modpanel-grid">${moduloCards}</div>
      </div>
    </div>
  `;
  // Mobile panel (under mob-topbar): inject a floating layer below the topbar
  const mobPanel = document.getElementById("mobModulosPanel");
  if(mobPanel) mobPanel.remove();
  if(state.modpanelAberto){
    const mobilePanel = document.createElement("div");
    mobilePanel.id = "mobModulosPanel";
    mobilePanel.style.cssText = "position:fixed; top:48px; left:0; right:0; z-index:160; background:var(--brand-2); border-bottom:1px solid rgba(255,255,255,.08); padding:16px; box-shadow:0 8px 24px rgba(0,0,0,.4);";
    mobilePanel.innerHTML = `<div style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.3);font-weight:600;margin-bottom:10px;">Selecione o módulo</div><div style="display:flex;flex-wrap:wrap;gap:8px;">${moduloCards}</div>`;
    document.body.appendChild(mobilePanel);
    // Wire card clicks on mobile panel
    mobilePanel.querySelectorAll(".modcard").forEach(card => card.addEventListener("click", () => {
      const modId = card.dataset.id; if(!modId) return;
      const mod = MODULOS_CATALOGO.find(m=>m.id===modId);
      if(!mod||!mod.ativo){ showToast("Módulo em construção.","error"); return; }
      if(MODULOS_GRANULARES.includes(modId) && !podeVerModulo(modId)){ showToast("Esse usuário não tem acesso a esse módulo.","error"); return; }
      state.modpanelAberto = false; mobilePanel.remove();
      state.moduloAtivo = modId;
      if(modId==="visaogeral") state.view="vg_executivo";
      else if(modId==="cadastro") state.view="cadastro_hub";
      else if(modId==="financeiro") state.view="dashboard";
      else if(modId==="estoque") state.view="est_dashboard";
      else if(modId==="clientes") state.view="cli_dashboard";
      else if(modId==="rh") state.view="rh_dashboard";
      else if(modId==="comprasvendas") state.view="cv_lista";
      renderApp();
    }));
    // Close on tap outside
    setTimeout(() => {
      document.addEventListener("click", function fecharMob(ev){
        const btn = document.getElementById("mobModulosBtn");
        if(!mobilePanel.contains(ev.target) && btn && !btn.contains(ev.target)){
          state.modpanelAberto = false;
          mobilePanel.remove();
          document.removeEventListener("click", fecharMob);
        }
      });
    }, 50);
  }
  document.getElementById("btnModulos")?.addEventListener("click", e => {
    e.stopPropagation();
    state.modpanelAberto = !state.modpanelAberto;
    renderModbar();
  });
  if(state.modpanelAberto){
    setTimeout(() => {
      document.addEventListener("click", function fechar(ev){
        const panel = document.getElementById("modPanel");
        const btn = document.getElementById("btnModulos");
        if(panel && !panel.contains(ev.target) && btn && !btn.contains(ev.target)){
          state.modpanelAberto = false;
          renderModbar();
          document.removeEventListener("click", fechar);
        }
      });
    }, 50);
  }
}

    <button class="fab-btn" id="fabBtn" title="Lançar" aria-label="Lançar">+</button>
  </div>`;
  const importInput = document.getElementById("importarBackupInput");
  if(importInput) importInput.addEventListener("change", handleImportarBackup);
  // membros nao acessam Dashboard/Contas/Cartoes/Ajustes/Usuarios — redireciona se necessario
  const VIEWS_SOMENTE_MASTER = ["dashboard","contas","cartoes","ajustes","categorias","negocios","usuarios","rel_fluxo","rel_dre"];
  if(!master && VIEWS_SOMENTE_MASTER.includes(state.view)){
    state.view = "lancamentos";
  }
  // módulos com acesso granular (Estoque/Clientes/RH) — sem "ver" liberado, volta pro Financeiro
  if(state.view.startsWith("rh_") && !podeVerModulo("rh")){ state.view = "lancamentos"; state.moduloAtivo = "financeiro"; }
  if(state.view.startsWith("est_") && !podeVerModulo("estoque")){ state.view = "lancamentos"; state.moduloAtivo = "financeiro"; }
  if(state.view.startsWith("cli_") && !podeVerModulo("clientes")){ state.view = "lancamentos"; state.moduloAtivo = "financeiro"; }
  salvarNavegacaoAtual();
  renderModbar();
  // ---- Mobile drawer ----
  const mobMenuBtn = document.getElementById("mobMenuBtn");
  const mainSidebar = document.getElementById("mainSidebar");
  const sidebarOverlay = document.getElementById("sidebarOverlay");
  function openDrawer(){ mainSidebar?.classList.add("open"); sidebarOverlay?.classList.add("open"); document.body.style.overflow = "hidden"; }
  function closeDrawer(){ mainSidebar?.classList.remove("open"); sidebarOverlay?.classList.remove("open"); document.body.style.overflow = ""; }
  mobMenuBtn?.addEventListener("click", () => mainSidebar?.classList.contains("open") ? closeDrawer() : openDrawer());
  document.getElementById("mobMenuBtn2")?.addEventListener("click", () => mainSidebar?.classList.contains("open") ? closeDrawer() : openDrawer());
  sidebarOverlay?.addEventListener("click", closeDrawer);
  // Close drawer on nav-item tap (mobile UX)
  mainSidebar?.querySelectorAll(".nav-item").forEach(el => el.addEventListener("click", () => { if(window.innerWidth < 900) closeDrawer(); }));
  // Mobile modules button — reuses the modbar panel logic
  document.getElementById("mobModulosBtn")?.addEventListener("click", () => {
    state.modpanelAberto = !state.modpanelAberto;
    renderModbar();
  });
  // ---- Botão flutuante "+" ----
  const fabBtn = document.getElementById("fabBtn");
  const fabMenu = document.getElementById("fabMenu");
  fabBtn?.addEventListener("click", e => {
    e.stopPropagation();
    fabBtn.classList.toggle("open");
    fabMenu.classList.toggle("open");
  });
  if(fabMenu?.classList.contains("open")){
    setTimeout(() => {
      document.addEventListener("click", function fecharFab(ev){
        if(!fabMenu.contains(ev.target) && !fabBtn.contains(ev.target)){
          fabBtn.classList.remove("open"); fabMenu.classList.remove("open");
          document.removeEventListener("click", fecharFab);
        }
      });
    }, 50);
  }
  renderView();
}

      const password = document.getElementById("authPassword").value;
      if(!email || !password) { showToast("Preencha email e senha.", "error"); return; }
      authBusy = true; renderApp();
      const ok = authMode === "login" ? await doLogin(email, password) : await doSignup(email, password);
      authBusy = false;
      renderApp();
    });
  }
  const formTec = document.getElementById("authTecnicoForm");
  if(formTec){
    formTec.addEventListener("submit", async e => {
      e.preventDefault();
      const email = document.getElementById("tecEmail").value.trim();
      const password = document.getElementById("tecPassword").value;
      const codTecnico = document.getElementById("tecCodTecnico").value.trim();

      renderApp();
    });

// VISÃO GERAL — painel executivo consolidado (Sintético) e comparativo
// por negócio (Analítico). Não duplica cálculo: reaproveita os mesmos
// helpers que Dashboard/Estoque/Clientes/RH já usam. Financeiro fica
// aberto a todo mundo (igual Lançamentos já é), só o Saldo em conta
// (que depende de Contas, tela master-only) fica restrito ao Master.
// Estoque/Clientes/RH seguem a permissão granular de cada perfil.
// ============================================================
function vgKpiCard(label, value, note, cor, destino){
  const clicavel = destino ? `data-action="cad-ver-lista" data-modulo="${destino.modulo}" data-view="${destino.view}" style="cursor:pointer; transition:border-color .12s, box-shadow .12s;" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'" title="Ir para ${esc(destino.label||label)}"` : "";
  return `<div class="kpi-card" ${clicavel}><div class="kpi-label">${esc(label)}</div><div class="kpi-value ${cor||''}" style="font-size:20px;">${value}</div>${note?`<div class="kpi-note">${esc(note)}</div>`:""}</div>`;
}
function vgBlocoHTML(titulo, cardsHTML){
  return `<div style="margin-bottom:22px;">
    <div style="font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); font-weight:700; margin-bottom:10px;">${esc(titulo)}</div>
    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr));">${cardsHTML}</div>
  </div>`;
}
// Um bloco de KPIs por negócio (em vez de por módulo) — só entram os
// cartões de Estoque/Clientes/Chamados/RH que fazem sentido pra ESSE
// negócio (só aparecem se ele realmente tiver algo cadastrado ali), pra não
// empilhar "0" irrelevante em negócios que não usam aquele módulo (ex: um
// negócio sem clientes vinculados não precisa mostrar "Clientes ativos: 0").
function vgBlocoNegocio(n, inicioMesISO, fimMesISO){
  const master = ehMaster();
  const lancDoNeg = lancamentosVisiveis(state.lancamentos.filter(l => l.negocio===n.nome && !l.inativo));
  const aReceber = lancDoNeg.filter(l=>l.tipo==="Receita" && l.status!=="Pago").reduce((s,l)=>s+Number(l.valor),0);
  const aPagar = lancDoNeg.filter(l=>l.tipo==="Despesa" && l.status!=="Pago").reduce((s,l)=>s+Number(l.valor),0);
  const receitaMes = lancDoNeg.filter(l=>l.tipo==="Receita" && l.status==="Pago" && l.data>=inicioMesISO && l.data<=fimMesISO).reduce((s,l)=>s+Number(l.valor),0);
  const despesaMes = lancDoNeg.filter(l=>l.tipo==="Despesa" && l.status==="Pago" && l.data>=inicioMesISO && l.data<=fimMesISO).reduce((s,l)=>s+Number(l.valor),0);

  const cards = [];
  if(master && state.contas.some(c=>c.negocio===n.nome)){
    const saldoContas = state.contas.filter(c=>c.negocio===n.nome && c.ativa!==false).reduce((s,c)=>s+saldoAtual(c.id),0);
    cards.push(vgKpiCard("Saldo em contas", fmtBRL(saldoContas), "Contas ativas desse negócio", saldoContas>=0?"pos":"neg", {modulo:"financeiro", view:"contas", label:"Contas"}));
  }
  cards.push(vgKpiCard("A receber", fmtBRL(aReceber), "Pendente/agendado", "pos", {modulo:"financeiro", view:"receitas", label:"Contas a Receber"}));
  cards.push(vgKpiCard("A pagar", fmtBRL(aPagar), "Pendente/agendado", "neg", {modulo:"financeiro", view:"despesas", label:"Contas a Pagar"}));
  cards.push(vgKpiCard("Receita do mês", fmtBRL(receitaMes), "Pago, mês atual", "pos", {modulo:"financeiro", view:"receitas", label:"Contas a Receber"}));
  cards.push(vgKpiCard("Despesa do mês", fmtBRL(despesaMes), "Pago, mês atual", "neg", {modulo:"financeiro", view:"despesas", label:"Contas a Pagar"}));

  if(podeVerModulo("clientes")){
    const clientesDoNeg = state.cliClientes.filter(c => (c.contratos||[]).some(ct=>ct.negocio===n.nome));
    if(clientesDoNeg.length){
      const clientesAtivos = clientesDoNeg.filter(c=>(c.contratos||[]).some(ct=>ct.negocio===n.nome && ct.status==="Ativo")).length;
      cards.push(vgKpiCard("Clientes ativos", clientesAtivos, `${clientesDoNeg.length} vinculado(s) no total`, "", {modulo:"clientes", view:"cli_lista", label:"Clientes"}));
    }
    const chamadosDoNeg = state.cliChamados.filter(c => c.negocio===n.nome);
    if(chamadosDoNeg.length){
      const chamadosAbertos = chamadosDoNeg.filter(c=>["Aberto","Agendado","Em atendimento"].includes(c.status)).length;
      const atrasados = chamadosDoNeg.filter(c=>c.dataAgendada && c.dataAgendada<todayISO() && !["Concluído","Cancelado"].includes(c.status)).length;
      cards.push(vgKpiCard("Chamados abertos", chamadosAbertos, atrasados>0?`${atrasados} atrasado(s)`:"Nenhum atrasado", atrasados>0?"neg":"", {modulo:"clientes", view:"cli_chamados", label:"Chamados"}));
    }
    const osDoNeg = state.cliOS.filter(o => o.negocio===n.nome);
    if(osDoNeg.length){
      const osAndamento = osDoNeg.filter(o=>o.status==="Aberta").length;
      cards.push(vgKpiCard("OS em andamento", osAndamento, `${osDoNeg.length} no total`, "", {modulo:"clientes", view:"cli_os_lista", label:"Ordens de Serviço"}));
    }
  }
  if(podeVerModulo("estoque")){
    const produtosDoNeg = state.estProdutos.filter(p => p.negocio===n.nome);
    if(produtosDoNeg.length){
      const valorEstoque = produtosDoNeg.reduce((s,p)=>s+estSaldoAtual(p.id)*estValorUnitarioEstimado(p), 0);
      const abaixoMinimo = produtosDoNeg.filter(p=>estSaldoAtual(p.id)<=Number(p.estoqueMinimo||0) && Number(p.estoqueMinimo||0)>0).length;
      cards.push(vgKpiCard("Valor em estoque", fmtBRL(valorEstoque), `${produtosDoNeg.length} produto(s)`, "", {modulo:"estoque", view:"est_produtos", label:"Produtos"}));
      cards.push(vgKpiCard("Abaixo do mínimo", abaixoMinimo, abaixoMinimo>0?"Precisa repor":"Tudo certo", abaixoMinimo>0?"neg":"pos", {modulo:"estoque", view:"est_alertas", label:"Alertas de Estoque"}));
    }
  }
  if(podeVerModulo("rh")){
    const funcionariosDoNeg = state.rhFuncionarios.filter(f => f.negocio===n.nome);
    if(funcionariosDoNeg.length){
      const ativos = funcionariosDoNeg.filter(f=>f.status!=="Desligado");
      cards.push(vgKpiCard("Funcionários ativos", ativos.length, `${funcionariosDoNeg.length} no total`, "", {modulo:"rh", view:"rh_funcionarios", label:"Funcionários"}));
      const folhaDoNeg = ativos.reduce((s,f)=>s+(Number(f.salario)||0), 0);
      cards.push(vgKpiCard("Folha do mês (estimada)", fmtBRL(folhaDoNeg), "Soma dos salários ativos", "", {modulo:"rh", view:"rh_folha", label:"Folha de Pagamento"}));
    }
  }

  return `<div style="margin-bottom:22px;">
    <div style="font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); font-weight:700; margin-bottom:10px; display:flex; align-items:center; cursor:pointer; width:fit-content;" data-action="vg-ver-negocio" data-negocio="${esc(n.nome)}" title="Ver lançamentos de ${esc(n.nome)}">
      <span class="tag-dot" style="background:${negocioCor(n.nome)}; display:inline-block; margin-right:7px;"></span>${esc(n.nome)}
    </div>
    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr));">${cards.join("")}</div>
