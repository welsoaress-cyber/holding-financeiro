}
// ============================================================
// VISÃO GERAL — EXECUTIVO: painel único pra decisão rápida (não pra
// navegar). Patrimônio consolidado + evolução vs mês passado, performance
// por negócio com margem/status, top clientes por receita recorrente, e
// alertas com ação sugerida. Só entra o que dá pra calcular com dado real
// já existente no sistema — sem inventar número (ex: não tem "churn vs
// média histórica" porque contrato cancelado não guarda a data em que foi
// cancelado ainda; e não tem gráfico/projeção, é tudo cálculo direto).
// ============================================================
function vgVarPct(atual, anterior){
  if(!anterior) return atual ? { pct: 100, texto: "novo" } : { pct: 0, texto: "—" };
  const pct = Math.round(((atual-anterior)/Math.abs(anterior))*100);
  return { pct, texto: `${pct>=0?"▲":"▼"} ${Math.abs(pct)}%` };
}
function vgBarraEvolucao(label, atual, anterior, corBoaSeSobe){
  const v = vgVarPct(atual, anterior);
  const bom = anterior===0 ? true : (corBoaSeSobe ? v.pct>=0 : v.pct<=0);
  const cor = v.texto==="—" ? "var(--ink-4)" : (bom ? "var(--pos)" : "var(--neg)");
  const pctBarra = Math.max(4, Math.min(100, Math.abs(v.pct)));
  return `<div class="bar-row">
    <div class="name">${esc(label)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${pctBarra}%; background:${cor};"></div></div>
    <div class="val" style="color:${cor}; font-weight:700; min-width:64px; text-align:right;">${v.texto}</div>
  </div>`;
}

// ---- Gráficos hand-rolled (sem lib de charts) — linha/área em SVG e barras
// horizontais reaproveitando .bar-row/.bar-track já usados no resto do app.
// Tooltip é um único listener delegado no document (ver garantirTooltipGrafico),
// então funciona em qualquer gráfico novo só de marcar o elemento com data-tip.
let graficoTooltipPronto = false;
function garantirTooltipGrafico(){
  if(graficoTooltipPronto) return;
  graficoTooltipPronto = true;
  const tip = document.createElement("div");
  tip.className = "gtip"; tip.id = "graficoTooltip";
  document.body.appendChild(tip);
  document.addEventListener("mousemove", e => {
    const el = e.target.closest("[data-tip]");
    if(!el){ tip.classList.remove("show"); return; }
    tip.innerHTML = el.getAttribute("data-tip");
    const x = Math.min(e.clientX+14, window.innerWidth-230);
    const y = Math.max(e.clientY-38, 6);
    tip.style.left = x+"px"; tip.style.top = y+"px";
    tip.classList.add("show");
  });
  document.addEventListener("mouseout", e => {
    if(!e.relatedTarget || !(e.relatedTarget instanceof Element) || !e.relatedTarget.closest("[data-tip]")) tip.classList.remove("show");
  });
}
// Gráfico de linha/área — pontos: [{label, valor}]. Só faz sentido pra série
// única (saldo consolidado), por isso não tem legenda — o título do painel
// já diz o que é.
function svgLinhaSaldo(pontos, h){
  if(pontos.length < 2) return emptyState("Sem histórico suficiente ainda.");
  const w = 1000; // viewBox largo, escala 100% via CSS — sem preocupação com o px real da tela
  const vals = pontos.map(p=>p.valor);
  const min = Math.min(...vals), max = Math.max(...vals);
  const pad = (max-min)*0.15 || Math.abs(max)*0.15 || 10;
  const yMin = min-pad, yMax = max+pad;
  const stepX = w/(pontos.length-1);
  const xy = (i,v) => [i*stepX, h - ((v-yMin)/((yMax-yMin)||1))*h];
  const coords = pontos.map((p,i)=>xy(i,p.valor));
  const pathLine = coords.map((c,i)=>`${i===0?'M':'L'}${c[0].toFixed(1)},${c[1].toFixed(1)}`).join(" ");
  const pathArea = `${pathLine} L${coords[coords.length-1][0].toFixed(1)},${h} L0,${h} Z`;
  const pontosHTML = coords.map((c,i) => {
    const p = pontos[i];
    const tip = `<div>${esc(p.label)}</div><div class="tip-val">${fmtBRL(p.valor)}</div>`;
    return `<g class="grafico-linha-pt" data-tip="${esc(tip)}">
      <circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="14" fill="transparent" style="pointer-events:all;"></circle>
      <circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" style="pointer-events:none;"></circle>
    </g>`;
  }).join("");
  // Só 1º, meio e último — em tela estreita, rótulo demais gruda um no outro.
  const meio = Math.floor((pontos.length-1)/2);
  const labelsHTML = pontos.map((p,i) => {
    if(i!==0 && i!==meio && i!==pontos.length-1) return `<div style="flex:1;"></div>`;
    const alinho = i===0 ? "left" : i===pontos.length-1 ? "right" : "center";
    return `<div style="flex:1; text-align:${alinho};">${esc(p.label)}</div>`;
  }).join("");
  return `
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%; height:${h}px; display:block; overflow:visible;">
      <path d="${pathArea}" fill="var(--accent)" opacity=".1"></path>
      <path d="${pathLine}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path>
      ${pontosHTML}
    </svg>
    <div style="display:flex; margin-top:6px; font-size:10.5px; color:var(--ink-4);">${labelsHTML}</div>
  `;
}
// Barra horizontal reaproveitando .bar-row — usada pra receita e margem por negócio.
function graficoBarraHTML(label, pct, cor, valorTxt, tip, corDot){
  return `<div class="bar-row" data-tip="${esc(tip)}">
    <div class="name">${corDot?`<span class="tag-dot" style="background:${corDot}"></span>`:""}${esc(label)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,pct)}%; background:${cor};"></div></div>
    <div class="val" style="font-weight:700; color:${cor};">${valorTxt}</div>
  </div>`;
}
function viewVgExecutivo(){
  garantirTooltipGrafico();
  const master = ehMaster();
  const mv = state.mesVisualizado;
  const hoje = new Date();
  const isMesAtual = mv.ano === hoje.getFullYear() && mv.mes === hoje.getMonth();
  const oculto = state.executivoOculto;
  const vv = (n) => oculto ? "R$ ••••••" : fmtBRL(n); // "valor visível" — some quando oculto
  const inicioMesISO = new Date(mv.ano, mv.mes, 1).toISOString().slice(0,10);
  const fimMesISO = new Date(mv.ano, mv.mes+1, 0).toISOString().slice(0,10);
  const mesAntObj = (() => { const m = mv.mes===0?11:mv.mes-1; const a = mv.mes===0?mv.ano-1:mv.ano; return {ano:a, mes:m}; })();
  const inicioMesAntISO = new Date(mesAntObj.ano, mesAntObj.mes, 1).toISOString().slice(0,10);
  const fimMesAntISO = new Date(mesAntObj.ano, mesAntObj.mes+1, 0).toISOString().slice(0,10);
  const negociosVisiveis = state.negocios.filter(n => master || podeVerNegocio(n.nome));

  const lancVis = (filtro) => lancamentosVisiveis(state.lancamentos.filter(filtro));
  const somaMes = (tipo, ini, fim) => lancVis(l => l.tipo===tipo && !l.inativo && l.status==="Pago" && l.data>=ini && l.data<=fim).reduce((s,l)=>s+Number(l.valor),0);
  const somaMesAberto = (tipo, ini, fim) => lancVis(l => l.tipo===tipo && !l.inativo && l.status!=="Pago" && l.data>=ini && l.data<=fim).reduce((s,l)=>s+Number(l.valor),0);
  // Realizado (já pago) — o valor real, certo. "Aberto" é só o que tem
  // vencimento DENTRO do mês selecionado (nunca soma os anos de recorrência
  // futura de um contrato — aquilo é previsão de longo prazo, não "a
  // receber" do mês; misturar os dois inflava o número de forma irreal).
  const receitaRealizadaMes = somaMes("Receita", inicioMesISO, fimMesISO), receitaRealizadaMesAnt = somaMes("Receita", inicioMesAntISO, fimMesAntISO);
  const despesaRealizadaMes = somaMes("Despesa", inicioMesISO, fimMesISO), despesaRealizadaMesAnt = somaMes("Despesa", inicioMesAntISO, fimMesAntISO);
  const receitaAbertaMes = somaMesAberto("Receita", inicioMesISO, fimMesISO);
  const despesaAbertaMes = somaMesAberto("Despesa", inicioMesISO, fimMesISO);
  const receitaPrevistaMes = receitaRealizadaMes + receitaAbertaMes; // total esperado até o fim do mês
  const despesaPrevistaMes = despesaRealizadaMes + despesaAbertaMes;
  const resultadoRealizadoMes = receitaRealizadaMes-despesaRealizadaMes, resultadoRealizadoMesAnt = receitaRealizadaMesAnt-despesaRealizadaMesAnt;

  // Saldo no ponto do mês selecionado — mesma lógica que o Dashboard já usa
  // (saldo realizado até agora + o que ainda está previsto entrar/sair).
  const saldoMesAnterior = saldoProjetadoAteMes(mesAntObj.ano, mesAntObj.mes);
  const movReal = movimentoRealizadoDoMes(mv.ano, mv.mes);
  const movPendente = movimentoPendenteDoMes(mv.ano, mv.mes);
  const saldoAtualMes = master ? saldoMesAnterior + movReal.entradas - movReal.saidas : null;
  const saldoFinalPrevisto = master ? saldoAtualMes + movPendente.entradas - movPendente.saidas : null;

  const seletorMesHTML = `
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="icon-btn" data-action="mes-prev" style="font-size:14px; padding:5px 10px; border:1px solid var(--border); border-radius:var(--r);">◀</button>
      <div style="text-align:center; min-width:150px;">
        <input type="month" id="mesManualInput" value="${mv.ano}-${String(mv.mes+1).padStart(2,'0')}" style="font-family:var(--font-ui); font-weight:700; font-size:14px; border:none; background:transparent; text-align:center; cursor:pointer; color:var(--ink); padding:2px;">
        <div>${!isMesAtual ? `<span style="font-size:10.5px; color:var(--ink-4); cursor:pointer; text-decoration:underline;" data-action="mes-hoje">voltar pro mês atual</span>` : `<span style="font-size:10.5px; color:var(--ink-4);">mês atual</span>`}</div>
      </div>
      <button class="icon-btn" data-action="mes-next" style="font-size:14px; padding:5px 10px; border:1px solid var(--border); border-radius:var(--r);">▶</button>
      <button class="icon-btn" data-action="toggle-executivo-oculto" title="${oculto?'Mostrar valores':'Ocultar valores'}" style="font-size:16px; padding:6px 10px; border:1px solid var(--border); border-radius:var(--r); margin-left:6px;">${oculto?'🙈':'👁️'}</button>
    </div>`;

  const patrimonioHTML = `
    <div class="panel" style="margin:0;"><div class="panel-head"><div class="panel-title">💰 Patrimônio</div></div><div class="panel-body">
      <div class="kpi-grid" style="grid-template-columns:repeat(2,1fr); margin-bottom:0;">
        ${master ? vgKpiCard("Saldo atual", vv(saldoAtualMes), isMesAtual?"Realizado até hoje":"Realizado até o fim do mês", saldoAtualMes>=0?"pos":"neg", {modulo:"financeiro", view:"contas", label:"Contas"}) : ""}
        ${master ? vgKpiCard("Saldo previsto (fim do mês)", vv(saldoFinalPrevisto), "Com o que ainda falta entrar/sair", saldoFinalPrevisto>=0?"pos":"neg") : ""}
        ${vgKpiCard("Receita do mês", vv(receitaPrevistaMes), `Já recebido: ${vv(receitaRealizadaMes)}`, "pos", {modulo:"financeiro", view:"receitas", label:"Contas a Receber"})}
        ${vgKpiCard("Despesa do mês", vv(despesaPrevistaMes), `Já pago: ${vv(despesaRealizadaMes)}`, "neg", {modulo:"financeiro", view:"despesas", label:"Contas a Pagar"})}
      </div>
    </div></div>
    <div class="panel" style="margin:0;"><div class="panel-head"><div class="panel-title">📈 Evolução vs mês anterior</div></div><div class="panel-body">
      ${vgBarraEvolucao("Receita (realizada)", receitaRealizadaMes, receitaRealizadaMesAnt, true)}
      ${vgBarraEvolucao("Despesa (realizada)", despesaRealizadaMes, despesaRealizadaMesAnt, false)}
      ${vgBarraEvolucao("Resultado (realizado)", resultadoRealizadoMes, resultadoRealizadoMesAnt, true)}
    </div></div>
  `;

  // ---- Performance por negócio (margem + status), no mês selecionado ----
  const alertas = [];
  const linhasNegocio = negociosVisiveis.map(n => {
    const lancDoNeg = lancVis(l => l.negocio===n.nome && !l.inativo);
    const receitaMesNeg = lancDoNeg.filter(l=>l.tipo==="Receita" && l.status==="Pago" && l.data>=inicioMesISO && l.data<=fimMesISO).reduce((s,l)=>s+Number(l.valor),0);
    const despesaMesNeg = lancDoNeg.filter(l=>l.tipo==="Despesa" && l.status==="Pago" && l.data>=inicioMesISO && l.data<=fimMesISO).reduce((s,l)=>s+Number(l.valor),0);
    const aPagarNeg = lancDoNeg.filter(l=>l.tipo==="Despesa" && l.status!=="Pago" && l.data>=inicioMesISO && l.data<=fimMesISO).reduce((s,l)=>s+Number(l.valor),0);
    const clientesAtivosNeg = podeVerModulo("clientes") ? state.cliClientes.filter(c=>(c.contratos||[]).some(ct=>ct.negocio===n.nome && ct.status==="Ativo")).length : null;
    const margem = receitaMesNeg>0 ? Math.round(((receitaMesNeg-despesaMesNeg)/receitaMesNeg)*100) : null;
    const status = margem===null ? { rotulo:"Sem receita no mês", cor:"var(--ink-4)", ponto:"⚪" }
      : margem>=80 ? { rotulo:"Estável", cor:"var(--pos)", ponto:"🟢" }
      : margem>=40 ? { rotulo:"Atenção", cor:"#D97706", ponto:"🟡" }
      : { rotulo:"Crítico", cor:"var(--neg)", ponto:"🔴" };
    if(isMesAtual && margem!==null && margem<40){
      alertas.push({
        tipo:"margem", negocio:n.nome,
        texto: `${n.nome}: margem de ${margem}% este mês — abaixo do ideal.`,
        acao: `Revisar custos/preços de ${n.nome} (margem crítica: ${margem}%).`,
      });
    }
    return { n, receitaMesNeg, despesaMesNeg, aPagarNeg, clientesAtivosNeg, margem, status };
  }).filter(l => l.receitaMesNeg>0 || l.despesaMesNeg>0 || l.aPagarNeg>0 || l.clientesAtivosNeg>0); // esconde negócio 100% inativo esse mês

  const tabelaNegociosHTML = linhasNegocio.length ? `
    <div style="overflow-x:auto;">
      <table style="min-width:600px;"><thead><tr>
        <th>Negócio</th><th class="num">Receita/mês</th><th class="num">A pagar (mês)</th><th class="num">Margem</th>${podeVerModulo("clientes")?`<th class="num">Clientes</th>`:""}<th>Status</th>
      </tr></thead><tbody>
        ${linhasNegocio.sort((a,b)=>b.receitaMesNeg-a.receitaMesNeg).map(l => `<tr style="cursor:pointer;" data-action="vg-ver-negocio" data-negocio="${esc(l.n.nome)}" title="Ver lançamentos de ${esc(l.n.nome)}">
          <td style="font-weight:600;"><span class="tag-dot" style="background:${negocioCor(l.n.nome)}; display:inline-block; margin-right:6px;"></span>${esc(l.n.nome)}</td>
          <td class="num" style="color:var(--pos);">${vv(l.receitaMesNeg)}</td>
          <td class="num" style="color:var(--neg);">${vv(l.aPagarNeg)}</td>
          <td class="num" style="color:${l.status.cor}; font-weight:700;">${l.margem===null?"—":l.margem+"%"}</td>
          ${podeVerModulo("clientes")?`<td class="num">${l.clientesAtivosNeg}</td>`:""}
          <td>${l.status.ponto} ${l.status.rotulo}</td>
        </tr>`).join("")}
      </tbody></table>
    </div>
  ` : emptyState("Nenhum negócio com movimento nesse mês.");

  // ---- Gráfico: evolução do saldo consolidado, últimos 12 meses (master only) ----
  const graficoSaldoHTML = master ? (() => {
    const pontos = [];
    for(let i=11; i>=0; i--){
      let mes = mv.mes-i, ano = mv.ano;
      while(mes<0){ mes+=12; ano-=1; }
      pontos.push({ ano, mes, label: `${NOMES_MESES[mes].slice(0,3)}/${String(ano).slice(2)}`, valor: saldoProjetadoAteMes(ano,mes) });
    }
    const primeiro = pontos[0], ultimo = pontos[pontos.length-1];
    const maiorPico = pontos.reduce((a,b)=>b.valor>a.valor?b:a);
    const menorPico = pontos.reduce((a,b)=>b.valor<a.valor?b:a);
    const varTotal = vgVarPct(ultimo.valor, primeiro.valor);
    return `<div class="panel" style="margin-bottom:16px;">
      <div class="panel-head"><div class="panel-title">📈 Evolução do saldo — últimos 12 meses</div></div>
      <div class="panel-body">
        ${oculto ? `<div style="padding:30px 0; text-align:center; color:var(--ink-4); font-size:13px;">Valores ocultos — clique no 👁️ pra ver o gráfico</div>` : svgLinhaSaldo(pontos, 140)}
        <div style="display:flex; flex-wrap:wrap; gap:16px; margin-top:14px; padding-top:12px; border-top:1px solid var(--border); font-size:12px; color:var(--ink-3);">
          <div>📌 Maior saldo: <strong style="color:var(--ink);">${vv(maiorPico.valor)}</strong> (${maiorPico.label})</div>
          <div>📌 Menor saldo: <strong style="color:var(--ink);">${vv(menorPico.valor)}</strong> (${menorPico.label})</div>
          <div>📌 Variação em 12 meses: <strong style="color:${varTotal.pct>=0?'var(--pos)':'var(--neg)'};">${varTotal.texto}</strong></div>
        </div>
      </div>
    </div>`;
  })() : "";

  // ---- Gráfico: receita por negócio (mês selecionado) — linhasNegocio já
  // vem ordenado desc por receita (o .sort() acima, em tabelaNegociosHTML,
  // muta o array e reaproveitamos a mesma ordem aqui). ----
  const comReceita = linhasNegocio.filter(l=>l.receitaMesNeg>0);
  const graficoReceitaHTML = comReceita.length ? (() => {
    const totalReceita = comReceita.reduce((s,l)=>s+l.receitaMesNeg,0);
    const maxReceita = Math.max(...comReceita.map(l=>l.receitaMesNeg));
    const barras = comReceita.map(l => {
      const pctDoTotal = totalReceita>0 ? Math.round((l.receitaMesNeg/totalReceita)*100) : 0;
      const tip = `<div>${esc(l.n.nome)}</div><div class="tip-val">${fmtBRL(l.receitaMesNeg)}</div><div>${pctDoTotal}% do total</div>`;
      return graficoBarraHTML(l.n.nome, (l.receitaMesNeg/maxReceita)*100, negocioCor(l.n.nome), oculto?"••••":`${pctDoTotal}%`, tip, negocioCor(l.n.nome));
    }).join("");
    const top1 = comReceita[0], top2 = comReceita[1];
    const pctTop1 = totalReceita>0 ? Math.round((top1.receitaMesNeg/totalReceita)*100) : 0;

    const menor = comReceita[comReceita.length-1];
    return `<div class="panel" style="margin-bottom:16px;">
      <div class="panel-head"><div class="panel-title">📊 Receita por negócio — ${isMesAtual?"este mês":`${NOMES_MESES[mv.mes]}/${mv.ano}`}</div></div>
      <div class="panel-body">
        ${barras}
        <div style="display:flex; flex-direction:column; gap:4px; margin-top:12px; padding-top:12px; border-top:1px solid var(--border); font-size:12px; color:var(--ink-3);">
          <div>📌 <strong style="color:var(--ink);">${esc(top1.n.nome)}</strong> representa ${oculto?"—":pctTop1+"%"} da receita total do período</div>
          ${top2 ? `<div>📌 <strong style="color:var(--ink);">${esc(top1.n.nome)} + ${esc(top2.n.nome)}</strong> juntos = ${oculto?"—":pctTop2+"%"}</div>` : ""}
          ${comReceita.length>1 ? `<div>📌 <strong style="color:var(--ink);">${esc(menor.n.nome)}</strong>: menor faturamento do período</div>` : ""}
        </div>
      </div>
    </div>`;
  })() : "";

  // ---- Gráfico: margem por negócio (mês selecionado) ----
  const comMargem = linhasNegocio.filter(l=>l.margem!==null).slice().sort((a,b)=>b.margem-a.margem);
  const graficoMargemHTML = comMargem.length ? (() => {
    const media = Math.round(comMargem.reduce((s,l)=>s+l.margem,0)/comMargem.length);
    const barras = comMargem.map(l => {
      const tip = `<div>${esc(l.n.nome)}</div><div class="tip-val">${l.margem}% de margem</div><div>Receita: ${fmtBRL(l.receitaMesNeg)}</div>`;
      return graficoBarraHTML(l.n.nome, l.margem, l.status.cor, `${l.status.ponto} ${l.margem}%`, tip);
    }).join("");
    const critico = comMargem.filter(l=>l.margem<40);
    return `<div class="panel" style="margin-bottom:16px;">
      <div class="panel-head"><div class="panel-title">💼 Margem por negócio — ${isMesAtual?"este mês":`${NOMES_MESES[mv.mes]}/${mv.ano}`}</div></div>
      <div class="panel-body">
        ${barras}
        <div style="display:flex; flex-wrap:wrap; gap:16px; margin-top:12px; padding-top:12px; border-top:1px solid var(--border); font-size:12px; color:var(--ink-3);">
          <div>📌 Média do holding: <strong style="color:var(--ink);">${media}%</strong></div>
          ${critico.length ? `<div style="color:var(--neg);">🔴 ${critico.map(l=>esc(l.n.nome)).join(", ")}: margem crítica (abaixo de 40%)</div>` : `<div style="color:var(--pos);">🟢 Nenhum negócio em margem crítica</div>`}
        </div>
      </div>
    </div>`;
  })() : "";

  // ---- Top clientes por receita recorrente (MRR dos contratos ativos — não muda com o mês, é o valor recorrente atual) ----
  const topClientesHTML = podeVerModulo("clientes") ? (() => {
    const comMrr = state.cliClientes.map(c => {
      const contratosAtivos = (c.contratos||[]).filter(ct=>ct.status==="Ativo");
      const mrr = contratosAtivos.reduce((s,ct)=>{const p=cliPlanoById(ct.planoId); return s+(p?Number(p.valor||0):0);},0);
      const negs = [...new Set(contratosAtivos.map(ct=>ct.negocio).filter(Boolean))];
      return { c, mrr, negs };
    }).filter(x => x.mrr>0).sort((a,b)=>b.mrr-a.mrr).slice(0,3);
    if(!comMrr.length) return "";
    return `<div class="panel" style="margin:0;"><div class="panel-head"><div class="panel-title">🏆 Top clientes (receita recorrente)</div></div><div class="panel-body">
      ${comMrr.map((x,i) => `<div style="display:flex; justify-content:space-between; align-items:center; padding:7px 0; ${i?'border-top:1px solid var(--border);':''}">
        <div style="font-size:13px;"><strong>${i+1}.</strong> ${esc(cliNome(x.c))} <span style="color:var(--ink-4); font-size:11.5px;">(${esc(x.negs.join(", ")||"—")})</span></div>
        <div style="font-weight:700; font-size:13px; color:var(--pos);">${vv(x.mrr)}/mês</div>
      </div>`).join("")}
    </div></div>`;
  })() : "";

  // ---- Chamados parados há muito tempo (alerta operacional — sempre em tempo real, não muda com o mês navegado) ----
  if(podeVerModulo("clientes") && isMesAtual){
    const LIMITE_DIAS = 3;
    state.cliChamados.filter(c => !["Concluído","Cancelado"].includes(c.status)).forEach(c => {
      const dias = Math.floor((new Date(todayISO()+"T00:00:00") - new Date((c.dataCadastro||todayISO())+"T00:00:00")) / 86400000);
      if(dias >= LIMITE_DIAS){
        alertas.push({
          tipo:"chamado", negocio:c.negocio||"",
          texto: `Chamado ${c.numero}${c.negocio?` (${c.negocio})`:""}: em aberto há ${dias} dia(s).`,
          acao: `Priorizar o chamado ${c.numero} — parado há ${dias} dia(s).`,
        });
      }
    });
  }

  const alertasHTML = alertas.length ? `
    <div class="panel" style="margin:0; border-color:var(--neg);"><div class="panel-head"><div class="panel-title" style="color:var(--neg);">🔴 Alertas</div></div><div class="panel-body">
      ${alertas.map(a => `<div style="font-size:13px; padding:5px 0; display:flex; gap:8px;"><span>⚠</span><span>${esc(a.texto)}</span></div>`).join("")}
    </div></div>
    <div class="panel" style="margin:0;"><div class="panel-head"><div class="panel-title">📌 Ações recomendadas</div></div><div class="panel-body">
      ${alertas.map((a,i) => `<div style="font-size:13px; padding:5px 0;">${i+1}. ${esc(a.acao)}</div>`).join("")}
    </div></div>
  ` : `<div class="panel" style="margin:0;"><div class="panel-body">${emptyState(isMesAtual ? "Nada precisando de atenção agora. 🎉" : "Alertas operacionais só valem pro mês atual.")}</div></div>`;

  return `
    <div class="page-header">
      <div><div class="page-title">🎯 Executivo</div><div class="page-sub">${isMesAtual ? `Posição hoje, ${fmtDateBR(todayISO())} · ${new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}` : `Vendo ${NOMES_MESES[mv.mes]}/${mv.ano}`}</div></div>
      ${seletorMesHTML}
    </div>
    <div class="two-col" style="margin-bottom:16px;">${patrimonioHTML}</div>
    ${graficoSaldoHTML}
    <div class="two-col" style="margin-bottom:16px;">${graficoReceitaHTML}${graficoMargemHTML}</div>
    <div class="panel" style="margin-bottom:16px;"><div class="panel-head"><div class="panel-title">💼 Performance por negócio (detalhado)</div></div><div class="panel-body">${tabelaNegociosHTML}</div></div>
    ${topClientesHTML ? `<div style="margin-bottom:16px;">${topClientesHTML}</div>` : ""}
    <div class="two-col">${alertasHTML}</div>
  `;
}

function viewVgSintetico(){
  const hoje = new Date();
  const inicioMesISO = new Date(hoje.getFullYear(), hoje.getMonth(), 1).toISOString().slice(0,10);
  const fimMesISO = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).toISOString().slice(0,10);
  const negociosVisiveis = state.negocios.filter(n => ehMaster() || podeVerNegocio(n.nome));

  // Lançamentos sem negócio marcado não somem — entram num bloco à parte,
  // pra não ficar "invisível" quando alguém esquece de marcar o negócio.
  const semNegocio = lancamentosVisiveis(state.lancamentos.filter(l => !l.negocio && !l.inativo && l.tipo!=="Transferência"));
  const blocoSemNegocio = semNegocio.length ? (() => {
    const aReceber = semNegocio.filter(l=>l.tipo==="Receita" && l.status!=="Pago").reduce((s,l)=>s+Number(l.valor),0);
    const aPagar = semNegocio.filter(l=>l.tipo==="Despesa" && l.status!=="Pago").reduce((s,l)=>s+Number(l.valor),0);
    return `<div style="margin-bottom:22px;">
      <div style="font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); font-weight:700; margin-bottom:10px;">🗂️ Sem negócio definido</div>
      <div class="kpi-grid" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr));">
        ${vgKpiCard("A receber", fmtBRL(aReceber), "Pendente/agendado", "pos", {modulo:"financeiro", view:"receitas", label:"Contas a Receber"})}
        ${vgKpiCard("A pagar", fmtBRL(aPagar), "Pendente/agendado", "neg", {modulo:"financeiro", view:"despesas", label:"Contas a Pagar"})}
      </div>
    </div>`;
  })() : "";

  const blocos = negociosVisiveis.map(n => vgBlocoNegocio(n, inicioMesISO, fimMesISO)).join("");

  return `
    <div class="page-header">
      <div><div class="page-title">Visão Geral — Sintético</div><div class="page-sub">Panorama por negócio, em tempo real.</div></div>
    </div>
    ${blocos || emptyState("Nenhum negócio visível pra esse usuário.")}${blocoSemNegocio}
  `;
}

function viewVgAnalitico(){
  const negociosVisiveis = state.negocios.filter(n => ehMaster() || podeVerNegocio(n.nome));
  const hoje = new Date();
  const inicioMesISO = new Date(hoje.getFullYear(), hoje.getMonth(), 1).toISOString().slice(0,10);
  const fimMesISO = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).toISOString().slice(0,10);
  const vErEstoque = podeVerModulo("estoque"), vErClientes = podeVerModulo("clientes"), vErRh = podeVerModulo("rh");

  const linhas = negociosVisiveis.map(n => {
    const lancDoNeg = lancamentosVisiveis(state.lancamentos.filter(l => l.negocio===n.nome && !l.inativo));
    const receitaMes = lancDoNeg.filter(l=>l.tipo==="Receita" && l.status==="Pago" && l.data>=inicioMesISO && l.data<=fimMesISO).reduce((s,l)=>s+Number(l.valor),0);
    const despesaMes = lancDoNeg.filter(l=>l.tipo==="Despesa" && l.status==="Pago" && l.data>=inicioMesISO && l.data<=fimMesISO).reduce((s,l)=>s+Number(l.valor),0);
    const aReceber = lancDoNeg.filter(l=>l.tipo==="Receita" && l.status!=="Pago" && l.data>=inicioMesISO && l.data<=fimMesISO).reduce((s,l)=>s+Number(l.valor),0);
    const aPagar = lancDoNeg.filter(l=>l.tipo==="Despesa" && l.status!=="Pago" && l.data>=inicioMesISO && l.data<=fimMesISO).reduce((s,l)=>s+Number(l.valor),0);
    const abaixoMinimo = vErEstoque ? state.estProdutos.filter(p => p.negocio===n.nome && estSaldoAtual(p.id)<=Number(p.estoqueMinimo||0) && Number(p.estoqueMinimo||0)>0).length : null;
    const clientesAtivos = vErClientes ? state.cliClientes.filter(c => (c.contratos||[]).some(ct=>ct.negocio===n.nome && ct.status==="Ativo")).length : null;
    const chamadosAbertos = vErClientes ? state.cliChamados.filter(c => c.negocio===n.nome && ["Aberto","Agendado","Em atendimento"].includes(c.status)).length : null;
    const funcionariosAtivos = vErRh ? state.rhFuncionarios.filter(f => f.negocio===n.nome && f.status!=="Desligado").length : null;
    return `<tr>
      <td style="font-weight:600; cursor:pointer; color:var(--accent); white-space:nowrap;" data-action="vg-ver-negocio" data-negocio="${esc(n.nome)}" title="Ver lançamentos de ${esc(n.nome)}"><span class="tag-dot" style="background:${negocioCor(n.nome)}; display:inline-block; margin-right:6px;"></span>${esc(n.nome)}</td>
      <td class="num" style="color:var(--pos);">${fmtBRL(receitaMes)}</td>
      <td class="num" style="color:var(--neg);">${fmtBRL(despesaMes)}</td>
      <td class="num" style="font-weight:600; color:${(receitaMes-despesaMes)>=0?'var(--pos)':'var(--neg)'};">${fmtBRL(receitaMes-despesaMes)}</td>
      <td class="num" style="color:var(--ink-3);">${fmtBRL(aReceber)}</td>
      <td class="num" style="color:var(--ink-3);">${fmtBRL(aPagar)}</td>
      ${vErEstoque ? `<td class="num" style="color:${abaixoMinimo>0?'var(--neg)':'var(--ink-3)'};">${abaixoMinimo}</td>` : ""}
      ${vErClientes ? `<td class="num">${clientesAtivos}</td><td class="num">${chamadosAbertos}</td>` : ""}
      ${vErRh ? `<td class="num">${funcionariosAtivos}</td>` : ""}
    </tr>`;
  }).join("");

  const totalCols = 6 + (vErEstoque?1:0) + (vErClientes?2:0) + (vErRh?1:0);
  return `
    <div class="page-header">
      <div><div class="page-title">Visão Geral — Analítico</div><div class="page-sub">Comparativo por negócio — só entram os negócios que esse usuário pode ver.</div></div>
    </div>
    <div class="panel"><div class="panel-body" style="overflow-x:auto;">
      <table style="min-width:760px;"><thead><tr>
        <th>Negócio</th><th class="num">Receita (mês)</th><th class="num">Despesa (mês)</th><th class="num">Resultado (mês)</th>
        <th class="num">A receber (mês)</th><th class="num">A pagar (mês)</th>
        ${vErEstoque ? `<th class="num">Abaixo do mín.</th>` : ""}
        ${vErClientes ? `<th class="num">Clientes ativos</th><th class="num">Chamados abertos</th>` : ""}
        ${vErRh ? `<th class="num">Funcionários</th>` : ""}
      </tr></thead>
      <tbody>${linhas || `<tr><td colspan="${totalCols}">${emptyState("Nenhum negócio visível pra esse usuário.")}</td></tr>`}</tbody></table>
    </div></div>
  `;
}

function viewCadastroHub(){
  const master = ehMaster();
  const gruposHTML = CADASTRO_TIPOS.map(grupo => {
    const itensVisiveis = grupo.itens.filter(it => (!it.soMaster || master) && (!it.requerModulo || podeCriarModulo(it.requerModulo)));
    if(!itensVisiveis.length) return "";
    const cardsHTML = itensVisiveis.map(it => `
      <div class="kpi-card" style="cursor:pointer; position:relative; transition:border-color .12s, box-shadow .12s;" data-action="cad-abrir" data-tipo="${it.id}"
        onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
        ${it.destino ? `<button type="button" class="icon-btn" data-action="cad-ver-lista" data-modulo="${it.destino.modulo}" data-view="${it.destino.view}" title="Ver lista de ${esc(it.nome)}" style="position:absolute; top:6px; right:6px; font-size:12px; padding:3px 6px;">↗</button>` : ""}
        <div style="font-size:22px; margin-bottom:8px;">${it.ico}</div>
        <div style="font-weight:700; font-size:13.5px; color:var(--ink); padding-right:18px;">${it.nome}</div>

      </div>`).join("");
    return `
      <div style="margin-bottom:22px;">
        <div style="font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); font-weight:700; margin-bottom:10px;">${grupo.grupo}</div>
        <div class="kpi-grid" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); margin-bottom:0;">${cardsHTML}</div>

  return `

      <div><div class="page-title">Central de Cadastros</div><div class="page-sub">Escolha o que você quer cadastrar — cada um já pergunta o negócio quando fizer sentido, e vai direto pro módulo dele.</div></div>

    </div>
    ${gruposHTML || emptyState("Nenhum tipo de cadastro disponível para o seu perfil.")}
  `;
}

function parseTabularText(texto){
  const t = texto.replace(/\r\n/g,"\n").replace(/\r/g,"\n").trim();
  if(!t) return { headers:[], rows:[] };
  const linhas = t.split("\n").filter(l => l.length);
  const candidatos = [",",";","\t"];
  const delim = candidatos.reduce((melhor,d) => linhas[0].split(d).length > linhas[0].split(melhor).length ? d : melhor, ",");
  const parseLinha = (linha) => {
    const campos = []; let atual = "", dentroAspas = false;
    for(let i=0;i<linha.length;i++){
      const ch = linha[i];
      if(ch === '"'){ if(dentroAspas && linha[i+1] === '"'){ atual += '"'; i++; } else dentroAspas = !dentroAspas; }
      else if(ch === delim && !dentroAspas){ campos.push(atual); atual = ""; }
      else atual += ch;
    }
    campos.push(atual);
    return campos.map(c => c.trim());
  };
  const headers = parseLinha(linhas[0]);
  const rows = linhas.slice(1).map(parseLinha);
  return { headers, rows };
}
function parseXlsxArrayBuffer(buffer){
  const wb = XLSX.read(buffer, { type:"array" });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const linhas = XLSX.utils.sheet_to_json(sheet, { header:1, raw:false, defval:"" });
  const naoVazias = linhas.filter(l => l.some(c => String(c||"").trim() !== ""));
  if(!naoVazias.length) return { headers:[], rows:[] };
  const headers = naoVazias[0].map(h => String(h||"").trim());
  const rows = naoVazias.slice(1).map(l => headers.map((_,i) => String(l[i]??"").trim()));
  return { headers, rows };
}

function modalImportarDados(){
  if(!ehMaster()){ showToast("Apenas o Master pode importar dados.", "error"); return; }
  importState = { entidade:"", headers:[], rows:[], mapa:{} };

function renderImportFase1(){
  const opts = Object.entries(IMPORT_ENTIDADES).map(([id,e]) => `<option value="${id}" ${importState.entidade===id?"selected":""}>${esc(e.nome)}</option>`).join("");
  openModal(`
    <div class="modal-head"><div class="modal-title">📥 Importar dados</div><button class="modal-close" data-action="close-modal">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>O que você quer importar?</label><select id="importEntidade">${opts}</select></div>
      <div class="field"><label>Arquivo (CSV ou Excel .xlsx)</label><input type="file" id="importArquivo" accept=".csv,.xlsx,.xls"></div>
      <div class="field-help" style="margin:4px 0 10px;">— ou —</div>
      <div class="field"><label>Colar dados direto (copiado do Excel/Sheets, com a primeira linha de cabeçalho)</label>
        <textarea id="importColar" rows="6" style="font-family:var(--font-mono); font-size:12px; resize:vertical;" placeholder="nome	telefone	negocio&#10;Ana Souza	11999990000	Provedor"></textarea>
      </div>
      <div id="importErro" class="field-help" style="color:var(--neg); display:none;"></div>
    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="button" class="btn btn-primary" id="importAvancar">Avançar →</button></div>
  `);
  document.getElementById("importAvancar").addEventListener("click", async () => {
    const entidade = document.getElementById("importEntidade").value;
    const arquivo = document.getElementById("importArquivo").files[0];
    const colado = document.getElementById("importColar").value;
    const erroEl = document.getElementById("importErro");
    const mostrarErro = (msg) => { erroEl.textContent = msg; erroEl.style.display = "block"; };
    let parsed;
    try{
      if(arquivo){
        if(/\.xlsx?$/i.test(arquivo.name)){
          const buffer = await arquivo.arrayBuffer();
          parsed = parseXlsxArrayBuffer(buffer);
        }else{
          parsed = parseTabularText(await arquivo.text());
        }
      }else if(colado.trim()){
        parsed = parseTabularText(colado);
      }else{
        mostrarErro("Carregue um arquivo ou cole os dados antes de avançar.");
        return;
      }
    }catch(e){
      mostrarErro("Não consegui ler esse arquivo: " + (e.message||e));
      return;
    }
    if(!parsed.headers.length || !parsed.rows.length){
      mostrarErro("Não encontrei nenhuma linha de dados (verifique se a primeira linha é o cabeçalho).");
      return;
    }
    importState.entidade = entidade;
    importState.headers = parsed.headers;
    importState.rows = parsed.rows;
    importState.mapa = {};
    renderImportFase2();
  });
}
function renderImportFase2(){
  const cfg = IMPORT_ENTIDADES[importState.entidade];
  // tenta casar automaticamente pelo nome da coluna, mas o usuário confirma/ajusta tudo
  importState.headers.forEach((h,i) => {
    if(importState.mapa[i] !== undefined) return;
    const hNorm = h.trim().toLowerCase();
    const campo = cfg.campos.find(c => c.key.toLowerCase() === hNorm || c.label.toLowerCase().startsWith(hNorm));
    importState.mapa[i] = campo ? campo.key : "";
  });
  const linhasMapeamento = importState.headers.map((h,i) => `
    <tr>
      <td style="font-weight:600;">${esc(h)}</td>
      <td>
        <select class="import-map-select" data-col="${i}">
          <option value="">— Ignorar essa coluna —</option>
          ${cfg.campos.map(c => `<option value="${c.key}" ${importState.mapa[i]===c.key?"selected":""}>${esc(c.label)}${c.obrigatorio?" *":""}</option>`).join("")}
        </select>
      </td>
      <td style="color:var(--ink-4); font-size:11.5px; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(importState.rows.slice(0,2).map(r=>r[i]).filter(Boolean).join(" · "))}</td>
    </tr>`).join("");
  openModal(`
    <div class="modal-head"><div class="modal-title">📥 Importar ${esc(cfg.nome)} — mapear colunas</div><button class="modal-close" data-action="close-modal">✕</button></div>
    <div class="modal-body">
      <div class="field-help" style="margin-bottom:10px;">${importState.rows.length} linha(s) encontrada(s). Escolha qual campo do sistema cada coluna preenche — campos marcados com * são obrigatórios.</div>
      <div style="max-height:320px; overflow-y:auto; border:1px solid var(--border); border-radius:var(--r);">
        <table><thead><tr><th>Coluna do arquivo</th><th>Vira no sistema</th><th>Exemplo</th></tr></thead><tbody>${linhasMapeamento}</tbody></table>
      </div>
      <div id="importErro2" class="field-help" style="color:var(--neg); display:none; margin-top:10px;"></div>
    </div><div class="modal-foot">
      <button type="button" class="btn btn-ghost" data-action="import-voltar">← Voltar</button>
      <button type="button" class="btn btn-primary" id="importConfirmar">Importar ${importState.rows.length} registro(s)</button>
    </div>
  `);
  document.querySelectorAll(".import-map-select").forEach(sel => {
    sel.addEventListener("change", () => { importState.mapa[Number(sel.dataset.col)] = sel.value; });
  });
  document.getElementById("importConfirmar").addEventListener("click", async () => {
    const camposObrigatorios = cfg.campos.filter(c => c.obrigatorio).map(c => c.key);
    const colunaDoCampo = {};
    Object.entries(importState.mapa).forEach(([col,key]) => { if(key) colunaDoCampo[key] = Number(col); });
    const faltando = camposObrigatorios.filter(k => colunaDoCampo[k] === undefined);
    if(faltando.length){
      const el = document.getElementById("importErro2");
      const labels = faltando.map(k => cfg.campos.find(c=>c.key===k).label).join(", ");
      el.textContent = `Mapeie os campos obrigatórios antes de importar: ${labels}.`;
      el.style.display = "block";
      return;
    }
    let importados = 0, ignorados = 0;
    const novos = [];
    importState.rows.forEach(row => {
      const valores = {};
      Object.entries(colunaDoCampo).forEach(([key,col]) => { valores[key] = row[col] ?? ""; });
      if(camposObrigatorios.some(k => !String(valores[k]||"").trim())){ ignorados++; return; }
      novos.push({ id: uid(cfg.arr), ...cfg.montar(valores) });
      importados++;
    });
    if(!novos.length){ document.getElementById("importErro2").textContent = "Nenhuma linha válida pra importar (confira os campos obrigatórios)."; document.getElementById("importErro2").style.display = "block"; return; }
    state[cfg.arr].push(...novos);
    await saveRows(cfg.tabela, novos);
    closeModal(); renderApp();
    showToast(`${importados} ${cfg.nome.toLowerCase()}(s) importado(s)${ignorados?`, ${ignorados} ignorado(s) por falta de dado obrigatório`:""}.`);
  });
}

// ============================================================
// RELATÓRIOS — Fluxo de Caixa e DRE. Ambos usam state.mesVisualizado (o
// mesmo seletor de mês do Dashboard/Executivo) como mês/mês-final de
// referência, pra ficar consistente com o resto do sistema.
// ============================================================
let relFluxoPeriodo = 6; // quantos meses pra trás mostrar, terminando no mês selecionado

function viewRelFluxoCaixa(){
  const mv = state.mesVisualizado;
  const hoje = new Date();
  const isMesAtual = mv.ano === hoje.getFullYear() && mv.mes === hoje.getMonth();
  const lancVis = (filtro) => lancamentosVisiveis(state.lancamentos.filter(filtro));

  const meses = [];
  for(let i=relFluxoPeriodo-1; i>=0; i--){
    let mes = mv.mes - i, ano = mv.ano;
    while(mes < 0){ mes += 12; ano -= 1; }
    meses.push({ ano, mes });
  }
  let saldoAcumulado = null; // só existe se master (saldo de contas é master-only)
  const master = ehMaster();
  if(master && meses.length){
    const primeiro = meses[0];
    const mesAntesDoPrimeiro = primeiro.mes===0 ? {ano:primeiro.ano-1, mes:11} : {ano:primeiro.ano, mes:primeiro.mes-1};
    saldoAcumulado = saldoProjetadoAteMes(mesAntesDoPrimeiro.ano, mesAntesDoPrimeiro.mes);
  }
  const linhas = meses.map(({ano,mes}) => {
    const ini = new Date(ano,mes,1).toISOString().slice(0,10);
    const fim = new Date(ano,mes+1,0).toISOString().slice(0,10);
    const entradas = lancVis(l=>l.tipo==="Receita" && !l.inativo && l.status==="Pago" && l.data>=ini && l.data<=fim).reduce((s,l)=>s+Number(l.valor),0);
    const saidas = lancVis(l=>l.tipo==="Despesa" && !l.inativo && l.status==="Pago" && l.data>=ini && l.data<=fim).reduce((s,l)=>s+Number(l.valor),0);
    if(saldoAcumulado!==null) saldoAcumulado += entradas - saidas;
    return { ano, mes, entradas, saidas, resultado: entradas-saidas, saldo: saldoAcumulado };
  });
  const totalEntradas = linhas.reduce((s,l)=>s+l.entradas,0);
  const totalSaidas = linhas.reduce((s,l)=>s+l.saidas,0);

  const linhasHTML = linhas.map(l => `<tr>
    <td style="font-weight:600;">${NOMES_MESES[l.mes]}/${l.ano}</td>
    <td class="num" style="color:var(--pos);">${fmtBRL(l.entradas)}</td>
    <td class="num" style="color:var(--neg);">${fmtBRL(l.saidas)}</td>
    <td class="num" style="font-weight:600; color:${l.resultado>=0?'var(--pos)':'var(--neg)'};">${fmtBRL(l.resultado)}</td>
    ${master ? `<td class="num">${fmtBRL(l.saldo)}</td>` : ""}
  </tr>`).join("");

  return `
    <div class="page-header">
      <div><div class="page-title">💵 Fluxo de Caixa</div><div class="page-sub">Entradas e saídas realizadas (pagas) mês a mês — termina em ${isMesAtual?"o mês atual":`${NOMES_MESES[mv.mes]}/${mv.ano}`}.</div></div>
      <div style="display:flex; align-items:center; gap:8px;">
        <select id="relFluxoPeriodoSelect" style="font-family:var(--font-ui); font-size:13px; padding:8px 10px; border-radius:var(--r); border:1px solid var(--border);">
          <option value="3" ${relFluxoPeriodo===3?"selected":""}>Últimos 3 meses</option>
          <option value="6" ${relFluxoPeriodo===6?"selected":""}>Últimos 6 meses</option>
          <option value="12" ${relFluxoPeriodo===12?"selected":""}>Últimos 12 meses</option>
        </select>
        <button class="icon-btn" data-action="mes-prev" title="Mês anterior" style="font-size:14px; padding:6px 12px; border:1px solid var(--border); border-radius:var(--r);">◀</button>
        ${!isMesAtual ? `<button class="icon-btn" data-action="mes-hoje" title="Voltar para o mês atual" style="font-size:12px; padding:6px 10px; border:1px solid var(--border); border-radius:var(--r); white-space:nowrap;">Hoje</button>` : ""}
        <button class="icon-btn" data-action="mes-next" title="Próximo mês" style="font-size:14px; padding:6px 12px; border:1px solid var(--border); border-radius:var(--r);">▶</button>
      </div>
    </div>
    <div class="kpi-grid" style="grid-template-columns:repeat(${master?3:2},1fr); margin-bottom:16px;">
      ${vgKpiCard("Total de entradas", fmtBRL(totalEntradas), `${relFluxoPeriodo} meses`, "pos")}
      ${vgKpiCard("Total de saídas", fmtBRL(totalSaidas), `${relFluxoPeriodo} meses`, "neg")}
      ${master ? vgKpiCard("Resultado do período", fmtBRL(totalEntradas-totalSaidas), "Entradas − saídas", (totalEntradas-totalSaidas)>=0?"pos":"neg") : ""}
    </div>
    <div class="panel"><div class="panel-body" style="overflow-x:auto;">
      <table style="min-width:${master?560:460}px;"><thead><tr>
        <th>Mês</th><th class="num">Entradas</th><th class="num">Saídas</th><th class="num">Resultado</th>${master?`<th class="num">Saldo acumulado</th>`:""}
      </tr></thead><tbody>${linhasHTML}</tbody></table>
    </div></div>
    <div class="field-help" style="margin-top:10px;">Mostra só o que já foi de fato pago/recebido (realizado) — não entra provisionado nem recorrência futura. Diário/semanal ainda não tem tela própria; peça se precisar.</div>
  `;
}

// ---- DRE (Demonstração de Resultado) — simplificado: sem linha de
// "Deduções" (impostos/comissões não são rastreados separado ainda) e sem
// separar juros/depreciação do resultado final (por isso "EBITDA" e "Lucro
// líquido" saem iguais aqui) — mas os números que ELE mostra são reais,
// batidos com o que está lançado, não inventados.
let relDreNegocio = "";
function viewRelDre(){
  const mv = state.mesVisualizado;
  const hoje = new Date();
  const isMesAtual = mv.ano === hoje.getFullYear() && mv.mes === hoje.getMonth();
  const ini = new Date(mv.ano,mv.mes,1).toISOString().slice(0,10);
  const fim = new Date(mv.ano,mv.mes+1,0).toISOString().slice(0,10);
  const negociosVisiveis = state.negocios.filter(n => ehMaster() || podeVerNegocio(n.nome));
  if(relDreNegocio && !negociosVisiveis.some(n=>n.nome===relDreNegocio)) relDreNegocio = "";

  const base = lancamentosVisiveis(state.lancamentos.filter(l => !l.inativo && l.status==="Pago" && l.data>=ini && l.data<=fim && (!relDreNegocio || l.negocio===relDreNegocio)));
  const receitaBruta = base.filter(l=>l.tipo==="Receita").reduce((s,l)=>s+Number(l.valor),0);
  const despesas = base.filter(l=>l.tipo==="Despesa");
  const grupoDaCategoria = (nomeCat) => { const c = state.categorias.find(x=>x.nome===nomeCat); return (c && c.grupoDre) || "operacional"; };
  const custosDiretos = despesas.filter(l=>grupoDaCategoria(l.categoria)==="custo_direto").reduce((s,l)=>s+Number(l.valor),0);
  const despesasOperacionais = despesas.filter(l=>grupoDaCategoria(l.categoria)!=="custo_direto").reduce((s,l)=>s+Number(l.valor),0);
  const receitaLiquida = receitaBruta; // sem dedução rastreada ainda
  const lucroBruto = receitaLiquida - custosDiretos;
  const resultado = lucroBruto - despesasOperacionais;
  const margem = receitaBruta>0 ? Math.round((resultado/receitaBruta)*100) : null;

  const linha = (label, valor, opts={}) => `<div style="display:flex; justify-content:space-between; align-items:center; padding:${opts.grande?'12px 0':'8px 0'}; ${opts.semBorda?'':'border-top:1px solid var(--border);'} ${opts.indent?'padding-left:16px;':''}">
    <div style="font-size:${opts.grande?'14.5px':'13px'}; font-weight:${opts.grande?'700':opts.negrito?'600':'400'}; color:${opts.cor||'var(--ink)'};">${esc(label)}</div>
    <div style="font-family:var(--font-mono); font-size:${opts.grande?'15px':'13px'}; font-weight:${opts.grande||opts.negrito?'700':'400'}; color:${opts.cor||'var(--ink)'};">${valor}</div>
  </div>`;

  return `
    <div class="page-header">
      <div><div class="page-title">📑 DRE — Demonstração de Resultado</div><div class="page-sub">${isMesAtual?"Mês atual":`${NOMES_MESES[mv.mes]}/${mv.ano}`}${relDreNegocio?` · ${relDreNegocio}`:" · todos os negócios"} — simplificado (sem deduções fiscais rastreadas à parte)</div></div>
      <div style="display:flex; align-items:center; gap:8px;">
        <select id="relDreNegocioSelect" style="font-family:var(--font-ui); font-size:13px; padding:8px 10px; border-radius:var(--r); border:1px solid var(--border);">
          <option value="">Todos os negócios</option>
          ${negociosVisiveis.map(n=>`<option value="${esc(n.nome)}" ${relDreNegocio===n.nome?"selected":""}>${esc(n.nome)}</option>`).join("")}
        </select>
        <button class="icon-btn" data-action="mes-prev" title="Mês anterior" style="font-size:14px; padding:6px 12px; border:1px solid var(--border); border-radius:var(--r);">◀</button>
        ${!isMesAtual ? `<button class="icon-btn" data-action="mes-hoje" title="Voltar para o mês atual" style="font-size:12px; padding:6px 10px; border:1px solid var(--border); border-radius:var(--r); white-space:nowrap;">Hoje</button>` : ""}
        <button class="icon-btn" data-action="mes-next" title="Próximo mês" style="font-size:14px; padding:6px 12px; border:1px solid var(--border); border-radius:var(--r);">▶</button>
      </div>
    </div>
    <div class="panel"><div class="panel-body">
      ${linha("Receita Bruta", fmtBRL(receitaBruta), {negrito:true, semBorda:true})}
      ${linha("(−) Custos diretos", fmtBRL(-custosDiretos), {indent:true, cor:"var(--neg)"})}
      ${linha("= Lucro Bruto", fmtBRL(lucroBruto), {negrito:true})}
      ${linha("(−) Despesas operacionais", fmtBRL(-despesasOperacionais), {indent:true, cor:"var(--neg)"})}
      ${linha("= Resultado do período", fmtBRL(resultado), {grande:true, cor: resultado>=0?"var(--pos)":"var(--neg)"})}
    </div></div>
    <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr); margin-top:16px;">
      ${vgKpiCard("Receita bruta", fmtBRL(receitaBruta), "", "pos")}
      ${vgKpiCard("Total de despesas", fmtBRL(custosDiretos+despesasOperacionais), `${fmtBRL(custosDiretos)} custo direto + ${fmtBRL(despesasOperacionais)} operacional`, "neg")}
      ${vgKpiCard("Margem", margem===null?"—":margem+"%", "Resultado / receita bruta", margem===null?"":(margem>=0?"pos":"neg"))}
    </div>
    <div class="field-help" style="margin-top:10px;">"Custo direto" vs "Despesa operacional" é definido por categoria — edite em Categorias (Ajustes) pra reclassificar. Categoria sem grupo definido entra como despesa operacional.</div>
  `;
}

function viewContas(){
  const rowHTML = (c, nested) => {
    const sa = saldoAtual(c.id), sp = saldoProjetado(c.id), nc = naoConciliados(c.id);
    const inativa = c.ativa === false;
    const negTag = c.negocio
      ? `<span class="tag" style="background:color-mix(in srgb, ${negocioCor(c.negocio)} 14%, white); color:${negocioCor(c.negocio)}; margin-left:6px;"><span class="tag-dot" style="background:${negocioCor(c.negocio)}"></span>${esc(c.negocio)}</span>`
      : `<span class="tag" style="background:var(--muted-bg); color:var(--muted); margin-left:6px;">🌐 Todos os negócios</span>`;
    const nomeCell = nested ? `<span style="color:var(--ink-4); padding-left:18px;">↳</span> ${esc(c.nome)}` : `<strong>${esc(c.nome)}</strong>${negTag}<div style="font-size:11px;color:var(--ink-4)">${esc(c.instituicao)} · ${esc(c.tipo)}</div>`;
    const novaCaixinhaBtn = nested ? "" : `<button class="icon-btn" data-action="new-caixinha" data-id="${c.id}" title="Nova caixinha">＋📦</button>`;
    return `<tr style="${inativa ? 'opacity:.55;' : ''} ${nested ? 'background:var(--surface-2);' : ''}">
      ${bulkCheckboxCellHTML("contas", c.id)}
      <td style="${nested ? 'padding-left:26px;' : ''}">${nomeCell}</td>
      <td class="num ${receberDesbloqueado()?'':'masked-value'}">${maskBRL(c.saldoInicial, receberDesbloqueado())}</td>
      <td class="num ${receberDesbloqueado()?'':'masked-value'}" style="font-weight:600;">${maskBRL(sa, receberDesbloqueado())}</td>
      <td class="num ${receberDesbloqueado()?'':'masked-value'}">${maskBRL(sp, receberDesbloqueado())}</td>
      <td style="text-align:center;">${nc > 0 ? `<span class="status-pill status-pendente">${nc}</span>` : "—"}</td>
      <td style="text-align:center;"><span class="status-pill ${inativa ? 'status-agendado' : 'status-pago'}" style="cursor:pointer;" data-action="toggle-ativa" data-id="${c.id}" title="Clique para ${inativa?'ativar':'inativar'}">${inativa ? "Inativa" : "Ativa"}</span></td>
      <td><div class="row-actions">${novaCaixinhaBtn}<button class="icon-btn" data-action="conta-lancar-rendimento" data-id="${c.id}" title="Lançar rendimento (CDI/caixinha)" style="color:var(--pos);">📈</button><button class="icon-btn" data-action="edit-conta" data-id="${c.id}" title="Editar">✎</button><button class="icon-btn danger" data-action="del-conta" data-id="${c.id}" title="Excluir">🗑</button></div></td>
    </tr>`;
  };
  const todasContas = [...contasRaiz(), ...state.contas.filter(c=>c.parentId)];
  const rows = contasRaiz().map(c => rowHTML(c,false) + caixinhasDe(c.id).map(cx=>rowHTML(cx,true)).join("")).join("");
  return `
    <div class="page-header"><div><div class="page-title">Contas Bancárias</div><div class="page-sub">Saldo Atual soma só lançamentos Pagos. Use "＋📦" para criar caixinhas dentro de uma conta, e "📈" pra lançar rendimento (CDI de dia útil, por exemplo).</div></div><div style="display:flex; gap:8px;">${bulkBarraAcoesHTML("contas")}<button class="btn btn-primary" data-action="new-conta">+ Nova conta</button></div></div>
    <div class="panel"><div class="panel-body" style="padding-top:14px;"><table><thead><tr>${bulkCheckboxHeaderHTML("contas", todasContas.map(c=>c.id))}<th>Conta</th><th class="num">Saldo Inicial</th><th class="num">Saldo Atual</th><th class="num">Saldo Projetado</th><th style="text-align:center;">Não conc.</th><th style="text-align:center;">Status</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="8">${emptyState("Nenhuma conta cadastrada.")}</td></tr>`}</tbody></table></div></div>
  `;
}

// VIEW: CARTÕES DE CRÉDITO
// ============================================================
function viewCartoes(){
  const lockedPagar = !pagarDesbloqueado();
  const cardHTML = (c) => {
    const emAberto = faturaEmAberto(c.id);
    const disp = Number(c.limite||0) - emAberto;
    const inativo = c.ativo === false;
    const estourado = disp < 0;
    const todasFaturas = faturasAgrupadas(c.id);
    const faturas = todasFaturas.slice(0,6);
    const faturasHTML = faturas.length ? faturas.map(f => `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--border); font-size:12px;">
        <span style="color:var(--ink-3); cursor:pointer;" data-action="ver-fatura" data-id="${c.id}" data-venc="${f.data}">Vence ${fmtDateBR(f.data)} <span style="color:var(--ink-4);">(${f.itens.length} item${f.itens.length===1?'':'s'})</span></span>
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="${lockedPagar?'masked-value':''}" style="font-family:var(--font-mono); font-weight:600;">${maskBRL(f.total, pagarDesbloqueado())}</span>
          <button class="btn btn-ghost btn-sm" data-action="ver-fatura" data-id="${c.id}" data-venc="${f.data}">Detalhes</button>
          <button class="btn btn-ghost btn-sm" data-action="pagar-fatura" data-id="${c.id}" data-venc="${f.data}">Pagar fatura</button>
        </div>
      </div>`).join("") + (todasFaturas.length > faturas.length ? `<div style="font-size:11px; color:var(--ink-4); padding-top:6px;">+ ${todasFaturas.length - faturas.length} fatura(s) mais à frente</div>` : "")
      : `<div style="font-size:12px; color:var(--ink-4); padding:6px 0;">Nenhuma fatura em aberto.</div>`;
    const cor = PALETA_NEGOCIOS[state.cartoes.indexOf(c) % PALETA_NEGOCIOS.length];
    const negTag = c.negocio ? `<span class="tag" style="background:color-mix(in srgb, ${negocioCor(c.negocio)} 14%, white); color:${negocioCor(c.negocio)};"><span class="tag-dot" style="background:${negocioCor(c.negocio)}"></span>${esc(c.negocio)}</span>` : "";
    return `<div class="panel" style="margin-bottom:14px; ${inativo?'opacity:.55;':''}">
      <div style="padding:16px 18px; border-bottom:1px solid var(--border);">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
          <div>
            <div style="display:flex; align-items:center; gap:8px;"><input type="checkbox" data-action="bulk-toggle" data-contexto="cartoes" data-id="${c.id}" ${bulkSet("cartoes").has(c.id)?"checked":""} title="Selecionar"><span class="tag-dot" style="background:${cor};"></span><strong>${esc(c.nome)}</strong><span class="status-pill ${inativo?'status-agendado':'status-pago'}" style="cursor:pointer;" data-action="toggle-cartao-ativo" data-id="${c.id}">${inativo?"Inativo":"Ativo"}</span>${negTag}</div>
            <div style="font-size:12px; color:var(--ink-4); margin-top:3px;">${esc(c.bandeira)} · final ${esc(c.ultimosDigitos)} · fecha dia ${c.diaFechamento} · vence dia ${c.diaVencimento} · paga com ${contaLabel(contaById(c.contaPagamentoId))}</div>
          </div>
          <div class="row-actions"><button class="btn btn-primary btn-sm" data-action="new-compra-cartao" data-id="${c.id}">+ Compra</button><button class="icon-btn" data-action="edit-cartao" data-id="${c.id}" title="Editar">✎</button><button class="icon-btn danger" data-action="del-cartao" data-id="${c.id}" title="Excluir">🗑</button></div>
        </div>
      </div>
      <div class="panel-body" style="padding-top:14px;">
        <div class="kpi-grid" style="grid-template-columns: repeat(3, minmax(120px,1fr));">
          <div class="kpi-card"><div class="kpi-label">Limite</div><div class="kpi-value" style="font-size:16px;">${fmtBRL(c.limite)}</div></div>
          <div class="kpi-card"><div class="kpi-label">Fatura em aberto</div><div class="kpi-value ${lockedPagar?'masked-value':'neg'}" style="font-size:16px;">${maskBRL(emAberto, pagarDesbloqueado())}</div></div>
          <div class="kpi-card"><div class="kpi-label">Limite disponível</div><div class="kpi-value ${lockedPagar?'masked-value':(estourado?'neg':'pos')}" style="font-size:16px;">${lockedPagar ? "R$ ••••••" : fmtBRL(disp)}</div></div>
        </div>
        <div style="margin-top:10px;"><div style="font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-3); margin-bottom:2px;">Faturas em aberto — pagamento é por fatura fechada, não por compra</div>${faturasHTML}</div>
      </div>
    </div>`;
  };
  return `
    <div class="page-header"><div><div class="page-title">Cartões de Crédito</div><div class="page-sub">Cada compra vira um lançamento na data de vencimento da fatura certa — já entra em Contas a Pagar automaticamente.</div></div><div style="display:flex; gap:8px;">${bulkBarraAcoesHTML("cartoes")}<button class="btn btn-primary" data-action="new-cartao">+ Novo cartão</button></div></div>
    ${state.cartoes.map(cardHTML).join("") || emptyState("Nenhum cartão cadastrado ainda.")}
  `;
}

  lancamentos:     { titulo: "Todos os Lançamentos", sub: "O coração do sistema — toda receita, despesa e transferência entra aqui.", tipo: null,             novoLabel: "+ Novo lançamento",  tipoPreset: null },
  receitas:        { titulo: "Contas a Receber",      sub: "Só receitas — o que você tem pra receber, entrar na conta.",           tipo: "Receita",         novoLabel: "+ Nova receita",     tipoPreset: "Receita" },
  despesas:        { titulo: "Contas a Pagar",         sub: "Só despesas avulsas — compras no cartão ficam no menu Cartão de Crédito.", tipo: "Despesa",     novoLabel: "+ Nova despesa",     tipoPreset: "Despesa" },
  transferencias:  { titulo: "Transferências",         sub: "Só transferências entre contas.",                                     tipo: "Transferência",  novoLabel: "+ Nova transferência", tipoPreset: "Transferência" },
};
const CATEGORIA_FILTRO_LABELS = {
  receber: "📥 Contas a Receber",
  pagar: "📤 Contas a Pagar",
  cartao: "💳 Cartão de Crédito",
  transferencia: "⇄ Transferências",
};
function viewLancamentos(){
  const cfg = LANC_VIEW_CONFIG[state.view] || LANC_VIEW_CONFIG.lancamentos;
  let list = [...state.lancamentos].sort((a,b) => a.data.localeCompare(b.data) || a.id.localeCompare(b.id));
  list = lancamentosVisiveis(list); // membros so veem os negocios liberados pra eles; Master ve tudo
  if(cfg.tipo) list = list.filter(l => l.tipo === cfg.tipo);
  if(state.view === "despesas") list = list.filter(l => !l.cartaoId); // compras de cartao ficam so no menu Cartao de Credito
  if(state.view === "lancamentos" && lancFilter.categoria){
    if(lancFilter.categoria === "receber") list = list.filter(l => l.tipo === "Receita");
    else if(lancFilter.categoria === "pagar") list = list.filter(l => l.tipo === "Despesa" && !l.cartaoId);
    else if(lancFilter.categoria === "cartao") list = list.filter(l => !!l.cartaoId);
    else if(lancFilter.categoria === "transferencia") list = list.filter(l => l.tipo === "Transferência");
  }
  if(lancFilter.negocio) list = list.filter(l => l.negocio === lancFilter.negocio);
  if(lancFilter.status) list = list.filter(l => l.status === lancFilter.status);
  if(lancFilter.conta) list = list.filter(l => l.contaOrigem === lancFilter.conta || l.contaDestino === lancFilter.conta);
  if(state.view === "lancamentos" && lancFilter.cartao) list = list.filter(l => l.cartaoId === lancFilter.cartao);
  if(lancFilter.catNome) list = list.filter(l => l.categoria === lancFilter.catNome);
  if(lancFilter.subcatNome) list = list.filter(l => l.subcategoria === lancFilter.subcatNome);
  if(lancFilter.texto) list = list.filter(l => (l.descricao||"").toLowerCase().includes(lancFilter.texto.toLowerCase()));
  if(lancFilter.dataDe) list = list.filter(l => l.data >= lancFilter.dataDe);
  if(lancFilter.dataAte) list = list.filter(l => l.data <= lancFilter.dataAte);
  lancVisibleIds = list.map(l => l.id);
  // limpa da selecao qualquer id que nao existe mais (ja excluido em outra tela, etc.)
  const idsValidos = new Set(state.lancamentos.map(l=>l.id));
  Array.from(lancSelecionados).forEach(id => { if(!idsValidos.has(id)) lancSelecionados.delete(id); });

  const rows = list.map(l => {
    const origem = contaById(l.contaOrigem);
    const destino = contaById(l.contaDestino);
    const cartao = l.cartaoId ? cartaoById(l.cartaoId) : null;
    const color = negocioCor(l.negocio);
    const statusClass = l.status === "Pago" ? "status-pago" : (l.status === "Provisionado" ? "status-pendente" : "status-agendado");
    let contaTxt;
    if(cartao){
      contaTxt = `💳 ${esc(cartao.nome)} <span style="color:var(--ink-4); font-size:11px;">final ${esc(cartao.ultimosDigitos)}</span>${l.dataCompra && l.dataCompra !== l.data ? `<div style="font-size:11px;color:var(--ink-4)">compra em ${fmtDateBR(l.dataCompra)}</div>` : ""}`;
    }else if(l.tipo === "Transferência"){
      contaTxt = `${origem ? contaLabel(origem) : "—"} → ${destino ? contaLabel(destino) : "—"}`;
    }else{
      contaTxt = origem ? contaLabel(origem) : "—";
    }
    const sinal = l.tipo === "Despesa" ? "−" : (l.tipo === "Receita" ? "+" : "⇄");
    const unlocked = l.tipo === "Despesa" ? pagarDesbloqueado() : receberDesbloqueado();
    const catTxt = [l.categoria, l.subcategoria].filter(Boolean).join(" › ");
    // OBS: o emoji 💳 fica reservado pra despesa de cartão de verdade
    // (l.cartaoId) — "Parcelado" sozinho não quer dizer cartão (dá pra
    // parcelar uma despesa direto, sem cartão nenhum, ex: financiamento).
    const recBadge = l.recorrenciaId ? ` <span title="${l.recorrenciaTipo==='parcelado'?'Parcelado':'Recorrente'} (${l.recorrenciaIndex}/${l.recorrenciaTotal})" style="font-size:11px;">${l.recorrenciaTipo==='parcelado'?'📅':'🔁'}</span>` : "";
    const cartaoBadge = l.cartaoId ? ` <span title="Despesa de cartão de crédito — pagamento é pela fatura" style="font-size:11px;">💳</span>` : "";
    const podeEditar = podeEditarNegocio(l.negocio);
    const podeExcluir = podeExcluirNegocio(l.negocio);
    const podeBaixar = l.status !== "Pago" && l.tipo !== "Transferência" && !l.cartaoId && podeEditar && !l.inativo;
    const podeVerFaturaDoItem = l.cartaoId && l.status !== "Pago" && podeEditar && !l.inativo;
    const marcado = lancSelecionados.has(l.id);
    const autorBadge = l.lancadoPor ? `<span style="font-size:10px; color:var(--ink-4); margin-left:4px; font-family:var(--font-mono);">por ${esc(l.lancadoPor)}</span>` : "";
    if(l.inativo){
      const quando = l.inativadoEm ? ` em ${fmtDateBR(l.inativadoEm.slice(0,10))}` : "";
      return `<tr style="opacity:.45; background:#FAF5F5;">
        <td></td>
        <td style="white-space:nowrap; text-decoration:line-through;">${fmtDateBR(l.data)}</td>
        <td style="text-decoration:line-through;">${sinal} ${esc(l.tipo)}</td>
        <td style="text-decoration:line-through;">${l.negocio ? `<span class="tag" style="background:#EEE; color:#999;">${esc(l.negocio)}</span>` : "—"}</td>
        <td style="text-decoration:line-through;">${contaTxt}</td>
        <td style="text-decoration:line-through;">${esc(l.descricao)}<div style="font-size:11px;color:var(--neg);">Inativado por ${esc(l.inativadoPor||"?")}${quando}</div></td>
        <td class="num" style="text-decoration:line-through;">${fmtBRL(l.valor)}</td>
        <td><span class="status-pill status-agendado">Inativo</span></td>
        <td></td>
        <td><div class="row-actions">${ehMaster() ? `<button class="icon-btn" data-action="reativar-lanc" data-id="${l.id}" title="Reativar lançamento" style="color:var(--pos);">↩</button>` : ""}</div></td>
      </tr>`;
    }
    return `<tr style="${marcado ? 'background:#EAF1FB;' : ''}">
      <td style="text-align:center;">${podeExcluir ? `<input type="checkbox" data-action="toggle-select-lanc" data-id="${l.id}" ${marcado?"checked":""}>` : ""}</td>
      <td style="white-space:nowrap;">${fmtDateBR(l.data)}</td>
      <td>${sinal} ${esc(l.tipo)}</td>
      <td>${l.negocio ? `<span class="tag" style="background:color-mix(in srgb, ${color} 14%, white); color:${color};"><span class="tag-dot" style="background:${color}"></span>${esc(l.negocio)}</span>` : "—"}</td>
      <td>${contaTxt}</td>
      <td>${esc(l.descricao)}${cartaoBadge}${recBadge}${autorBadge}${catTxt ? `<div style="font-size:11px;color:var(--ink-4)">${esc(catTxt)}</div>` : ""}</td>
      <td class="num" style="font-weight:600;">${maskBRL(l.valor, true)}</td>
      <td><span class="status-pill ${statusClass}">${l.status}</span></td>
      <td style="text-align:center;"><span class="${l.conciliado ? 'conc-yes' : 'conc-no'}" style="${podeEditar?'cursor:pointer;':''}" ${podeEditar?`data-action="toggle-conc" data-id="${l.id}"`:''} title="${podeEditar?'Clique para alternar':''}">${l.conciliado ? "✓ Sim" : "Não"}</span></td>
      <td><div class="row-actions">${podeBaixar ? `<button class="icon-btn" data-action="baixar-titulo" data-id="${l.id}" title="Dar baixa (marcar como pago)" style="color:var(--pos);">💲</button>` : ""}${podeVerFaturaDoItem ? `<button class="icon-btn" data-action="ver-fatura-item" data-id="${l.id}" title="É de cartão — ver opções de pagamento da fatura" style="color:var(--pos);">💳</button>` : ""}${podeEditar ? `<button class="icon-btn" data-action="edit-lanc" data-id="${l.id}" title="Editar">✎</button>` : ""}${podeExcluir ? `<button class="icon-btn danger" data-action="del-lanc" data-id="${l.id}" title="Inativar">🗑</button>` : ""}</div></td>
    </tr>`;
  }).join("");
  const negOptions = (ehMaster() ? state.negocios : state.negocios.filter(n => podeVerNegocio(n.nome))).map(n => `<option value="${esc(n.nome)}" ${lancFilter.negocio===n.nome?"selected":""}>${esc(n.nome)}</option>`).join("");
  const statusOptions = STATUS_LANC.map(s => `<option value="${s}" ${lancFilter.status===s?"selected":""}>${s}</option>`).join("");
  const contaOptions = state.contas.map(c => `<option value="${c.id}" ${lancFilter.conta===c.id?"selected":""}>${contaLabel(c)}</option>`).join("");
  const cartaoOptions = state.cartoes.map(c => `<option value="${c.id}" ${lancFilter.cartao===c.id?"selected":""}>${esc(c.nome)}</option>`).join("");
  const categoriaOptions = Object.entries(CATEGORIA_FILTRO_LABELS).map(([val,label]) => `<option value="${val}" ${lancFilter.categoria===val?"selected":""}>${label}</option>`).join("");
  const catNomeOptions = state.categorias.map(c => `<option value="${esc(c.nome)}" ${lancFilter.catNome===c.nome?"selected":""}>${esc(c.nome)}</option>`).join("");
  const subcatNomeOptions = subcategoriasDe(lancFilter.catNome).map(s => `<option value="${esc(s.nome)}" ${lancFilter.subcatNome===s.nome?"selected":""}>${esc(s.nome)}</option>`).join("");
  const temFiltro = lancFilter.negocio||lancFilter.status||lancFilter.conta||lancFilter.cartao||lancFilter.categoria||lancFilter.catNome||lancFilter.subcatNome||lancFilter.texto||lancFilter.dataDe||lancFilter.dataAte;
  const todosVisiveisSelecionados = lancVisibleIds.length > 0 && lancVisibleIds.every(id => lancSelecionados.has(id));
  return `
    <div class="page-header">
      <div><div class="page-title">${cfg.titulo}</div><div class="page-sub">${cfg.sub}</div></div>
      <div style="display:flex; gap:8px;">
        ${lancSelecionados.size > 0 ? `<button class="btn btn-ghost" style="color:var(--neg); border-color:var(--neg-bg);" data-action="excluir-selecionados">🗑 Excluir selecionados (${lancSelecionados.size})</button>` : ""}
        <button class="btn btn-primary" data-action="new-lanc" data-tipo-preset="${cfg.tipoPreset||''}">${cfg.novoLabel}</button>
      </div>
    </div>
    <div class="panel"><div class="filter-bar">
      <input type="text" placeholder="Buscar por descrição..." value="${esc(lancFilter.texto)}" data-action="filter-texto" style="min-width:200px;">
      ${state.view === "lancamentos" ? `<select data-action="filter-categoria"><option value="">Todas as categorias</option>${categoriaOptions}</select>` : ""}
      <select data-action="filter-negocio"><option value="">Todos os negócios</option>${negOptions}</select>
      <select data-action="filter-status"><option value="">Todos os status</option>${statusOptions}</select>
      <select data-action="filter-conta"><option value="">Todas as contas</option>${contaOptions}</select>
      ${state.view === "lancamentos" && state.cartoes.length ? `<select data-action="filter-cartao"><option value="">Todos os cartões</option>${cartaoOptions}</select>` : ""}
      <select data-action="filter-catnome"><option value="">🏷️ Todas as categorias</option>${catNomeOptions}</select>
      <select data-action="filter-subcatnome" ${lancFilter.catNome?"":"disabled"}><option value="">${lancFilter.catNome?"Todas as subcategorias":"🏷️ Selecione uma categoria"}</option>${subcatNomeOptions}</select>
      <span style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-3);">De <input type="date" data-action="filter-data-de" value="${lancFilter.dataDe}"> até <input type="date" data-action="filter-data-ate" value="${lancFilter.dataAte}"></span>
      ${temFiltro ? `<button class="btn btn-ghost btn-sm" data-action="filter-clear">Limpar filtros</button>` : ""}
    </div><div class="panel-body"><table><thead><tr>
      <th style="text-align:center;"><input type="checkbox" data-action="toggle-select-all-lanc" ${todosVisiveisSelecionados?"checked":""} title="Selecionar todos os visíveis"></th>
      <th>Data</th><th>Tipo</th><th>Negócio</th><th>Conta</th><th>Descrição</th><th class="num">Valor</th><th>Status</th><th style="text-align:center;">Conciliado</th><th></th>
    </tr></thead><tbody>${rows || `<tr><td colspan="10">${emptyState("Nenhum lançamento encontrado com esse filtro.")}</td></tr>`}</tbody></table></div></div>
  `;
}

function viewAjustes(){

    const conta = contaById(a.contaId);
    return `<tr>
      <td>${fmtDateBR(a.data)}</td>
      <td>${esc(conta?.nome || "Conta removida")}</td>
      <td class="num ${receberDesbloqueado()?'':'masked-value'}" style="font-weight:600; color:${receberDesbloqueado() ? (a.valor>=0?'var(--pos)':'var(--neg)') : 'inherit'};">${maskBRL(a.valor, receberDesbloqueado())}</td>
      <td>${esc(a.motivo)}</td>

}

function viewUsuarios(){
  const rows = state.perfis.map(p => {
    let resumo;
    if(p.tipo === "master"){
      resumo = `<span class="status-pill status-pago">👑 Master — acesso completo</span>`;
    }else{
      const entradasNeg = Object.entries(p.permissoes || {}).filter(([,perm]) => perm.ver || perm.editar || perm.excluir);
      const negTags = entradasNeg.map(([neg,perm]) => `<span class="tag" style="background:var(--muted-bg); color:var(--ink-3); margin:2px 4px 2px 0;">${esc(neg)}: ${[perm.ver&&'Ver',perm.editar&&'Editar',perm.excluir&&'Excluir'].filter(Boolean).join('/')}</span>`).join("");
      const entradasCat = Object.entries(p.categoriasPermitidas || {}).filter(([,v]) => v).map(([cat]) => cat);
      const catTxt = entradasCat.length ? `<div style="font-size:11px; color:var(--ink-4); margin-top:4px;">Categorias: ${entradasCat.map(esc).join(", ")}</div>` : "";
      resumo = (negTags || `<span style="color:var(--ink-4); font-size:12px;">Nenhum negócio liberado ainda</span>`) + catTxt;
    }
    return `<tr>
      <td><strong>${esc(p.nome)}</strong></td>
      <td>${resumo}</td>
      <td><div class="row-actions"><button class="icon-btn" data-action="edit-perfil" data-id="${p.id}" title="Editar">✎</button><button class="icon-btn danger" data-action="del-perfil" data-id="${p.id}" title="Excluir">🗑</button></div></td>
    </tr>`;
  }).join("");
  return `
    <div class="page-header">
      <div><div class="page-title">Usuários</div><div class="page-sub">Crie um login pra cada pessoa da equipe e escolha o que cada uma pode ver, editar ou excluir — por negócio. O Master (você) sempre vê tudo.</div></div>
      <button class="btn btn-primary" data-action="new-perfil">+ Novo usuário</button>
    </div>
    <div class="panel"><div class="panel-body" style="padding-top:14px;">
      <table><thead><tr><th>Nome</th><th>Permissões</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="3">${emptyState("Nenhum usuário criado ainda — só o Master existe.")}</td></tr>`}</tbody></table>
    </div></div>
  `;
}

// ============================================================
// BACKUP (exportar/importar JSON)
// ============================================================
function exportarBackup(){
  const dados = {
    versao: "4-supabase", exportadoEm: new Date().toISOString(),
    contas: state.contas, lancamentos: state.lancamentos, ajustes: state.ajustes,
    categorias: state.categorias, negocios: state.negocios, cartoes: state.cartoes
  };
  const blob = new Blob([JSON.stringify(dados, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `backup-financeiro-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  showToast("Backup exportado.");
}
function handleImportarBackup(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try{
      const dados = JSON.parse(ev.target.result);
      if(!dados || !Array.isArray(dados.contas)){ showToast("Arquivo de backup inválido.", "error"); return; }
      if(!confirm("Importar esse backup vai substituir TODOS os dados atuais. Continuar?")) return;
      state.contas = dados.contas || [];
      state.lancamentos = dados.lancamentos || [];
      state.ajustes = dados.ajustes || [];
      state.categorias = dados.categorias || seedCategorias();
      state.negocios = dados.negocios || seedNegocios();
      state.cartoes = dados.cartoes || [];
      await saveContas(); await saveLancamentos(); await saveAjustes();
      await saveCategorias(); await saveNegocios(); await saveCartoes();
      renderApp();
      showToast("Backup importado com sucesso.");
    }catch(err){ showToast("Não consegui ler esse arquivo.", "error"); }
  };
  reader.readAsText(file);

}

// ============================================================
// DADOS DE TESTE — popular/remover ~10 registros por área (só Master)
// Propositalmente NÃO mexe em Contas/Cartões/Categorias/Negócios/Lançamentos:
// são o núcleo financeiro real da holding, e misturar dado fake ali contaminaria
// saldo e relatórios de verdade. Tudo que é criado aqui vem marcado com
// "_teste: true" (guardado dentro do jsonb "dados", não é coluna nova) e prefixo
// "[TESTE]" no nome, pra ficar óbvio e fácil de tirar depois.
// ============================================================
// ============================================================
// DADOS DE TESTE — Geral (todas as áreas) ou só a área/módulo selecionado,
// tanto pra popular quanto pra remover. Cada área é independente (não
// depende de outra ter rodado antes), mas se a outra já tiver dados
// (de teste ou reais), aproveita pra enriquecer (ex: Chamados usa
// produtos/contas que já existirem, senão só pula essa parte opcional).
// ============================================================
const AREAS_DADOS_TESTE = [
  { id:"financeiro", nome:"Financeiro", desc:"contas, cartões e lançamentos" },
  { id:"estoque",    nome:"Estoque",    desc:"fornecedores, produtos e compras" },
  { id:"clientes",   nome:"Clientes",   desc:"planos, clientes, técnicos e chamados" },
  { id:"rh",         nome:"RH",         desc:"cargos, funcionários, folha e férias" },
];
function areaDadosTesteDoModulo(moduloId){ return AREAS_DADOS_TESTE.find(a => a.id === moduloId) || null; }
function testeCpfFake(i){ return `${String(100+i).padStart(3,'0')}.${String(200+i*3).padStart(3,'0')}.${String(300+i*7).padStart(3,'0')}-${String(10+i).padStart(2,'0')}`; }
function testeTelFake(base, i){ return `(11) 9${String(base+i*111).padStart(4,'0')}-${String(1000+i*97).padStart(4,'0')}`; }
function testeNegAleatorio(){ const nomes = state.negocios.map(n=>n.nome); return nomes.length ? nomes[Math.floor(Math.random()*nomes.length)] : ""; }

function modalDadosTeste(acao){
  if(!ehMaster()){ showToast(`Apenas o Master pode ${acao==="popular"?"popular":"remover"} dados de teste.`, "error"); return; }
  const areaAtual = areaDadosTesteDoModulo(state.moduloAtivo);
  const titulo = acao==="popular" ? "🌱 Popular dados de teste" : "🧹 Remover dados de teste";
  const verbo = acao==="popular" ? "Cria" : "Remove";
  openModal(`
    <div class="modal-head"><div class="modal-title">${titulo}</div><button class="modal-close" data-action="close-modal">✕</button></div>
    <div class="modal-body">
      <div class="field-help" style="margin-bottom:14px;">Escolha o alcance:</div>
      <button type="button" class="btn btn-ghost" style="width:100%; justify-content:flex-start; text-align:left; margin-bottom:8px; padding:14px;" data-action="dados-teste-executar" data-acao="${acao}" data-escopo="geral">
        <div><div style="font-weight:700;">🌐 Geral</div><div style="font-size:11.5px; color:var(--ink-4); font-weight:400; margin-top:2px;">${verbo} ~10 registros de teste em Financeiro, Estoque, Clientes e RH.</div></div>
      </button>
      ${areaAtual ? `
      <button type="button" class="btn btn-ghost" style="width:100%; justify-content:flex-start; text-align:left; padding:14px;" data-action="dados-teste-executar" data-acao="${acao}" data-escopo="${areaAtual.id}">
        <div><div style="font-weight:700;">📍 Somente ${esc(areaAtual.nome)}</div><div style="font-size:11.5px; color:var(--ink-4); font-weight:400; margin-top:2px;">${verbo} só ${esc(areaAtual.desc)}.</div></div>
      </button>` : `<div class="field-help">Você está num módulo sem dados de teste próprios (Cadastro, Visão Geral ou Relatórios) — só "Geral" está disponível aqui. Abra Financeiro, Estoque, Clientes ou RH pra liberar a opção "Somente esse módulo".</div>`}
    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button></div>
  `);
}

    id: uid("cartao"), nome: `[TESTE] ${nome}`, bandeira, ultimosDigitos: String(1000+i*111).slice(-4),
