<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holding — Painel Financeiro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F6F8;
    --panel: #FFFFFF;
    --ink: #12151C;
    --ink-soft: #5B6270;
    --ink-faint: #9AA1AF;
    --line: #E5E7EC;
    --sidebar: #10141F;
    --sidebar-ink: #E7EAF2;
    --sidebar-faint: #7C8399;
    --sidebar-active: #1B2233;
    --accent: #146356;
    --accent-soft: #E4F1EE;
    --danger: #C1432E;
    --danger-soft: #FBEAE6;
    --warn: #B4790C;
    --warn-soft: #FBF1DF;
    --c-toptv: #3B7EC4;
    --c-uniplay: #8457C9;
    --c-servnet: #1E9159;
    --c-precautec: #D8752B;
    --c-porto: #0D8C82;
    --c-pessoal: #6B7280;
    --c-compartilhado: #B8891A;
    --radius: 10px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; height:100%; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  #app{ display:flex; min-height:100vh; }
  .sidebar{
    width: 240px;
    flex-shrink:0;
    background: var(--sidebar);
    color: var(--sidebar-ink);
    display:flex;
    flex-direction:column;
    padding: 22px 14px;
    overflow-y: auto;
    max-height: 100vh;
    position: sticky;
    top: 0;
  }
  .brand{
    font-family: var(--font-display);
    font-weight:700;
    font-size: 17px;
    letter-spacing: -0.02em;
    padding: 4px 10px 4px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand .dot{ width:8px; height:8px; border-radius:50%; background:#3FD68E; display:inline-block; }
  .brand-sub{
    font-size:11px;
    color: var(--sidebar-faint);
    padding: 0 10px 22px;
    font-family: var(--font-mono);
  }
  .nav-group-label{
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--sidebar-faint);
    padding: 14px 12px 6px;
  }
  .nav-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding: 9px 12px;
    border-radius: 8px;
    color: var(--sidebar-ink);
    cursor:pointer;
    font-size: 13.5px;
    font-weight:500;
    transition: background .12s ease;
    user-select:none;
  }
  .nav-item:hover{ background: rgba(255,255,255,.05); }
  .nav-item.active{ background: var(--sidebar-active); }
  .nav-item.active .nav-ico{ color:#3FD68E; }
  .nav-item.disabled{ color: var(--sidebar-faint); cursor:default; }
  .nav-item.disabled:hover{ background:transparent; }
  .nav-ico{ font-size:14px; width:16px; text-align:center; }
  .soon-badge{
    font-size:9.5px;
    font-family: var(--font-mono);
    background: rgba(255,255,255,.06);
    color: var(--sidebar-faint);
    padding: 2px 6px;
    border-radius: 999px;
  }
  .sidebar-footer{
    margin-top:auto;
    padding: 12px 10px 4px;
    font-size: 11px;
    color: var(--sidebar-faint);
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .sidebar-lock-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    width:100%; padding:9px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.05); color: var(--sidebar-ink); font-size:12.5px; font-weight:600;
    cursor:pointer; margin-bottom:10px; font-family: var(--font-body);
  }
  .sidebar-lock-btn:hover{ background: rgba(255,255,255,.11); }
  .sidebar-lock-btn.unlocked{ background: rgba(63,214,142,.12); border-color: rgba(63,214,142,.32); color:#3FD68E; }
  .masked-value{ color: var(--ink-faint); letter-spacing:1px; }
  .main{ flex:1; min-width:0; padding: 28px 36px 60px; }
  .page-header{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px;}
  .page-title{ font-family: var(--font-display); font-size: 24px; font-weight:700; letter-spacing:-0.01em; }
  .page-sub{ color: var(--ink-soft); font-size: 13px; margin-top:2px; }
  .btn{
    font-family: var(--font-body);
    font-weight:600;
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition: all .12s ease;
  }
  .btn-primary{ background: var(--accent); color:#fff; }
  .btn-primary:hover{ background:#0F4A40; }
  .btn-ghost{ background: transparent; color: var(--ink); border-color: var(--line); }
  .btn-ghost:hover{ background: #F0F1F4; }
  .btn-danger-text{ background:transparent; color:var(--danger); border:none; padding:4px 8px; font-size:12.5px; }
  .btn-sm{ padding:6px 10px; font-size:12px; }
  .btn-logout{ background: rgba(255,255,255,.08); color: var(--sidebar-ink); border:1px solid rgba(255,255,255,.1); }
  .btn-logout:hover{ background: rgba(255,50,50,.15); border-color: rgba(255,50,50,.3); }
  .kpi-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; margin-bottom: 22px; }
  .kpi-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .kpi-label{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
  .kpi-value{ font-family: var(--font-mono); font-size: 22px; font-weight:600; letter-spacing:-0.01em; }
  .kpi-value.pos{ color:#0F5C3F; }
  .kpi-value.neg{ color: var(--danger); }
  .kpi-note{ font-size:11.5px; color:var(--ink-faint); margin-top:6px; }
  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 20px;
    overflow:hidden;
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--line);
  }
  .panel-title{ font-family: var(--font-display); font-weight:600; font-size:15px; }
  .panel-body{ padding: 6px 18px 18px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table{ width:100%; border-collapse: collapse; font-size:13px; }
  thead th{
    text-align:left;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing:.04em;
    color: var(--ink-soft);
    padding: 10px 10px;
    border-bottom: 1px solid var(--line);
    white-space:nowrap;
  }
  tbody td{ padding: 11px 10px; border-bottom: 1px solid #EFF0F3; vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:#FAFBFC; }
  td.num, th.num{ text-align:right; font-family: var(--font-mono); }
  .tag{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11px; font-weight:600; padding: 3px 9px; border-radius:999px;
  }
  .tag-dot{ width:6px; height:6px; border-radius:50%; }
  .status-pill{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; }
  .status-pago{ background: var(--accent-soft); color:#0F5C3F; }
  .status-pendente{ background: var(--warn-soft); color:#8A5C09; }
  .status-agendado{ background:#EAEDF3; color:#4A5266; }
  .conc-yes{ color:#0F5C3F; font-weight:600; }
  .conc-no{ color: var(--ink-faint); }
  .row-actions{ display:flex; gap:4px; justify-content:flex-end; }
  .icon-btn{
    border:none; background:transparent; cursor:pointer; padding:5px 7px; border-radius:6px; color: var(--ink-soft); font-size:13px;
  }
  .icon-btn:hover{ background:#F0F1F4; color:var(--ink); }
  .icon-btn.danger:hover{ background: var(--danger-soft); color: var(--danger); }
  .empty-state{ padding: 40px 20px; text-align:center; color: var(--ink-faint); font-size:13px; }
  .filter-bar{ display:flex; gap:8px; flex-wrap:wrap; padding: 12px 18px 4px; }
  .filter-bar select, .filter-bar input[type=text]{
    font-family: var(--font-body); font-size:12.5px; padding:7px 10px; border-radius:7px; border:1px solid var(--line); background:#FCFCFD; color:var(--ink);
  }
  .modal-overlay{
    position:fixed; inset:0; background: rgba(15,17,22,.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal{
    background:#fff; border-radius: 14px; width: 480px; max-width:100%; max-height:88vh; overflow-y:auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding: 18px 20px; border-bottom:1px solid var(--line); }
  .modal-title{ font-family: var(--font-display); font-weight:700; font-size:16px; }
  .modal-close{ border:none; background:transparent; font-size:18px; cursor:pointer; color:var(--ink-soft); line-height:1; }
  .modal-body{ padding: 18px 20px; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:8px; padding: 14px 20px; border-top:1px solid var(--line); }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  .field input, .field select, .field textarea{
    width:100%; font-family:var(--font-body); font-size:13.5px; padding:9px 11px; border-radius:8px; border:1px solid var(--line); background:#FCFCFD; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid #146356; outline-offset:1px; border-color:transparent; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .checkbox-row{ display:flex; align-items:center; gap:8px; font-size:13px; }
  .checkbox-row input{ width:auto; }
  .field-help{ font-size:11px; color:var(--ink-faint); margin-top:4px; }
  .bar-row{ display:grid; grid-template-columns: 170px 1fr 120px; align-items:center; gap:12px; padding:9px 0; }
  .bar-track{ height:8px; border-radius:999px; background:#EEF0F3; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:999px; }
  .bar-row .val{ font-family:var(--font-mono); font-size:12.5px; text-align:right; }
  .toast-wrap{ position:fixed; bottom:22px; right:22px; display:flex; flex-direction:column; gap:8px; z-index:200; }
  .toast{
    background: var(--ink); color:#fff; padding: 11px 16px; border-radius:9px; font-size:13px;
    box-shadow: 0 8px 24px rgba(0,0,0,.25); animation: toast-in .18s ease-out;
    display:flex; align-items:center; gap:8px;
  }
  .toast.error{ background: var(--danger); }
  @keyframes toast-in{ from{ opacity:0; transform: translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .loading-screen{ display:flex; align-items:center; justify-content:center; height:100vh; width:100%; color: var(--ink-soft); font-family: var(--font-mono); font-size:13px; }
  table{ min-width: 640px; }
  @media (max-width: 980px){
    .kpi-grid{ grid-template-columns: repeat(2,1fr); }
    .sidebar{ width:64px; }
    .brand span:not(.dot), .brand-sub, .nav-item span.label, .nav-group-label, .soon-badge{ display:none; }
    .nav-item{ justify-content:center; }
    .main{ padding: 16px 12px 50px; }
    .sidebar-footer{ padding: 10px 4px 4px; }
    .sidebar-lock-btn{ padding: 9px 4px; font-size:16px; }
    .sidebar-lock-btn .label, .sidebar-footer .footer-detail{ display:none; }
    .modal{ width: 94vw; }
    .page-title{ font-size: 20px; }
    .kpi-value{ font-size: 18px; }
  }
</style>
</head>
<body>
<div id="app"><div class="loading-screen">Carregando painel financeiro…</div></div>
<div class="toast-wrap" id="toastWrap"></div>
<script>
// ============================================================
// CONFIGURAÇÃO DO SUPABASE
// ============================================================
const SUPABASE_URL = 'https://lkymiclirksgqkeiglyw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0peTquB1iqmsYTBMLwH2JA_eOwz2yTM';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ============================================================
// ESTADO E CONSTANTES
// ============================================================
const PALETA_NEGOCIOS = ["#3B7EC4","#8457C9","#1E9159","#D8752B","#0D8C82","#6B7280","#B8891A","#C0447A","#3C6E8F","#8A8F1F"];
const TIPOS_CONTA = ["Conta Corrente","Conta Pagamento","Poupança"];
const TIPOS_LANC = ["Receita","Despesa","Transferência"];
const STATUS_LANC = ["Pago","Provisionado","Agendado"];
const BANDEIRAS = ["Visa","Mastercard","Elo","American Express","Hipercard","Outra"];
const PERIODOS = ["Semanal", "Quinzenal", "Mensal", "Bimestral", "Trimestral", "Semestral", "Anual"];
const SENHA_PAGAR = "@2020";
const SENHA_RECEBER = "@1010";
const TABELAS = ["contas","lancamentos","ajustes","categorias","negocios","cartoes"];

let state = {
  contas: [], lancamentos: [], ajustes: [], categorias: [], negocios: [], cartoes: [],
  view: "dashboard", storageOK: true, ultimoSalvamento: null, user: null,
  pagarUnlocked: false, receberUnlocked: false, ajustesMenuAberto: false,
  mesVisualizado: { ano: new Date().getFullYear(), mes: new Date().getMonth() }
};
const NOMES_MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const HORIZONTE_ANOS = 5;

// ============================================================
// UTILITÁRIOS
// ============================================================
function uid(prefix){ return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtBRL(n){ n = Number(n)||0; return n.toLocaleString("pt-BR", {style:"currency", currency:"BRL"}); }
function maskBRL(n, unlocked){ return unlocked ? fmtBRL(n) : "R$ ••••••"; }
function fmtDateBR(iso){ if(!iso) return "—"; const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function contaById(id){ return state.contas.find(c => c.id === id); }
function cartaoById(id){ return state.cartoes.find(c => c.id === id); }
function negocioByNome(nome){ return state.negocios.find(n => n.nome === nome); }
function negocioById(id){ return state.negocios.find(n => n.id === id); }
function categoriaByNome(nome){ return state.categorias.find(c => c.nome === nome); }
function categoriaById(id){ return state.categorias.find(c => c.id === id); }
function contaLabel(c){
  if(!c) return "—";
  if(c.parentId){ const pai = contaById(c.parentId); return `${pai ? esc(pai.nome) : "?"} → ${esc(c.nome)}`; }
  return esc(c.nome);
}
function negocioCor(nome){
  const n = negocioByNome(nome);
  return (n && n.cor) || "var(--ink-faint)";
}
function proximaCorNegocio(){ return PALETA_NEGOCIOS[state.negocios.length % PALETA_NEGOCIOS.length]; }
function contasRaiz(){ return state.contas.filter(c => !c.parentId); }
function caixinhasDe(contaId){ return state.contas.filter(c => c.parentId === contaId); }
function contasParaSelecao(selectedId){ return state.contas.filter(c => c.ativa !== false || c.id === selectedId); }
function subcategoriasDe(nomeCategoria){
  const cat = categoriaByNome(nomeCategoria);
  return cat ? (cat.subcategorias||[]) : [];
}
function showToast(msg, type){
  const wrap = document.getElementById("toastWrap");
  const el = document.createElement("div");
  el.className = "toast" + (type === "error" ? " error" : "");
  el.textContent = msg;
  el.style.cursor = "pointer";
  el.title = "Clique para fechar";
  el.addEventListener("click", () => el.remove());
  wrap.appendChild(el);
  setTimeout(() => el.remove(), type === "error" ? 12000 : 3200);
}
function dividirValor(total, qtd){
  const totalCentavos = Math.round(Number(total) * 100);
  const baseCentavos = Math.floor(totalCentavos / qtd);
  const resto = totalCentavos - (baseCentavos * qtd);
  const valores = [];
  for(let i=0;i<qtd;i++){
    let c = baseCentavos;
    if(i === qtd - 1) c += resto; // ultima parcela absorve a sobra de arredondamento
    valores.push(Math.round(c) / 100);
  }
  return valores;
}
const MESES_POR_FREQUENCIA = { "Mensal":1, "Bimestral":2, "Trimestral":3, "Semestral":6, "Anual":12 };
function proximaData(dataISO, freq){
  const d = new Date(dataISO + "T00:00:00");
  if(freq === "Semanal"){ d.setDate(d.getDate() + 7); return d.toISOString().slice(0,10); }
  if(freq === "Quinzenal"){ d.setDate(d.getDate() + 15); return d.toISOString().slice(0,10); }
  const meses = MESES_POR_FREQUENCIA[freq] || 1;
  const dia = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + meses);
  const diasNoMes = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(dia, diasNoMes));
  return d.toISOString().slice(0,10);
}
function calcularVencimento(dataCompraISO, cartao){
  const d = new Date(dataCompraISO + 'T00:00:00');
  const diaCompra = d.getDate();
  let anoFech = d.getFullYear(), mesFech = d.getMonth();
  if(diaCompra > cartao.diaFechamento){ mesFech += 1; if(mesFech > 11){ mesFech = 0; anoFech += 1; } }
  let anoVenc = anoFech, mesVenc = mesFech;
  if(cartao.diaVencimento < cartao.diaFechamento){ mesVenc += 1; if(mesVenc > 11){ mesVenc = 0; anoVenc += 1; } }
  const diasNoMes = new Date(anoVenc, mesVenc + 1, 0).getDate();
  const diaVenc = Math.min(cartao.diaVencimento, diasNoMes);
  return new Date(anoVenc, mesVenc, diaVenc).toISOString().slice(0,10);
}
function faturaEmAberto(cartaoId){
  return state.lancamentos.filter(l => l.cartaoId === cartaoId && l.status !== 'Pago').reduce((s,l) => s + Number(l.valor), 0);
}
function faturasAgrupadas(cartaoId){
  const grupos = {};
  state.lancamentos.filter(l => l.cartaoId === cartaoId && l.status !== 'Pago').forEach(l => {
    if(!grupos[l.data]) grupos[l.data] = { data: l.data, total: 0, itens: [] };
    grupos[l.data].total += Number(l.valor);
    grupos[l.data].itens.push(l);
  });
  return Object.values(grupos).sort((a,b) => a.data.localeCompare(b.data));
}
function autoBaixarAgendados(){
  // "Agendado" = debito/credito automatico agendado no banco: quando a data chega, vira "Pago" sozinho.
  // "Provisionado" fica parado ate baixa manual (botao 💲).
  const hojeISO = todayISO();
  let alterou = [];
  for(const l of state.lancamentos){
    if(l.status === "Agendado" && l.data <= hojeISO && l.tipo !== "Transferência"){
      l.status = "Pago";
      l.conciliado = true;
      alterou.push(l);
    }
  }
  return alterou;
}

// ============================================================
// CALCULADORA INLINE (anexada a campos de valor)
// ============================================================
function attachCalculadora(inputId){
  const input = document.getElementById("campo_" + inputId);
  if(!input || input.dataset.calcAttached) return;
  input.dataset.calcAttached = "1";
  const wrap = document.createElement("div");
  wrap.style.position = "relative";
  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);
  input.style.paddingRight = "36px";
  input.style.width = "100%";
  input.style.boxSizing = "border-box";
  const btn = document.createElement("button");
  btn.type = "button";
  btn.title = "Calculadora";
  btn.textContent = "🧮";
  btn.style.cssText = "position:absolute; right:2px; top:50%; transform:translateY(-50%); border:none; background:transparent; cursor:pointer; font-size:15px; padding:6px 8px; border-radius:6px;";
  wrap.appendChild(btn);
  const pop = document.createElement("div");
  pop.style.cssText = "display:none; position:absolute; z-index:80; top:100%; right:0; margin-top:6px; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 28px rgba(0,0,0,.18); padding:10px; width:206px;";
  const displayId = "calcDisplay_" + inputId;
  pop.innerHTML = `
    <input type="text" readonly id="${displayId}" value="0" style="width:100%; box-sizing:border-box; text-align:right; font-family:var(--font-mono); font-size:16px; padding:8px; border:1px solid var(--line); border-radius:6px; margin-bottom:8px;">
    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:5px;">
      ${["7","8","9","÷","4","5","6","×","1","2","3","−","C","0",".","+"].map(k=>`<button type="button" data-k="${k}" style="padding:9px 0; border:1px solid var(--line); border-radius:6px; background:#FAFBFC; cursor:pointer; font-size:13px; font-family:var(--font-mono);">${k}</button>`).join("")}
      <button type="button" data-k="=" style="grid-column:span 4; padding:9px 0; border:none; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; font-weight:600; margin-top:4px; font-size:12.5px;">= Usar valor</button>
    </div>
  `;
  wrap.appendChild(pop);
  let expr = "";
  const display = () => document.getElementById(displayId);
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const abrindo = pop.style.display !== "block";
    pop.style.display = abrindo ? "block" : "none";
    if(abrindo){
      expr = (input.value && Number(input.value) !== 0) ? String(input.value) : "";
      display().value = expr || "0";
    }
  });
  pop.addEventListener("click", (e) => e.stopPropagation());
  pop.querySelectorAll("[data-k]").forEach(b => {
    b.addEventListener("click", () => {
      const k = b.dataset.k;
      if(k === "C"){ expr = ""; display().value = "0"; return; }
      if(k === "="){
        const safeExpr = expr.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
        if(!safeExpr || !/^[0-9+\-*/.() ]+$/.test(safeExpr)){ display().value = "erro"; return; }
        try{
          const resultado = Function('"use strict"; return (' + safeExpr + ")")();
          if(typeof resultado !== "number" || !isFinite(resultado)){ display().value = "erro"; return; }
          const val = Math.round(resultado * 100) / 100;
          input.value = val;
          input.dispatchEvent(new Event("change", {bubbles:true}));
          pop.style.display = "none";
        }catch(err){ display().value = "erro"; }
        return;
      }
      expr += k;
      display().value = expr || "0";
    });
  });
  document.addEventListener("click", (ev) => { if(!wrap.contains(ev.target)) pop.style.display = "none"; });
}

async function saveRows(table, items){
  if(!state.user || !items.length) return;
  try{
    const rows = items.map(item => {
      const { id, ...rest } = item;
      return { id, user_id: state.user.id, dados: rest, updated_at: new Date().toISOString() };
    });
    const { error } = await supabaseClient.from(table).upsert(rows, { onConflict: "id" });
    if(error) throw error;
    state.storageOK = true;
    state.ultimoSalvamento = new Date();
  }catch(e){
    state.storageOK = false;
    console.error(`[saveRows:${table}]`, e);
    showToast(`Não salvou (${table}): ${e.message || e}`, "error");
  }
}
async function deleteRow(table, id){
  if(!state.user || !id) return;
  try{
    const { error } = await supabaseClient.from(table).delete().eq("id", id).eq("user_id", state.user.id);
    if(error) throw error;
  }catch(e){
    console.error(`[deleteRow:${table}]`, e);
    showToast(`Erro ao excluir (${table}): ${e.message || e}`, "error");
  }
}
async function deleteRows(table, ids){
  if(!state.user || !ids || !ids.length) return;
  try{
    const { error } = await supabaseClient.from(table).delete().in("id", ids).eq("user_id", state.user.id);
    if(error) throw error;
  }catch(e){
    console.error(`[deleteRows:${table}]`, e);
    showToast(`Erro ao excluir (${table}): ${e.message || e}`, "error");
  }
}
const saveContas = () => saveRows("contas", state.contas);
const saveLancamentos = () => saveRows("lancamentos", state.lancamentos);
const saveAjustes = () => saveRows("ajustes", state.ajustes);
const saveCategorias = () => saveRows("categorias", state.categorias);
const saveNegocios = () => saveRows("negocios", state.negocios);
const saveCartoes = () => saveRows("cartoes", state.cartoes);

async function loadData(){
  if(!state.user) return;
  try{
    const results = await Promise.all(TABELAS.map(t =>
      supabaseClient.from(t).select("id,dados").eq("user_id", state.user.id)
    ));
    results.forEach((r, i) => { if(r.error){ console.error(`[loadData:${TABELAS[i]}]`, r.error); throw r.error; } });
    const [contas, lancamentos, ajustes, categorias, negocios, cartoes] = results.map(r =>
      (r.data || []).map(row => ({ id: row.id, ...row.dados }))
    );
    state.contas = contas;
    state.lancamentos = lancamentos;
    state.ajustes = ajustes;
    state.categorias = categorias;
    state.negocios = negocios;
    state.cartoes = cartoes;
    state.storageOK = true;

    // Primeiro login: sem categorias/negocios ainda -> semeia os padroes.
    if(state.categorias.length === 0 && state.negocios.length === 0){
      state.categorias = seedCategorias();
      state.negocios = seedNegocios();
      await saveCategorias();
      await saveNegocios();
    }
    if(autoBaixarAgendados().length) await saveLancamentos();
  }catch(e){
    state.storageOK = false;
    showToast("Erro ao carregar dados: " + (e.message || e), "error");
  }
}
function seedCategorias(){
  return ["Servidores/Hospedagem","Aluguel","Assinaturas/Softwares","Marketing","Salários/Pró-labore","Impostos/Taxas","Outros"]
    .map(nome => ({ id: uid("cat"), nome, subcategorias: [] }));
}
function seedNegocios(){

    .map((nome,i) => ({ id: uid("neg"), nome, cor: PALETA_NEGOCIOS[i % PALETA_NEGOCIOS.length] }));
}

function saldoAtual(contaId){
  const conta = contaById(contaId);
  if(!conta) return 0;
  let total = Number(conta.saldoInicial) || 0;
  for(const l of state.lancamentos){
    if(l.status !== "Pago") continue;
    if(l.tipo === "Receita" && l.contaOrigem === contaId) total += Number(l.valor);
    if(l.tipo === "Despesa" && l.contaOrigem === contaId) total -= Number(l.valor);
    if(l.tipo === "Transferência"){
      if(l.contaOrigem === contaId) total -= Number(l.valor);
      if(l.contaDestino === contaId) total += Number(l.valor);
    }
  }
  for(const a of state.ajustes){ if(a.contaId === contaId) total += Number(a.valor); }
  return total;
}
function saldoProjetado(contaId){
  let total = saldoAtual(contaId);
  for(const l of state.lancamentos){
    if(l.status === "Pago") continue;
    if(l.tipo === "Receita" && l.contaOrigem === contaId) total += Number(l.valor);
    if(l.tipo === "Despesa" && l.contaOrigem === contaId) total -= Number(l.valor);
    if(l.tipo === "Transferência"){
      if(l.contaOrigem === contaId) total -= Number(l.valor);
      if(l.contaDestino === contaId) total += Number(l.valor);
    }
  }
  return total;
}
function naoConciliados(contaId){
  return state.lancamentos.filter(l => (l.contaOrigem === contaId || l.contaDestino === contaId) && !l.conciliado).length;
}
function saldoProjetadoAteMes(ano, mes){
  const base = state.contas.reduce((s,c) => s + (Number(c.saldoInicial)||0), 0);
  const fimISO = new Date(ano, mes + 1, 0).toISOString().slice(0,10);
  let total = base;
  for(const l of state.lancamentos){
    if(l.data > fimISO) continue;
    if(l.tipo === "Receita") total += Number(l.valor);
    if(l.tipo === "Despesa") total -= Number(l.valor);
  }
  for(const a of state.ajustes){ if(a.data <= fimISO) total += Number(a.valor); }
  return total;
}
function saldoContaAteMes(contaId, ano, mes){
  const conta = contaById(contaId);
  if(!conta) return 0;
  const fimISO = new Date(ano, mes + 1, 0).toISOString().slice(0,10);
  let total = Number(conta.saldoInicial) || 0;
  for(const l of state.lancamentos){
    if(l.data > fimISO) continue;
    if(l.tipo === "Receita" && l.contaOrigem === contaId) total += Number(l.valor);
    if(l.tipo === "Despesa" && l.contaOrigem === contaId) total -= Number(l.valor);
    if(l.tipo === "Transferência"){
      if(l.contaOrigem === contaId) total -= Number(l.valor);
      if(l.contaDestino === contaId) total += Number(l.valor);
    }
  }
  for(const a of state.ajustes){ if(a.contaId === contaId && a.data <= fimISO) total += Number(a.valor); }
  return total;
}
function movimentoPendenteDoMes(ano, mes){
  const inicioISO = new Date(ano, mes, 1).toISOString().slice(0,10);
  const fimISO = new Date(ano, mes + 1, 0).toISOString().slice(0,10);
  let entradas = 0, saidas = 0;
  for(const l of state.lancamentos){
    if(l.data < inicioISO || l.data > fimISO || l.status === "Pago") continue;
    if(l.tipo === "Receita") entradas += Number(l.valor);
    if(l.tipo === "Despesa") saidas += Number(l.valor);
  }
  return { entradas, saidas };
}
function movimentoRealizadoDoMes(ano, mes){
  const inicioISO = new Date(ano, mes, 1).toISOString().slice(0,10);
  const fimISO = new Date(ano, mes + 1, 0).toISOString().slice(0,10);
  let entradas = 0, saidas = 0;
  for(const l of state.lancamentos){
    if(l.data < inicioISO || l.data > fimISO || l.status !== "Pago") continue;
    if(l.tipo === "Receita") entradas += Number(l.valor);
    if(l.tipo === "Despesa") saidas += Number(l.valor);
  }
  return { entradas, saidas };
}
function topLancamentosDoMes(tipo, ano, mes, n){
  const inicioISO = new Date(ano, mes, 1).toISOString().slice(0,10);
  const fimISO = new Date(ano, mes + 1, 0).toISOString().slice(0,10);
  return state.lancamentos
    .filter(l => l.tipo === tipo && l.data >= inicioISO && l.data <= fimISO)
    .sort((a,b) => Number(b.valor) - Number(a.valor))
    .slice(0, n || 5);
}
function contasAPagar(){
  return state.lancamentos.filter(l => l.tipo === "Despesa" && l.status !== "Pago");
}
function contasAReceber(){
  return state.lancamentos.filter(l => l.tipo === "Receita" && l.status !== "Pago");
}
function contasAPagarConsolidado(){
  // Despesas avulsas ficam uma por uma. Compras de cartao viram UMA linha por fatura
  // (mesmo cartao + mesma data de vencimento), porque é assim que se paga de verdade.
  const pendentes = state.lancamentos.filter(l => l.tipo === "Despesa" && l.status !== "Pago");
  const individuais = pendentes.filter(l => !l.cartaoId).map(l => ({
    tipo: "individual", id: l.id, data: l.data, valor: Number(l.valor),
    descricao: l.descricao, negocio: l.negocio, status: l.status
  }));
  const grupos = {};
  pendentes.filter(l => l.cartaoId).forEach(l => {
    const key = l.cartaoId + "|" + l.data;
    if(!grupos[key]) grupos[key] = { cartaoId: l.cartaoId, data: l.data, valor: 0, itens: [] };
    grupos[key].valor += Number(l.valor);
    grupos[key].itens.push(l);
  });
  const faturas = Object.values(grupos).map(g => {
    const cartao = cartaoById(g.cartaoId);
    return {
      tipo: "fatura", cartaoId: g.cartaoId, data: g.data, valor: g.valor,
      descricao: `Fatura ${cartao ? cartao.nome : "Cartão"} (${g.itens.length} compra${g.itens.length===1?'':'s'})`,
      negocio: "", status: "Provisionado"
    };
  });
  return [...individuais, ...faturas].sort((a,b) => a.data.localeCompare(b.data));
}

  const saldoMesAnterior = (() => { const m = mv.mes===0?11:mv.mes-1; const a = mv.mes===0?mv.ano-1:mv.ano; return saldoProjetadoAteMes(a,m); })();
  const movPendente = movimentoPendenteDoMes(mv.ano, mv.mes);
  const movReal = movimentoRealizadoDoMes(mv.ano, mv.mes);
  const saldoAtualMes = saldoMesAnterior + movReal.entradas - movReal.saidas;
  const saldoFinalPrevisto = saldoAtualMes + movPendente.entradas - movPendente.saidas;
  const topReceitas = topLancamentosDoMes("Receita", mv.ano, mv.mes, 5);
  const topDespesas = topLancamentosDoMes("Despesa", mv.ano, mv.mes, 5);
  const maxAbs = Math.max(...state.contas.map(c => Math.abs(saldoContaAteMes(c.id, mv.ano, mv.mes))), 1);

  const barRow = (c, nested) => {
    const sa = saldoContaAteMes(c.id, mv.ano, mv.mes);
    const pct = lockedReceber ? 45 : Math.max(4, Math.round((Math.abs(sa)/maxAbs)*100));
    const inativa = c.ativa === false;
    const color = inativa ? "var(--ink-faint)" : (lockedReceber ? "var(--ink-faint)" : (nested ? "var(--c-porto)" : "var(--accent)"));
    const nomeTxt = nested ? `↳ ${esc(c.nome)}` : esc(c.nome);
    return `<div class="bar-row" style="${nested ? 'padding-left:14px;' : ''}">
      <div class="name" style="${nested ? 'font-weight:500; font-size:12px;' : ''}"><span class="tag-dot" style="background:${color}"></span>${nomeTxt}${inativa ? ' <span class="status-pill status-agendado">Inativa</span>' : ""}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${color};"></div></div>
      <div class="val ${lockedReceber ? 'masked-value' : ''}">${maskBRL(sa, state.receberUnlocked)}</div>
    </div>`;
  };
  const barsHTML = contasRaiz().map(c => barRow(c,false) + caixinhasDe(c.id).map(cx=>barRow(cx,true)).join("")).join("");
  const topListHTML = (lista, unlocked) => {
    if(!lista.length) return emptyState("Nada lançado neste mês.");
    return lista.map((l,i) => `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; ${i===0?'':'border-top:1px solid #F0F1F4;'}">
        <div style="min-width:0;"><div style="font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${i+1}. ${esc(l.descricao)}</div>
        <div style="font-size:11px; color:var(--ink-faint);">${fmtDateBR(l.data)} · ${l.status}${l.negocio ? ' · '+esc(l.negocio) : ''}</div></div>
        <div class="${unlocked?'':'masked-value'}" style="font-family:var(--font-mono); font-size:12.5px; font-weight:600; white-space:nowrap;">${maskBRL(l.valor, unlocked)}</div>
      </div>`).join("");
  };
  const listaAPagar = contasAPagarConsolidado();
  const contasAPagarHTML = listaAPagar.length ? listaAPagar.map(item => `
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; border-top:1px solid #F0F1F4;">
      <div style="min-width:0;">
        <div style="font-size:12.5px; font-weight:600;">${item.tipo==='fatura'?'💳 ':''}${esc(item.descricao)}</div>
        <div style="font-size:11px; color:var(--ink-faint);">Vence ${fmtDateBR(item.data)}${item.negocio?' · '+esc(item.negocio):''} · ${item.status}</div>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="${lockedPagar?'masked-value':''}" style="font-family:var(--font-mono); font-weight:600; white-space:nowrap;">${maskBRL(item.valor, state.pagarUnlocked)}</span>
        ${item.tipo === 'fatura'
          ? `<button class="btn btn-ghost btn-sm" data-action="pagar-fatura" data-id="${item.cartaoId}" data-venc="${item.data}">Pagar</button>`
          : `<button class="icon-btn" data-action="baixar-titulo" data-id="${item.id}" title="Dar baixa" style="color:#0F5C3F;">💲</button>`}
      </div>
    </div>`).join("") : emptyState("Nada em aberto. 🎉");

  return `
    <div class="page-header"><div><div class="page-title">Dashboard</div><div class="page-sub">Posição do mês — navegue entre os meses para ver a projeção passada ou futura</div></div></div>
    <div class="panel" style="margin-bottom:18px;">
      <div class="panel-body" style="padding-top:16px;">
        <div style="display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:18px;">
          <button class="icon-btn" data-action="mes-prev" style="font-size:16px; padding:6px 12px; border:1px solid var(--line); border-radius:8px;">◀</button>
          <div style="text-align:center; min-width:200px;">
            <input type="month" id="mesManualInput" value="${mv.ano}-${String(mv.mes+1).padStart(2,'0')}" style="font-family:var(--font-display); font-weight:700; font-size:16px; border:none; background:transparent; text-align:center; cursor:pointer; color:var(--ink); padding:2px;">
            <div>${!isMesAtual ? `<span style="font-size:11px; color:var(--ink-faint); cursor:pointer; text-decoration:underline;" data-action="mes-hoje">voltar para hoje</span>` : `<span style="font-size:11px; color:var(--ink-faint);">mês atual</span>`}</div>
          </div>
          <button class="icon-btn" data-action="mes-next" style="font-size:16px; padding:6px 12px; border:1px solid var(--line); border-radius:8px;">▶</button>
        </div>
        <div class="kpi-grid" style="grid-template-columns: repeat(2, minmax(150px, 1fr)); margin-bottom:14px;">
          <div class="kpi-card" style="text-align:center;"><div class="kpi-label">Saldo final mês anterior</div><div class="kpi-value ${lockedReceber ? 'masked-value' : (saldoMesAnterior>=0?'pos':'neg')}">${maskBRL(saldoMesAnterior, state.receberUnlocked)}</div></div>
          <div class="kpi-card" style="text-align:center;"><div class="kpi-label">Saldo atual</div><div class="kpi-value ${lockedReceber || lockedPagar ? 'masked-value' : (saldoAtualMes>=0?'pos':'neg')}">${(lockedReceber || lockedPagar) ? "R$ ••••••" : fmtBRL(saldoAtualMes)}</div><div class="kpi-note">Mês anterior + realizado receitas − realizado despesas</div></div>
        </div>
        <div class="kpi-grid" style="grid-template-columns: repeat(2, minmax(150px, 1fr)); margin-bottom:14px;">
          <div class="kpi-card"><div class="kpi-label">Previsto receitas</div><div class="kpi-value ${lockedReceber ? 'masked-value' : 'pos'}">${maskBRL(movPendente.entradas, state.receberUnlocked)}</div><div class="kpi-note">Ainda não baixado</div></div>
          <div class="kpi-card"><div class="kpi-label">Previsto despesas</div><div class="kpi-value ${lockedPagar ? 'masked-value' : 'neg'}">${maskBRL(movPendente.saidas, state.pagarUnlocked)}</div><div class="kpi-note">Ainda não baixado</div></div>
        </div>
        <div class="kpi-grid" style="grid-template-columns: repeat(2, minmax(150px, 1fr)); margin-bottom:14px;">
          <div class="kpi-card"><div class="kpi-label">Realizado receitas</div><div class="kpi-value ${lockedReceber ? 'masked-value' : 'pos'}">${maskBRL(movReal.entradas, state.receberUnlocked)}</div></div>
          <div class="kpi-card"><div class="kpi-label">Realizado despesas</div><div class="kpi-value ${lockedPagar ? 'masked-value' : 'neg'}">${maskBRL(movReal.saidas, state.pagarUnlocked)}</div></div>
        </div>
        <div class="kpi-grid" style="grid-template-columns: 1fr;">
          <div class="kpi-card" style="text-align:center;"><div class="kpi-label">Saldo final previsto</div><div class="kpi-value ${lockedReceber || lockedPagar ? 'masked-value' : (saldoFinalPrevisto>=0?'pos':'neg')}">${(lockedReceber || lockedPagar) ? "R$ ••••••" : fmtBRL(saldoFinalPrevisto)}</div><div class="kpi-note">Saldo atual + previsto receitas − previsto despesas</div></div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><div class="panel-title">Contas a Pagar</div></div>
      <div class="panel-body" style="padding-top:6px;">${contasAPagarHTML}</div>
    </div>
    <div class="kpi-grid" style="grid-template-columns: repeat(2, minmax(240px, 1fr)); margin-bottom:20px;">
      <div class="panel" style="margin-bottom:0;"><div class="panel-head"><div class="panel-title">Top 5 maiores receitas do mês</div></div><div class="panel-body" style="padding-top:6px;">${topListHTML(topReceitas, state.receberUnlocked)}</div></div>
      <div class="panel" style="margin-bottom:0;"><div class="panel-head"><div class="panel-title">Top 5 maiores despesas do mês</div></div><div class="panel-body" style="padding-top:6px;">${topListHTML(topDespesas, state.pagarUnlocked)}</div></div>
    </div>
    <div class="panel"><div class="panel-head"><div class="panel-title">Saldo por conta${!isMesAtual ? ` — projetado até ${NOMES_MESES[mv.mes]} de ${mv.ano}` : ''}</div></div><div class="panel-body">${barsHTML || emptyState("Nenhuma conta cadastrada ainda.")}</div></div>
  `;
}

// ============================================================
// VIEW: CONTAS
// ============================================================
function viewContas(){
  const rowHTML = (c, nested) => {
    const sa = saldoAtual(c.id), sp = saldoProjetado(c.id), nc = naoConciliados(c.id);
    const inativa = c.ativa === false;
    const nomeCell = nested ? `<span style="color:var(--ink-faint); padding-left:18px;">↳</span> ${esc(c.nome)}` : `<strong>${esc(c.nome)}</strong><div style="font-size:11px;color:var(--ink-faint)">${esc(c.instituicao)} · ${esc(c.tipo)}</div>`;
    const novaCaixinhaBtn = nested ? "" : `<button class="icon-btn" data-action="new-caixinha" data-id="${c.id}" title="Nova caixinha">＋📦</button>`;
    return `<tr style="${inativa ? 'opacity:.55;' : ''} ${nested ? 'background:#FAFBFC;' : ''}">
      <td style="${nested ? 'padding-left:26px;' : ''}">${nomeCell}</td>
      <td class="num ${state.receberUnlocked?'':'masked-value'}">${maskBRL(c.saldoInicial, state.receberUnlocked)}</td>
      <td class="num ${state.receberUnlocked?'':'masked-value'}" style="font-weight:600;">${maskBRL(sa, state.receberUnlocked)}</td>
      <td class="num ${state.receberUnlocked?'':'masked-value'}">${maskBRL(sp, state.receberUnlocked)}</td>
      <td style="text-align:center;">${nc > 0 ? `<span class="status-pill status-pendente">${nc}</span>` : "—"}</td>
      <td style="text-align:center;"><span class="status-pill ${inativa ? 'status-agendado' : 'status-pago'}" style="cursor:pointer;" data-action="toggle-ativa" data-id="${c.id}" title="Clique para ${inativa?'ativar':'inativar'}">${inativa ? "Inativa" : "Ativa"}</span></td>
      <td><div class="row-actions">${novaCaixinhaBtn}<button class="icon-btn" data-action="edit-conta" data-id="${c.id}" title="Editar">✎</button><button class="icon-btn danger" data-action="del-conta" data-id="${c.id}" title="Excluir">🗑</button></div></td>
    </tr>`;
  };
  const rows = contasRaiz().map(c => rowHTML(c,false) + caixinhasDe(c.id).map(cx=>rowHTML(cx,true)).join("")).join("");
  return `
    <div class="page-header"><div><div class="page-title">Contas Bancárias</div><div class="page-sub">Saldo Atual soma só lançamentos Pagos. Use "＋📦" para criar caixinhas dentro de uma conta.</div></div><button class="btn btn-primary" data-action="new-conta">+ Nova conta</button></div>
    <div class="panel"><div class="panel-body" style="padding-top:14px;"><table><thead><tr><th>Conta</th><th class="num">Saldo Inicial</th><th class="num">Saldo Atual</th><th class="num">Saldo Projetado</th><th style="text-align:center;">Não conc.</th><th style="text-align:center;">Status</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="7">${emptyState("Nenhuma conta cadastrada.")}</td></tr>`}</tbody></table></div></div>
  `;
}

// ============================================================
// VIEW: CARTÕES DE CRÉDITO
// ============================================================
function viewCartoes(){
  const lockedPagar = !state.pagarUnlocked;
  const cardHTML = (c) => {
    const emAberto = faturaEmAberto(c.id);
    const disp = Number(c.limite||0) - emAberto;
    const inativo = c.ativo === false;
    const estourado = disp < 0;
    const todasFaturas = faturasAgrupadas(c.id);
    const faturas = todasFaturas.slice(0,6);
    const faturasHTML = faturas.length ? faturas.map(f => `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-top:1px solid #F0F1F4; font-size:12px;">
        <span style="color:var(--ink-soft); cursor:pointer;" data-action="ver-fatura" data-id="${c.id}" data-venc="${f.data}">Vence ${fmtDateBR(f.data)} <span style="color:var(--ink-faint);">(${f.itens.length} item${f.itens.length===1?'':'s'})</span></span>
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="${lockedPagar?'masked-value':''}" style="font-family:var(--font-mono); font-weight:600;">${maskBRL(f.total, state.pagarUnlocked)}</span>
          <button class="btn btn-ghost btn-sm" data-action="ver-fatura" data-id="${c.id}" data-venc="${f.data}">Detalhes</button>
          <button class="btn btn-ghost btn-sm" data-action="pagar-fatura" data-id="${c.id}" data-venc="${f.data}">Pagar fatura</button>
        </div>
      </div>`).join("") + (todasFaturas.length > faturas.length ? `<div style="font-size:11px; color:var(--ink-faint); padding-top:6px;">+ ${todasFaturas.length - faturas.length} fatura(s) mais à frente</div>` : "")
      : `<div style="font-size:12px; color:var(--ink-faint); padding:6px 0;">Nenhuma fatura em aberto.</div>`;
    const cor = PALETA_NEGOCIOS[state.cartoes.indexOf(c) % PALETA_NEGOCIOS.length];
    return `<div class="panel" style="margin-bottom:14px; ${inativo?'opacity:.55;':''}">
      <div style="padding:16px 18px; border-bottom:1px solid var(--line);">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
          <div>
            <div style="display:flex; align-items:center; gap:8px;"><span class="tag-dot" style="background:${cor};"></span><strong>${esc(c.nome)}</strong><span class="status-pill ${inativo?'status-agendado':'status-pago'}" style="cursor:pointer;" data-action="toggle-cartao-ativo" data-id="${c.id}">${inativo?"Inativo":"Ativo"}</span></div>
            <div style="font-size:12px; color:var(--ink-faint); margin-top:3px;">${esc(c.bandeira)} · final ${esc(c.ultimosDigitos)} · fecha dia ${c.diaFechamento} · vence dia ${c.diaVencimento} · paga com ${contaLabel(contaById(c.contaPagamentoId))}</div>
          </div>
          <div class="row-actions"><button class="btn btn-primary btn-sm" data-action="new-compra-cartao" data-id="${c.id}">+ Compra</button><button class="icon-btn" data-action="edit-cartao" data-id="${c.id}" title="Editar">✎</button><button class="icon-btn danger" data-action="del-cartao" data-id="${c.id}" title="Excluir">🗑</button></div>
        </div>
      </div>
      <div class="panel-body" style="padding-top:14px;">
        <div class="kpi-grid" style="grid-template-columns: repeat(3, minmax(120px,1fr));">
          <div class="kpi-card"><div class="kpi-label">Limite</div><div class="kpi-value" style="font-size:16px;">${fmtBRL(c.limite)}</div></div>
          <div class="kpi-card"><div class="kpi-label">Fatura em aberto</div><div class="kpi-value ${lockedPagar?'masked-value':'neg'}" style="font-size:16px;">${maskBRL(emAberto, state.pagarUnlocked)}</div></div>
          <div class="kpi-card"><div class="kpi-label">Limite disponível</div><div class="kpi-value ${lockedPagar?'masked-value':(estourado?'neg':'pos')}" style="font-size:16px;">${lockedPagar ? "R$ ••••••" : fmtBRL(disp)}</div></div>
        </div>
        <div style="margin-top:10px;"><div style="font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:2px;">Faturas em aberto — pagamento é por fatura fechada, não por compra</div>${faturasHTML}</div>
      </div>
    </div>`;
  };
  return `
    <div class="page-header"><div><div class="page-title">Cartões de Crédito</div><div class="page-sub">Cada compra vira um lançamento na data de vencimento da fatura certa — já entra em Contas a Pagar automaticamente.</div></div><button class="btn btn-primary" data-action="new-cartao">+ Novo cartão</button></div>
    ${state.cartoes.map(cardHTML).join("") || emptyState("Nenhum cartão cadastrado ainda.")}
  `;
}

// ============================================================
// VIEW: LANÇAMENTOS
// ============================================================
let lancFilter = { negocio: "", status: "", conta: "", cartao: "", dataDe: "", dataAte: "" };
let lancSelecionados = new Set();
let lancVisibleIds = [];
const LANC_VIEW_CONFIG = {
  lancamentos:     { titulo: "Todos os Lançamentos", sub: "O coração do sistema — toda receita, despesa e transferência entra aqui.", tipo: null,             novoLabel: "+ Novo lançamento",  tipoPreset: null },
  receitas:        { titulo: "Contas a Receber",      sub: "Só receitas — o que você tem pra receber, entrar na conta.",           tipo: "Receita",         novoLabel: "+ Nova receita",     tipoPreset: "Receita" },
  despesas:        { titulo: "Contas a Pagar",         sub: "Só despesas avulsas — compras no cartão ficam no menu Cartão de Crédito.", tipo: "Despesa",     novoLabel: "+ Nova despesa",     tipoPreset: "Despesa" },
  transferencias:  { titulo: "Transferências",         sub: "Só transferências entre contas.",                                     tipo: "Transferência",  novoLabel: "+ Nova transferência", tipoPreset: "Transferência" },
};
function viewLancamentos(){
  const cfg = LANC_VIEW_CONFIG[state.view] || LANC_VIEW_CONFIG.lancamentos;
  let list = [...state.lancamentos].sort((a,b) => a.data.localeCompare(b.data) || a.id.localeCompare(b.id));
  if(cfg.tipo) list = list.filter(l => l.tipo === cfg.tipo);
  if(state.view === "despesas") list = list.filter(l => !l.cartaoId); // compras de cartao ficam so no menu Cartao de Credito
  if(lancFilter.negocio) list = list.filter(l => l.negocio === lancFilter.negocio);
  if(lancFilter.status) list = list.filter(l => l.status === lancFilter.status);
  if(lancFilter.conta) list = list.filter(l => l.contaOrigem === lancFilter.conta || l.contaDestino === lancFilter.conta);
  if(state.view === "lancamentos" && lancFilter.cartao) list = list.filter(l => l.cartaoId === lancFilter.cartao);
  if(lancFilter.dataDe) list = list.filter(l => l.data >= lancFilter.dataDe);
  if(lancFilter.dataAte) list = list.filter(l => l.data <= lancFilter.dataAte);
  lancVisibleIds = list.map(l => l.id);
  // limpa da selecao qualquer id que nao existe mais (ja excluido em outra tela, etc.)
  const idsValidos = new Set(state.lancamentos.map(l=>l.id));
  Array.from(lancSelecionados).forEach(id => { if(!idsValidos.has(id)) lancSelecionados.delete(id); });

  const rows = list.map(l => {
    const origem = contaById(l.contaOrigem);
    const destino = contaById(l.contaDestino);
    const cartao = l.cartaoId ? cartaoById(l.cartaoId) : null;
    const color = negocioCor(l.negocio);
    const statusClass = l.status === "Pago" ? "status-pago" : (l.status === "Provisionado" ? "status-pendente" : "status-agendado");
    let contaTxt;
    if(cartao){
      contaTxt = `💳 ${esc(cartao.nome)} <span style="color:var(--ink-faint); font-size:11px;">final ${esc(cartao.ultimosDigitos)}</span>${l.dataCompra && l.dataCompra !== l.data ? `<div style="font-size:11px;color:var(--ink-faint)">compra em ${fmtDateBR(l.dataCompra)}</div>` : ""}`;
    }else if(l.tipo === "Transferência"){
      contaTxt = `${origem ? contaLabel(origem) : "—"} → ${destino ? contaLabel(destino) : "—"}`;
    }else{
      contaTxt = origem ? contaLabel(origem) : "—";
    }
    const sinal = l.tipo === "Despesa" ? "−" : (l.tipo === "Receita" ? "+" : "⇄");
    const unlocked = l.tipo === "Despesa" ? state.pagarUnlocked : state.receberUnlocked;
    const catTxt = [l.categoria, l.subcategoria].filter(Boolean).join(" › ");
    const recBadge = l.recorrenciaId ? ` <span title="${l.recorrenciaTipo==='parcelado'?'Parcelado':'Recorrente'} (${l.recorrenciaIndex}/${l.recorrenciaTotal})" style="font-size:11px;">${l.recorrenciaTipo==='parcelado'?'💳':'🔁'}</span>` : "";
    const podeBaixar = l.status !== "Pago" && l.tipo !== "Transferência" && !l.cartaoId;
    const marcado = lancSelecionados.has(l.id);
    return `<tr style="${marcado ? 'background:#EAF1FB;' : ''}">
      <td style="text-align:center;"><input type="checkbox" data-action="toggle-select-lanc" data-id="${l.id}" ${marcado?"checked":""}></td>
      <td style="white-space:nowrap;">${fmtDateBR(l.data)}</td>
      <td>${sinal} ${esc(l.tipo)}</td>
      <td>${l.negocio ? `<span class="tag" style="background:color-mix(in srgb, ${color} 14%, white); color:${color};"><span class="tag-dot" style="background:${color}"></span>${esc(l.negocio)}</span>` : "—"}</td>
      <td>${contaTxt}</td>
      <td>${esc(l.descricao)}${recBadge}${catTxt ? `<div style="font-size:11px;color:var(--ink-faint)">${esc(catTxt)}</div>` : ""}</td>
      <td class="num ${unlocked?'':'masked-value'}" style="font-weight:600;">${maskBRL(l.valor, unlocked)}</td>
      <td><span class="status-pill ${statusClass}">${l.status}</span></td>
      <td style="text-align:center;"><span class="${l.conciliado ? 'conc-yes' : 'conc-no'}" style="cursor:pointer;" data-action="toggle-conc" data-id="${l.id}" title="Clique para alternar">${l.conciliado ? "✓ Sim" : "Não"}</span></td>
      <td><div class="row-actions">${podeBaixar ? `<button class="icon-btn" data-action="baixar-titulo" data-id="${l.id}" title="Dar baixa (marcar como pago)" style="color:#0F5C3F;">💲</button>` : ""}<button class="icon-btn" data-action="edit-lanc" data-id="${l.id}" title="Editar">✎</button><button class="icon-btn danger" data-action="del-lanc" data-id="${l.id}" title="Excluir">🗑</button></div></td>
    </tr>`;
  }).join("");

// ============================================================
// BACKUP (exportar/importar JSON)
// ============================================================
function exportarBackup(){
  const dados = {
    versao: "4-supabase", exportadoEm: new Date().toISOString(),
    contas: state.contas, lancamentos: state.lancamentos, ajustes: state.ajustes,
    categorias: state.categorias, negocios: state.negocios, cartoes: state.cartoes
  };
  const blob = new Blob([JSON.stringify(dados, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `backup-financeiro-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  showToast("Backup exportado.");
}
function handleImportarBackup(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try{
      const dados = JSON.parse(ev.target.result);
      if(!dados || !Array.isArray(dados.contas)){ showToast("Arquivo de backup inválido.", "error"); return; }
      if(!confirm("Importar esse backup vai substituir TODOS os dados atuais. Continuar?")) return;
      state.contas = dados.contas || [];
      state.lancamentos = dados.lancamentos || [];
      state.ajustes = dados.ajustes || [];
      state.categorias = dados.categorias || seedCategorias();
      state.negocios = dados.negocios || seedNegocios();
      state.cartoes = dados.cartoes || [];
      await saveContas(); await saveLancamentos(); await saveAjustes();
      await saveCategorias(); await saveNegocios(); await saveCartoes();
      renderApp();
      showToast("Backup importado com sucesso.");
    }catch(err){ showToast("Não consegui ler esse arquivo.", "error"); }
  };
  reader.readAsText(file);
  e.target.value = "";
}

function openModal(html){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "modalOverlay";
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  overlay.addEventListener("click", e => { if(e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
}
function closeModal(){ const el = document.getElementById("modalOverlay"); if(el) el.remove(); }

        <div class="field-help">É fixo, então não pedimos por quanto tempo — geramos automaticamente os próximos ${HORIZONTE_ANOS} anos de lançamentos.</div>
      </div>
      <div id="repeticaoParceladoWrap" class="field" style="display:none;">
        <label>Número de parcelas</label>
        <input type="number" min="2" max="60" step="1" name="qtdParcelas" value="3" id="lancQtdParcelas">
        <div class="field-help" style="margin-bottom:10px;">Cada parcela cai um mês depois da anterior.</div>
        <label>O valor informado acima é</label>
        <select name="tipoValorParcela" id="lancTipoValorParcela">
          <option value="parcela">O valor de cada parcela</option>
          <option value="total">O valor TOTAL da compra (divide entre as parcelas)</option>
        </select>
        <div class="field-help" id="lancDivisaoPreview"></div>
      </div>
      ` : ""}
    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">${isEdit ? "Salvar alterações" : "Adicionar lançamento"}</button></div></form>
  `);

  document.getElementById("lancTipo").addEventListener("change", e => {
    const isTransf = e.target.value === "Transferência";
    document.getElementById("lancDestinoWrap").style.display = isTransf ? "block" : "none";
    document.getElementById("lancNegocioWrap").style.display = isTransf ? "none" : "block";
    document.getElementById("lancCategoriaWrap").style.display = isTransf ? "none" : "block";
  });

  // ---- Categoria inline ----
  const catSelect = document.getElementById("lancCategoriaSelect");
  const subSelect = document.getElementById("lancSubcategoriaSelect");
  const novaCategoriaRow = document.getElementById("novaCategoriaRow");
  const novaSubcategoriaRow = document.getElementById("novaSubcategoriaRow");
  catSelect.addEventListener("change", () => {
    if(catSelect.value === "__nova__"){
      novaCategoriaRow.style.display = "block";
      document.getElementById("novaCategoriaInput").focus();
    }else{
      novaCategoriaRow.style.display = "none";
      subSelect.innerHTML = subcatOptionsHTML(catSelect.value, "");
      novaSubcategoriaRow.style.display = "none";
    }
  });
  document.getElementById("novaCategoriaBtn").addEventListener("click", () => {
    const input = document.getElementById("novaCategoriaInput");
    const nome = input.value.trim();
    if(!nome){ input.focus(); return; }
    if(categoriaByNome(nome)){ showToast("Essa categoria já existe.", "error"); return; }
    state.categorias.push({ id: uid("cat"), nome, subcategorias: [] });
    saveCategorias();
    catSelect.innerHTML = catOptionsHTML(nome);
    novaCategoriaRow.style.display = "none";
    input.value = "";
    subSelect.innerHTML = subcatOptionsHTML(nome, "");
    showToast("Categoria criada.");
  });
  subSelect.addEventListener("change", () => {
    if(subSelect.value === "__nova__"){
      if(!catSelect.value || catSelect.value === "__nova__"){
        showToast("Escolha (ou crie) uma categoria primeiro.", "error");
        subSelect.value = "";
        return;
      }
      novaSubcategoriaRow.style.display = "block";
      document.getElementById("novaSubcategoriaInput").focus();
    }else{
      novaSubcategoriaRow.style.display = "none";
    }
  });
  document.getElementById("novaSubcategoriaBtn").addEventListener("click", () => {
    const input = document.getElementById("novaSubcategoriaInput");
    const nome = input.value.trim();
    if(!nome){ input.focus(); return; }
    const cat = categoriaByNome(catSelect.value);
    if(!cat){ showToast("Escolha uma categoria primeiro.", "error"); return; }
    if(cat.subcategorias.some(s=>s.nome===nome)){ showToast("Essa subcategoria já existe.", "error"); return; }
    cat.subcategorias.push({ id: uid("sub"), nome });
    saveCategorias();
    subSelect.innerHTML = subcatOptionsHTML(cat.nome, nome);
    novaSubcategoriaRow.style.display = "none";
    input.value = "";
    showToast("Subcategoria criada.");
  });

  // ---- Negócio inline ----
  const negSelect = document.getElementById("lancNegocioSelect");
  const novoNegocioRow = document.getElementById("novoNegocioRow");
  negSelect.addEventListener("change", () => {
    novoNegocioRow.style.display = negSelect.value === "__novo__" ? "block" : "none";
    if(negSelect.value === "__novo__") document.getElementById("novoNegocioInput").focus();
  });
  document.getElementById("novoNegocioBtn").addEventListener("click", () => {
    const input = document.getElementById("novoNegocioInput");
    const nome = input.value.trim();
    if(!nome){ input.focus(); return; }
    if(negocioByNome(nome)){ showToast("Esse negócio já existe.", "error"); return; }
    state.negocios.push({ id: uid("neg"), nome, cor: proximaCorNegocio() });
    saveNegocios();
    negSelect.innerHTML = negOptionsHTML(nome);
    novoNegocioRow.style.display = "none";
    input.value = "";
    showToast("Negócio criado.");
  });

  // ---- Repetição + divisão total/parcela ----
  const repSelect = document.getElementById("lancRepeticao");
  if(repSelect){
    const recWrap = document.getElementById("repeticaoRecorrenteWrap");
    const parWrap = document.getElementById("repeticaoParceladoWrap");
    const valorHint = document.getElementById("valorHint");
    const tipoValorParcela = document.getElementById("lancTipoValorParcela");
    const qtdParcelasInput = document.getElementById("lancQtdParcelas");
    const divisaoPreview = document.getElementById("lancDivisaoPreview");
    const atualizarDivisaoPreview = () => {
      if(repSelect.value !== "parcelado" || tipoValorParcela.value !== "total"){ divisaoPreview.textContent = ""; return; }
      const valorInput = document.getElementById("campo_valor");
      const total = parseFloat(valorInput ? valorInput.value : 0) || 0;
      const qtd = Math.max(2, parseInt(qtdParcelasInput.value)||2);
      const partes = dividirValor(total, qtd);
      divisaoPreview.textContent = partes[0] === partes[partes.length-1]
        ? `${qtd}x de ${fmtBRL(partes[0])}`
        : `${qtd-1}x de ${fmtBRL(partes[0])} + 1x de ${fmtBRL(partes[partes.length-1])} (ajuste de centavos)`;
    };
    repSelect.addEventListener("change", () => {
      recWrap.style.display = repSelect.value === "recorrente" ? "block" : "none";
      parWrap.style.display = repSelect.value === "parcelado" ? "block" : "none";
      valorHint.textContent = repSelect.value === "parcelado" ? "(valor de cada parcela, por padrão)" : (repSelect.value === "recorrente" ? "(valor de cada ocorrência)" : "");
      atualizarDivisaoPreview();
    });
    tipoValorParcela.addEventListener("change", atualizarDivisaoPreview);
    qtdParcelasInput.addEventListener("input", atualizarDivisaoPreview);
    document.getElementById("campo_valor")?.addEventListener("input", atualizarDivisaoPreview);
  }
  attachCalculadora("valor");

  document.getElementById("formLanc").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const tipo = fd.get("tipo");
    if(catSelect.value === "__nova__" || subSelect.value === "__nova__"){
      showToast("Finalize a criação da categoria/subcategoria antes de salvar.", "error"); return;
    }
    if(negSelect.value === "__novo__"){
      showToast("Finalize a criação do negócio antes de salvar.", "error"); return;
    }
    const data = {
      data: fd.get("data"), tipo,
      negocio: tipo === "Transferência" ? "" : (fd.get("negocio")||""),
      categoria: tipo === "Transferência" ? "" : (fd.get("categoria")||""),
      subcategoria: tipo === "Transferência" ? "" : (fd.get("subcategoria")||""),
      contaOrigem: fd.get("contaOrigem"),
      contaDestino: tipo === "Transferência" ? fd.get("contaDestino") : "",
      valor: parseFloat(fd.get("valor"))||0,
      descricao: fd.get("descricao").trim(),
      status: fd.get("status"),
      conciliado: fd.get("conciliado") === "on"
    };
    if(tipo === "Transferência" && data.contaOrigem === data.contaDestino){
      showToast("Conta de origem e destino não podem ser iguais.", "error"); return;
    }

    if(isEdit){
      if(existing.recorrenciaId){
        closeModal();
        modalEscopoEdicaoSerie(existing, data);
      }else{
        Object.assign(existing, data);
        await saveLancamentos(); closeModal(); renderApp(); showToast("Lançamento atualizado.");
      }
      return;
    }

    const repeticao = fd.get("repeticao") || "nenhuma";
    if(repeticao === "nenhuma"){
      state.lancamentos.push({ id: uid("l"), ...data });
      await saveLancamentos(); closeModal(); renderApp(); showToast("Lançamento adicionado.");
      return;
    }
    const isParcelado = repeticao === "parcelado";
    const freq = isParcelado ? "Mensal" : (fd.get("frequencia")||"Mensal");
    const OCORRENCIAS_POR_ANO = { "Semanal":52, "Quinzenal":24, "Mensal":12, "Bimestral":6, "Trimestral":4, "Semestral":2, "Anual":1 };
    let qtd;
    if(isParcelado){
      qtd = Math.max(2, parseInt(fd.get("qtdParcelas"))||2);
    }else{
      qtd = (OCORRENCIAS_POR_ANO[freq]||12) * HORIZONTE_ANOS;
    }
    const valoresParcelas = (isParcelado && fd.get("tipoValorParcela") === "total") ? dividirValor(data.valor, qtd) : null;
    const grupoId = uid("rec");
    let dataOcorrencia = data.data;
    for(let i=0;i<qtd;i++){
      const descricaoOcorrencia = isParcelado ? `${data.descricao} (${i+1}/${qtd})` : data.descricao;
      state.lancamentos.push({
        id: uid("l"), ...data,
        valor: valoresParcelas ? valoresParcelas[i] : data.valor,
        data: dataOcorrencia,
        descricao: descricaoOcorrencia,
        status: i===0 ? data.status : "Provisionado",
        conciliado: i===0 ? data.conciliado : false,
        recorrenciaId: grupoId, recorrenciaTipo: repeticao, recorrenciaIndex: i+1, recorrenciaTotal: qtd
      });
      dataOcorrencia = proximaData(dataOcorrencia, freq);
    }
    await saveLancamentos(); closeModal(); renderApp();
    showToast(isParcelado ? `${qtd} parcelas criadas.` : `Lançamento fixo criado (próximos ${HORIZONTE_ANOS} anos já agendados).`);
  });
}

            <button type="button" class="btn btn-ghost btn-sm" id="compraNovaSubcategoriaBtn" style="width:100%; justify-content:center;">+ Adicionar subcategoria</button>
          </div>
        </div>
      </div>
      <div class="field"><label>Negócio</label>
        <select name="negocio" id="compraNegocioSelect">${negOptionsHTML("")}</select>
        <div class="field-inline-add" id="compraNovoNegocioRow" style="display:none; margin-top:8px;">
          <input type="text" id="compraNovoNegocioInput" placeholder="Nome do novo negócio" style="width:100%; font-family:var(--font-body); font-size:13px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); margin-bottom:6px;">
          <button type="button" class="btn btn-ghost btn-sm" id="compraNovoNegocioBtn" style="width:100%; justify-content:center;">+ Adicionar negócio</button>
        </div>
      </div>
      <div class="field"><label>Descrição</label><input required type="text" name="descricao" placeholder="Ex: Notebook, Supermercado..."></div>
      <div class="field">
        <label>Repetição</label>
        <select name="repeticao" id="compraRepeticao">
          <option value="nenhuma">Compra única (à vista)</option>
          <option value="parcelado">💳 Parcelado (ex: 12x)</option>
          <option value="recorrente">🔁 Recorrente (ex: assinatura cobrada no cartão)</option>
        </select>
      </div>
      <div id="compraParceladoWrap" class="field" style="display:none;">
        <label>Número de parcelas</label>
        <input type="number" min="2" max="60" step="1" name="qtdParcelas" value="2" id="compraQtdParcelas">
        <div class="field-help" style="margin-bottom:10px;">Cada parcela cai na fatura de um mês.</div>
        <label>O valor informado acima é</label>
        <select name="tipoValorParcela" id="compraTipoValorParcela">
          <option value="parcela">O valor de cada parcela</option>
          <option value="total">O valor TOTAL da compra (divide entre as parcelas)</option>
        </select>
        <div class="field-help" id="compraDivisaoPreview"></div>
      </div>
      <div id="compraRecorrenteWrap" class="field" style="display:none;">
        <label>Repetir a cada</label>
        <select name="frequencia"><option value="Mensal" selected>Mês</option><option value="Bimestral">Bimestre</option><option value="Trimestral">Trimestre</option><option value="Semestral">Semestre</option><option value="Anual">Ano</option></select>
        <div class="field-help">É fixo, então geramos automaticamente os próximos ${HORIZONTE_ANOS} anos de faturas.</div>
      </div>
      <div class="field-help" style="margin-top:4px;">Toda compra entra como "Provisionado" — dá baixa manual (💲 em Lançamentos) quando pagar a fatura.</div>
    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Adicionar compra</button></div></form>
  `);

  const atualizarPreview = () => {
    const cartao = cartaoById(document.getElementById("compraCartaoSelect").value);
    const dataCompra = document.getElementById("compraDataInput").value;
    if(!cartao || !dataCompra) return;
    const venc = calcularVencimento(dataCompra, cartao);
    document.getElementById("compraFaturaPreview").textContent = `Cai na fatura com vencimento em ${fmtDateBR(venc)}.`;
  };
  document.getElementById("compraCartaoSelect").addEventListener("change", atualizarPreview);
  document.getElementById("compraDataInput").addEventListener("change", atualizarPreview);
  atualizarPreview();

  const catSelect = document.getElementById("compraCategoriaSelect");
  const subSelect = document.getElementById("compraSubcategoriaSelect");
  const novaCategoriaRow = document.getElementById("compraNovaCategoriaRow");
  const novaSubcategoriaRow = document.getElementById("compraNovaSubcategoriaRow");
  catSelect.addEventListener("change", () => {
    if(catSelect.value === "__nova__"){ novaCategoriaRow.style.display = "block"; document.getElementById("compraNovaCategoriaInput").focus(); }
    else{ novaCategoriaRow.style.display = "none"; subSelect.innerHTML = subcatOptionsHTML(catSelect.value, ""); novaSubcategoriaRow.style.display = "none"; }
  });
  document.getElementById("compraNovaCategoriaBtn").addEventListener("click", () => {
    const input = document.getElementById("compraNovaCategoriaInput");
    const nome = input.value.trim();
    if(!nome){ input.focus(); return; }
    if(categoriaByNome(nome)){ showToast("Essa categoria já existe.", "error"); return; }
    state.categorias.push({ id: uid("cat"), nome, subcategorias: [] });
    saveCategorias();
    catSelect.innerHTML = catOptionsHTML(nome);
    novaCategoriaRow.style.display = "none"; input.value = "";
    subSelect.innerHTML = subcatOptionsHTML(nome, "");
    showToast("Categoria criada.");
  });
  subSelect.addEventListener("change", () => {
    if(subSelect.value === "__nova__"){
      if(!catSelect.value || catSelect.value === "__nova__"){ showToast("Escolha (ou crie) uma categoria primeiro.", "error"); subSelect.value = ""; return; }
      novaSubcategoriaRow.style.display = "block"; document.getElementById("compraNovaSubcategoriaInput").focus();
    }else{ novaSubcategoriaRow.style.display = "none"; }
  });
  document.getElementById("compraNovaSubcategoriaBtn").addEventListener("click", () => {
    const input = document.getElementById("compraNovaSubcategoriaInput");
    const nome = input.value.trim();
    if(!nome){ input.focus(); return; }
    const cat = categoriaByNome(catSelect.value);
    if(!cat){ showToast("Escolha uma categoria primeiro.", "error"); return; }
    if(cat.subcategorias.some(s=>s.nome===nome)){ showToast("Essa subcategoria já existe.", "error"); return; }
    cat.subcategorias.push({ id: uid("sub"), nome });
    saveCategorias();
    subSelect.innerHTML = subcatOptionsHTML(cat.nome, nome);
    novaSubcategoriaRow.style.display = "none"; input.value = "";
    showToast("Subcategoria criada.");
  });

  const negSelect = document.getElementById("compraNegocioSelect");
  const novoNegocioRow = document.getElementById("compraNovoNegocioRow");
  negSelect.addEventListener("change", () => {
    novoNegocioRow.style.display = negSelect.value === "__novo__" ? "block" : "none";
    if(negSelect.value === "__novo__") document.getElementById("compraNovoNegocioInput").focus();
  });
  document.getElementById("compraNovoNegocioBtn").addEventListener("click", () => {
    const input = document.getElementById("compraNovoNegocioInput");
    const nome = input.value.trim();
    if(!nome){ input.focus(); return; }
    if(negocioByNome(nome)){ showToast("Esse negócio já existe.", "error"); return; }
    state.negocios.push({ id: uid("neg"), nome, cor: proximaCorNegocio() });
    saveNegocios();
    negSelect.innerHTML = negOptionsHTML(nome);
    novoNegocioRow.style.display = "none"; input.value = "";
    showToast("Negócio criado.");
  });

  const repSelect = document.getElementById("compraRepeticao");
  const parWrap = document.getElementById("compraParceladoWrap");
  const recWrap = document.getElementById("compraRecorrenteWrap");
  const valorHint = document.getElementById("compraValorHint");
  const compraTipoValorParcela = document.getElementById("compraTipoValorParcela");
  const compraQtdParcelas = document.getElementById("compraQtdParcelas");
  const compraDivisaoPreview = document.getElementById("compraDivisaoPreview");
  const atualizarCompraDivisaoPreview = () => {
    if(repSelect.value !== "parcelado" || compraTipoValorParcela.value !== "total"){ compraDivisaoPreview.textContent = ""; return; }
    const valorInput = document.getElementById("campo_valor");
    const total = parseFloat(valorInput ? valorInput.value : 0) || 0;
    const qtd = Math.max(2, parseInt(compraQtdParcelas.value)||2);
    const partes = dividirValor(total, qtd);
    compraDivisaoPreview.textContent = partes[0] === partes[partes.length-1]
      ? `${qtd}x de ${fmtBRL(partes[0])}`
      : `${qtd-1}x de ${fmtBRL(partes[0])} + 1x de ${fmtBRL(partes[partes.length-1])} (ajuste de centavos)`;
  };
  repSelect.addEventListener("change", () => {
    parWrap.style.display = repSelect.value === "parcelado" ? "block" : "none";
    recWrap.style.display = repSelect.value === "recorrente" ? "block" : "none";
    valorHint.textContent = repSelect.value === "parcelado" ? "(valor de cada parcela, por padrão)" : (repSelect.value === "recorrente" ? "(valor de cada cobrança)" : "");
    atualizarCompraDivisaoPreview();
  });
  compraTipoValorParcela.addEventListener("change", atualizarCompraDivisaoPreview);
  compraQtdParcelas.addEventListener("input", atualizarCompraDivisaoPreview);
  document.getElementById("campo_valor")?.addEventListener("input", () => { atualizarCompraDivisaoPreview(); });
  attachCalculadora("valor");

  document.getElementById("formCompraCartao").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    if(catSelect.value === "__nova__" || subSelect.value === "__nova__"){ showToast("Finalize a criação da categoria/subcategoria antes de salvar.", "error"); return; }
    if(negSelect.value === "__novo__"){ showToast("Finalize a criação do negócio antes de salvar.", "error"); return; }
    const cartao = cartaoById(fd.get("cartaoId"));
    if(!cartao){ showToast("Escolha um cartão.", "error"); return; }
    const dataCompra = fd.get("dataCompra");
    const base = {
      tipo: "Despesa", negocio: fd.get("negocio")||"", categoria: fd.get("categoria")||"", subcategoria: fd.get("subcategoria")||"",
      contaOrigem: cartao.contaPagamentoId, contaDestino: "", descricao: fd.get("descricao").trim(),
      status: "Provisionado", conciliado: false, cartaoId: cartao.id, dataCompra
    };
    const valor = parseFloat(fd.get("valor"))||0;
    const repeticao = fd.get("repeticao") || "nenhuma";

    if(repeticao === "nenhuma"){
      const venc = calcularVencimento(dataCompra, cartao);
      state.lancamentos.push({ id: uid("l"), ...base, valor, data: venc });
      await saveLancamentos(); closeModal(); renderApp(); showToast("Compra adicionada.");
      return;
    }
    const isParcelado = repeticao === "parcelado";
    const freq = isParcelado ? "Mensal" : (fd.get("frequencia")||"Mensal");
    let qtd;
    if(isParcelado){ qtd = Math.max(2, parseInt(fd.get("qtdParcelas"))||2); }
    else{ const OCORRENCIAS_POR_ANO = { "Mensal":12, "Bimestral":6, "Trimestral":4, "Semestral":2, "Anual":1 }; qtd = (OCORRENCIAS_POR_ANO[freq]||12) * HORIZONTE_ANOS; }
    const valoresParcelas = (isParcelado && fd.get("tipoValorParcela") === "total") ? dividirValor(valor, qtd) : null;
    const grupoId = uid("rec");
    let dataVencOcorrencia = calcularVencimento(dataCompra, cartao);
    for(let i=0;i<qtd;i++){
      const descricaoOcorrencia = isParcelado ? `${base.descricao} (${i+1}/${qtd})` : base.descricao;
      state.lancamentos.push({
        id: uid("l"), ...base,
        valor: valoresParcelas ? valoresParcelas[i] : valor,
        descricao: descricaoOcorrencia, data: dataVencOcorrencia,
        recorrenciaId: grupoId, recorrenciaTipo: repeticao, recorrenciaIndex: i+1, recorrenciaTotal: qtd
      });
      dataVencOcorrencia = proximaData(dataVencOcorrencia, freq);
    }
    await saveLancamentos(); closeModal(); renderApp();
    showToast(isParcelado ? `${qtd} parcelas criadas.` : `Compra fixa criada (próximos ${HORIZONTE_ANOS} anos já agendados).`);
  });
}

// MODAL — BAIXAR TÍTULO
