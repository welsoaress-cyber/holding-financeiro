<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holding — Painel Financeiro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F6F8;
    --panel: #FFFFFF;
    --ink: #12151C;
    --ink-soft: #5B6270;
    --ink-faint: #9AA1AF;
    --line: #E5E7EC;
    --sidebar: #10141F;
    --sidebar-ink: #E7EAF2;
    --sidebar-faint: #7C8399;
    --sidebar-active: #1B2233;
    --accent: #146356;
    --accent-soft: #E4F1EE;
    --danger: #C1432E;
    --danger-soft: #FBEAE6;
    --warn: #B4790C;
    --warn-soft: #FBF1DF;
    --c-toptv: #3B7EC4;
    --c-uniplay: #8457C9;
    --c-servnet: #1E9159;
    --c-precautec: #D8752B;
    --c-porto: #0D8C82;
    --c-pessoal: #6B7280;
    --c-compartilhado: #B8891A;
    --radius: 10px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; height:100%; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  #app{ display:flex; min-height:100vh; }
  .sidebar{
    width: 240px;
    flex-shrink:0;
    background: var(--sidebar);
    color: var(--sidebar-ink);
    display:flex;
    flex-direction:column;
    padding: 22px 14px;
  }
  .brand{
    font-family: var(--font-display);
    font-weight:700;
    font-size: 17px;
    letter-spacing: -0.02em;
    padding: 4px 10px 4px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand .dot{ width:8px; height:8px; border-radius:50%; background:#3FD68E; display:inline-block; }
  .brand-sub{
    font-size:11px;
    color: var(--sidebar-faint);
    padding: 0 10px 22px;
    font-family: var(--font-mono);
  }
  .nav-group-label{
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--sidebar-faint);
    padding: 14px 12px 6px;
  }
  .nav-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding: 9px 12px;
    border-radius: 8px;
    color: var(--sidebar-ink);
    cursor:pointer;
    font-size: 13.5px;
    font-weight:500;
    transition: background .12s ease;
    user-select:none;
  }
  .nav-item:hover{ background: rgba(255,255,255,.05); }
  .nav-item.active{ background: var(--sidebar-active); }
  .nav-item.active .nav-ico{ color:#3FD68E; }
  .nav-item.disabled{ color: var(--sidebar-faint); cursor:default; }
  .nav-item.disabled:hover{ background:transparent; }
  .nav-ico{ font-size:14px; width:16px; text-align:center; }
  .soon-badge{
    font-size:9.5px;
    font-family: var(--font-mono);
    background: rgba(255,255,255,.06);
    color: var(--sidebar-faint);
    padding: 2px 6px;
    border-radius: 999px;
  }
  .sidebar-footer{
    margin-top:auto;
    padding: 12px 10px 4px;
    font-size: 11px;
    color: var(--sidebar-faint);
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .sidebar-lock-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    width:100%; padding:9px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.05); color: var(--sidebar-ink); font-size:12.5px; font-weight:600;
    cursor:pointer; margin-bottom:10px; font-family: var(--font-body);
  }
  .sidebar-lock-btn:hover{ background: rgba(255,255,255,.11); }
  .sidebar-lock-btn.unlocked{ background: rgba(63,214,142,.12); border-color: rgba(63,214,142,.32); color:#3FD68E; }
  .masked-value{ color: var(--ink-faint); letter-spacing:1px; }
  .main{ flex:1; min-width:0; padding: 28px 36px 60px; }
  .page-header{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px;}
  .page-title{ font-family: var(--font-display); font-size: 24px; font-weight:700; letter-spacing:-0.01em; }
  .page-sub{ color: var(--ink-soft); font-size: 13px; margin-top:2px; }
  .btn{
    font-family: var(--font-body);
    font-weight:600;
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition: all .12s ease;
  }
  .btn-primary{ background: var(--accent); color:#fff; }
  .btn-primary:hover{ background:#0F4A40; }
  .btn-ghost{ background: transparent; color: var(--ink); border-color: var(--line); }
  .btn-ghost:hover{ background: #F0F1F4; }
  .btn-danger-text{ background:transparent; color:var(--danger); border:none; padding:4px 8px; font-size:12.5px; }
  .btn-sm{ padding:6px 10px; font-size:12px; }
  .btn-logout{ background: rgba(255,255,255,.08); color: var(--sidebar-ink); border:1px solid rgba(255,255,255,.1); }
  .btn-logout:hover{ background: rgba(255,50,50,.15); border-color: rgba(255,50,50,.3); }
  .kpi-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; margin-bottom: 22px; }
  .kpi-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .kpi-label{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
  .kpi-value{ font-family: var(--font-mono); font-size: 22px; font-weight:600; letter-spacing:-0.01em; }
  .kpi-value.pos{ color:#0F5C3F; }
  .kpi-value.neg{ color: var(--danger); }
  .kpi-note{ font-size:11.5px; color:var(--ink-faint); margin-top:6px; }
  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 20px;
    overflow:hidden;
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--line);
  }
  .panel-title{ font-family: var(--font-display); font-weight:600; font-size:15px; }
  .panel-body{ padding: 6px 18px 18px; }
  table{ width:100%; border-collapse: collapse; font-size:13px; }
  thead th{
    text-align:left;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing:.04em;
    color: var(--ink-soft);
    padding: 10px 10px;
    border-bottom: 1px solid var(--line);
    white-space:nowrap;
  }
  tbody td{ padding: 11px 10px; border-bottom: 1px solid #EFF0F3; vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:#FAFBFC; }
  td.num, th.num{ text-align:right; font-family: var(--font-mono); }
  .tag{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11px; font-weight:600; padding: 3px 9px; border-radius:999px;
  }
  .tag-dot{ width:6px; height:6px; border-radius:50%; }
  .status-pill{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; }
  .status-pago{ background: var(--accent-soft); color:#0F5C3F; }
  .status-pendente{ background: var(--warn-soft); color:#8A5C09; }
  .status-agendado{ background:#EAEDF3; color:#4A5266; }
  .conc-yes{ color:#0F5C3F; font-weight:600; }
  .conc-no{ color: var(--ink-faint); }
  .row-actions{ display:flex; gap:4px; justify-content:flex-end; }
  .icon-btn{
    border:none; background:transparent; cursor:pointer; padding:5px 7px; border-radius:6px; color: var(--ink-soft); font-size:13px;
  }
  .icon-btn:hover{ background:#F0F1F4; color:var(--ink); }
  .icon-btn.danger:hover{ background: var(--danger-soft); color: var(--danger); }
  .empty-state{ padding: 40px 20px; text-align:center; color: var(--ink-faint); font-size:13px; }
  .filter-bar{ display:flex; gap:8px; flex-wrap:wrap; padding: 12px 18px 4px; }
  .filter-bar select, .filter-bar input[type=text]{
    font-family: var(--font-body); font-size:12.5px; padding:7px 10px; border-radius:7px; border:1px solid var(--line); background:#FCFCFD; color:var(--ink);
  }
  .modal-overlay{
    position:fixed; inset:0; background: rgba(15,17,22,.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal{
    background:#fff; border-radius: 14px; width: 480px; max-width:100%; max-height:88vh; overflow-y:auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding: 18px 20px; border-bottom:1px solid var(--line); }
  .modal-title{ font-family: var(--font-display); font-weight:700; font-size:16px; }
  .modal-close{ border:none; background:transparent; font-size:18px; cursor:pointer; color:var(--ink-soft); line-height:1; }
  .modal-body{ padding: 18px 20px; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:8px; padding: 14px 20px; border-top:1px solid var(--line); }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  .field input, .field select, .field textarea{
    width:100%; font-family:var(--font-body); font-size:13.5px; padding:9px 11px; border-radius:8px; border:1px solid var(--line); background:#FCFCFD; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid #146356; outline-offset:1px; border-color:transparent; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .checkbox-row{ display:flex; align-items:center; gap:8px; font-size:13px; }
  .checkbox-row input{ width:auto; }
  .field-help{ font-size:11px; color:var(--ink-faint); margin-top:4px; }
  .bar-row{ display:grid; grid-template-columns: 170px 1fr 120px; align-items:center; gap:12px; padding:9px 0; }
  .bar-track{ height:8px; border-radius:999px; background:#EEF0F3; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:999px; }
  .bar-row .val{ font-family:var(--font-mono); font-size:12.5px; text-align:right; }
  .toast-wrap{ position:fixed; bottom:22px; right:22px; display:flex; flex-direction:column; gap:8px; z-index:200; }
  .toast{
    background: var(--ink); color:#fff; padding: 11px 16px; border-radius:9px; font-size:13px;
    box-shadow: 0 8px 24px rgba(0,0,0,.25); animation: toast-in .18s ease-out;
    display:flex; align-items:center; gap:8px;
  }
  .toast.error{ background: var(--danger); }
  @keyframes toast-in{ from{ opacity:0; transform: translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .loading-screen{ display:flex; align-items:center; justify-content:center; height:100vh; width:100%; color: var(--ink-soft); font-family: var(--font-mono); font-size:13px; }
  @media (max-width: 980px){
    .kpi-grid{ grid-template-columns: repeat(2,1fr); }
    .sidebar{ width:72px; }
    .brand span:not(.dot), .brand-sub, .nav-item span.label, .nav-group-label, .soon-badge, .sidebar-footer{ display:none; }
    .nav-item{ justify-content:center; }
    .main{ padding: 20px 16px 50px; }
  }
</style>
</head>
<body>
<div id="app"><div class="loading-screen">Carregando painel financeiro…</div></div>
<div class="toast-wrap" id="toastWrap"></div>
<script>
// ============================================================
// CONFIGURAÇÃO DO SUPABASE
// ============================================================
const SUPABASE_URL = 'https://lkymiclirksgqkeiglyw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0peTquB1iqmsYTBMLwH2JA_eOwz2yTM';
supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ============================================================
// ESTADO E CONSTANTES
// ============================================================
const PALETA_NEGOCIOS = ["#3B7EC4","#8457C9","#1E9159","#D8752B","#0D8C82","#6B7280","#B8891A","#C0447A","#3C6E8F","#8A8F1F"];
const TIPOS_CONTA = ["Conta Corrente","Conta Pagamento","Poupança"];
const TIPOS_LANC = ["Receita","Despesa","Transferência"];
const STATUS_LANC = ["Pago","Provisionado","Agendado"];
const BANDEIRAS = ["Visa","Mastercard","Elo","American Express","Hipercard","Outra"];
const PERIODOS = ["Semanal", "Quinzenal", "Mensal", "Bimestral", "Trimestral", "Semestral", "Anual"];

let state = {
  contas: [], lancamentos: [], ajustes: [], categorias: [], negocios: [], cartoes: [],
  view: "dashboard", storageOK: true, user: null,
  pagarUnlocked: false, receberUnlocked: false,
  mesVisualizado: { ano: new Date().getFullYear(), mes: new Date().getMonth() }
};
const NOMES_MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const HORIZONTE_ANOS = 5;
const SENHA_PAGAR = "@2020";
const SENHA_RECEBER = "@1010";

// ============================================================
// UTILITÁRIOS
// ============================================================
function uid(prefix){ return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtBRL(n){ n = Number(n)||0; return n.toLocaleString("pt-BR", {style:"currency", currency:"BRL"}); }
function maskBRL(n, unlocked){ return unlocked ? fmtBRL(n) : "R$ ••••••"; }
function fmtDateBR(iso){ if(!iso) return "—"; const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function contaById(id){ return state.contas.find(c => c.id === id); }
function cartaoById(id){ return state.cartoes.find(c => c.id === id); }
function negocioByNome(nome){ return state.negocios.find(n => n.nome === nome); }
function categoriaByNome(nome){ return state.categorias.find(c => c.nome === nome); }
function contaLabel(c){
  if(!c) return "—";
  if(c.parentId){ const pai = contaById(c.parentId); return `${pai ? esc(pai.nome) : "?"} → ${esc(c.nome)}`; }
  return esc(c.nome);
}
function negocioCor(nome){
  const n = negocioByNome(nome);
  return (n && n.cor) || "var(--ink-faint)";
}
function showToast(msg, type){
  const wrap = document.getElementById("toastWrap");
  const el = document.createElement("div");
  el.className = "toast" + (type === "error" ? " error" : "");
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function dividirValor(total, qtd){
  const totalCentavos = Math.round(Number(total) * 100);
  const baseCentavos = Math.floor(totalCentavos / qtd);
  const resto = totalCentavos - (baseCentavos * qtd);
  const valores = [];
  for(let i=0;i<qtd;i++){
    let c = baseCentavos;
    if(i === qtd - 1) c += resto;
    valores.push(Math.round(c) / 100);
  }
  return valores;
}
function proximaData(dataISO, freq){
  const d = new Date(dataISO + "T00:00:00");
  if(freq === "Semanal"){ d.setDate(d.getDate() + 7); return d.toISOString().slice(0,10); }
  if(freq === "Quinzenal"){ d.setDate(d.getDate() + 15); return d.toISOString().slice(0,10); }
  const MESES_POR_FREQ = { "Mensal":1, "Bimestral":2, "Trimestral":3, "Semestral":6, "Anual":12 };
  const meses = MESES_POR_FREQ[freq] || 1;
  const dia = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + meses);
  const diasNoMes = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(dia, diasNoMes));
  return d.toISOString().slice(0,10);
}
function calcularVencimento(dataCompraISO, cartao) {
  const d = new Date(dataCompraISO + 'T00:00:00');
  const diaCompra = d.getDate();
  let anoFech = d.getFullYear(), mesFech = d.getMonth();
  if (diaCompra > cartao.diaFechamento) { mesFech += 1; if (mesFech > 11) { mesFech = 0; anoFech += 1; } }
  let anoVenc = anoFech, mesVenc = mesFech;
  if (cartao.diaVencimento < cartao.diaFechamento) { mesVenc += 1; if (mesVenc > 11) { mesVenc = 0; anoVenc += 1; } }
  const diasNoMes = new Date(anoVenc, mesVenc + 1, 0).getDate();
  const diaVenc = Math.min(cartao.diaVencimento, diasNoMes);
  return new Date(anoVenc, mesVenc, diaVenc).toISOString().slice(0,10);
}
function subcategoriasDe(nomeCategoria){
  const cat = categoriaByNome(nomeCategoria);
  return cat ? cat.subcategorias : [];
}
function contasRaiz(){ return state.contas.filter(c => !c.parentId); }
function caixinhasDe(contaId){ return state.contas.filter(c => c.parentId === contaId); }
function contasParaSelecao(selectedId){ return state.contas.filter(c => c.ativa !== false || c.id === selectedId); }

// ============================================================
// FUNÇÕES SUPABASE
// ============================================================
async function loadData() {
  if (!state.user) return;
  try {
    const { data: contas } = await supabase.from('contas').select('*').eq('user_id', state.user.id);
    const { data: lancamentos } = await supabase.from('lancamentos').select('*').eq('user_id', state.user.id);
    const { data: ajustes } = await supabase.from('ajustes').select('*').eq('user_id', state.user.id);
    const { data: categorias } = await supabase.from('categorias').select('*').eq('user_id', state.user.id);
    const { data: negocios } = await supabase.from('negocios').select('*').eq('user_id', state.user.id);
    const { data: cartoes } = await supabase.from('cartoes').select('*').eq('user_id', state.user.id);
    if (contas) state.contas = contas;
    if (lancamentos) state.lancamentos = lancamentos;
    if (ajustes) state.ajustes = ajustes;
    if (categorias) state.categorias = categorias;
    if (negocios) state.negocios = negocios;
    if (cartoes) state.cartoes = cartoes;
  } catch(e) {
    showToast('Erro ao carregar dados: ' + e.message, 'error');
  }
  renderApp();
}
async function saveContas() {
  if (!state.user) return;
  try {
    const data = state.contas.map(c => ({ ...c, user_id: state.user.id }));
    await supabase.from('contas').upsert(data, { onConflict: 'id' });
  } catch(e) { showToast('Erro ao salvar contas', 'error'); }
}
async function saveLancamentos() {
  if (!state.user) return;
  try {
    const data = state.lancamentos.map(l => ({ ...l, user_id: state.user.id }));
    await supabase.from('lancamentos').upsert(data, { onConflict: 'id' });
  } catch(e) { showToast('Erro ao salvar lançamentos', 'error'); }
}
async function saveAjustes() {
  if (!state.user) return;
  try {
    const data = state.ajustes.map(a => ({ ...a, user_id: state.user.id }));
    await supabase.from('ajustes').upsert(data, { onConflict: 'id' });
  } catch(e) { showToast('Erro ao salvar ajustes', 'error'); }
}
async function saveCategorias() {
  if (!state.user) return;
  try {
    const data = state.categorias.map(c => ({ ...c, user_id: state.user.id }));
    await supabase.from('categorias').upsert(data, { onConflict: 'id' });
  } catch(e) { showToast('Erro ao salvar categorias', 'error'); }
}
async function saveNegocios() {
  if (!state.user) return;
  try {
    const data = state.negocios.map(n => ({ ...n, user_id: state.user.id }));
    await supabase.from('negocios').upsert(data, { onConflict: 'id' });
  } catch(e) { showToast('Erro ao salvar negócios', 'error'); }
}
async function saveCartoes() {
  if (!state.user) return;
  try {
    const data = state.cartoes.map(c => ({ ...c, user_id: state.user.id }));
    await supabase.from('cartoes').upsert(data, { onConflict: 'id' });
  } catch(e) { showToast('Erro ao salvar cartões', 'error'); }
}

// ============================================================
// AUTENTICAÇÃO
// ============================================================
let authMode = 'login';
async function doLogin(email, password) {
  try {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) { showToast(error.message, 'error'); return false; }
    state.user = data.user;
    await loadData();
    return true;
  } catch(e) { showToast('Erro ao fazer login', 'error'); return false; }
}
async function doSignup(email, password) {
  try {
    const { data, error } = await supabase.auth.signUp({ email, password });
    if (error) { showToast(error.message, 'error'); return false; }
    if (data.user) {
      state.user = data.user;
      const cats = ['Servidores/Hospedagem','Aluguel','Assinaturas/Softwares','Marketing','Salários/Pró-labore','Impostos/Taxas','Outros'];
      for (const nome of cats) state.categorias.push({ id: uid('cat'), nome, subcategorias: [] });
      const negs = ['TopTV','Uniplay','ServNet','Precautec','Porto Odonto','Pessoal','Compartilhado'];
      for (let i=0; i<negs.length; i++) state.negocios.push({ id: uid('neg'), nome: negs[i], cor: PALETA_NEGOCIOS[i % PALETA_NEGOCIOS.length] });
      await saveCategorias();
      await saveNegocios();
      await loadData();
      showToast('Conta criada com sucesso!');
      return true;
    }
    return false;
  } catch(e) { showToast('Erro ao criar conta', 'error'); return false; }
}
async function doLogout() {
  await supabase.auth.signOut();
  state.user = null;
  state.contas = []; state.lancamentos = []; state.ajustes = []; state.categorias = []; state.negocios = []; state.cartoes = [];

// ============================================================
// CÁLCULOS
// ============================================================
function saldoAtual(contaId) {
  const conta = contaById(contaId);
  if (!conta) return 0;
  let total = Number(conta.saldoInicial) || 0;
  for (const l of state.lancamentos) {
    if (l.status !== 'Pago') continue;
    if (l.tipo === 'Receita' && l.contaOrigem === contaId) total += Number(l.valor);
    if (l.tipo === 'Despesa' && l.contaOrigem === contaId) total -= Number(l.valor);
    if (l.tipo === 'Transferência') {
      if (l.contaOrigem === contaId) total -= Number(l.valor);
      if (l.contaDestino === contaId) total += Number(l.valor);
    }
  }
  for (const a of state.ajustes) {
    if (a.contaId === contaId) total += Number(a.valor);
  }
  return total;
}
function saldoProjetado(contaId) {
  let total = saldoAtual(contaId);
  for (const l of state.lancamentos) {
    if (l.status === 'Pago') continue;
    if (l.tipo === 'Receita' && l.contaOrigem === contaId) total += Number(l.valor);
    if (l.tipo === 'Despesa' && l.contaOrigem === contaId) total -= Number(l.valor);
    if (l.tipo === 'Transferência') {
      if (l.contaOrigem === contaId) total -= Number(l.valor);
      if (l.contaDestino === contaId) total += Number(l.valor);
    }
  }
  return total;
}
function totalConsolidado() {
  let total = 0;
  for (const c of state.contas) total += saldoAtual(c.id);
  return total;
}
function totalReceber() {
  return state.lancamentos.filter(l => l.tipo === 'Receita' && l.status !== 'Pago').reduce((s,l) => s + Number(l.valor), 0);
}
function totalPagar() {
  return state.lancamentos.filter(l => l.tipo === 'Despesa' && l.status !== 'Pago').reduce((s,l) => s + Number(l.valor), 0);
}
function saldoProjetadoAteMes(ano, mes) {
  const base = state.contas.reduce((s,c) => s + (Number(c.saldoInicial)||0), 0);
  const fimMes = new Date(ano, mes + 1, 0);
  const fimISO = fimMes.toISOString().slice(0,10);
  let total = base;
  for (const l of state.lancamentos) {
    if (l.data > fimISO) continue;
    if (l.tipo === 'Receita') total += Number(l.valor);
    if (l.tipo === 'Despesa') total -= Number(l.valor);
  }
  for (const a of state.ajustes) {
    if (a.data <= fimISO) total += Number(a.valor);
  }
  return total;
}
function movimentoPendenteDoMes(ano, mes) {
  const inicioISO = new Date(ano, mes, 1).toISOString().slice(0,10);
  const fimISO = new Date(ano, mes + 1, 0).toISOString().slice(0,10);
  let entradas = 0, saidas = 0;
  for (const l of state.lancamentos) {
    if (l.data < inicioISO || l.data > fimISO || l.status === 'Pago') continue;
    if (l.tipo === 'Receita') entradas += Number(l.valor);
    if (l.tipo === 'Despesa') saidas += Number(l.valor);
  }
  return { entradas, saidas };
}
function movimentoRealizadoDoMes(ano, mes) {
  const inicioISO = new Date(ano, mes, 1).toISOString().slice(0,10);
  const fimISO = new Date(ano, mes + 1, 0).toISOString().slice(0,10);
  let entradas = 0, saidas = 0;
  for (const l of state.lancamentos) {
    if (l.data < inicioISO || l.data > fimISO || l.status !== 'Pago') continue;
    if (l.tipo === 'Receita') entradas += Number(l.valor);
    if (l.tipo === 'Despesa') saidas += Number(l.valor);
  }
  return { entradas, saidas };
}
function topLancamentosDoMes(tipo, ano, mes, n) {
  const inicioISO = new Date(ano, mes, 1).toISOString().slice(0,10);
  const fimISO = new Date(ano, mes + 1, 0).toISOString().slice(0,10);
  return state.lancamentos
    .filter(l => l.tipo === tipo && l.data >= inicioISO && l.data <= fimISO)
    .sort((a,b) => Number(b.valor) - Number(a.valor))
    .slice(0, n || 5);
}
function saldoContaAteMes(contaId, ano, mes) {
  const conta = contaById(contaId);
  if (!conta) return 0;
  const fimISO = new Date(ano, mes + 1, 0).toISOString().slice(0,10);
  let total = Number(conta.saldoInicial) || 0;
  for (const l of state.lancamentos) {
    if (l.data > fimISO) continue;
    if (l.tipo === 'Receita' && l.contaOrigem === contaId) total += Number(l.valor);
    if (l.tipo === 'Despesa' && l.contaOrigem === contaId) total -= Number(l.valor);
    if (l.tipo === 'Transferência') {
      if (l.contaOrigem === contaId) total -= Number(l.valor);
      if (l.contaDestino === contaId) total += Number(l.valor);
    }
  }
  for (const a of state.ajustes) {
    if (a.contaId === contaId && a.data <= fimISO) total += Number(a.valor);
  }
  return total;
}
function faturaEmAberto(cartaoId) {
  return state.lancamentos.filter(l => l.cartaoId === cartaoId && l.status !== 'Pago').reduce((s,l) => s + Number(l.valor), 0);
}
function faturasAgrupadas(cartaoId) {
  const grupos = {};
  state.lancamentos.filter(l => l.cartaoId === cartaoId && l.status !== 'Pago').forEach(l => {
    if (!grupos[l.data]) grupos[l.data] = { data: l.data, total: 0, itens: [] };
    grupos[l.data].total += Number(l.valor);
    grupos[l.data].itens.push(l);
  });
  return Object.values(grupos).sort((a,b) => a.data.localeCompare(b.data));
}

function viewDashboard() {
  const lockedReceber = !state.receberUnlocked;
  const lockedPagar = !state.pagarUnlocked;
  const mv = state.mesVisualizado;
  const hoje = new Date();
  const isMesAtual = mv.ano === hoje.getFullYear() && mv.mes === hoje.getMonth();
  const saldoMesAnterior = (() => { const m = mv.mes===0?11:mv.mes-1; const a = mv.mes===0?mv.ano-1:mv.ano; return saldoProjetadoAteMes(a,m); })();
  const movPendente = movimentoPendenteDoMes(mv.ano, mv.mes);
  const movReal = movimentoRealizadoDoMes(mv.ano, mv.mes);
  const saldoAtualMes = saldoMesAnterior + movReal.entradas - movReal.saidas;
  const saldoFinalPrevisto = saldoAtualMes + movPendente.entradas - movPendente.saidas;
  const topReceitas = topLancamentosDoMes('Receita', mv.ano, mv.mes, 5);
  const topDespesas = topLancamentosDoMes('Despesa', mv.ano, mv.mes, 5);
  const maxAbs = Math.max(...state.contas.map(c => Math.abs(saldoContaAteMes(c.id, mv.ano, mv.mes))), 1);

  const barRow = (c, nested) => {
    const sa = saldoContaAteMes(c.id, mv.ano, mv.mes);
    const pct = lockedReceber ? 45 : Math.max(4, Math.round((Math.abs(sa)/maxAbs)*100));
    const inativa = c.ativa === false;
    const color = inativa ? "var(--ink-faint)" : (lockedReceber ? "var(--ink-faint)" : (nested ? "var(--c-porto)" : "var(--accent)"));
    const nomeTxt = nested ? `↳ ${esc(c.nome)}` : esc(c.nome);
    return `<div class="bar-row" style="${nested ? 'padding-left:14px;' : ''}">
      <div class="name" style="${nested ? 'font-weight:500; font-size:12px;' : ''}"><span class="tag-dot" style="background:${color}"></span>${nomeTxt}${inativa ? ' <span class="status-pill status-agendado">Inativa</span>' : ""}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${color};"></div></div>
      <div class="val ${lockedReceber ? 'masked-value' : ''}">${maskBRL(sa, state.receberUnlocked)}</div>
    </div>`;
  };
  const barsHTML = contasRaiz().map(c => barRow(c,false) + caixinhasDe(c.id).map(cx=>barRow(cx,true)).join("")).join("");
  const topListHTML = (lista, unlocked) => {
    if (!lista.length) return emptyState("Nada lançado neste mês.");
    return lista.map((l,i) => `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; ${i===0?'':'border-top:1px solid #F0F1F4;'}">
        <div style="min-width:0;"><div style="font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${i+1}. ${esc(l.descricao)}</div>
        <div style="font-size:11px; color:var(--ink-faint);">${fmtDateBR(l.data)} · ${l.status}${l.negocio ? ' · '+esc(l.negocio) : ''}</div></div>
        <div class="${unlocked?'':'masked-value'}" style="font-family:var(--font-mono); font-size:12.5px; font-weight:600; white-space:nowrap;">${maskBRL(l.valor, unlocked)}</div>
      </div>`).join("");
  };

  return `
    <div class="page-header"><div><div class="page-title">Dashboard</div><div class="page-sub">Posição do mês — navegue entre os meses para ver a projeção passada ou futura</div></div></div>
    <div class="panel" style="margin-bottom:18px;">
      <div class="panel-body" style="padding-top:16px;">
        <div style="display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:18px;">
          <button class="icon-btn" data-action="mes-prev" style="font-size:16px; padding:6px 12px; border:1px solid var(--line); border-radius:8px;">◀</button>
          <div style="text-align:center; min-width:200px;">
            <input type="month" id="mesManualInput" value="${mv.ano}-${String(mv.mes+1).padStart(2,'0')}" style="font-family:var(--font-display); font-weight:700; font-size:16px; border:none; background:transparent; text-align:center; cursor:pointer; color:var(--ink); padding:2px;">
            <div>${!isMesAtual ? `<span style="font-size:11px; color:var(--ink-faint); cursor:pointer; text-decoration:underline;" data-action="mes-hoje">voltar para hoje</span>` : `<span style="font-size:11px; color:var(--ink-faint);">mês atual</span>`}</div>

          <div class="kpi-card"><div class="kpi-label">Saldo atual</div><div class="kpi-value ${lockedReceber || lockedPagar ? 'masked-value' : (saldoAtualMes>=0?'pos':'neg')}">${(lockedReceber || lockedPagar) ? "R$ ••••••" : fmtBRL(saldoAtualMes)}</div><div class="kpi-note">Mês anterior + realizado receitas − realizado despesas</div></div>
        </div>

        </div>
        <div class="kpi-grid" style="grid-template-columns: repeat(2, minmax(150px, 1fr)); margin-bottom:14px;">
          <div class="kpi-card"><div class="kpi-label">Realizado receitas</div><div class="kpi-value ${lockedReceber ? 'masked-value' : 'pos'}">${maskBRL(movReal.entradas, state.receberUnlocked)}</div></div>

        </div>
        <div class="kpi-grid" style="grid-template-columns: 1fr;">
          <div class="kpi-card" style="text-align:center;"><div class="kpi-label">Saldo final previsto</div><div class="kpi-value ${lockedReceber || lockedPagar ? 'masked-value' : (saldoFinalPrevisto>=0?'pos':'neg')}">${(lockedReceber || lockedPagar) ? "R$ ••••••" : fmtBRL(saldoFinalPrevisto)}</div><div class="kpi-note">Saldo atual + previsto receitas − previsto despesas</div></div>
        </div>
      </div>
    </div>
    <div class="kpi-grid" style="grid-template-columns: repeat(2, minmax(240px, 1fr)); margin-bottom:20px;">
      <div class="panel" style="margin-bottom:0;"><div class="panel-head"><div class="panel-title">Top 5 maiores receitas do mês</div></div><div class="panel-body" style="padding-top:6px;">${topListHTML(topReceitas, state.receberUnlocked)}</div></div>

  `;
}

let lancFilter = { negocio: "", status: "", conta: "", cartao: "", dataDe: "", dataAte: "" };
function viewLancamentos() {
  let list = [...state.lancamentos].sort((a,b) => a.data.localeCompare(b.data) || a.id.localeCompare(b.id));
  if (lancFilter.negocio) list = list.filter(l => l.negocio === lancFilter.negocio);
  if (lancFilter.status) list = list.filter(l => l.status === lancFilter.status);
  if (lancFilter.conta) list = list.filter(l => l.contaOrigem === lancFilter.conta || l.contaDestino === lancFilter.conta);
  if (lancFilter.cartao) list = list.filter(l => l.cartaoId === lancFilter.cartao);
  if (lancFilter.dataDe) list = list.filter(l => l.data >= lancFilter.dataDe);
  if (lancFilter.dataAte) list = list.filter(l => l.data <= lancFilter.dataAte);

  const rows = list.map(l => {
    const origem = contaById(l.contaOrigem);
    const destino = contaById(l.contaDestino);
    const cartao = l.cartaoId ? cartaoById(l.cartaoId) : null;
    const color = negocioCor(l.negocio);
    const statusClass = l.status === "Pago" ? "status-pago" : (l.status === "Provisionado" ? "status-pendente" : "status-agendado");
    let contaTxt = cartao ? `💳 ${esc(cartao.nome)}` : (l.tipo === "Transferência" ? `${origem ? contaLabel(origem) : "—"} → ${destino ? contaLabel(destino) : "—"}` : (origem ? contaLabel(origem) : "—"));
    const sinal = l.tipo === "Despesa" ? "−" : (l.tipo === "Receita" ? "+" : "⇄");
    const unlocked = l.tipo === "Despesa" ? state.pagarUnlocked : state.receberUnlocked;
    const podeBaixar = l.status !== "Pago" && l.tipo !== "Transferência";
    const recBadge = l.recorrenciaId ? ` <span title="${l.recorrenciaTipo==='parcelado'?'Parcelado':'Recorrente'} (${l.recorrenciaIndex}/${l.recorrenciaTotal})" style="font-size:11px;">${l.recorrenciaTipo==='parcelado'?'💳':'🔁'}</span>` : "";
    return `<tr>
      <td>${fmtDateBR(l.data)}</td>
      <td>${sinal} ${esc(l.tipo)}</td>
      <td>${l.negocio ? `<span class="tag" style="background:color-mix(in srgb, ${color} 14%, white); color:${color};"><span class="tag-dot" style="background:${color}"></span>${esc(l.negocio)}</span>` : "—"}</td>
      <td>${contaTxt}</td>
      <td>${esc(l.descricao)}${recBadge}${l.categoria ? `<div style="font-size:11px;color:var(--ink-faint)">${esc(l.categoria)}</div>` : ""}</td>
      <td class="num ${unlocked?'':'masked-value'}" style="font-weight:600;">${maskBRL(l.valor, unlocked)}</td>
      <td><span class="status-pill ${statusClass}">${l.status}</span></td>
      <td style="text-align:center;"><span class="${l.conciliado ? 'conc-yes' : 'conc-no'}" style="cursor:pointer;" data-action="toggle-conc" data-id="${l.id}">${l.conciliado ? "✓ Sim" : "Não"}</span></td>
      <td><div class="row-actions">${podeBaixar ? `<button class="icon-btn" data-action="baixar-titulo" data-id="${l.id}" style="color:#0F5C3F;">💲</button>` : ""}<button class="icon-btn" data-action="edit-lanc" data-id="${l.id}">✎</button><button class="icon-btn danger" data-action="del-lanc" data-id="${l.id}">🗑</button></div></td>
    </tr>`;
  }).join("");
  const negOptions = state.negocios.map(n => `<option value="${esc(n.nome)}" ${lancFilter.negocio===n.nome?"selected":""}>${esc(n.nome)}</option>`).join("");
  const statusOptions = STATUS_LANC.map(s => `<option value="${s}" ${lancFilter.status===s?"selected":""}>${s}</option>`).join("");
  const contaOptions = state.contas.map(c => `<option value="${c.id}" ${lancFilter.conta===c.id?"selected":""}>${contaLabel(c)}</option>`).join("");
  const cartaoOptions = state.cartoes.map(c => `<option value="${c.id}" ${lancFilter.cartao===c.id?"selected":""}>${esc(c.nome)}</option>`).join("");
  const temFiltro = lancFilter.negocio||lancFilter.status||lancFilter.conta||lancFilter.cartao||lancFilter.dataDe||lancFilter.dataAte;
  return `
    <div class="page-header"><div><div class="page-title">Lançamentos</div><div class="page-sub">Ordem cronológica. Use 💲 para dar baixa manual em despesas/receitas.</div></div><button class="btn btn-primary" data-action="new-lanc">+ Novo lançamento</button></div>
    <div class="panel"><div class="filter-bar">
      <select data-action="filter-negocio"><option value="">Todos os negócios</option>${negOptions}</select>
      <select data-action="filter-status"><option value="">Todos os status</option>${statusOptions}</select>
      <select data-action="filter-conta"><option value="">Todas as contas</option>${contaOptions}</select>
      ${state.cartoes.length ? `<select data-action="filter-cartao"><option value="">Todos os cartões</option>${cartaoOptions}</select>` : ""}
      <span style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft);">De <input type="date" data-action="filter-data-de" value="${lancFilter.dataDe}"> até <input type="date" data-action="filter-data-ate" value="${lancFilter.dataAte}"></span>
      ${temFiltro ? `<button class="btn btn-ghost btn-sm" data-action="filter-clear">Limpar</button>` : ""}
    </div><div class="panel-body"><table><thead><tr><th>Data</th><th>Tipo</th><th>Negócio</th><th>Conta</th><th>Descrição</th><th class="num">Valor</th><th>Status</th><th style="text-align:center;">Conc.</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="9">${emptyState("Nenhum lançamento encontrado.")}</td></tr>`}</tbody></table></div></div>
  `;
}

// ============================================================
// VIEW: CARTÕES
// ============================================================
function viewCartoes() {
  const lockedPagar = !state.pagarUnlocked;
  const cardHTML = (c) => {
    const emAberto = faturaEmAberto(c.id);
    const disp = Number(c.limite||0) - emAberto;
    const inativo = c.ativo === false;
    const estourado = disp < 0;
    const faturas = faturasAgrupadas(c.id).slice(0,3);
    const faturasHTML = faturas.length ? faturas.map(f => `
      <div style="display:flex; justify-content:space-between; padding:6px 0; border-top:1px solid #F0F1F4; font-size:12px;">
        <span style="color:var(--ink-soft);">Vence ${fmtDateBR(f.data)} (${f.itens.length} item${f.itens.length===1?'':'s'})</span>
        <span class="${lockedPagar?'masked-value':''}" style="font-family:var(--font-mono); font-weight:600;">${maskBRL(f.total, state.pagarUnlocked)}</span>
      </div>`).join("") : `<div style="font-size:12px; color:var(--ink-faint); padding:6px 0;">Nenhuma fatura em aberto.</div>`;
    return `<div class="panel" style="margin-bottom:14px; ${inativo?'opacity:.55;':''}">
      <div style="padding:16px 18px; border-bottom:1px solid var(--line);">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
          <div><div style="display:flex; align-items:center; gap:8px;"><span class="tag-dot" style="background:${PALETA_NEGOCIOS[state.cartoes.indexOf(c) % PALETA_NEGOCIOS.length]};"></span><strong>${esc(c.nome)}</strong><span class="status-pill ${inativo?'status-agendado':'status-pago'}" style="cursor:pointer;" data-action="toggle-cartao-ativo" data-id="${c.id}">${inativo?"Inativo":"Ativo"}</span></div>
          <div style="font-size:12px; color:var(--ink-faint);">${esc(c.bandeira)} · final ${esc(c.ultimosDigitos)} · fecha ${c.diaFechamento} · vence ${c.diaVencimento}</div></div>
          <div class="row-actions"><button class="btn btn-primary btn-sm" data-action="new-compra-cartao" data-id="${c.id}">+ Compra</button><button class="icon-btn" data-action="edit-cartao" data-id="${c.id}">✎</button><button class="icon-btn danger" data-action="del-cartao" data-id="${c.id}">🗑</button></div>
        </div>
      </div>
      <div class="panel-body">
        <div class="kpi-grid" style="grid-template-columns: repeat(3, minmax(120px,1fr));">
          <div class="kpi-card"><div class="kpi-label">Limite</div><div class="kpi-value" style="font-size:16px;">${fmtBRL(c.limite)}</div></div>
          <div class="kpi-card"><div class="kpi-label">Fatura em aberto</div><div class="kpi-value ${lockedPagar?'masked-value':'neg'}" style="font-size:16px;">${maskBRL(emAberto, state.pagarUnlocked)}</div></div>
          <div class="kpi-card"><div class="kpi-label">Limite disponível</div><div class="kpi-value ${lockedPagar?'masked-value':(estourado?'neg':'pos')}" style="font-size:16px;">${lockedPagar ? "R$ ••••••" : fmtBRL(disp)}</div></div>
        </div>
        <div style="margin-top:10px;"><div style="font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);">Próximas faturas</div>${faturasHTML}</div>
      </div>
    </div>`;
  };
  return `
    <div class="page-header"><div><div class="page-title">Cartões de Crédito</div><div class="page-sub">Compras viram lançamentos na data de vencimento da fatura.</div></div><button class="btn btn-primary" data-action="new-cartao">+ Novo cartão</button></div>
    ${state.cartoes.map(cardHTML).join("") || emptyState("Nenhum cartão cadastrado.")}
  `;
}
function emptyState(msg){ return `<div class="empty-state">${esc(msg)}</div>`; }

// ============================================================
// BACKUP
// ============================================================
function exportarBackup(){
  const dados = { versao: "3-contas-editaveis", exportadoEm: new Date().toISOString(), contas: state.contas, lancamentos: state.lancamentos, ajustes: state.ajustes, categorias: state.categorias, negocios: state.negocios, cartoes: state.cartoes };
  const blob = new Blob([JSON.stringify(dados, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `backup-financeiro-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  showToast("Backup exportado.");
}
function handleImportarBackup(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try{
      const dados = JSON.parse(ev.target.result);
      if(!confirm("Importar esse backup vai substituir TODOS os dados atuais. Continuar?")) return;
      state.contas = dados.contas || [];
      state.lancamentos = dados.lancamentos || [];
      state.ajustes = dados.ajustes || [];
      state.categorias = dados.categorias || [];
      state.negocios = dados.negocios || [];
      state.cartoes = dados.cartoes || [];
      await saveContas(); await saveLancamentos(); await saveAjustes(); await saveCategorias(); await saveNegocios(); await saveCartoes();
      renderApp(); showToast("Backup importado.");
    }catch(err){ showToast("Arquivo inválido.", "error"); }
  };
  reader.readAsText(file);
  e.target.value = "";
}

function openModal(html) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modalOverlay';
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
}
function closeModal(){ const el = document.getElementById('modalOverlay'); if(el) el.remove(); }

      <div class="field-help" style="margin-top:-8px; margin-bottom:14px;">Provisionado = você vai pagar/receber, mas a baixa é manual (💲). Agendado = vira "Pago" sozinho na data.</div>
      ${!isEdit ? `
      <div class="field"><label>Repetição</label><select name="repeticao" id="lancRepeticao"><option value="nenhuma">Não se repete (avulsa)</option><option value="recorrente">🔁 Recorrente / fixa</option><option value="parcelado">💳 Parcelado</option></select></div>

      <div id="repeticaoParceladoWrap" class="field" style="display:none;"><label>Número de parcelas</label><input type="number" min="2" max="60" step="1" name="qtdParcelas" value="3"><div class="field-help">Cada parcela é gerada mensalmente.</div></div>
      ` : ''}

  `);

  // ---- Categoria inline ----
  const catSelect = document.getElementById('lancCategoriaSelect');
  const subSelect = document.getElementById('lancSubcategoriaSelect');
  const novaCategoriaRow = document.getElementById('novaCategoriaRow');
  const novaSubcategoriaRow = document.getElementById('novaSubcategoriaRow');

  catSelect.addEventListener('change', function() {
    if (this.value === '__nova__') {
      novaCategoriaRow.style.display = 'block';
      document.getElementById('novaCategoriaInput').focus();
    } else {
      novaCategoriaRow.style.display = 'none';

    if (categoriaByNome(nome)) { showToast('Essa categoria já existe.', 'error'); return; }

    saveCategorias();

    catSelect.value = nome;
    novaCategoriaRow.style.display = 'none';
    input.value = '';
    subSelect.innerHTML = `<option value="">— Nenhuma —</option><option value="__nova__">+ Nova subcategoria...</option>`;
    showToast('Categoria criada.');
  });

  subSelect.addEventListener('change', function() {
    if (this.value === '__nova__') {
      novaSubcategoriaRow.style.display = 'block';
      document.getElementById('novaSubcategoriaInput').focus();
    } else {
      novaSubcategoriaRow.style.display = 'none';
    }
  });

  document.getElementById('novaSubcategoriaBtn').addEventListener('click', function() {
    const input = document.getElementById('novaSubcategoriaInput');
    const nome = input.value.trim();
    if (!nome) { input.focus(); return; }
    const cat = categoriaByNome(catSelect.value);
    if (!cat) { showToast('Escolha uma categoria primeiro.', 'error'); return; }
    if (cat.subcategorias.some(s => s.nome === nome)) { showToast('Essa subcategoria já existe.', 'error'); return; }
    cat.subcategorias.push({ id: uid('sub'), nome });
    saveCategorias();
    subSelect.innerHTML = `<option value="">— Nenhuma —</option>${cat.subcategorias.map(s => `<option value="${esc(s.nome)}">${esc(s.nome)}</option>`).join('')}<option value="__nova__">+ Nova subcategoria...</option>`;

    novaSubcategoriaRow.style.display = 'none';

  negSelect.addEventListener('change', function() {

    negSelect.innerHTML = `<option value="">— Selecione —</option>${state.negocios.map(n => `<option value="${esc(n.nome)}">${esc(n.nome)}</option>`).join('')}<option value="__novo__">+ Novo negócio...</option>`;
    negSelect.value = nome;
    novoNegocioRow.style.display = 'none';
    input.value = '';
    showToast('Negócio criado.');
  });

  document.getElementById('lancTipo').addEventListener('change', function() {
    const isTransf = this.value === 'Transferência';
    document.getElementById('lancDestinoWrap').style.display = isTransf ? 'block' : 'none';
    document.getElementById('lancNegocioWrap').style.display = isTransf ? 'none' : 'block';
    document.getElementById('lancCategoriaWrap').style.display = isTransf ? 'none' : 'block';
  });

  const repSelect = document.getElementById('lancRepeticao');
  if (repSelect) {
    const recWrap = document.getElementById('repeticaoRecorrenteWrap');
    const parWrap = document.getElementById('repeticaoParceladoWrap');
    repSelect.addEventListener('change', function() {
      recWrap.style.display = this.value === 'recorrente' ? 'block' : 'none';
      parWrap.style.display = this.value === 'parcelado' ? 'block' : 'none';
    });
  }

  document.getElementById('formLanc').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const tipo = fd.get('tipo');
    const data = {
      data: fd.get('data'), tipo,
      negocio: tipo === 'Transferência' ? '' : (fd.get('negocio') || ''),
      categoria: tipo === 'Transferência' ? '' : (fd.get('categoria') || ''),
      subcategoria: tipo === 'Transferência' ? '' : (fd.get('subcategoria') || ''),
      contaOrigem: fd.get('contaOrigem'),
      contaDestino: tipo === 'Transferência' ? fd.get('contaDestino') : '',
      valor: parseFloat(fd.get('valor')) || 0,
      descricao: fd.get('descricao').trim(),
      status: fd.get('status'),
      conciliado: fd.get('conciliado') === 'on'
    };
    if (tipo === 'Transferência' && data.contaOrigem === data.contaDestino) {
      showToast('Contas não podem ser iguais.', 'error');
      return;
    }
    if (isEdit) {
      Object.assign(existing, data);
      await saveLancamentos();
      closeModal(); renderApp(); showToast('Lançamento atualizado.');
      return;
    }
    const repeticao = fd.get('repeticao') || 'nenhuma';
    if (repeticao === 'nenhuma') {
      state.lancamentos.push({ id: uid('l'), ...data });
    } else if (repeticao === 'recorrente') {
      const freq = fd.get('frequencia') || 'Mensal';
      const grupoId = uid('rec');
      let dataOcorrencia = data.data;
      const ocorrenciasPorAno = { 'Semanal':52, 'Quinzenal':24, 'Mensal':12, 'Bimestral':6, 'Trimestral':4, 'Semestral':2, 'Anual':1 };
      const qtd = (ocorrenciasPorAno[freq]||12) * HORIZONTE_ANOS;
      for (let i=0; i<qtd; i++) {
        state.lancamentos.push({ id: uid('l'), ...data, data: dataOcorrencia, descricao: i===0 ? data.descricao : `${data.descricao} (${i+1})`, status: i===0 ? data.status : 'Provisionado', conciliado: i===0 ? data.conciliado : false, recorrenciaId: grupoId, recorrenciaTipo: 'recorrente', recorrenciaIndex: i+1, recorrenciaTotal: qtd });
        dataOcorrencia = proximaData(dataOcorrencia, freq);
      }
      showToast(`Lançamento fixo criado (próximos ${HORIZONTE_ANOS} anos).`);
    } else if (repeticao === 'parcelado') {
      const qtd = Math.max(2, parseInt(fd.get('qtdParcelas'))||3);
      const grupoId = uid('rec');
      let dataOcorrencia = data.data;
      for (let i=0; i<qtd; i++) {
        state.lancamentos.push({ id: uid('l'), ...data, data: dataOcorrencia, descricao: `${data.descricao} (${i+1}/${qtd})`, status: i===0 ? data.status : 'Provisionado', conciliado: i===0 ? data.conciliado : false, recorrenciaId: grupoId, recorrenciaTipo: 'parcelado', recorrenciaIndex: i+1, recorrenciaTotal: qtd });
        dataOcorrencia = proximaData(dataOcorrencia, 'Mensal');
      }
      showToast(`${qtd} parcelas criadas.`);
    }
    await saveLancamentos();
    closeModal(); renderApp(); showToast('Lançamento adicionado.');
  });
}

      <div class="field"><label>Negócio</label><select name="negocio"><option value="">— Selecione —</option>${negOpts}</select></div>
      <div class="field"><label>Descrição</label><input required type="text" name="descricao" placeholder="Ex: Notebook"></div>
      <div class="field"><label>Parcelado?</label><select name="parcelado"><option value="nao">À vista</option><option value="sim">Parcelado</option></select></div>
      <div id="parcelasWrap" style="display:none;"><div class="field"><label>Número de parcelas</label><input type="number" min="2" max="60" step="1" name="qtdParcelas" value="2"></div></div>
    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Adicionar</button></div></form>
  `);
  document.querySelector('select[name="parcelado"]').addEventListener('change', function() {
    document.getElementById('parcelasWrap').style.display = this.value === 'sim' ? 'block' : 'none';
  });
  document.getElementById('formCompra').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const cartao = cartaoById(fd.get('cartaoId'));
    const dataCompra = fd.get('dataCompra');
    const valor = parseFloat(fd.get('valor'))||0;
    const qtd = parseInt(fd.get('qtdParcelas'))||2;
    const isParcelado = fd.get('parcelado') === 'sim';
    const base = { tipo:'Despesa', negocio: fd.get('negocio')||'', categoria: fd.get('categoria')||'', contaOrigem: cartao.contaPagamentoId, contaDestino:'', descricao: fd.get('descricao').trim(), status:'Provisionado', conciliado:false, cartaoId: cartao.id, dataCompra };
    if (!isParcelado) {
      const dataVenc = calcularVencimento(dataCompra, cartao);
      state.lancamentos.push({ id: uid('l'), ...base, valor, data: dataVenc });
    } else {
      const parcelas = dividirValor(valor, qtd);
      const grupoId = uid('rec');
      let dataVenc = calcularVencimento(dataCompra, cartao);
      for (let i=0; i<qtd; i++) {
        state.lancamentos.push({ id: uid('l'), ...base, valor: parcelas[i], data: dataVenc, descricao: `${base.descricao} (${i+1}/${qtd})`, recorrenciaId: grupoId, recorrenciaTipo: 'parcelado', recorrenciaIndex: i+1, recorrenciaTotal: qtd });
        dataVenc = proximaData(dataVenc, 'Mensal');
      }
    }
    await saveLancamentos();
    closeModal(); renderApp(); showToast(isParcelado ? `${qtd} parcelas criadas.` : 'Compra adicionada.');
  });
}

// ============================================================
// MODAL: BAIXA MANUAL
// ============================================================
function modalBaixa(l) {
  const contaOpts = contasParaSelecao(l.contaOrigem).map(c => `<option value="${c.id}" ${l.contaOrigem===c.id?"selected":""}>${contaLabel(c)}</option>`).join('');
  openModal(`
    <div class="modal-head"><div class="modal-title">💲 Dar baixa</div><button class="modal-close" data-action="close-modal">✕</button></div>
    <form id="formBaixa"><div class="modal-body">
      <div class="field-help" style="margin-bottom:12px;"><strong>${esc(l.descricao)}</strong><br>${l.tipo} de ${fmtBRL(l.valor)}</div>
      <div class="field-row"><div class="field"><label>Data</label><input required type="date" name="data" value="${todayISO()}"></div><div class="field"><label>Conta</label><select name="contaOrigem">${contaOpts}</select></div></div>
      <div class="field"><label class="checkbox-row"><input type="checkbox" name="conciliado" checked> Conciliado</label></div>
    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Confirmar</button></div></form>
  `);
  document.getElementById('formBaixa').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    l.status = 'Pago';
    l.data = fd.get('data');
    l.contaOrigem = fd.get('contaOrigem');
    l.conciliado = fd.get('conciliado') === 'on';
    await saveLancamentos();
    closeModal(); renderApp(); showToast('Baixa confirmada.');
  });
}

// ============================================================
// EVENTOS
// ============================================================
document.addEventListener('click', function(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  if (action === 'nav') setView(el.dataset.view);
  else if (action === 'close-modal') closeModal();
  else if (action === 'switch-auth') { authMode = authMode === 'login' ? 'register' : 'login'; renderApp(); }
  else if (action === 'logout') doLogout();
  else if (action === 'exportar-backup') exportarBackup();
  else if (action === 'unlock-pagar') { state.pagarUnlocked = true; renderApp(); }
  else if (action === 'lock-pagar') { state.pagarUnlocked = false; renderApp(); }
  else if (action === 'unlock-receber') { state.receberUnlocked = true; renderApp(); }
  else if (action === 'lock-receber') { state.receberUnlocked = false; renderApp(); }
  else if (action === 'filter-clear') { lancFilter = {negocio:'',status:'',conta:'',cartao:'',dataDe:'',dataAte:''}; renderApp(); }

  else if (action === 'new-conta') modalConta(null);
  else if (action === 'new-caixinha') modalCaixinha(id, null);
  else if (action === 'edit-conta') { const c = contaById(id); if (c && c.parentId) modalCaixinha(null, c); else modalConta(c); }
  else if (action === 'toggle-ativa') { const c = contaById(id); if(c){ c.ativa = c.ativa === false; saveContas(); renderApp(); } }
  else if (action === 'del-conta') {
    const c = contaById(id);
    if (!c) return;
    if (!confirm('Excluir esta conta?')) return;
    state.contas = state.contas.filter(x => x.id !== id);
    saveContas(); renderApp();
  }

  else if (action === 'new-lanc') modalLancamento(null);
  else if (action === 'edit-lanc') {
    const l = state.lancamentos.find(x => x.id === id);
    if (l) modalLancamento(l);
  }
  else if (action === 'del-lanc') {
    if (!confirm('Excluir este lançamento?')) return;
    const l = state.lancamentos.find(x => x.id === id);
    if (l && l.recorrenciaId) {
      const total = state.lancamentos.filter(x => x.recorrenciaId === l.recorrenciaId).length;
      if (!confirm(`Este lançamento faz parte de uma série (${total} no total). Excluir apenas este ou todos? Clique OK para todos, Cancelar para apenas este.`)) {
        state.lancamentos = state.lancamentos.filter(x => x.id !== id);
        await saveLancamentos();
        renderApp();
        showToast('Lançamento removido.');
        return;
      }
      state.lancamentos = state.lancamentos.filter(x => x.recorrenciaId !== l.recorrenciaId);
      showToast(`Série completa removida (${total} lançamentos).`);
    } else {
      state.lancamentos = state.lancamentos.filter(x => x.id !== id);
    }
    await saveLancamentos();
    renderApp();
    showToast('Lançamento removido.');
  }
  else if (action === 'toggle-conc') {
    const l = state.lancamentos.find(x => x.id === id);
    if (l) { l.conciliado = !l.conciliado; saveLancamentos(); renderApp(); }
  }
  else if (action === 'baixar-titulo') {
    const l = state.lancamentos.find(x => x.id === id);
    if (l) modalBaixa(l);
  }

  else if (action === 'new-ajuste') modalAjuste(null);
  else if (action === 'edit-ajuste') modalAjuste(state.ajustes.find(a=>a.id===id));
  else if (action === 'del-ajuste') {
    if (!confirm('Excluir este ajuste?')) return;
    state.ajustes = state.ajustes.filter(a => a.id !== id);
    saveAjustes(); renderApp();
  }

  else if (action === 'new-categoria') modalCategoria(null);
  else if (action === 'edit-categoria') modalCategoria(categoriaById(el.dataset.cat));
  else if (action === 'del-categoria') {
    const cat = categoriaById(el.dataset.cat);
    if (!cat) return;
    if (!confirm('Excluir categoria?')) return;
    state.categorias = state.categorias.filter(c => c.id !== el.dataset.cat);
    saveCategorias(); renderApp();
  }
  else if (action === 'add-subcategoria') modalSubcategoria(el.dataset.cat, null);
  else if (action === 'edit-subcategoria') {
    const cat = categoriaById(el.dataset.cat);
    const sub = cat ? cat.subcategorias.find(s => s.id === el.dataset.sub) : null;
    modalSubcategoria(el.dataset.cat, sub);
  }
  else if (action === 'del-subcategoria') {
    const cat = categoriaById(el.dataset.cat);
    if (!cat) return;
    cat.subcategorias = cat.subcategorias.filter(s => s.id !== el.dataset.sub);
    saveCategorias(); renderApp();
  }

  else if (action === 'new-negocio') modalNegocio(null);
  else if (action === 'edit-negocio') modalNegocio(negocioById(id));
  else if (action === 'del-negocio') {
    const neg = negocioById(id);
    if (!neg) return;
    if (!confirm('Excluir negócio?')) return;
    state.negocios = state.negocios.filter(n => n.id !== id);
    saveNegocios(); renderApp();
  }

  else if (action === 'new-cartao') modalCartao(null);
  else if (action === 'edit-cartao') modalCartao(cartaoById(id));
  else if (action === 'toggle-cartao-ativo') {
    const c = cartaoById(id);
    if (c) { c.ativo = c.ativo === false; saveCartoes(); renderApp(); }
  }
  else if (action === 'del-cartao') {
    const c = cartaoById(id);
    if (!c) return;
    if (!confirm('Excluir cartão?')) return;
    state.cartoes = state.cartoes.filter(x => x.id !== id);
    saveCartoes(); renderApp();
  }
  else if (action === 'new-compra-cartao') modalCompraCartao(id);

  else if (action === 'mes-prev') {
    let { ano, mes } = state.mesVisualizado;
    mes -= 1; if (mes < 0) { mes = 11; ano -= 1; }
    state.mesVisualizado = { ano, mes }; renderView();
  }
  else if (action === 'mes-next') {
    let { ano, mes } = state.mesVisualizado;
    mes += 1; if (mes > 11) { mes = 0; ano += 1; }
    state.mesVisualizado = { ano, mes }; renderView();
  }
  else if (action === 'mes-hoje') {
    const hoje = new Date();
    state.mesVisualizado = { ano: hoje.getFullYear(), mes: hoje.getMonth() };
    renderView();
  }
});

document.addEventListener('change', function(e) {
  if (e.target.dataset.action === 'filter-negocio') { lancFilter.negocio = e.target.value; renderApp(); }
  if (e.target.dataset.action === 'filter-status') { lancFilter.status = e.target.value; renderApp(); }
  if (e.target.dataset.action === 'filter-conta') { lancFilter.conta = e.target.value; renderApp(); }
  if (e.target.dataset.action === 'filter-cartao') { lancFilter.cartao = e.target.value; renderApp(); }
  if (e.target.dataset.action === 'filter-data-de') { lancFilter.dataDe = e.target.value; renderApp(); }
  if (e.target.dataset.action === 'filter-data-ate') { lancFilter.dataAte = e.target.value; renderApp(); }
  if (e.target.id === 'mesManualInput' && e.target.value) {
    const [anoStr, mesStr] = e.target.value.split('-');
    state.mesVisualizado = { ano: parseInt(anoStr), mes: parseInt(mesStr) - 1 };
    renderView();
  }
});

// ============================================================
// AUTENTICAÇÃO - SUBMIT
// ============================================================
document.addEventListener('submit', async function(e) {
  if (e.target.id === 'authForm') {
    e.preventDefault();
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if (!email || !password) { showToast('Preencha email e senha.', 'error'); return; }
    const success = authMode === 'login' ? await doLogin(email, password) : await doSignup(email, password);
    if (success) renderApp();
  }
});

// ============================================================
// INIT
// ============================================================
async function init() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session?.user) {
    state.user = session.user;
    await loadData();
  }
  renderApp();
}
init();
</script>
