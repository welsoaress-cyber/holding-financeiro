    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">${isEdit ? "Salvar alterações" : "Adicionar lançamento"}</button></div></form>
  `);

  document.getElementById("lancTipo").addEventListener("change", e => {
    const isTransf = e.target.value === "Transferência";
    document.getElementById("lancDestinoWrap").style.display = isTransf ? "block" : "none";
    document.getElementById("lancNegocioWrap").style.display = isTransf ? "none" : "block";
    document.getElementById("lancCategoriaWrap").style.display = isTransf ? "none" : "block";
  });

  // ---- Categoria inline ----
  const catSelect = document.getElementById("lancCategoriaSelect");
  const subSelect = document.getElementById("lancSubcategoriaSelect");
  const novaCategoriaRow = document.getElementById("novaCategoriaRow");
  const novaSubcategoriaRow = document.getElementById("novaSubcategoriaRow");
  catSelect.addEventListener("change", () => {
    if(catSelect.value === "__nova__"){
      novaCategoriaRow.style.display = "block";
      document.getElementById("novaCategoriaInput").focus();
    }else{
      novaCategoriaRow.style.display = "none";
      subSelect.innerHTML = subcatOptionsHTML(catSelect.value, "");
      novaSubcategoriaRow.style.display = "none";
    }
  });
  document.getElementById("novaCategoriaBtn").addEventListener("click", () => {
    const input = document.getElementById("novaCategoriaInput");
    const nome = input.value.trim();
    if(!nome){ input.focus(); return; }
    if(categoriaByNome(nome)){ showToast("Essa categoria já existe.", "error"); return; }
    state.categorias.push({ id: uid("cat"), nome, subcategorias: [] });
    saveCategorias();
    catSelect.innerHTML = catOptionsHTML(nome);
    novaCategoriaRow.style.display = "none";
    input.value = "";
    subSelect.innerHTML = subcatOptionsHTML(nome, "");
    showToast("Categoria criada.");
  });
  subSelect.addEventListener("change", () => {
    if(subSelect.value === "__nova__"){
      if(!catSelect.value || catSelect.value === "__nova__"){
        showToast("Escolha (ou crie) uma categoria primeiro.", "error");
        subSelect.value = "";
        return;
      }
      novaSubcategoriaRow.style.display = "block";
      document.getElementById("novaSubcategoriaInput").focus();
    }else{
      novaSubcategoriaRow.style.display = "none";
    }
  });
  document.getElementById("novaSubcategoriaBtn").addEventListener("click", () => {
    const input = document.getElementById("novaSubcategoriaInput");
    const nome = input.value.trim();
    if(!nome){ input.focus(); return; }
    const cat = categoriaByNome(catSelect.value);
    if(!cat){ showToast("Escolha uma categoria primeiro.", "error"); return; }
    if(cat.subcategorias.some(s=>s.nome===nome)){ showToast("Essa subcategoria já existe.", "error"); return; }
    cat.subcategorias.push({ id: uid("sub"), nome });
    saveCategorias();
    subSelect.innerHTML = subcatOptionsHTML(cat.nome, nome);
    novaSubcategoriaRow.style.display = "none";
    input.value = "";
    showToast("Subcategoria criada.");
  });

  // ---- Negócio inline ----
  const negSelect = document.getElementById("lancNegocioSelect");
  const novoNegocioRow = document.getElementById("novoNegocioRow");
  negSelect.addEventListener("change", () => {
    novoNegocioRow.style.display = negSelect.value === "__novo__" ? "block" : "none";
    if(negSelect.value === "__novo__") document.getElementById("novoNegocioInput").focus();
  });
  document.getElementById("novoNegocioBtn").addEventListener("click", () => {
    const input = document.getElementById("novoNegocioInput");
    const nome = input.value.trim();
    if(!nome){ input.focus(); return; }
    if(negocioByNome(nome)){ showToast("Esse negócio já existe.", "error"); return; }
    state.negocios.push({ id: uid("neg"), nome, cor: proximaCorNegocio() });
    saveNegocios();
    negSelect.innerHTML = negOptionsHTML(nome);
    novoNegocioRow.style.display = "none";
    input.value = "";
    showToast("Negócio criado.");
  });

  // ---- Conta (origem/destino) inline: qualquer usuário pode cadastrar uma conta que ainda não existe ----
  function wireContaInline(selectId, rowId, nomeId, instId, btnId){
    const select = document.getElementById(selectId);
    const row = document.getElementById(rowId);
    if(!select || !row) return;
    select.addEventListener("change", () => {
      if(select.value === "__nova__"){
        row.style.display = "block";
        document.getElementById(nomeId).focus();
      }else{
        row.style.display = "none";
      }
    });
    document.getElementById(btnId).addEventListener("click", async () => {
      const nomeInput = document.getElementById(nomeId);
      const instInput = document.getElementById(instId);
      const nome = nomeInput.value.trim();
      const instituicao = instInput.value.trim();
      if(!nome){ nomeInput.focus(); return; }
      const nova = { id: uid("c"), parentId: null, nome, instituicao, tipo: "Conta Corrente", saldoInicial: 0, limite: 0, ativa: true };
      state.contas.push(nova);
      await saveContas();
      select.innerHTML = contaOptionsComCriacao(nova.id);
      row.style.display = "none";
      nomeInput.value = ""; instInput.value = "";
      showToast("Conta criada.");
    });
  }
  wireContaInline("lancContaOrigemSelect", "novaContaOrigemRow", "novaContaOrigemNome", "novaContaOrigemInstituicao", "novaContaOrigemBtn");
  wireContaInline("lancContaDestinoSelect", "novaContaDestinoRow", "novaContaDestinoNome", "novaContaDestinoInstituicao", "novaContaDestinoBtn");

  // ---- Repetição + divisão total/parcela ----
  const repSelect = document.getElementById("lancRepeticao");
  if(repSelect){
    const recWrap = document.getElementById("repeticaoRecorrenteWrap");
    const parWrap = document.getElementById("repeticaoParceladoWrap");
    const valorHint = document.getElementById("valorHint");
    const tipoValorParcela = document.getElementById("lancTipoValorParcela");
    const qtdParcelasInput = document.getElementById("lancQtdParcelas");
    const divisaoPreview = document.getElementById("lancDivisaoPreview");
    const atualizarDivisaoPreview = () => {
      if(repSelect.value !== "parcelado" || tipoValorParcela.value !== "total"){ divisaoPreview.textContent = ""; return; }
      const valorInput = document.getElementById("campo_valor");
      const total = parseFloat(valorInput ? valorInput.value : 0) || 0;
      const qtd = Math.max(2, parseInt(qtdParcelasInput.value)||2);
      const partes = dividirValor(total, qtd);
      divisaoPreview.textContent = partes[0] === partes[partes.length-1]
        ? `${qtd}x de ${fmtBRL(partes[0])}`
        : `${qtd-1}x de ${fmtBRL(partes[0])} + 1x de ${fmtBRL(partes[partes.length-1])} (ajuste de centavos)`;
    };
    repSelect.addEventListener("change", () => {
      recWrap.style.display = repSelect.value === "recorrente" ? "block" : "none";
      parWrap.style.display = repSelect.value === "parcelado" ? "block" : "none";
      valorHint.textContent = repSelect.value === "parcelado" ? "(valor de cada parcela, por padrão)" : (repSelect.value === "recorrente" ? "(valor de cada ocorrência)" : "");
      atualizarDivisaoPreview();
    });
    tipoValorParcela.addEventListener("change", atualizarDivisaoPreview);
    qtdParcelasInput.addEventListener("input", atualizarDivisaoPreview);
    document.getElementById("campo_valor")?.addEventListener("input", atualizarDivisaoPreview);
  }
  attachCalculadora("valor");

  document.getElementById("formLanc").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const tipo = fd.get("tipo");
    if(catSelect.value === "__nova__" || subSelect.value === "__nova__"){
      showToast("Finalize a criação da categoria/subcategoria antes de salvar.", "error"); return;
    }
    if(negSelect.value === "__novo__"){
      showToast("Finalize a criação do negócio antes de salvar.", "error"); return;
    }
    if(fd.get("contaOrigem") === "__nova__" || fd.get("contaDestino") === "__nova__"){
      showToast("Finalize a criação da conta antes de salvar.", "error"); return;
    }
    const data = {
      data: fd.get("data"), tipo,
      negocio: tipo === "Transferência" ? "" : (fd.get("negocio")||""),
      categoria: tipo === "Transferência" ? "" : (fd.get("categoria")||""),
      subcategoria: tipo === "Transferência" ? "" : (fd.get("subcategoria")||""),
      contaOrigem: fd.get("contaOrigem"),
      contaDestino: tipo === "Transferência" ? fd.get("contaDestino") : "",
      valor: parseFloat(fd.get("valor"))||0,
      descricao: fd.get("descricao").trim(),
      status: fd.get("status"),
      conciliado: fd.get("conciliado") === "on",
      lancadoPor: isEdit ? existing.lancadoPor : (state.perfilAtivo ? state.perfilAtivo.nome : "Master"),
      editadoPor: isEdit ? (state.perfilAtivo ? state.perfilAtivo.nome : "Master") : undefined
    };
    if(tipo === "Transferência" && data.contaOrigem === data.contaDestino){
      showToast("Conta de origem e destino não podem ser iguais.", "error"); return;
    }

    if(isEdit){
      if(existing.recorrenciaId){
        closeModal();
        modalEscopoEdicaoSerie(existing, data);
      }else{
        Object.assign(existing, data);
        await saveLancamentos(); closeModal(); renderApp(); showToast("Lançamento atualizado.");
      }
      return;
    }

    const repeticao = fd.get("repeticao") || "nenhuma";
    if(repeticao === "nenhuma"){
      state.lancamentos.push({ id: uid("l"), ...data });
      await saveLancamentos(); closeModal(); renderApp(); showToast("Lançamento adicionado.");
      return;
    }
    const isParcelado = repeticao === "parcelado";
    const freq = isParcelado ? "Mensal" : (fd.get("frequencia")||"Mensal");
    const OCORRENCIAS_POR_ANO = { "Semanal":52, "Quinzenal":24, "Mensal":12, "Bimestral":6, "Trimestral":4, "Semestral":2, "Anual":1 };
    let qtd;
    if(isParcelado){
      qtd = Math.max(2, parseInt(fd.get("qtdParcelas"))||2);
    }else{
      qtd = (OCORRENCIAS_POR_ANO[freq]||12) * HORIZONTE_ANOS;
    }
    const valoresParcelas = (isParcelado && fd.get("tipoValorParcela") === "total") ? dividirValor(data.valor, qtd) : null;
    const grupoId = uid("rec");
    let dataOcorrencia = data.data;
    for(let i=0;i<qtd;i++){
      const descricaoOcorrencia = isParcelado ? `${data.descricao} (${i+1}/${qtd})` : data.descricao;
      state.lancamentos.push({
        id: uid("l"), ...data,
        valor: valoresParcelas ? valoresParcelas[i] : data.valor,
        data: dataOcorrencia,
        descricao: descricaoOcorrencia,
        status: i===0 ? data.status : "Provisionado",
        conciliado: i===0 ? data.conciliado : false,
        recorrenciaId: grupoId, recorrenciaTipo: repeticao, recorrenciaIndex: i+1, recorrenciaTotal: qtd
      });
      dataOcorrencia = proximaData(dataOcorrencia, freq);
    }
    await saveLancamentos(); closeModal(); renderApp();
    showToast(isParcelado ? `${qtd} parcelas criadas.` : `Lançamento fixo criado (próximos ${HORIZONTE_ANOS} anos já agendados).`);
  });
}

        excluir: fd.get(`excluir_${n.id}`) === "on",
      };
    });
    const categoriasPermitidas = {};
    state.categorias.forEach(c => { categoriasPermitidas[c.nome] = fd.get(`cat_${c.id}`) === "on"; });
    const data = { nome, senha, tipo, permissoes, categoriasPermitidas };
    if(isEdit){ Object.assign(existing, data); }
    else{ state.perfis.push({ id: uid("perfil"), ...data }); }
    await savePerfis(); closeModal(); renderApp(); showToast(isEdit ? "Usuário atualizado." : "Usuário criado.");
  });
}

  document.getElementById("compraDataInput").addEventListener("change", atualizarPreview);

  const subSelect = document.getElementById("compraSubcategoriaSelect");
  const novaCategoriaRow = document.getElementById("compraNovaCategoriaRow");
  const novaSubcategoriaRow = document.getElementById("compraNovaSubcategoriaRow");
  catSelect.addEventListener("change", () => {
    if(catSelect.value === "__nova__"){ novaCategoriaRow.style.display = "block"; document.getElementById("compraNovaCategoriaInput").focus(); }
    else{ novaCategoriaRow.style.display = "none"; subSelect.innerHTML = subcatOptionsHTML(catSelect.value, ""); novaSubcategoriaRow.style.display = "none"; }
  });
  document.getElementById("compraNovaCategoriaBtn").addEventListener("click", () => {
    const input = document.getElementById("compraNovaCategoriaInput");
    const nome = input.value.trim();
    if(!nome){ input.focus(); return; }
    if(categoriaByNome(nome)){ showToast("Essa categoria já existe.", "error"); return; }

    saveCategorias();
    catSelect.innerHTML = catOptionsHTML(nome);
    novaCategoriaRow.style.display = "none"; input.value = "";
    subSelect.innerHTML = subcatOptionsHTML(nome, "");
    showToast("Categoria criada.");
  });
  subSelect.addEventListener("change", () => {
    if(subSelect.value === "__nova__"){
      if(!catSelect.value || catSelect.value === "__nova__"){ showToast("Escolha (ou crie) uma categoria primeiro.", "error"); subSelect.value = ""; return; }
      novaSubcategoriaRow.style.display = "block"; document.getElementById("compraNovaSubcategoriaInput").focus();

  document.getElementById("compraNovaSubcategoriaBtn").addEventListener("click", () => {

    const nome = input.value.trim();
    if(!nome){ input.focus(); return; }
    const cat = categoriaByNome(catSelect.value);

    if(cat.subcategorias.some(s=>s.nome===nome)){ showToast("Essa subcategoria já existe.", "error"); return; }
    cat.subcategorias.push({ id: uid("sub"), nome });
    saveCategorias();
    subSelect.innerHTML = subcatOptionsHTML(cat.nome, nome);
    novaSubcategoriaRow.style.display = "none"; input.value = "";
    showToast("Subcategoria criada.");
  });

  const negSelect = document.getElementById("compraNegocioSelect");
  const novoNegocioRow = document.getElementById("compraNovoNegocioRow");
  negSelect.addEventListener("change", () => {
    novoNegocioRow.style.display = negSelect.value === "__novo__" ? "block" : "none";
    if(negSelect.value === "__novo__") document.getElementById("compraNovoNegocioInput").focus();
  });
  document.getElementById("compraNovoNegocioBtn").addEventListener("click", () => {
    const input = document.getElementById("compraNovoNegocioInput");
    const nome = input.value.trim();
    if(!nome){ input.focus(); return; }
    if(negocioByNome(nome)){ showToast("Esse negócio já existe.", "error"); return; }
    state.negocios.push({ id: uid("neg"), nome, cor: proximaCorNegocio() });
    saveNegocios();
    negSelect.innerHTML = negOptionsHTML(nome);
    novoNegocioRow.style.display = "none"; input.value = "";
    showToast("Negócio criado.");
  });

  const repSelect = document.getElementById("compraRepeticao");
  const parWrap = document.getElementById("compraParceladoWrap");
  const recWrap = document.getElementById("compraRecorrenteWrap");
  const valorHint = document.getElementById("compraValorHint");
  const compraTipoValorParcela = document.getElementById("compraTipoValorParcela");
  const compraQtdParcelas = document.getElementById("compraQtdParcelas");
  const compraDivisaoPreview = document.getElementById("compraDivisaoPreview");
  const atualizarCompraDivisaoPreview = () => {
    if(repSelect.value !== "parcelado" || compraTipoValorParcela.value !== "total"){ compraDivisaoPreview.textContent = ""; return; }
    const valorInput = document.getElementById("campo_valor");
    const total = parseFloat(valorInput ? valorInput.value : 0) || 0;
    const qtd = Math.max(2, parseInt(compraQtdParcelas.value)||2);
    const partes = dividirValor(total, qtd);
    compraDivisaoPreview.textContent = partes[0] === partes[partes.length-1]
      ? `${qtd}x de ${fmtBRL(partes[0])}`
      : `${qtd-1}x de ${fmtBRL(partes[0])} + 1x de ${fmtBRL(partes[partes.length-1])} (ajuste de centavos)`;
  };
  repSelect.addEventListener("change", () => {
    parWrap.style.display = repSelect.value === "parcelado" ? "block" : "none";
    recWrap.style.display = repSelect.value === "recorrente" ? "block" : "none";
    valorHint.textContent = repSelect.value === "parcelado" ? "(valor de cada parcela, por padrão)" : (repSelect.value === "recorrente" ? "(valor de cada cobrança)" : "");
    atualizarCompraDivisaoPreview();
  });
  compraTipoValorParcela.addEventListener("change", atualizarCompraDivisaoPreview);
  compraQtdParcelas.addEventListener("input", atualizarCompraDivisaoPreview);
  document.getElementById("campo_valor")?.addEventListener("input", () => { atualizarCompraDivisaoPreview(); });
  attachCalculadora("valor");

  document.getElementById("formCompraCartao").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    if(catSelect.value === "__nova__" || subSelect.value === "__nova__"){ showToast("Finalize a criação da categoria/subcategoria antes de salvar.", "error"); return; }
    if(negSelect.value === "__novo__"){ showToast("Finalize a criação do negócio antes de salvar.", "error"); return; }
    const cartao = cartaoById(fd.get("cartaoId"));
    if(!cartao){ showToast("Escolha um cartão.", "error"); return; }
    const dataCompra = fd.get("dataCompra");
    const base = {
      tipo: "Despesa", negocio: fd.get("negocio")||"", categoria: fd.get("categoria")||"", subcategoria: fd.get("subcategoria")||"",
      contaOrigem: cartao.contaPagamentoId, contaDestino: "", descricao: fd.get("descricao").trim(),
      status: "Provisionado", conciliado: false, cartaoId: cartao.id, dataCompra,
      lancadoPor: state.perfilAtivo ? state.perfilAtivo.nome : "Master"
    };
    const valor = parseFloat(fd.get("valor"))||0;
    const repeticao = fd.get("repeticao") || "nenhuma";

    if(repeticao === "nenhuma"){
      const venc = calcularVencimento(dataCompra, cartao);
      state.lancamentos.push({ id: uid("l"), ...base, valor, data: venc });
      await saveLancamentos(); closeModal(); renderApp(); showToast("Compra adicionada.");
      return;
    }
    const isParcelado = repeticao === "parcelado";
    const freq = isParcelado ? "Mensal" : (fd.get("frequencia")||"Mensal");
    let qtd;
    if(isParcelado){ qtd = Math.max(2, parseInt(fd.get("qtdParcelas"))||2); }
    else{ const OCORRENCIAS_POR_ANO = { "Mensal":12, "Bimestral":6, "Trimestral":4, "Semestral":2, "Anual":1 }; qtd = (OCORRENCIAS_POR_ANO[freq]||12) * HORIZONTE_ANOS; }
    const valoresParcelas = (isParcelado && fd.get("tipoValorParcela") === "total") ? dividirValor(valor, qtd) : null;
    const grupoId = uid("rec");
    let dataVencOcorrencia = calcularVencimento(dataCompra, cartao);
    for(let i=0;i<qtd;i++){
      const descricaoOcorrencia = isParcelado ? `${base.descricao} (${i+1}/${qtd})` : base.descricao;
      state.lancamentos.push({
        id: uid("l"), ...base,
        valor: valoresParcelas ? valoresParcelas[i] : valor,
        descricao: descricaoOcorrencia, data: dataVencOcorrencia,
        recorrenciaId: grupoId, recorrenciaTipo: repeticao, recorrenciaIndex: i+1, recorrenciaTotal: qtd
      });
      dataVencOcorrencia = proximaData(dataVencOcorrencia, freq);
    }
    await saveLancamentos(); closeModal(); renderApp();
    showToast(isParcelado ? `${qtd} parcelas criadas.` : `Compra fixa criada (próximos ${HORIZONTE_ANOS} anos já agendados).`);
  });
}

function modalBaixa(l){
  const contaAtual = contaById(l.contaOrigem);
  const unlockedValor = l.tipo === "Despesa" ? pagarDesbloqueado() : receberDesbloqueado();
  const contaOpts = contasParaSelecao(l.contaOrigem).map(c => `<option value="${c.id}" ${l.contaOrigem===c.id?"selected":""}>${contaLabel(c)}${c.ativa===false?" (inativa)":""}</option>`).join("");
  openModal(`
    <div class="modal-head"><div class="modal-title">💲 Dar baixa no título</div><button class="modal-close" data-action="close-modal">✕</button></div>
    <form id="formBaixa"><div class="modal-body">
      <div class="field-help" style="margin-bottom:12px; font-size:13px;"><strong>${esc(l.descricao)}</strong><br>${l.tipo} de ${maskBRL(l.valor, unlockedValor)} — hoje em ${contaLabel(contaAtual)}</div>
      <div class="field-row"><div class="field"><label>Data da baixa</label><input required type="date" name="data" value="${todayISO()}"></div><div class="field"><label>Conta</label><select name="contaOrigem">${contaOpts}</select></div></div>
      <div class="field-help" style="margin-bottom:12px;">Pode escolher qualquer conta — não precisa ser a que estava no lançamento original.</div>
      <div class="field"><label class="checkbox-row"><input type="checkbox" name="conciliado" checked> Já conciliado com o extrato</label></div>
    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Confirmar baixa</button></div></form>
  `);
  document.getElementById("formBaixa").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    l.status = "Pago";
    l.data = fd.get("data");
    l.contaOrigem = fd.get("contaOrigem");
    l.conciliado = fd.get("conciliado") === "on";
    await saveLancamentos(); closeModal(); renderApp(); showToast("Título baixado.");
  });
}

// MODAL — PAGAR FATURA (baixa todas as compras daquela fatura de uma vez)
// ============================================================
function modalPagarFatura(cartaoId, dataVencimento){
  const cartao = cartaoById(cartaoId);
  if(!cartao) return;
  const itens = state.lancamentos.filter(l => l.cartaoId === cartaoId && l.data === dataVencimento && l.status !== "Pago");
  if(!itens.length){ showToast("Essa fatura já está paga.", "error"); return; }
  const total = itens.reduce((s,l) => s + Number(l.valor), 0);
  const unlockedValor = pagarDesbloqueado();
  const contaOpts = contasParaSelecao(cartao.contaPagamentoId).map(c => `<option value="${c.id}" ${cartao.contaPagamentoId===c.id?"selected":""}>${contaLabel(c)}${c.ativa===false?" (inativa)":""}</option>`).join("");
  const itensHTML = itens.map(l => `
    <div style="display:flex; justify-content:space-between; padding:6px 0; border-top:1px solid var(--border); font-size:12px;">
      <span style="color:var(--ink-3);">${esc(l.descricao)}</span>
      <span class="${unlockedValor?'':'masked-value'}" style="font-family:var(--font-mono);">${maskBRL(l.valor, unlockedValor)}</span>
    </div>`).join("");
  openModal(`
    <div class="modal-head"><div class="modal-title">💳 Pagar fatura — ${esc(cartao.nome)}</div><button class="modal-close" data-action="close-modal">✕</button></div>
    <form id="formPagarFatura"><div class="modal-body">
      <div class="field-help" style="margin-bottom:6px; font-size:13px;">Vencimento em <strong>${fmtDateBR(dataVencimento)}</strong> · ${itens.length} lançamento${itens.length===1?'':'s'}</div>
      <div style="max-height:180px; overflow-y:auto; margin-bottom:10px;">${itensHTML}</div>
      <div style="display:flex; justify-content:space-between; padding:8px 0; border-top:2px solid var(--border); margin-bottom:14px;">
        <strong style="font-size:13px;">Total da fatura</strong>
        <strong class="${unlockedValor?'':'masked-value'}" style="font-family:var(--font-mono); font-size:15px;">${maskBRL(total, unlockedValor)}</strong>
      </div>
      <div class="field-row"><div class="field"><label>Data do pagamento</label><input required type="date" name="data" value="${todayISO()}"></div><div class="field"><label>Conta</label><select name="contaOrigem">${contaOpts}</select></div></div>
      <div class="field-help" style="margin-bottom:12px;">Todos os ${itens.length} lançamentos dessa fatura são marcados como Pago de uma vez, na mesma conta e data.</div>
      <div class="field"><label class="checkbox-row"><input type="checkbox" name="conciliado" checked> Já conciliado com o extrato</label></div>
    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Confirmar pagamento da fatura</button></div></form>
  `);
  document.getElementById("formPagarFatura").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const dataPagamento = fd.get("data");

}

function modalExcluirLancamento(l){
  if(!l.recorrenciaId){
    if(!confirm("Excluir este lançamento?")) return;
    state.lancamentos = state.lancamentos.filter(x => x.id !== l.id);
    deleteRow("lancamentos", l.id);
    renderApp(); showToast("Lançamento removido.");
    return;
  }
  const serieTxt = l.recorrenciaTipo === "parcelado" ? "parcelada" : "recorrente";
  const totalTxt = l.recorrenciaTipo === "parcelado" ? "parcelas" : "ocorrências";
  const futuros = state.lancamentos.filter(x => x.recorrenciaId === l.recorrenciaId && x.data >= l.data).length;
  const todos = state.lancamentos.filter(x => x.recorrenciaId === l.recorrenciaId).length;
  openModal(`
    <div class="modal-head"><div class="modal-title">Excluir lançamento</div><button class="modal-close" data-action="close-modal">✕</button></div>
    <div class="modal-body">
      <div class="field-help" style="margin-bottom:14px; font-size:13px;"><strong>${esc(l.descricao)}</strong> (${fmtDateBR(l.data)}) faz parte de uma série ${serieTxt} — ${l.recorrenciaIndex}ª de ${l.recorrenciaTotal} ${totalTxt}. O que você quer excluir?</div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button class="btn btn-ghost" style="justify-content:flex-start;" data-action="del-lanc-um" data-id="${l.id}">Excluir apenas este lançamento</button>
        <button class="btn btn-ghost" style="justify-content:flex-start;" data-action="del-lanc-futuros" data-id="${l.id}">Excluir este e os próximos <span style="color:var(--ink-4); margin-left:4px;">(${futuros} lançamento${futuros===1?'':'s'} a partir de ${fmtDateBR(l.data)})</span></button>
        <button class="btn btn-ghost" style="justify-content:flex-start; color:var(--neg);" data-action="del-lanc-todos" data-id="${l.id}">Excluir todos da série <span style="color:var(--ink-4); margin-left:4px;">(${todos} lançamento${todos===1?'':'s'} no total)</span></button>
      </div>
    </div>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button></div>
  `);
}

// ============================================================
// MODAL — ESCOPO DA EDIÇÃO EM SÉRIE (ex: reajuste de valor)
// ============================================================
const CAMPOS_CASCATA_SERIE = ["tipo","negocio","categoria","subcategoria","contaOrigem","contaDestino","valor"];
function modalEscopoEdicaoSerie(existing, data){
  const serieTxt = existing.recorrenciaTipo === "parcelado" ? "parcelada" : "recorrente";
  const futuros = state.lancamentos.filter(x => x.recorrenciaId === existing.recorrenciaId && x.data >= existing.data).length;
  const todos = state.lancamentos.filter(x => x.recorrenciaId === existing.recorrenciaId).length;
  openModal(`
    <div class="modal-head"><div class="modal-title">Aplicar alteração</div><button class="modal-close" data-action="close-modal">✕</button></div>
    <div class="modal-body">
      <div class="field-help" style="margin-bottom:14px; font-size:13px;">
        <strong>${esc(existing.descricao)}</strong> faz parte de uma série ${serieTxt}. Onde aplicar valor, categoria, conta e negócio (ex: um reajuste)?
        <br><span style="color:var(--ink-4);">Data, status e conciliado nunca são copiados — cada ocorrência mantém os seus.</span>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button class="btn btn-ghost" style="justify-content:flex-start;" id="btnEscopoUm">Aplicar apenas a este lançamento</button>
        <button class="btn btn-ghost" style="justify-content:flex-start;" id="btnEscopoFuturos">Aplicar a este e aos próximos <span style="color:var(--ink-4); margin-left:4px;">(${futuros} lançamento${futuros===1?'':'s'})</span></button>
        <button class="btn btn-ghost" style="justify-content:flex-start;" id="btnEscopoTodos">Aplicar a todos da série <span style="color:var(--ink-4); margin-left:4px;">(${todos} lançamento${todos===1?'':'s'})</span></button>
      </div>
    </div>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button></div>
  `);
  const aplicarCascata = async (apenasFuturos) => {
    Object.assign(existing, data);
    const afetados = [existing];
    for(const l of state.lancamentos){
      if(l === existing) continue;
      if(l.recorrenciaId !== existing.recorrenciaId) continue;
      if(apenasFuturos && l.data < existing.data) continue;
      CAMPOS_CASCATA_SERIE.forEach(campo => { l[campo] = data[campo]; });
      afetados.push(l);
    }
    await saveLancamentos(); closeModal(); renderApp(); showToast(`Alteração aplicada a ${afetados.length} lançamento(s).`);
  };
  document.getElementById("btnEscopoUm").addEventListener("click", async () => {
    Object.assign(existing, data);
    await saveLancamentos(); closeModal(); renderApp(); showToast("Lançamento atualizado.");
  });
  document.getElementById("btnEscopoFuturos").addEventListener("click", () => aplicarCascata(true));
  document.getElementById("btnEscopoTodos").addEventListener("click", () => aplicarCascata(false));
}

// ============================================================
// EVENT DELEGATION
// ============================================================
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  const catId = el.dataset.cat;
  const subId = el.dataset.sub;

  if(action === "nav") setView(el.dataset.view);
  else if(action === "abrir-modulo"){
    const mod = MODULOS_CATALOGO.find(m => m.id === el.dataset.id);
    if(!mod || !mod.ativo){ showToast("Esse módulo ainda está em construção.", "error"); return; }
    state.modpanelAberto = false;
    state.moduloAtivo = mod.id;
    if(mod.id === "financeiro"){ state.view = "dashboard"; }
    else if(mod.id === "estoque"){ state.view = "est_dashboard"; }
    else if(mod.id === "clientes"){ state.view = "cli_dashboard"; }
    renderApp();
  }
  else if(action === "toggle-ajustes-menu"){ state.ajustesMenuAberto = !state.ajustesMenuAberto; renderApp(); }
  else if(action === "close-modal") closeModal();
  else if(action === "switch-auth"){ authMode = authMode === "login" ? "signup" : "login"; renderApp(); }
  else if(action === "logout") doLogout();
  else if(action === "selecionar-master") modalSenhaMaster();
  else if(action === "selecionar-perfil"){ const p = perfilById(id); if(p) modalSenhaPerfil(p); }
  else if(action === "trocar-perfil"){ state.perfilAtivo = null; state.perfilEscolhido = false; renderApp(); }
  else if(action === "exportar-backup") exportarBackup();
  else if(action === "unlock-pagar") modalSenha("pagar");
  else if(action === "lock-pagar"){ state.pagarUnlocked = false; renderApp(); showToast("Contas a pagar ocultadas."); }
  else if(action === "unlock-receber") modalSenha("receber");
  else if(action === "lock-receber"){ state.receberUnlocked = false; renderApp(); showToast("A receber/saldo ocultados."); }
  else if(action === "filter-clear"){ lancFilter = {negocio:"",status:"",conta:"",cartao:"",categoria:"",dataDe:"",dataAte:""}; lancSelecionados.clear(); renderApp(); }
  else if(action === "toggle-select-lanc"){
    if(lancSelecionados.has(id)) lancSelecionados.delete(id); else lancSelecionados.add(id);
    renderView();
  }
  else if(action === "toggle-select-all-lanc"){
    const todosSelecionados = lancVisibleIds.length > 0 && lancVisibleIds.every(vid => lancSelecionados.has(vid));
    if(todosSelecionados){ lancVisibleIds.forEach(vid => lancSelecionados.delete(vid)); }
    else{ lancVisibleIds.forEach(vid => lancSelecionados.add(vid)); }
    renderView();
  }
  else if(action === "excluir-selecionados"){
    const qtd = lancSelecionados.size;
    if(qtd === 0) return;
    if(!confirm(`Excluir ${qtd} lançamento(s) selecionado(s)? Essa ação não pode ser desfeita.`)) return;
    const ids = Array.from(lancSelecionados);
    state.lancamentos = state.lancamentos.filter(l => !lancSelecionados.has(l.id));
    await deleteRows("lancamentos", ids);
    lancSelecionados.clear();
    renderApp();
    showToast(`${ids.length} lançamento(s) excluído(s).`);
  }

  else if(action === "new-conta") modalConta(null);
  else if(action === "new-caixinha") modalCaixinha(id, null);
  else if(action === "edit-conta"){ const c = contaById(id); if(c && c.parentId) modalCaixinha(null, c); else modalConta(c); }
  else if(action === "toggle-ativa"){
    const c = contaById(id);
    if(c){ c.ativa = c.ativa === false; await saveContas(); renderApp(); showToast(c.ativa ? "Ativada." : "Inativada."); }
  }
  else if(action === "del-conta"){
    const c = contaById(id);
    if(!c) return;
    if(!c.parentId && caixinhasDe(id).length > 0){ alert("Essa conta ainda tem caixinhas dentro dela. Exclua ou mova as caixinhas primeiro."); return; }
    const usado = state.lancamentos.some(l => l.contaOrigem===id || l.contaDestino===id) || state.ajustes.some(a=>a.contaId===id);
    const label = c.parentId ? "caixinha" : "conta";
    if(usado && !confirm(`Essa ${label} tem lançamentos ou ajustes vinculados. Excluir mesmo assim? Os lançamentos vinculados vão continuar existindo, mas sem referência de conta.`)) return;
    state.contas = state.contas.filter(x => x.id !== id);
    await deleteRow("contas", id);
    renderApp(); showToast(c.parentId ? "Caixinha removida." : "Conta removida.");
  }

  else if(action === "new-lanc") modalLancamento(null, el.dataset.tipoPreset || null);
  else if(action === "edit-lanc"){ const l = state.lancamentos.find(x=>x.id===id); if(l) modalLancamento(l); }
  else if(action === "del-lanc"){ const l = state.lancamentos.find(x=>x.id===id); if(l) modalExcluirLancamento(l); }
  else if(action === "del-lanc-um"){
    const l = state.lancamentos.find(x => x.id === id);
    if(l){
      const quem = state.perfilAtivo ? state.perfilAtivo.nome : "Master";
      l.inativo = true; l.inativadoPor = quem; l.inativadoEm = new Date().toISOString();
      await saveLancamentos();
      closeModal(); renderApp(); showToast("Lançamento inativado (aparece tachado).");
    }
  }
  else if(action === "del-lanc-futuros"){
    const l = state.lancamentos.find(x => x.id === id);
    if(!l) return;
    const afetados = state.lancamentos.filter(x => x.recorrenciaId === l.recorrenciaId && x.data >= l.data);
    const quem = state.perfilAtivo ? state.perfilAtivo.nome : "Master";
    afetados.forEach(x => { x.inativo = true; x.inativadoPor = quem; x.inativadoEm = new Date().toISOString(); });
    await saveLancamentos();
    closeModal(); renderApp(); showToast(`${afetados.length} lançamento(s) inativado(s).`);
  }
  else if(action === "del-lanc-todos"){
    const l = state.lancamentos.find(x => x.id === id);
    if(!l) return;
    const afetados = state.lancamentos.filter(x => x.recorrenciaId === l.recorrenciaId);
    const quem = state.perfilAtivo ? state.perfilAtivo.nome : "Master";
    afetados.forEach(x => { x.inativo = true; x.inativadoPor = quem; x.inativadoEm = new Date().toISOString(); });
    await saveLancamentos();
    closeModal(); renderApp(); showToast(`${afetados.length} lançamento(s) inativado(s).`);
  }
  else if(action === "reativar-lanc"){
    const l = state.lancamentos.find(x => x.id === id);
    if(l){ delete l.inativo; delete l.inativadoPor; delete l.inativadoEm; await saveLancamentos(); renderApp(); showToast("Lançamento reativado."); }
  }
  else if(action === "toggle-conc"){
    const l = state.lancamentos.find(x=>x.id===id);
    if(l){ l.conciliado = !l.conciliado; await saveLancamentos(); renderApp(); }
  }
  else if(action === "baixar-titulo"){ const l = state.lancamentos.find(x=>x.id===id); if(l) modalBaixa(l); }

  else if(action === "new-ajuste") modalAjuste(null);
  else if(action === "edit-ajuste") modalAjuste(state.ajustes.find(a=>a.id===id));
  else if(action === "del-ajuste"){
    if(!confirm("Excluir este ajuste de saldo?")) return;
    state.ajustes = state.ajustes.filter(a => a.id !== id);
    await deleteRow("ajustes", id);
    renderApp(); showToast("Ajuste removido.");
  }

  else if(action === "new-categoria") modalCategoria(null);
  else if(action === "edit-categoria") modalCategoria(categoriaById(catId));
  else if(action === "del-categoria"){
    const cat = categoriaById(catId);
    if(!cat) return;
    const usada = state.lancamentos.some(l => l.categoria === cat.nome);
    if(usada && !confirm(`A categoria "${cat.nome}" está em uso em lançamentos existentes. Excluir mesmo assim?`)) return;
    state.categorias = state.categorias.filter(c => c.id !== catId);
    await deleteRow("categorias", catId);
    renderApp(); showToast("Categoria removida.");
  }
  else if(action === "add-subcategoria") modalSubcategoria(catId, null);
  else if(action === "edit-subcategoria"){
    const cat = categoriaById(catId);
    const sub = cat ? cat.subcategorias.find(s => s.id === subId) : null;
    modalSubcategoria(catId, sub);
  }
  else if(action === "del-subcategoria"){
    const cat = categoriaById(catId);
    if(!cat) return;
    const sub = cat.subcategorias.find(s => s.id === subId);
    const usada = sub && state.lancamentos.some(l => l.categoria === cat.nome && l.subcategoria === sub.nome);
    if(usada && !confirm("Essa subcategoria está em uso em lançamentos existentes. Excluir mesmo assim?")) return;
    cat.subcategorias = cat.subcategorias.filter(s => s.id !== subId);
    await saveCategorias(); renderApp(); showToast("Subcategoria removida.");
  }

  else if(action === "new-negocio") modalNegocio(null);
  else if(action === "edit-negocio") modalNegocio(negocioById(id));
  else if(action === "del-negocio"){
    const neg = negocioById(id);
    if(!neg) return;
    const usado = state.lancamentos.some(l => l.negocio === neg.nome);
    if(usado && !confirm(`O negócio "${neg.nome}" está em uso em lançamentos existentes. Excluir mesmo assim?`)) return;
    state.negocios = state.negocios.filter(n => n.id !== id);
    await deleteRow("negocios", id);
    renderApp(); showToast("Negócio removido.");
  }

  else if(action === "new-perfil") modalPerfil(null);
  else if(action === "edit-perfil") modalPerfil(perfilById(id));
  else if(action === "del-perfil"){
    const p = perfilById(id);
    if(!p) return;
    if(!confirm(`Excluir o usuário "${p.nome}"? Ele não vai mais conseguir entrar.`)) return;
    state.perfis = state.perfis.filter(x => x.id !== id);
    await deleteRow("perfis", id);
    if(state.perfilAtivo && state.perfilAtivo.id === id){ state.perfilAtivo = null; state.perfilEscolhido = false; }
    renderApp(); showToast("Usuário removido.");
  }

  else if(action === "new-cartao") modalCartao(null);
  else if(action === "edit-cartao") modalCartao(cartaoById(id));
  else if(action === "toggle-cartao-ativo"){
    const c = cartaoById(id);
    if(c){ c.ativo = c.ativo === false; await saveCartoes(); renderApp(); }
  }
  else if(action === "del-cartao"){
    const c = cartaoById(id);
    if(!c) return;
    const usado = state.lancamentos.some(l => l.cartaoId === id);
    if(usado && !confirm("Esse cartão tem compras lançadas. Excluir mesmo assim? Os lançamentos já criados continuam existindo, mas sem referência ao cartão.")) return;
    state.cartoes = state.cartoes.filter(x => x.id !== id);
    await deleteRow("cartoes", id);
    renderApp(); showToast("Cartão removido.");
  }
  else if(action === "new-compra-cartao") modalCompraCartao(id);
  else if(action === "pagar-fatura"){ closeModal(); modalPagarFatura(id, el.dataset.venc); }
  else if(action === "pagar-fatura-minimo"){ closeModal(); modalPagarFaturaMinimo(id, el.dataset.venc, parseFloat(el.dataset.total)||0); }
  else if(action === "pagar-fatura-parcial"){ closeModal(); modalPagarFaturaParcial(id, el.dataset.venc, parseFloat(el.dataset.total)||0); }
  else if(action === "ver-fatura") modalDetalheFatura(id, el.dataset.venc);

  else if(action === "mes-prev"){
    let { ano, mes } = state.mesVisualizado;
    mes -= 1; if(mes < 0){ mes = 11; ano -= 1; }
    state.mesVisualizado = { ano, mes }; renderView();
  }
  else if(action === "mes-next"){
    let { ano, mes } = state.mesVisualizado;
    mes += 1; if(mes > 11){ mes = 0; ano += 1; }
    state.mesVisualizado = { ano, mes }; renderView();
  }
  else if(action === "mes-hoje"){
    const hoje = new Date();
    state.mesVisualizado = { ano: hoje.getFullYear(), mes: hoje.getMonth() };
    renderView();
  }
  // ---- Estoque ----
  else if(action === "est-novo-produto") modalEstProduto(null);
  else if(action === "est-edit-produto") modalEstProduto(estProdutoById(id));
  else if(action === "est-del-produto"){
    if(!confirm("Excluir este produto? As movimentações históricas serão mantidas.")) return;
    state.estProdutos = state.estProdutos.filter(p => p.id !== id);
    await deleteRow("est_produtos", id);
    renderView(); showToast("Produto removido.");
  }
  else if(action === "est-nova-movimentacao") modalEstMovimentacao("", "Entrada");
  else if(action === "est-registrar-entrada") modalEstMovimentacao(id, "Entrada");
  else if(action === "est-registrar-saida") modalEstMovimentacao(id, "Saída");
  else if(action === "est-del-mov"){
    if(!confirm("Remover esta movimentação? O saldo do produto será recalculado.")) return;
    state.estMovimentos = state.estMovimentos.filter(m => m.id !== id);
    await deleteRow("est_movimentos", id);
    renderView(); showToast("Movimentação removida.");
  }
  else if(action === "est-novo-fornecedor") modalEstFornecedor(null);
  else if(action === "est-edit-fornecedor") modalEstFornecedor(estFornecedorById(id));
  else if(action === "est-del-fornecedor"){
    if(!confirm("Excluir este fornecedor?")) return;
    state.estFornecedores = state.estFornecedores.filter(f => f.id !== id);
    await deleteRow("est_fornecedores", id);
    renderView(); showToast("Fornecedor removido.");
  }
  else if(action === "est-filtro-clear"){ estFiltroCategoria = ""; estFiltroTexto = ""; renderView(); }
  else if(action === "est-movfiltro-clear"){ estMovFiltro = {tipo:"",produto:"",dataDe:"",dataAte:""}; renderView(); }
  // ---- Clientes ----
  else if(action === "cli-novo") modalCliCliente(null);
  else if(action === "cli-edit"){ const c = cliClienteById(id); if(c) modalCliCliente(c); }
  else if(action === "cli-del"){
    const c = cliClienteById(id);
    if(!c) return;
    if(!confirm(`Excluir o cliente "${cliNome(c)}" e todos os seus contratos?`)) return;
    state.cliClientes = state.cliClientes.filter(x=>x.id!==id);
    await deleteRow("cli_clientes", id);
    state.view = "cli_lista"; renderApp(); showToast("Cliente excluído.");
  }
  else if(action === "cli-detalhe"){ cliViewDetalheId = id; state.view = "cli_detalhe"; renderApp(); }
  else if(action === "cli-add-contrato") modalCliContrato(id, null);
  else if(action === "cli-edit-contrato"){
    const c = cliClienteById(id);
    const ct = (c?.contratos||[]).find(x=>x.id===el.dataset.cid);
    if(ct) modalCliContrato(id, ct);
  }
  else if(action === "cli-del-contrato"){
    const c = cliClienteById(id);
    if(!c) return;
    if(!confirm("Remover este contrato?")) return;
    c.contratos = (c.contratos||[]).filter(x=>x.id!==el.dataset.cid);
    await saveCliClientes(); renderView(); showToast("Contrato removido.");
  }
  else if(action === "cli-novo-plano") modalCliPlano(null);
  else if(action === "cli-edit-plano") modalCliPlano(cliPlanoById(id));
  else if(action === "cli-del-plano"){
    if(!confirm("Excluir este plano?")) return;
    state.cliPlanos = state.cliPlanos.filter(x=>x.id!==id);
    await deleteRow("cli_planos", id);
    renderView(); showToast("Plano excluído.");
  }
  else if(action === "cli-filtrar-negocio"){
    cliFiltro.negocio = el.dataset.negocio||"";
    state.view = "cli_lista"; renderApp();
  }
  else if(action === "cli-filtro-clear"){ cliFiltro = {negocio:"",status:"",plano:"",texto:""}; renderView(); }
});

// MÓDULO CLIENTES — CRM completo para Holding com múltiplos negócios
// =========================================================================

// ---- Estado de navegação e filtros ----
let cliViewDetalheId = null;
let cliFiltro = { negocio:"", plano:"", status:"", texto:"" };

// ---- Constantes ----
const CLI_STATUS = ["Ativo","Inativo","Suspenso","Cancelado","Inadimplente","Lead"];
const CLI_GENEROS = ["Masculino","Feminino","Outro","Pessoa Jurídica","Não informado"];
const CLI_ESTADOS = ["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"];
const CLI_TIPOS_CONEXAO = ["Fibra Óptica","Cabo","Rádio","4G/5G","Satélite","ADSL"];

// ---- Helpers ----
function cliClienteById(id){ return state.cliClientes.find(c => c.id === id); }
function cliPlanoById(id){ return state.cliPlanos.find(p => p.id === id); }
function cliNome(c){ return c.tipoPessoa === "PJ" ? (c.nomeFantasia || c.razaoSocial || c.nome) : c.nome; }
function cliContratosByNegocio(clienteId, negocio){
  const c = cliClienteById(clienteId);
  return (c?.contratos || []).filter(ct => ct.negocio === negocio);
}
function cliDataRecente(dias){ const d = new Date(); d.setDate(d.getDate()-dias); return d.toISOString().slice(0,10); }

// ---- VIEW: DASHBOARD CLIENTES ----
function viewCliDashboard(){
  const total = state.cliClientes.length;
  const ativos = state.cliClientes.filter(c => c.status === "Ativo").length;
  const inativos = total - ativos;
  const novos30 = state.cliClientes.filter(c => c.dataCadastro >= cliDataRecente(30)).length;
  const novos60 = state.cliClientes.filter(c => c.dataCadastro >= cliDataRecente(60) && c.dataCadastro < cliDataRecente(30)).length;
  const crescPct = novos60 > 0 ? ((novos30 - novos60)/novos60*100).toFixed(1) : novos30 > 0 ? "+100" : "0";
  const crescPos = Number(crescPct) >= 0;

  const negocioTotais = state.negocios.map(n => {
    const clientes = state.cliClientes.filter(c => (c.contratos||[]).some(ct => ct.negocio === n.nome));
    const ativos = clientes.filter(c => (c.contratos||[]).find(ct=>ct.negocio===n.nome)?.status === "Ativo").length;
    const mrr = clientes.reduce((s,c) => {
      const ct = (c.contratos||[]).find(ct=>ct.negocio===n.nome && ct.status==="Ativo");
      const plano = ct ? cliPlanoById(ct.planoId) : null;
      return s + (plano ? Number(plano.valor||0) : 0);
    }, 0);
    return { n, total: clientes.length, ativos, mrr };
  }).filter(r => r.total > 0);

  const inadimplentes = state.cliClientes.filter(c => c.status === "Inadimplente").length;
  const mrrTotal = state.cliClientes.reduce((s,c) => {
    return s + (c.contratos||[]).filter(ct=>ct.status==="Ativo").reduce((ss,ct) => {
      const p = cliPlanoById(ct.planoId);
      return ss + (p ? Number(p.valor||0) : 0);
    },0);
  },0);

  const novosRows = state.cliClientes
    .filter(c => c.dataCadastro >= cliDataRecente(30))
    .sort((a,b)=>b.dataCadastro.localeCompare(a.dataCadastro))
    .slice(0,8)
    .map(c => `<tr>
      <td style="font-weight:600; cursor:pointer; color:var(--accent);" data-action="cli-detalhe" data-id="${c.id}">${esc(cliNome(c))}</td>
      <td style="color:var(--ink-3);">${fmtDateBR(c.dataCadastro)}</td>
      <td>${(c.contratos||[]).map(ct=>`<span class="status-pill status-agendado" style="margin-right:3px;">${esc(ct.negocio)}</span>`).join("")||"—"}</td>
      <td>${esc(c.cidade||"—")}${c.uf?` — ${c.uf}`:""}</td>
    </tr>`).join("");

  const negCards = negocioTotais.map(({n,total,ativos,mrr}) => `
    <div class="kpi-card" style="cursor:pointer;" data-action="cli-filtrar-negocio" data-negocio="${esc(n.nome)}">
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
        <span style="width:10px;height:10px;border-radius:50%;background:${n.cor};display:inline-block;flex-shrink:0;"></span>
        <span class="kpi-label" style="margin:0;">${esc(n.nome)}</span>
      </div>
      <div class="kpi-value" style="font-size:26px;">${total}</div>
      <div class="kpi-note">${ativos} ativos · MRR ${fmtBRL(mrr)}</div>
    </div>`).join("");

  return `
    <div class="page-header">
      <div><div class="page-title">Clientes — Dashboard</div><div class="page-sub">Visão consolidada de todos os negócios</div></div>
      <button class="btn btn-primary" data-action="cli-novo">+ Novo cliente</button>
    </div>
    <div class="kpi-grid" style="grid-template-columns:repeat(5,1fr);">
      <div class="kpi-card"><div class="kpi-label">Total de clientes</div><div class="kpi-value">${total}</div></div>
      <div class="kpi-card"><div class="kpi-label">Clientes ativos</div><div class="kpi-value pos">${ativos}</div></div>
      <div class="kpi-card"><div class="kpi-label">MRR total</div><div class="kpi-value" style="font-size:18px;">${fmtBRL(mrrTotal)}</div><div class="kpi-note">Receita mensal recorrente</div></div>
      <div class="kpi-card"><div class="kpi-label">Novos (30 dias)</div><div class="kpi-value">${novos30}</div><div class="kpi-note" style="color:${crescPos?'var(--pos)':'var(--neg)'};">${crescPos?'↑':'↓'} ${Math.abs(crescPct)}% vs mês anterior</div></div>
      <div class="kpi-card"><div class="kpi-label">Inadimplentes</div><div class="kpi-value ${inadimplentes>0?'neg':''}">${inadimplentes}</div></div>
    </div>

    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); margin-bottom:16px;">
      ${negCards || `<div class="kpi-card" style="grid-column:1/-1; text-align:center; color:var(--ink-4);">Nenhum cliente cadastrado com negócios vinculados.</div>`}
    </div>

    <div class="panel">
      <div class="panel-head"><div class="panel-title">👥 Novos clientes — últimos 30 dias</div><span style="font-size:12px;color:var(--ink-3);">${novos30} cadastros</span></div>
      <div class="panel-body" style="padding-top:6px;">
        ${novosRows ? `<table><thead><tr><th>Nome</th><th>Cadastrado em</th><th>Negócios</th><th>Cidade</th></tr></thead><tbody>${novosRows}</tbody></table>` : emptyState("Nenhum cadastro nos últimos 30 dias.")}
      </div>
    </div>
  `;
}

// ---- VIEW: LISTA DE CLIENTES ----
function viewCliLista(){
  let lista = [...state.cliClientes].sort((a,b)=>cliNome(a).localeCompare(cliNome(b)));
  if(cliFiltro.negocio) lista = lista.filter(c => (c.contratos||[]).some(ct=>ct.negocio===cliFiltro.negocio));
  if(cliFiltro.status) lista = lista.filter(c => c.status === cliFiltro.status);
  if(cliFiltro.plano) lista = lista.filter(c => (c.contratos||[]).some(ct=>ct.planoId===cliFiltro.plano));
  if(cliFiltro.texto){
    const t = cliFiltro.texto.toLowerCase();
    lista = lista.filter(c => cliNome(c).toLowerCase().includes(t) || (c.cpfCnpj||"").includes(t) || (c.email||"").toLowerCase().includes(t) || (c.telefone||"").includes(t) || (c.cidade||"").toLowerCase().includes(t));
  }
  const rows = lista.map(c => {
    const negocios = (c.contratos||[]).map(ct=>`<span class="status-pill status-agendado" style="margin:1px;">${esc(ct.negocio)}</span>`).join("");
    const statusClass = c.status==="Ativo"?"status-pago":c.status==="Inadimplente"||c.status==="Cancelado"?"status-pendente":"status-agendado";
    const mrr = (c.contratos||[]).filter(ct=>ct.status==="Ativo").reduce((s,ct)=>{const p=cliPlanoById(ct.planoId); return s+(p?Number(p.valor||0):0);},0);
    return `<tr>
      <td style="font-weight:600; cursor:pointer; color:var(--accent);" data-action="cli-detalhe" data-id="${c.id}">${esc(cliNome(c))}</td>
      <td style="color:var(--ink-3); font-size:12px;">${esc(c.cpfCnpj||"—")}</td>
      <td>${negocios||"—"}</td>
      <td>${esc(c.cidade||"—")}${c.uf?`/${c.uf}`:""}</td>
      <td>${esc(c.telefone||"—")}</td>
      <td>${fmtDateBR(c.dataCadastro)}</td>
      <td>${mrr>0?fmtBRL(mrr):"—"}</td>
      <td><span class="status-pill ${statusClass}">${esc(c.status||"—")}</span></td>
      <td><div class="row-actions">
        <button class="icon-btn" data-action="cli-detalhe" data-id="${c.id}" title="Ver/Editar">✎</button>
        <button class="icon-btn danger" data-action="cli-del" data-id="${c.id}" title="Excluir">🗑</button>
      </div></td>
    </tr>`;
  }).join("");
  const negOpts = state.negocios.map(n=>`<option value="${esc(n.nome)}" ${cliFiltro.negocio===n.nome?"selected":""}>${esc(n.nome)}</option>`).join("");
  const statusOpts = CLI_STATUS.map(s=>`<option value="${s}" ${cliFiltro.status===s?"selected":""}>${s}</option>`).join("");
  const planoOpts = state.cliPlanos.map(p=>`<option value="${p.id}" ${cliFiltro.plano===p.id?"selected":""}>${esc(p.nome)}</option>`).join("");
  const temFiltro = cliFiltro.negocio||cliFiltro.status||cliFiltro.plano||cliFiltro.texto;
  return `
    <div class="page-header">
      <div><div class="page-title">Todos os Clientes</div><div class="page-sub">${lista.length} de ${state.cliClientes.length} cliente(s)</div></div>
      <button class="btn btn-primary" data-action="cli-novo">+ Novo cliente</button>
    </div>
    <div class="panel">
      <div class="filter-bar">
        <input type="text" placeholder="Buscar por nome, CPF, e-mail, telefone, cidade..." value="${esc(cliFiltro.texto)}" data-action="cli-filtro-texto" style="min-width:260px;">
        <select data-action="cli-filtro-negocio"><option value="">Todos os negócios</option>${negOpts}</select>
        <select data-action="cli-filtro-status"><option value="">Todos os status</option>${statusOpts}</select>
        <select data-action="cli-filtro-plano"><option value="">Todos os planos</option>${planoOpts}</select>
        ${temFiltro?`<button class="btn btn-ghost btn-sm" data-action="cli-filtro-clear">Limpar</button>`:""}
      </div>

    <form id="formCliCliente"><div class="modal-body">

      <div style="font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); font-weight:700; margin-bottom:10px; border-bottom:1px solid var(--border); padding-bottom:6px;">Dados pessoais</div>

      <div class="field-row">
        <div class="field"><label>Tipo de pessoa</label>
          <select name="tipoPessoa" id="cliTipoPessoa">
            <option value="PF" ${(c.tipoPessoa||"PF")==="PF"?"selected":""}>Pessoa Física</option>
            <option value="PJ" ${c.tipoPessoa==="PJ"?"selected":""}>Pessoa Jurídica</option>
          </select>
        </div>
        <div class="field"><label>Status</label><select name="status">${statusOpts}</select></div>

      </div>
      <div class="field" id="cliNomePFWrap">
        <label>Nome completo *</label><input required type="text" name="nome" value="${esc(c.nome)}" placeholder="Nome completo">
      </div>
      <div id="cliNomePJWrap" style="display:none;">
        <div class="field-row">
          <div class="field"><label>Razão social *</label><input type="text" name="razaoSocial" value="${esc(c.razaoSocial||"")}" placeholder="Razão social"></div>
          <div class="field"><label>Nome fantasia</label><input type="text" name="nomeFantasia" value="${esc(c.nomeFantasia||"")}" placeholder="Nome fantasia"></div>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label id="cliCpfLabel">CPF</label><input type="text" name="cpfCnpj" value="${esc(c.cpfCnpj||"")}" placeholder="000.000.000-00"></div>
        <div class="field" id="cliRgWrap"><label>RG</label><input type="text" name="rg" value="${esc(c.rg||"")}" placeholder="00.000.000-0"></div>
      </div>
      <div class="field-row">
        <div class="field" id="cliNascimentoWrap"><label>Data de nascimento</label><input type="date" name="dataNascimento" value="${c.dataNascimento||""}"></div>
        <div class="field" id="cliGeneroWrap"><label>Gênero</label><select name="genero">${generoOpts}</select></div>
      </div>

      <div style="font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); font-weight:700; margin:14px 0 10px; border-bottom:1px solid var(--border); padding-bottom:6px;">Contato</div>
      <div class="field-row">
        <div class="field"><label>Telefone</label><input type="text" name="telefone" value="${esc(c.telefone||"")}" placeholder="(00) 00000-0000"></div>
        <div class="field"><label>WhatsApp</label><input type="text" name="whatsapp" value="${esc(c.whatsapp||"")}" placeholder="(00) 00000-0000"></div>
      </div>
      <div class="field"><label>E-mail</label><input type="email" name="email" value="${esc(c.email||"")}" placeholder="cliente@email.com"></div>

      <div style="font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); font-weight:700; margin:14px 0 10px; border-bottom:1px solid var(--border); padding-bottom:6px;">Endereço</div>
      <div class="field-row">
        <div class="field"><label>CEP</label><input type="text" name="cep" value="${esc(c.cep||"")}" placeholder="00000-000"></div>
        <div class="field"><label>UF</label><select name="uf">${ufOpts}</select></div>
      </div>
      <div class="field-row">
        <div class="field" style="flex:2;"><label>Logradouro</label><input type="text" name="logradouro" value="${esc(c.logradouro||"")}" placeholder="Rua, Avenida, etc."></div>
        <div class="field"><label>Número</label><input type="text" name="numero" value="${esc(c.numero||"")}" placeholder="123"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Complemento</label><input type="text" name="complemento" value="${esc(c.complemento||"")}" placeholder="Apto, bloco, casa..."></div>
        <div class="field"><label>Bairro</label><input type="text" name="bairro" value="${esc(c.bairro||"")}" placeholder="Bairro"></div>
      </div>
      <div class="field"><label>Cidade</label><input type="text" name="cidade" value="${esc(c.cidade||"")}" placeholder="Cidade"></div>

      <div style="font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); font-weight:700; margin:14px 0 10px; border-bottom:1px solid var(--border); padding-bottom:6px;">Negócios vinculados</div>
      <div class="field-help" style="margin-bottom:8px;">Marque os negócios desta holding que esse cliente pertence</div>
      <div style="display:flex; flex-wrap:wrap; gap:4px 20px; margin-bottom:10px;">${negCheckboxes||"<span style='color:var(--ink-4);'>Nenhum negócio cadastrado</span>"}</div>

      <div style="font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); font-weight:700; margin:14px 0 10px; border-bottom:1px solid var(--border); padding-bottom:6px;">Observações</div>
      <div class="field"><textarea name="observacoes" rows="3" style="resize:none;" placeholder="Notas internas, histórico de atendimento, etc.">${esc(c.observacoes||"")}</textarea></div>

    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">${isEdit?"Salvar alterações":"Cadastrar cliente"}</button></div></form>
  `);

  // PF/PJ toggle
  const tipoPessoa = document.getElementById("cliTipoPessoa");
  const pfWrap = document.getElementById("cliNomePFWrap");
  const pjWrap = document.getElementById("cliNomePJWrap");
  const cpfLabel = document.getElementById("cliCpfLabel");
  const rgWrap = document.getElementById("cliRgWrap");
  const nascimentoWrap = document.getElementById("cliNascimentoWrap");
  const generoWrap = document.getElementById("cliGeneroWrap");
  const atualizarTipo = () => {
    const isPJ = tipoPessoa.value === "PJ";
    pfWrap.style.display = isPJ ? "none" : "block";
    pjWrap.style.display = isPJ ? "block" : "none";
    cpfLabel.textContent = isPJ ? "CNPJ" : "CPF";
    rgWrap.style.display = isPJ ? "none" : "block";
    nascimentoWrap.style.display = isPJ ? "none" : "block";
    generoWrap.style.display = isPJ ? "none" : "block";
    if(isPJ) pfWrap.querySelector("input").removeAttribute("required");
    else pfWrap.querySelector("input").setAttribute("required","");
  };
  tipoPessoa.addEventListener("change", atualizarTipo);
  atualizarTipo();

  document.getElementById("formCliCliente").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const isPJ = fd.get("tipoPessoa") === "PJ";
    const negociosMarcados = state.negocios.filter(n => fd.get(`neg_${n.id}`) === n.nome);

    const data = {
      tipoPessoa: fd.get("tipoPessoa"),
      nome: isPJ ? (fd.get("razaoSocial")||"").trim() : (fd.get("nome")||"").trim(),
      razaoSocial: (fd.get("razaoSocial")||"").trim(),
      nomeFantasia: (fd.get("nomeFantasia")||"").trim(),
      cpfCnpj: (fd.get("cpfCnpj")||"").trim(),
      rg: (fd.get("rg")||"").trim(),
      dataNascimento: fd.get("dataNascimento"),
      genero: fd.get("genero"),
      email: (fd.get("email")||"").trim(),
      telefone: (fd.get("telefone")||"").trim(),
      whatsapp: (fd.get("whatsapp")||"").trim(),
      cep: (fd.get("cep")||"").trim(),
      logradouro: (fd.get("logradouro")||"").trim(),
      numero: (fd.get("numero")||"").trim(),
      complemento: (fd.get("complemento")||"").trim(),
      bairro: (fd.get("bairro")||"").trim(),
      cidade: (fd.get("cidade")||"").trim(),
      uf: fd.get("uf"),
      status: fd.get("status"),
      dataCadastro: fd.get("dataCadastro") || todayISO(),
      observacoes: (fd.get("observacoes")||"").trim(),
    };

    if(isEdit){
      // Mantém contratos existentes, adiciona novos negócios sem contrato
      const novosNegs = negociosMarcados.filter(n=>!(existing.contratos||[]).some(ct=>ct.negocio===n.nome));
      const contratosNovos = novosNegs.map(n=>({ id:uid("ct"), negocio:n.nome, planoId:"", status:"Ativo", dataContrato:todayISO() }));
      // Remove contratos de negócios desmarcados
      const negsMarcadosNomes = negociosMarcados.map(n=>n.nome);
      const contratosRestantes = (existing.contratos||[]).filter(ct=>negsMarcadosNomes.includes(ct.negocio));
      data.contratos = [...contratosRestantes, ...contratosNovos];
      Object.assign(existing, data);
    }else{
      data.contratos = negociosMarcados.map(n=>({ id:uid("ct"), negocio:n.nome, planoId:"", status:"Ativo", dataContrato:todayISO() }));
    }

    if(isEdit){
      await saveCliClientes(); closeModal();
      cliViewDetalheId = existing.id;
      state.view = "cli_detalhe";
      renderApp(); showToast("Cliente atualizado.");
    }else{
      const novoId = uid("cli");
      state.cliClientes.push({ id:novoId, ...data });
      await saveCliClientes(); closeModal();
      cliViewDetalheId = novoId;
      state.view = "cli_detalhe";
      renderApp(); showToast("Cliente cadastrado.");
    }
  });
}

// ---- Helpers de estoque ----
function estProdutoById(id){ return state.estProdutos.find(p => p.id === id); }
function estFornecedorById(id){ return state.estFornecedores.find(f => f.id === id); }
function estSaldoAtual(produtoId){
  let saldo = 0;
  for(const m of state.estMovimentos){
    if(m.produtoId !== produtoId) continue;
    if(m.tipo === "Entrada" || m.tipo === "Devolução") saldo += Number(m.qtd);
    if(m.tipo === "Saída") saldo -= Number(m.qtd);
    if(m.tipo === "Ajuste") saldo = Number(m.qtdFinal);
    if(m.tipo === "Transferência" && m.localDestino) {} // apenas muda local, qtd total igual
  }
  return saldo;
}
function estStatusBadge(saldo, minimo){
  const pct = minimo > 0 ? saldo / minimo : 1;
  if(saldo <= 0) return `<span class="status-pill" style="background:#FEE2E2; color:#DC2626;">Zerado</span>`;
  if(pct <= 1)   return `<span class="status-pill status-pendente">Baixo (${saldo})</span>`;
  return `<span class="status-pill status-pago">${saldo} ${estProdutoById}</span>`;
}

        <div class="field" style="flex:2;"><label>Nome do produto *</label><input required type="text" name="nome" value="${esc(p.nome)}" placeholder="Ex: ONU GPON Huawei HG8145V5"></div>
        <div class="field"><label>Código interno</label><input type="text" name="codigoInterno" value="${esc(p.codigoInterno)}" placeholder="Ex: ONU-001"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Categoria *</label><select name="categoria">${catOptions}</select></div>
        <div class="field"><label>Unidade</label><select name="unidade">${unOptions}</select></div>
        <div class="field"><label>Estoque mínimo</label><input type="number" min="0" name="estoqueMinimo" value="${p.estoqueMinimo}" placeholder="0"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Modelo</label><input type="text" name="modelo" value="${esc(p.modelo)}" placeholder="Ex: HG8145V5"></div>
        <div class="field"><label>Fabricante</label><input type="text" name="fabricante" value="${esc(p.fabricante)}" placeholder="Ex: Huawei"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Fornecedor</label><select name="fornecedorId"><option value="">— Nenhum —</option>${fornOptions}</select></div>
        <div class="field"><label>Preço unitário (R$)</label><input type="number" step="0.01" min="0" name="precoUnitario" value="${p.precoUnitario}" placeholder="0,00"></div>
      </div>
      <div class="field"><label>Localização no estoque</label><input type="text" name="localizacao" value="${esc(p.localizacao)}" placeholder="Ex: Prateleira A3, Sala técnica"></div>
      <div class="field"><label>Observações</label><textarea name="observacoes" rows="2" style="resize:none;">${esc(p.observacoes)}</textarea></div>
    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">${isEdit?"Salvar":"Adicionar produto"}</button></div></form>
  `);
  document.getElementById("formEstProduto").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = {
      nome: fd.get("nome").trim(), codigoInterno: fd.get("codigoInterno").trim(),
      categoria: fd.get("categoria"), unidade: fd.get("unidade"),
      modelo: fd.get("modelo").trim(), fabricante: fd.get("fabricante").trim(),
      fornecedorId: fd.get("fornecedorId"),
      precoUnitario: parseFloat(fd.get("precoUnitario"))||0,
      estoqueMinimo: parseInt(fd.get("estoqueMinimo"))||0,
      localizacao: fd.get("localizacao").trim(),
      observacoes: fd.get("observacoes").trim(),
    };
    if(isEdit){ Object.assign(existing, data); }
    else{ state.estProdutos.push({ id: uid("ep"), ...data }); }
    await saveEstProdutos(); closeModal(); renderView(); showToast(isEdit?"Produto atualizado.":"Produto adicionado.");
  });
}

function modalEstMovimentacao(presetProdutoId, presetTipo){
  const prodOptions = state.estProdutos.map(p => `<option value="${p.id}" ${presetProdutoId===p.id?"selected":""}>${esc(p.nome)} — saldo: ${estSaldoAtual(p.id)} ${esc(p.unidade||"un")}</option>`).join("");
  const tipoOptions = EST_MOV_TIPOS.map(t => `<option value="${t}" ${presetTipo===t?"selected":""}>${t}</option>`).join("");
  openModal(`
    <div class="modal-head"><div class="modal-title">↕ Nova movimentação de estoque</div><button class="modal-close" data-action="close-modal">✕</button></div>
    <form id="formEstMov"><div class="modal-body">
      <div class="field-row">
        <div class="field"><label>Data *</label><input required type="date" name="data" value="${todayISO()}"></div>
        <div class="field"><label>Tipo *</label><select name="tipo" id="estMovTipo">${tipoOptions}</select></div>
      </div>
      <div class="field"><label>Produto *</label><select required name="produtoId">${prodOptions||'<option value="">— Cadastre um produto primeiro —</option>'}</select></div>
      <div class="field-row">
        <div class="field"><label>Quantidade *</label><input required type="number" min="1" step="1" name="qtd" placeholder="1">
          <div class="field-help" id="estMovQtdHelp"></div>
        </div>
        <div class="field" id="estMovQtdFinalWrap" style="display:none;"><label>Saldo final (ajuste)</label><input type="number" min="0" step="1" name="qtdFinal" placeholder="Saldo correto"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Local de origem</label><input type="text" name="localOrigem" placeholder="Ex: Almoxarifado"></div>
        <div class="field" id="estMovDestinoWrap"><label>Local de destino</label><input type="text" name="localDestino" placeholder="Ex: Técnico João"></div>
      </div>
      <div class="field"><label>Motivo / Descrição</label><input type="text" name="motivo" placeholder="Ex: Instalação cliente, Compra NF 123, Perda"></div>
      <div class="field-row">
        <div class="field"><label>Responsável</label><input type="text" name="responsavel" value="${state.perfilAtivo?state.perfilAtivo.nome:'Master'}" placeholder="Nome"></div>
        <div class="field"><label>Nota Fiscal</label><input type="text" name="notaFiscal" placeholder="Nº da NF (opcional)"></div>
      </div>
    </div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">Registrar</button></div></form>
  `);
  document.getElementById("estMovTipo").addEventListener("change", e => {
    const isAjuste = e.target.value === "Ajuste";
    const isTransf = e.target.value === "Transferência";
    document.getElementById("estMovQtdFinalWrap").style.display = isAjuste ? "block" : "none";
    document.getElementById("estMovDestinoWrap").style.display = isTransf ? "block" : "none";
  });
  document.getElementById("formEstMov").addEventListener("submit", async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    if(!fd.get("produtoId")){ showToast("Selecione um produto.", "error"); return; }
    const mov = {
      id: uid("em"), data: fd.get("data"), tipo: fd.get("tipo"),
      produtoId: fd.get("produtoId"), qtd: parseInt(fd.get("qtd"))||0,
      qtdFinal: parseInt(fd.get("qtdFinal"))||undefined,
      localOrigem: fd.get("localOrigem").trim(), localDestino: fd.get("localDestino").trim(),
      motivo: fd.get("motivo").trim(), responsavel: fd.get("responsavel").trim(),
      notaFiscal: fd.get("notaFiscal").trim(),
    };
    state.estMovimentos.push(mov);
    await saveEstMovimentos(); closeModal(); renderView();
    showToast("Movimentação registrada.");
  });
}

// ============================================================
// INIT — reage à sessão do Supabase
// ============================================================
async function init(){
  // onAuthStateChange dispara imediatamente com a sessão atual (vinda do localStorage
  // do navegador, se houver) assim que nos inscrevemos — não precisamos chamar
  // getSession() à parte, isso evitaria um carregamento duplicado.
  let carregouUmaVez = false;
  supabaseClient.auth.onAuthStateChange(async (_event, session) => {
    const jaLogado = !!state.user;
    state.user = session ? session.user : null;
    if(state.user && (!jaLogado || !carregouUmaVez)){
      carregouUmaVez = true;
      await loadData();
      renderApp();
    }else if(!state.user){
      carregouUmaVez = false;
      renderApp();
    }
  });
}
init();
</script>
