<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparativo de Faturamento</title>
<script src="https://oss.sheetjs.com/sheetjs/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── tokens ─────────────────────────────────────────── */
:root {
  --bg:        #EEF1F6;
  --surface:   #FFFFFF;
  --surface-2: #F5F7FA;
  --border:    #DDE1EA;
  --border-2:  #C4CAD8;
  --ink:       #0E1B33;
  --ink-2:     #2D3A52;
  --ink-3:     #5B6783;
  --ink-4:     #8E99B0;
  --brand:     #0F2045;
  --brand-2:   #1A3268;
  --accent:    #00C4D8;
  --acc-dim:   rgba(0,196,216,.1);
  --acc-bdr:   rgba(0,196,216,.25);
  --pos:       #059669;
  --pos-bg:    #ECFDF5;
  --pos-bdr:   rgba(5,150,105,.2);
  --neg:       #DC2626;
  --neg-bg:    #FEF2F2;
  --neg-bdr:   rgba(220,38,38,.2);
  --warn:      #B45309;
  --warn-bg:   #FFFBEB;
  --warn-bdr:  rgba(180,83,9,.2);
  --neu:       #4B5563;
  --neu-bg:    #F3F4F6;
  --neu-bdr:   rgba(75,85,99,.15);
  --font:      'Inter', -apple-system, sans-serif;
  --mono:      'IBM Plex Mono', 'Fira Mono', monospace;
  --r:         8px;
  --r-lg:      12px;
  --sh-sm:     0 1px 2px rgba(0,0,0,.05), 0 1px 4px rgba(0,0,0,.04);
  --sh:        0 2px 8px rgba(0,0,0,.07), 0 1px 3px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme=light]) {
  --bg:#0C1525; --surface:#12213B; --surface-2:#182D4A;
  --border:#1E3155; --border-2:#294175;
  --ink:#EDF2FF; --ink-2:#BFD0F0; --ink-3:#7D96C4; --ink-4:#4F6899;
  --pos-bg:rgba(5,150,105,.15); --neg-bg:rgba(220,38,38,.15);
  --warn-bg:rgba(180,83,9,.15); --neu-bg:rgba(75,85,99,.2);
}}
:root[data-theme=dark] {
  --bg:#0C1525; --surface:#12213B; --surface-2:#182D4A;
  --border:#1E3155; --border-2:#294175;
  --ink:#EDF2FF; --ink-2:#BFD0F0; --ink-3:#7D96C4; --ink-4:#4F6899;
  --pos-bg:rgba(5,150,105,.15); --neg-bg:rgba(220,38,38,.15);
  --warn-bg:rgba(180,83,9,.15); --neu-bg:rgba(75,85,99,.2);
}

/* ── reset ───────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);font-size:13.5px;line-height:1.5;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── topbar ──────────────────────────────────────────── */
.topbar{background:var(--brand);height:46px;display:flex;align-items:center;padding:0 22px;gap:10px;position:sticky;top:0;z-index:200;border-bottom:1px solid rgba(255,255,255,.07)}
.topbar-logo{font-size:14.5px;font-weight:800;color:#fff;letter-spacing:-.3px}
.topbar-sep{color:rgba(255,255,255,.2)}
.topbar-sub{font-size:12.5px;font-weight:500;color:rgba(255,255,255,.5)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}

/* ── upload bar ──────────────────────────────────────── */
.upload-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:46px;z-index:190;box-shadow:var(--sh-sm)}
.upload-slot{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1.5px dashed var(--border-2);border-radius:var(--r);cursor:pointer;transition:border-color .15s,background .15s;min-width:200px;background:var(--surface-2)}
.upload-slot:hover{border-color:var(--accent);background:var(--acc-dim)}
.upload-slot.loaded{border-style:solid;border-color:var(--pos);background:var(--pos-bg);cursor:default}
.upload-slot input[type=file]{display:none}
.slot-ico{font-size:18px;flex-shrink:0}
.slot-info{flex:1;min-width:0}
.slot-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-4)}
.slot-name{font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.slot-name.pending{color:var(--ink-4);font-style:italic;font-weight:400}
.slot-btn{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:6px;border:1px solid var(--border-2);background:var(--surface);color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:all .12s}
.slot-btn:hover{border-color:var(--accent);color:var(--accent)}
.upload-sep{color:var(--ink-4);font-size:16px;font-weight:300}
.sheet-pick{font-size:12px;padding:5px 8px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface);color:var(--ink);font-family:var(--font);outline:none;cursor:pointer;max-width:160px}
.sheet-pick:focus{border-color:var(--accent)}

/* ── summary bar ─────────────────────────────────────── */
.summary-bar{display:flex;align-items:center;gap:10px;padding:10px 22px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.summary-bar.hidden{display:none}
.kpi{display:flex;flex-direction:column;gap:1px;padding:0 14px;border-right:1px solid var(--border)}
.kpi:last-child{border-right:none}
.kpi-val{font-size:20px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi-lbl{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-4)}
.kpi.green .kpi-val{color:var(--pos)}
.kpi.red   .kpi-val{color:var(--neg)}
.kpi.warn  .kpi-val{color:var(--warn)}
.filter-sep{width:1px;height:32px;background:var(--border);margin:0 4px}
.filter-chip{font-size:11.5px;font-weight:600;padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--ink-3);cursor:pointer;transition:all .12s;white-space:nowrap}
.filter-chip.active,.filter-chip:hover{border-color:var(--accent);background:var(--acc-dim);color:var(--accent)}
.filter-chip.active{font-weight:700}

/* ── main ─────────────────────────────────────────────── */
.main{max-width:980px;margin:0 auto;padding:20px 22px 56px}

/* ── empty state ─────────────────────────────────────── */
.empty-state{text-align:center;padding:64px 20px;color:var(--ink-4)}
.empty-ico{font-size:40px;margin-bottom:12px;opacity:.6}
.empty-title{font-size:16px;font-weight:700;color:var(--ink-3);margin-bottom:6px}
.empty-sub{font-size:13px;max-width:360px;margin:0 auto}

/* ── client cards ────────────────────────────────────── */
.cards{display:flex;flex-direction:column;gap:12px}
.c-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-sm);border-left:4px solid var(--border-2);transition:box-shadow .15s}
.c-card.ok  {border-left-color:var(--pos)}
.c-card.diff{border-left-color:var(--neg)}
.c-card.only{border-left-color:var(--accent)}

/* card header */
.c-head{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;user-select:none;transition:background .1s}
.c-head:hover{background:var(--surface-2)}
.c-idx{font-size:10.5px;font-weight:700;color:var(--ink-4);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:36px}
.c-info{flex:1;min-width:0}
.c-name{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-meta{font-size:11.5px;color:var(--ink-3);margin-top:1px;display:flex;gap:8px;flex-wrap:wrap}
.c-metric{font-family:var(--mono);font-size:11px}
.c-meta-sep{color:var(--border-2)}
.c-badges{display:flex;align-items:center;gap:6px;flex-shrink:0}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.badge.ok  {background:var(--pos-bg);color:var(--pos);border:1px solid var(--pos-bdr)}
.badge.diff{background:var(--neg-bg);color:var(--neg);border:1px solid var(--neg-bdr)}
.badge.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bdr)}
.badge.neu {background:var(--neu-bg);color:var(--neu);border:1px solid var(--neu-bdr)}
.c-chevron{font-size:10px;color:var(--ink-4);transition:transform .2s;flex-shrink:0}
.c-card.open .c-chevron{transform:rotate(180deg)}

/* card body */
.c-body{border-top:1px solid var(--border);display:none}
.c-card.open .c-body{display:block}

/* contract row */
.ctr-row{padding:14px 16px;border-bottom:1px solid var(--border)}
.ctr-row:last-child{border-bottom:none}
.ctr-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ctr-num{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-4);background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 7px;white-space:nowrap}
.ctr-svc{font-size:13px;font-weight:600;color:var(--ink-2);flex:1;min-width:0}
.ctr-nf{font-size:11.5px;color:var(--ink-4);font-family:var(--mono)}
.ctr-st{margin-left:auto;flex-shrink:0}

/* metrics table */
.metrics-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px}
.metrics-t{width:100%;border-collapse:collapse;font-size:12.5px}
.metrics-t th{background:var(--surface-2);text-align:left;padding:6px 12px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-4);border-bottom:1px solid var(--border);white-space:nowrap}
.metrics-t th.num,.metrics-t td.num{text-align:right;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.metrics-t td{padding:7px 12px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--ink-2)}
.metrics-t tr:last-child td{border-bottom:none}
.metrics-t tr:hover td{background:var(--surface-2)}
.metrics-t .row-ok   td:first-child{color:var(--pos)}
.metrics-t .row-diff td:first-child{color:var(--neg)}
.diff-neg{color:var(--neg)!important;font-weight:600}
.diff-pos{color:var(--pos)!important;font-weight:600}
.muted{color:var(--ink-4)!important}
.metrics-t td.lbl{font-weight:500;white-space:nowrap;color:var(--ink-2)}
.metrics-t td.row-diff-val{background:var(--neg-bg)}

/* chips (benefits / adjustments) */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chips-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-4);margin-right:4px;align-self:center;white-space:nowrap}
.chip{font-size:11.5px;font-family:var(--mono);padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);color:var(--ink-3);white-space:nowrap}
.chip.hi{background:var(--acc-dim);border-color:var(--acc-bdr);color:var(--ink-2)}

/* btn */
.btn{display:inline-flex;align-items:center;gap:5px;font-family:var(--font);font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:var(--r);border:none;cursor:pointer;transition:background .12s,opacity .12s;white-space:nowrap}
.btn-pri{background:var(--accent);color:var(--brand)}
.btn-pri:hover{background:#00afc2}
.btn-sec{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border)}
.btn-sec:hover{background:var(--border)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* misc */
.hidden{display:none!important}
.ml-a{margin-left:auto}
.gap-6{gap:6px}
</style>
</head>
<body>

<!-- topbar -->
<header class="topbar">
  <span class="topbar-logo">Servsul</span>
  <span class="topbar-sep">›</span>
  <span class="topbar-sub">Conferência de Faturamento</span>
  <span class="topbar-sep">·</span>
  <span class="topbar-sub" id="monthLabel" style="color:rgba(255,255,255,.7);font-weight:600"></span>
  <script>document.getElementById('monthLabel').textContent=(['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][new Date().getMonth()])+'/'+new Date().getFullYear();</script>
  <div class="topbar-right">
    <button class="btn btn-sec" id="exportBtn" onclick="exportCSV()" style="display:none">⬇ Exportar</button>
    <button class="btn btn-sec" id="clearBtn"  onclick="clearAll()"  style="display:none;color:var(--neg)">✕ Limpar</button>
  </div>
</header>

<!-- upload bar -->
<div class="upload-bar">
  <!-- Planilha -->
  <div class="upload-slot" id="slotPlan" onclick="document.getElementById('filePlan').click()">
    <input type="file" id="filePlan" accept=".xlsx,.xlsm,.xls">
    <span class="slot-ico">📋</span>
    <div class="slot-info">
      <div class="slot-label">Planilha</div>
      <div class="slot-name pending" id="namePlan">Nenhum arquivo</div>
    </div>
    <button class="slot-btn" onclick="event.stopPropagation();document.getElementById('filePlan').click()">Carregar</button>
  </div>

  <!-- Sheet picker (hidden until planilha loaded) -->
  <select class="sheet-pick hidden" id="sheetPick" onchange="onSheetChange()"></select>

  <span class="upload-sep">+</span>

  <!-- Sistema CSV -->
  <div class="upload-slot" id="slotSys" onclick="document.getElementById('fileSys').click()">
    <input type="file" id="fileSys" accept=".csv,.txt">
    <span class="slot-ico">📄</span>
    <div class="slot-info">
      <div class="slot-label">Sistema (CSV)</div>
      <div class="slot-name pending" id="nameSys">Nenhum arquivo</div>
    </div>
    <button class="slot-btn" onclick="event.stopPropagation();document.getElementById('fileSys').click()">Carregar</button>
  </div>
</div>

<!-- summary bar -->
<div class="summary-bar hidden" id="summaryBar">
  <div class="kpi" id="kpiTotal">
    <span class="kpi-val">0</span><span class="kpi-lbl">Clientes</span>
  </div>
  <div class="kpi green" id="kpiOk">
    <span class="kpi-val">0</span><span class="kpi-lbl">✅ Conferem</span>
  </div>
  <div class="kpi red" id="kpiDiff">
    <span class="kpi-val">0</span><span class="kpi-lbl">⚠ Divergências</span>
  </div>
  <div class="kpi" id="kpiOnly">
    <span class="kpi-val">0</span><span class="kpi-lbl">📋 Só planilha</span>
  </div>
  <div class="filter-sep"></div>
  <button class="filter-chip active" data-f="all"  onclick="setFilter('all')">Todos</button>
  <button class="filter-chip"        data-f="diff" onclick="setFilter('diff')">⚠ Divergentes</button>
  <button class="filter-chip"        data-f="ok"   onclick="setFilter('ok')">✅ OK</button>
  <button class="filter-chip"        data-f="only" onclick="setFilter('only')">📋 Só planilha</button>
  <div class="filter-sep"></div>
  <button class="filter-chip" id="expandAllBtn" onclick="toggleAll()">⊞ Expandir todos</button>
</div>

<!-- main -->
<div class="main">
  <div class="empty-state" id="emptyState">
    <div class="empty-ico">📊</div>
    <div class="empty-title">Carregue a planilha para iniciar</div>
    <div class="empty-sub">Os contratos de cada cliente aparecem aqui. Com o CSV do sistema, o comparativo é gerado automaticamente.</div>
  </div>
  <div class="cards hidden" id="cards"></div>
</div>

<script>
/* =========================================================
   GLOBALS
   ========================================================= */
const S = {
  wb:      null,   // xlsx workbook
  planData:null,   // { headers, rows }  — "Dados Trat" sheet
  sysData: null,   // { headers, rows }  — CSV
  items:   null,   // Array<Item>  — flat: one per client+contract
  sysMap:  null,   // Map<vplCode, SysEntry>
  filter:  'all',
};

// Column indices for "Dados Trat"
const C = {
  nf:0, vpl:3, ctr:4, svc:5, cli:6, bruto:7,
  reaj:8, repasse:9, descFaltas:10, descEquip:11, descPremio:12,
  premio:13, he:14, prop:15, svcExtra:16, eqEsp:17,
  va:18, vr:19, vt:20, am:21, ao:22,
  total:26,
};
// CSV cols
const CSV = { cli:0, ctr:7, vlrFixo:20 };

/* =========================================================
   UTILS
   ========================================================= */
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
function parseBR(v){
  if(typeof v==='number') return isFinite(v)?v:0;
  v=String(v??'').trim().replace(/\s|R\$\s*/g,'');
  if(!v) return 0;
  if(/^\d{1,3}(\.\d{3})+(,\d*)?$/.test(v)) v=v.replace(/\./g,'').replace(',','.');
  else v=v.replace(',','.');
  return parseFloat(v)||0;
}
function fmtBRL(n){ return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}) }
function fmtNum(n){ return n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) }
function norm(s){ return String(s??'').toLowerCase().trim().replace(/\s+/g,' ') }

function extractVPL(name){
  const m=String(name).trim().match(/^(\d+)\s+/);
  return m?m[1]:null;
}
function extractCtrNum(name){
  const m=String(name).trim().match(/^(\d+)\s*/);
  return m?m[1]:null;
}

/* =========================================================
   FILE READING
   ========================================================= */
async function readText(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{
      try{ res(new TextDecoder('utf-8',{fatal:true}).decode(e.target.result)) }
      catch{ res(new TextDecoder('iso-8859-1').decode(e.target.result)) }
    };
    r.readAsArrayBuffer(file);
  });
}
async function readXlsx(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>{ try{ res(XLSX.read(e.target.result,{type:'array',cellDates:false})) }catch(e){rej(e)} };
    r.readAsArrayBuffer(file);
  });
}

function parseSheet(wb, name, headerRow=1){
  const ws=wb.Sheets[name];
  if(!ws) return{headers:[],rows:[]};
  const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  const hi=headerRow-1;
  if(hi>=raw.length) return{headers:[],rows:[]};
  const headers=(raw[hi]||[]).map(h=>String(h).replace(/\n/g,' ').trim());
  const rows=raw.slice(hi+1)
    .filter(r=>r.some(v=>String(v).trim()))
    .map(r=>{ const a=[...r]; while(a.length<headers.length)a.push(''); return a; });
  return{headers,rows};
}

function parseCSVText(text, sep=';', skip=1){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<=skip) return{headers:[],rows:[]};
  const headers=splitLine(lines[skip],sep);
  const rows=lines.slice(skip+1).map(l=>splitLine(l,sep)).filter(r=>r.some(v=>v.trim()));
  return{headers,rows};
}
function splitLine(line,sep){
  const res=[]; let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){ if(inQ&&line[i+1]==='"'){cur+='"';i++}else inQ=!inQ }
    else if(c===sep&&!inQ){ res.push(cur.trim());cur='' }
    else cur+=c;
  }
  res.push(cur.trim()); return res;
}

/* =========================================================
   COLUMN DETECTION
   Auto-detect "Dados Trat" vs monthly sheet columns
   ========================================================= */
function detectCols(headers){
  const h=headers.map(x=>norm(x));
  const find=(patterns)=>{ for(const p of patterns){ const i=h.findIndex(x=>x.includes(p)); if(i>=0)return i } return -1 };
  return{
    nf:       find(['nº da nota','nota fiscal']),
    vpl:      find(['código vpl','codigo vpl','cód. vpl','cod. vpl']),
    ctr:      find(['contrato']),
    svc:      find(['serviço','servico']),
    cli:      find(['cliente']),
    bruto:    find(['contrato mensal']),
    reaj:     find(['reajuste']),
    repasse:  find(['nota de repasse','repasse']),
    descFaltas: find(['desconto faltas','desc. faltas','desconto\nfaltas']),
    descEquip:  find(['desconto equip','desc. equip']),
    descPremio: find(['desconto prêmio','desconto premio']),
    premio:   find(['prêmio','premio']),
    he:       find(['hora extra']),
    prop:     find(['diferenças','proporcional']),
    svcExtra: find(['serviço extra','servico extra']),
    eqEsp:    find(['eq .esp','eq. esp','equip. especial']),
    va:       find(['va + prêmio','va+prêmio','va+premio']),
    vr:       find(['vr']),
    vt:       find(['vt']),
    am:       find(['am']),
    ao:       find(['ao']),
    total:    find(['total para faturar','total à faturar','total a faturar','total faturar']),
  };
}

/* =========================================================
   DATA BUILDING
   ========================================================= */
// Flat list — one item per (client + contract) pair
function buildItemList(data, cols){
  const itemMap=new Map(); // key `${vpl}|${ctrKey}` → item
  const seen=new Set();    // dedup NF rows

  for(const row of data.rows){
    const vpl=String(row[cols.vpl]??'').trim()||'__UNKNOWN__';
    const cliName=String(row[cols.cli]??'').trim();
    if(!cliName) continue;

    const ctrRaw=String(row[cols.ctr]??'').trim();
    const svcRaw=String(row[cols.svc]??'').trim();
    const ctrKey=ctrRaw||(svcRaw.slice(0,40));
    const nfRaw=String(row[cols.nf]??'').trim();

    const dd=`${vpl}|${ctrKey}|${nfRaw}`;
    if(seen.has(dd)) continue;
    seen.add(dd);

    const ik=`${vpl}|${ctrKey}`;
    if(!itemMap.has(ik)){
      itemMap.set(ik,{
        vpl, clientName:cliName, ctrKey,
        num:ctrRaw, svc:svcRaw, nf:nfRaw,
        bruto:0, totalFaturar:0,
        reaj:0, repasse:0, descFaltas:0, descEquip:0, descPremio:0,
        premio:0, he:0, prop:0, svcExtra:0, eqEsp:0,
        va:0, vr:0, vt:0, am:0, ao:0,
        sysBruto:null, status:'only',
      });
    }
    const item=itemMap.get(ik);
    const g=(k)=>cols[k]>=0?parseBR(row[cols[k]]??0):0;

    item.bruto        +=parseBR(row[cols.bruto]??0);
    item.totalFaturar +=parseBR(row[cols.total]??0);
    item.reaj         +=g('reaj');   item.repasse    +=g('repasse');
    item.descFaltas   +=g('descFaltas'); item.descEquip +=g('descEquip');
    item.descPremio   +=g('descPremio'); item.premio    +=g('premio');
    item.he           +=g('he');     item.prop       +=g('prop');
    item.svcExtra     +=g('svcExtra');   item.eqEsp   +=g('eqEsp');
    item.va+=g('va'); item.vr+=g('vr'); item.vt+=g('vt');
    item.am+=g('am'); item.ao+=g('ao');
    if(nfRaw && !item.nf.includes(nfRaw) && item.nf!==nfRaw)
      item.nf+=(item.nf?', ':'')+nfRaw;
  }

  return [...itemMap.values()];
}

function buildSysMap(data){
  const map=new Map();
  const seen=new Set();
  for(const row of data.rows){
    const cliRaw=String(row[CSV.cli]??'').trim();
    const vpl=extractVPL(cliRaw);
    if(!vpl) continue;
    const ctrName=String(row[CSV.ctr]??'').trim();
    const vlr=parseBR(row[CSV.vlrFixo]??0);
    const dd=vpl+'|'+ctrName;
    if(seen.has(dd)) continue;
    seen.add(dd);
    if(!map.has(vpl)) map.set(vpl,{total:0,contracts:new Map()});
    const e=map.get(vpl);
    e.total+=vlr;
    const cn=extractCtrNum(ctrName);
    if(cn) e.contracts.set(cn,(e.contracts.get(cn)||0)+vlr);
  }
  return map;
}

const TOL=0.01;
function matchAll(items, sysMap){
  for(const item of items){
    const sysEntry=sysMap?.get(item.vpl);
    if(!sysEntry){ item.status='only'; item.sysBruto=null; continue; }
    const sv=item.num?sysEntry.contracts.get(item.num):null;
    item.sysBruto=sv??null;
    if(sv!=null){
      item.status=Math.abs(item.bruto-sv)<=TOL?'ok':'diff';
    } else {
      item.status='no-match';
      // Fallback: client has exactly one contract in sysMap → use total
      if(sysEntry.contracts.size===1){
        item.sysBruto=sysEntry.total;
        item.status=Math.abs(item.bruto-sysEntry.total)<=TOL?'ok':'diff';
      }
    }
  }
}

/* =========================================================
   RENDERING
   ========================================================= */
function render(){
  if(!S.items) return;
  const sorted=[...S.items].sort((a,b)=>
    a.clientName.localeCompare(b.clientName,'pt-BR')||
    String(a.num).localeCompare(String(b.num),'pt-BR',{numeric:true})
  );
  const n=sorted.length;
  const filtered=sorted.filter(item=>S.filter==='all'||S.filter===item.status||
    (S.filter==='only'&&(item.status==='only'||item.status==='no-match')));
  document.getElementById('cards').innerHTML=filtered.length
    ?filtered.map((item,i)=>renderCard(item,sorted.indexOf(item)+1,n)).join('')
    :`<div class="empty-state" style="padding:40px"><div class="empty-ico">🔍</div><div class="empty-title">Nenhum item nesse filtro</div></div>`;
  updateSummary(sorted);
  syncExpandBtn();
}

function renderCard(item,num,total){
  const hasSys=S.sysMap!==null;
  const st=item.status;
  const isOpen=st==='diff'||st==='only'||st==='no-match';

  const badge=st==='ok'
    ?`<span class="badge ok">✅ Confere</span>`
    :st==='diff'
    ?`<span class="badge diff">⚠ Divergente</span>`
    :st==='no-match'
    ?`<span class="badge warn">? Não localizado</span>`
    :`<span class="badge neu">📋 Sem sistema</span>`;

  // Tags: VPL code + contract number
  const tag=(label,val)=>`<span style="font-size:10.5px;font-weight:700;color:var(--ink-4);background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;white-space:nowrap;font-family:var(--mono)">${label} ${esc(val)||'—'}</span>`;
  const vplTag=item.vpl&&item.vpl!=='__UNKNOWN__'?tag('CLI',item.vpl):'';
  const ctrTag=tag('CTR',item.num);

  const metaP=`<span class="c-metric" title="Bruto">Bruto ${fmtBRL(item.bruto)}</span>`;
  const metaT=`<span class="c-meta-sep">·</span><span class="c-metric" title="Total a faturar">Total ${fmtBRL(item.totalFaturar)}</span>`;
  const metaS=hasSys&&item.sysBruto!=null?`<span class="c-meta-sep">·</span><span class="c-metric" title="Bruto no sistema">Sist. ${fmtBRL(item.sysBruto)}</span>`:'';
  const nfDisp=item.nf?`<span class="c-meta-sep">·</span><span class="c-metric" style="font-family:var(--mono);font-size:11px">NF ${esc(item.nf.split(',')[0])}${item.nf.includes(',')?'…':''}</span>`:'';

  const body=renderItemBody(item,hasSys);

  return `<div class="c-card ${st} ${isOpen?'open':''}" id="card-${num}">
    <div class="c-head" onclick="toggleCard(this)">
      <div class="c-idx">${String(num).padStart(2,'0')}<br><span style="opacity:.5">/${total}</span></div>
      <div class="c-info">
        <div class="c-name">${esc(item.clientName)}</div>
        <div class="c-meta" style="margin-top:3px">
          ${vplTag}${vplTag?'<span class="c-meta-sep">·</span>':''}${ctrTag}
          <span class="c-meta-sep">·</span>
          <span class="c-metric" style="color:var(--ink-3)">${esc(item.svc)||'—'}</span>
          <span class="c-meta-sep">·</span>${metaP}${metaT}${metaS}${nfDisp}
        </div>
      </div>
      <div class="c-badges">${badge}</div>
      <div class="c-chevron">▼</div>
    </div>
    <div class="c-body"><div class="ctr-row">${body}</div></div>
  </div>`;
}

function renderItemBody(item,hasSys){
  const st=item.status;
  const isDiff=st==='diff';
  let rows='';

  // Bruto
  if(hasSys&&item.sysBruto!=null){
    const delta=item.bruto-item.sysBruto;
    const deltaCls=Math.abs(delta)<=TOL?'muted':(delta>0?'diff-pos':'diff-neg');
    rows+=`<tr class="${isDiff?'row-diff':'row-ok'}">
      <td class="lbl">Bruto <span style="font-weight:400;color:var(--ink-4)">(Ctr. Mensal)</span></td>
      <td class="num">${fmtBRL(item.bruto)}</td>
      <td class="num ${isDiff?'row-diff-val':''}">${fmtBRL(item.sysBruto)}</td>
      <td class="num ${deltaCls}">${Math.abs(delta)<=TOL?'R$ 0,00':fmtBRL(delta)}</td>
    </tr>`;
  } else {
    rows+=`<tr>
      <td class="lbl">Bruto <span style="font-weight:400;color:var(--ink-4)">(Ctr. Mensal)</span></td>
      <td class="num">${fmtBRL(item.bruto)}</td>
      <td class="num muted">${hasSys?'—':'N/A'}</td>
      <td class="num muted">—</td>
    </tr>`;
  }

  // Total a faturar
  const difBrutoTotal=item.totalFaturar-item.bruto;
  const totalEqBruto=Math.abs(difBrutoTotal)<=TOL;
  rows+=`<tr>
    <td class="lbl">Total a faturar</td>
    <td class="num">${fmtBRL(item.totalFaturar)}</td>
    <td class="num muted">—</td>
    <td class="num ${totalEqBruto?'muted':(difBrutoTotal>0?'diff-pos':'diff-neg')}">
      ${totalEqBruto?'= Bruto':fmtBRL(difBrutoTotal)+' vs bruto'}
    </td>
  </tr>`;

  // Adjustments
  const ajusts=[{k:'reaj',l:'Reajuste'},{k:'he',l:'Hora Extra'},{k:'svcExtra',l:'Serviço Extra'},{k:'eqEsp',l:'Eq. Especial (20%)'},{k:'prop',l:'Proporcional'}].filter(a=>Math.abs(item[a.k])>0.009);
  const descs=[{k:'descFaltas',l:'Desc. Faltas'},{k:'descEquip',l:'Desc. Equipamentos'},{k:'descPremio',l:'Desc. Prêmio'},{k:'repasse',l:'Nota Repasse'}].filter(a=>Math.abs(item[a.k])>0.009);
  if(ajusts.length||descs.length){
    rows+=`<tr style="background:var(--surface-2)"><td colspan="4" style="padding:4px 12px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-4)">Ajustes</td></tr>`;
    ajusts.forEach(a=>{rows+=`<tr><td class="lbl" style="padding-left:20px">${esc(a.l)}</td><td class="num diff-pos">+${fmtBRL(item[a.k])}</td><td class="num muted">—</td><td></td></tr>`;});
    descs.forEach(a=>{rows+=`<tr><td class="lbl" style="padding-left:20px">${esc(a.l)}</td><td class="num diff-neg">${fmtBRL(-Math.abs(item[a.k]))}</td><td class="num muted">—</td><td></td></tr>`;});
  }

  const metricsTable=`<div class="metrics-wrap">
    <table class="metrics-t">
      <thead><tr><th>Métrica</th><th class="num">Planilha</th><th class="num">Sistema</th><th class="num">Diferença</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;

  const benefits=[{k:'va',l:'VA+Prêmio'},{k:'vr',l:'VR'},{k:'vt',l:'VT'},{k:'am',l:'AM'},{k:'ao',l:'AO'}].filter(b=>item[b.k]>0.009);
  let benefitsHtml='';
  if(benefits.length){
    const tot=benefits.reduce((s,b)=>s+item[b.k],0);
    benefitsHtml=`<div class="chips"><span class="chips-label">Benefícios</span>${benefits.map(b=>`<span class="chip hi">${b.l} ${fmtBRL(item[b.k])}</span>`).join('')}<span class="chip" style="margin-left:4px;font-weight:700">Total ${fmtBRL(tot)}</span></div>`;
  }

  return metricsTable+benefitsHtml;
}

/* =========================================================
   SUMMARY
   ========================================================= */
function updateSummary(items){
  const ok=items.filter(i=>i.status==='ok').length;
  const diff=items.filter(i=>i.status==='diff').length;
  const only=items.filter(i=>i.status==='only'||i.status==='no-match').length;
  document.getElementById('kpiTotal').querySelector('.kpi-val').textContent=items.length;
  document.getElementById('kpiOk').querySelector('.kpi-val').textContent=ok;
  document.getElementById('kpiDiff').querySelector('.kpi-val').textContent=diff;
  document.getElementById('kpiOnly').querySelector('.kpi-val').textContent=only;
  document.getElementById('summaryBar').classList.remove('hidden');
  document.getElementById('emptyState').classList.add('hidden');
  document.getElementById('cards').classList.remove('hidden');
  document.getElementById('exportBtn').style.display='';
  document.getElementById('clearBtn').style.display='';
}

function setFilter(f){
  S.filter=f;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.toggle('active',c.dataset.f===f));
  render();
}

function toggleCard(head){
  head.closest('.c-card').classList.toggle('open');
  syncExpandBtn();
}

function clearAll(){
  // Reset state
  S.wb=null; S.planData=null; S.sysData=null; S.items=null; S.sysMap=null; S.filter='all';
  // Reset slots
  ['filePlan','fileSys'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  document.getElementById('namePlan').textContent='Nenhum arquivo'; document.getElementById('namePlan').classList.add('pending');
  document.getElementById('nameSys').textContent='Nenhum arquivo';  document.getElementById('nameSys').classList.add('pending');
  document.getElementById('slotPlan').classList.remove('loaded');
  document.getElementById('slotSys').classList.remove('loaded');
  document.getElementById('sheetPick').classList.add('hidden');
  // Reset summary + cards
  document.getElementById('summaryBar').classList.add('hidden');
  document.getElementById('cards').innerHTML=''; document.getElementById('cards').classList.add('hidden');
  document.getElementById('emptyState').classList.remove('hidden');
  document.getElementById('exportBtn').style.display='none';
  document.getElementById('clearBtn').style.display='none';
  // Reset filter chips
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.toggle('active',c.dataset.f==='all'));
  S.filter='all';
}

function toggleAll(){
  const cards=[...document.querySelectorAll('#cards .c-card')];
  const anyCollapsed=cards.some(c=>!c.classList.contains('open'));
  cards.forEach(c=>c.classList.toggle('open',anyCollapsed));
  syncExpandBtn();
}

function syncExpandBtn(){
  const cards=[...document.querySelectorAll('#cards .c-card')];
  if(!cards.length) return;
  const allOpen=cards.every(c=>c.classList.contains('open'));
  const btn=document.getElementById('expandAllBtn');
  if(btn) btn.textContent=allOpen?'⊟ Recolher todos':'⊞ Expandir todos';
}

/* =========================================================
   FILE HANDLERS
   ========================================================= */
document.getElementById('filePlan').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  document.getElementById('namePlan').textContent='Carregando…';
  try{
    S.wb=await readXlsx(f);
  }catch(err){ alert('Erro ao ler planilha: '+err.message); return; }

  document.getElementById('namePlan').textContent=f.name;
  document.getElementById('namePlan').classList.remove('pending');
  document.getElementById('slotPlan').classList.add('loaded');

  // Populate sheet picker
  const sel=document.getElementById('sheetPick');
  sel.innerHTML=S.wb.SheetNames.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
  // Auto-select: current month > Dados Trat > Clientes ativos
  const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const curMonth=MONTHS[new Date().getMonth()];
  const prefs=[curMonth,'Dados Trat','Clientes ativos'];
  let picked=S.wb.SheetNames[0];
  for(const p of prefs){ if(S.wb.SheetNames.includes(p)){picked=p;break} }
  sel.value=picked;
  sel.classList.remove('hidden');
  loadSheet(picked);
});

function onSheetChange(){
  const name=document.getElementById('sheetPick').value;
  loadSheet(name);
}

function loadSheet(name){
  if(!S.wb) return;
  const monthly=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const hr=monthly.includes(name)?6:1;
  S.planData=parseSheet(S.wb,name,hr);
  const cols=detectCols(S.planData.headers);
  // Fallback to hard-coded if not detected (known "Dados Trat" structure)
  const finalCols={
    nf:cols.nf>=0?cols.nf:C.nf,
    vpl:cols.vpl>=0?cols.vpl:C.vpl,
    ctr:cols.ctr>=0?cols.ctr:C.ctr,
    svc:cols.svc>=0?cols.svc:C.svc,
    cli:cols.cli>=0?cols.cli:C.cli,
    bruto:cols.bruto>=0?cols.bruto:C.bruto,
    reaj:cols.reaj>=0?cols.reaj:C.reaj,
    repasse:cols.repasse>=0?cols.repasse:C.repasse,
    descFaltas:cols.descFaltas>=0?cols.descFaltas:C.descFaltas,
    descEquip:cols.descEquip>=0?cols.descEquip:C.descEquip,
    descPremio:cols.descPremio>=0?cols.descPremio:C.descPremio,
    premio:cols.premio>=0?cols.premio:C.premio,
    he:cols.he>=0?cols.he:C.he,
    prop:cols.prop>=0?cols.prop:C.prop,
    svcExtra:cols.svcExtra>=0?cols.svcExtra:C.svcExtra,
    eqEsp:cols.eqEsp>=0?cols.eqEsp:C.eqEsp,
    va:cols.va>=0?cols.va:C.va,
    vr:cols.vr>=0?cols.vr:C.vr,
    vt:cols.vt>=0?cols.vt:C.vt,
    am:cols.am>=0?cols.am:C.am,
    ao:cols.ao>=0?cols.ao:C.ao,
    total:cols.total>=0?cols.total:C.total,
  };
  S.items=buildItemList(S.planData,finalCols);
  if(S.sysMap) matchAll(S.items,S.sysMap);
  render();
}

document.getElementById('fileSys').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  document.getElementById('nameSys').textContent='Carregando…';
  const text=await readText(f);
  S.sysData=parseCSVText(text,';',1);
  document.getElementById('nameSys').textContent=f.name;
  document.getElementById('nameSys').classList.remove('pending');
  document.getElementById('slotSys').classList.add('loaded');
  S.sysMap=buildSysMap(S.sysData);
  if(S.items){ matchAll(S.items,S.sysMap); render(); }
});

// Drag-and-drop
['slotPlan','slotSys'].forEach(id=>{
  const el=document.getElementById(id);
  const inputId=id==='slotPlan'?'filePlan':'fileSys';
  el.addEventListener('dragover',e=>{e.preventDefault();el.style.borderColor='var(--accent)'});
  el.addEventListener('dragleave',()=>el.style.borderColor='');
  el.addEventListener('drop',e=>{
    e.preventDefault(); el.style.borderColor='';
    const f=e.dataTransfer.files[0]; if(!f) return;
    const inp=document.getElementById(inputId);
    const dt=new DataTransfer(); dt.items.add(f); inp.files=dt.files;
    inp.dispatchEvent(new Event('change'));
  });
});

/* =========================================================
   EXPORT
   ========================================================= */
function exportCSV(){
  if(!S.items) return;
  const rows=['Cliente;VPL;Contrato;Serviço;NF;Bruto Planilha;Total Fat Planilha;Bruto Sistema;Diferença Bruto;VA+Prêmio;VR;VT;AM;AO;Hora Extra;Desc Faltas;Status'];
  for(const item of S.items){
    const delta=item.sysBruto!=null?(item.bruto-item.sysBruto):null;
    rows.push([
      item.clientName, item.vpl, item.num, item.svc, item.nf,
      item.bruto.toFixed(2), item.totalFaturar.toFixed(2),
      item.sysBruto!=null?item.sysBruto.toFixed(2):'',
      delta!=null?delta.toFixed(2):'',
      item.va.toFixed(2), item.vr.toFixed(2), item.vt.toFixed(2),
      item.am.toFixed(2), item.ao.toFixed(2),
      item.he.toFixed(2), item.descFaltas.toFixed(2),
      {ok:'OK',diff:'Divergente',only:'Só planilha','no-match':'Não localizado'}[item.status]||'',
    ].join(';'));
  }
  const b=new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');
  a.href=u; a.download='conferencia-faturamento.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),5000);
}
