# Projeto Xcode gerado com XcodeGen (brew install xcodegen; xcodegen generate)
name: AppsTom
options:
  bundleIdPrefix: br.com.appstom
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: "$(inherited) -framework ComposeApp"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  AppsTom:
    type: application
    platform: iOS
    sources: [AppsTom]
    info:
      path: AppsTom/Info.plist
      properties:
        CFBundleDisplayName: "Apps Tom"
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: >-
          O Apps Tom precisa acessar suas fotos e vídeos para enviá-los ao
          Google Drive e, com a sua confirmação, liberar espaço no aparelho.
    preBuildScripts:
      - name: Build Kotlin Framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
